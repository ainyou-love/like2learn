<svg viewBox="0 0 680 250" role="img" aria-labelledby="pb-context-t"><title id="pb-context-t">Context window as a budget</title><desc>Cached stable prefix, a weak-attention middle of old tool outputs, high-attention recent steps, a todo recitation at the end, and headroom.</desc><defs><marker id="pb-context-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9z" fill="var(--ink-3)"/></marker></defs><text class="t-s" x="280" y="62" text-anchor="middle">Lost-in-the-middle zone</text><text class="t-s" x="615" y="62" text-anchor="middle">Headroom</text><rect class="n-info" x="40" y="80" width="140" height="48" rx="4"/><rect class="n-box" x="180" y="80" width="200" height="48"/><rect class="n-new" x="380" y="80" width="120" height="48"/><rect class="n-warn" x="500" y="80" width="90" height="48"/><rect class="w-dash" x="590" y="80" width="50" height="48" rx="4"/><text class="t t-b" x="110" y="160" text-anchor="middle">Stable prefix</text><text class="t-s" x="110" y="180" text-anchor="middle">Cached, never edit</text><text class="t t-b" x="280" y="160" text-anchor="middle">Old tool outputs</text><text class="t-s" x="280" y="180" text-anchor="middle">Clear or compact</text><text class="t t-b" x="440" y="160" text-anchor="middle">Recent steps</text><text class="t-s" x="440" y="180" text-anchor="middle">High attention</text><line class="w-dash" x1="545" y1="128" x2="545" y2="198"/><text class="t t-b" x="545" y="216" text-anchor="middle">Todo recitation</text><text class="t-s" x="545" y="234" text-anchor="middle">Goal at the end</text></svg>
