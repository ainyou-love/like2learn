<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Repo Radar</title>
<meta name="description" content="Trending AI repositories on GitHub ranked by rising and total stars for today, this week and this month, grouped into customizable categories.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#141D27; --muted:#5C6976; --line:#DCE2E8;
  --accent:#2347C6; --accent-soft:#E6ECFB; --rise:#A95F00; --rise-soft:#FBEBD3;
  --shadow:0 1px 0 rgba(20,29,39,.04);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D131A; --surface:#141C25; --ink:#E5EAF0; --muted:#94A1AE; --line:#25303B;
  --accent:#86A2FF; --accent-soft:#1B2643; --rise:#F2B450; --rise-soft:#3A2A10;
}}
:root[data-theme="dark"]{
  --bg:#0D131A; --surface:#141C25; --ink:#E5EAF0; --muted:#94A1AE; --line:#25303B;
  --accent:#86A2FF; --accent-soft:#1B2643; --rise:#F2B450; --rise-soft:#3A2A10;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 112px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* Header */
header.top{padding:22px 0 8px}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{margin:0;font-size:clamp(26px,5vw,38px);line-height:1;font-weight:800;letter-spacing:-.02em}
.stamp{color:var(--muted);font-size:13px;margin-top:6px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:0 12px;cursor:pointer;font-weight:600;font-size:14px}
.icon-btn svg{width:18px;height:18px;flex:none}
.brand .icon-btn{flex:none}

/* Top 1 strip */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:16px 0 4px}
.champ{background:var(--surface);padding:16px 16px 14px;text-decoration:none;display:flex;flex-direction:column;gap:6px;min-width:0}
.champ:hover .champ-name{color:var(--accent)}
.champ-when{font-size:13px;color:var(--muted);font-weight:600}
.champ-name{font-size:19px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.champ-name span{color:var(--muted);font-weight:500}
.champ-desc{color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.champ-gain{margin-top:auto;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.champ-gain b{color:var(--rise);font-size:22px;font-weight:800;letter-spacing:-.01em}
.champ-gain small{color:var(--muted);font-size:13px}
.champ-alt{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
.champ-alt a{font-weight:600;text-decoration:none;color:var(--ink)}
.champ-alt a:hover{color:var(--accent)}

/* Sticky controls */
.controls{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
  padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.bar{display:flex;gap:10px;align-items:center;padding:10px 0 8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{border:0;background:none;padding:0 14px;height:36px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.short{display:none}
.sortlbl{font-size:13px;color:var(--muted);margin-left:auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;text-decoration:none;font-size:13.5px;font-weight:600;padding:6px 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.chip:hover,.chip.on{color:var(--accent);border-color:var(--accent)}
.chip i{font-style:normal;font-weight:500;opacity:.7;margin-left:4px}

/* Sections */
main{padding:18px 0 40px}
.grid{display:grid;gap:18px}
@media (min-width:1000px){.grid.cats{grid-template-columns:1fr 1fr}}
section.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.list-head{display:flex;align-items:center;gap:10px;padding:14px 14px 12px 16px;border-bottom:1px solid var(--line)}
.list-head h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.list-head .count{color:var(--muted);font-size:13px}
.list-head .icon-btn{margin-left:auto;height:34px;min-width:34px;padding:0 8px;border-radius:8px}
ol.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:2px 10px;padding:12px 16px;text-decoration:none;border-top:1px solid var(--line);position:relative}
li:first-child>.row{border-top:0}
.row:hover{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.rank{color:var(--muted);font-weight:600;font-size:14px;padding-top:1px}
.name{font-weight:700;font-size:15.5px;overflow-wrap:anywhere;line-height:1.3}
.name span{color:var(--muted);font-weight:500}
.desc{grid-column:2/4;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{grid-column:2/4;display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;margin-top:2px}
.meta b{color:var(--ink);font-weight:600}
.gain{align-self:start;font-weight:700;font-size:14px;color:var(--rise);background:var(--rise-soft);padding:2px 8px;border-radius:6px;white-space:nowrap}
.mbar{grid-column:2/4;height:3px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--rise);border-radius:2px;transform-origin:left;animation:grow .7s ease-out both}
@keyframes grow{from{transform:scaleX(0)}}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:12px;font-weight:600;color:var(--accent);cursor:pointer;font-size:14px}
.empty{padding:22px 16px;color:var(--muted);font-size:14px}
.empty button{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0}
footer{color:var(--muted);font-size:13px;padding:8px 0 32px;max-width:72ch}
footer code{font-size:12.5px;background:var(--surface);border:1px solid var(--line);padding:1px 5px;border-radius:5px}

/* Settings sheet */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(560px,100%);max-height:min(88vh,860px);
  border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,15,22,.45)}
@media (max-width:640px){
  dialog{margin:auto 0 0;max-width:100%;width:100%;max-height:90vh;border-radius:18px 18px 0 0;
    padding-bottom:env(safe-area-inset-bottom,0px)}
  dialog[open]{animation:sheet .22s ease-out}
}
@keyframes sheet{from{transform:translateY(40px);opacity:.4}}
.sheet{display:flex;flex-direction:column;max-height:inherit}
.sheet-head{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.sheet-head h3{margin:0;font-size:18px;flex:1}
.sheet-body{overflow:auto;padding:6px 16px 16px;-webkit-overflow-scrolling:touch}
.group{margin-top:16px}
.group>h4{margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:600}
.card{border:1px solid var(--line);border-radius:12px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-child{border-top:0}
.item .label{flex:1;min-width:120px}
.item .label strong{display:block;font-weight:600}
.item .label small{color:var(--muted);font-size:12.5px}
.item.hidden .label{opacity:.5}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:36px;height:36px;border:0;background:none;cursor:pointer;font-size:18px;line-height:1}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper input{width:40px;height:36px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);
  text-align:center;background:none;font-weight:600;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.switch{position:relative;width:42px;height:26px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(16px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;gap:4px}
.tool{width:34px;height:34px;border:1px solid var(--line);background:none;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.tool:disabled{opacity:.3;cursor:default}
.tool svg{width:16px;height:16px}
.editor{flex-basis:100%;display:grid;gap:8px;padding:4px 0 2px}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.field input,.field textarea{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:var(--bg);font-weight:400;color:var(--ink);font-size:15px}
.field textarea{min-height:64px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted)}
.hint b{color:var(--ink)}
.btn{height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.danger{color:#C2362B}
.row-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

@media (max-width:720px){
  .podium{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:84%;overflow-x:auto;scroll-snap-type:x mandatory;
    margin-left:-16px;margin-right:-16px;border-radius:0;border-left:0;border-right:0;scrollbar-width:none}
  .podium::-webkit-scrollbar{display:none}
  .champ{scroll-snap-align:start}
  .sortlbl{display:none}
  .bar{flex-wrap:nowrap;gap:8px}
  .bar .seg:first-child{flex:1}
  .bar .seg:first-child button{flex:1;padding:0 6px}
  #sortSeg button{padding:0 10px}
  .long{display:none}
  .short{display:inline!important}
  .tools{flex-basis:100%;padding-left:52px}
  .row{padding:12px 14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- live-data additions ---- */
:root{--ok:#1F8A4C;--warn:#B7791F;--off:#8A96A3}
:root[data-theme="dark"]{--ok:#4CC782;--warn:#F2B450;--off:#6E7B88}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ok:#4CC782;--warn:#F2B450;--off:#6E7B88}}
.head-actions{display:flex;gap:8px;flex:none}
@media (max-width:480px){#openSettings span{display:none}}
.status{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;padding:5px 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;max-width:100%}
.pill b{color:var(--ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--off);flex:none}
.dot.live{background:var(--ok)} .dot.approx,.dot.cache{background:var(--warn)}
.dot.busy{background:none;border:2px solid var(--accent);border-right-color:transparent;animation:spin .8s linear infinite;width:10px;height:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.note{margin-top:8px;font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;max-width:72ch}
.icon-btn.spinning svg{animation:spin .9s linear infinite}
.field small{font-weight:400;color:var(--muted)}
.field select{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:var(--bg);color:var(--ink);font-size:15px}
details.howto{font-size:13px;color:var(--muted)}
details.howto summary{cursor:pointer;color:var(--accent);font-weight:600;padding:4px 0}
pre.code{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;overflow-x:auto;font-size:12px;line-height:1.5;color:var(--ink);margin:6px 0}
.log{list-style:none;margin:0;padding:0;font-size:12.5px}
.log li{display:grid;grid-template-columns:52px 14px 1fr;gap:6px;padding:6px 12px;border-top:1px solid var(--line);color:var(--muted)}
.log li:first-child{border-top:0}
.log .ok{color:var(--ok)} .log .bad{color:#C2362B}
.log b{color:var(--ink);font-weight:600}
</style>
</head>

<div class="wrap">

<div class="controls">

<div class="wrap">
  <main>

</div>

<dialog id="settings" aria-labelledby="settingsTitle">

      <h3 id="settingsTitle">Customize</h3>
      <div class="seg" role="group" aria-label="Settings section" id="tabSeg">
        <button data-tab="lists">Lists</button><button data-tab="data">Data</button>
      </div>
      <button class="icon-btn" id="closeSettings" aria-label="Close">Done</button>
    </div>
    <div class="sheet-body" id="settingsBody"></div>
  </div>
</dialog>

"use strict";

/* =========================================================================

const PERIODS = ["daily", "weekly", "monthly"];

const PERIOD_LABEL = { daily: "Today", weekly: "This week", monthly: "This month" };
const PERIOD_SUFFIX = { daily: "today", weekly: "this week", monthly: "this month" };
// ---- Storage versioning ----
// Bump APP_VERSION when the HTML changes. If the settings shape changes, also add a
// step to SETTINGS_MIGRATIONS so saved settings carry forward.
const APP_VERSION = "1.0";
const KEY_PREFIX = `page_v${APP_VERSION}`;
const KEY = { settings: `${KEY_PREFIX}:settings`, cache: `${KEY_PREFIX}:cache` };
const KEY_RE = /^page_v(\d+(?:\.\d+)*):(settings|cache)$/;
const LEGACY_SETTINGS_KEYS = ["ai-radar-settings-v2", "ai-radar-settings-v1"];
const LEGACY_CACHE_KEYS = ["ai-radar-cache-v1"];
const SETTINGS_MIGRATIONS = [
  // Unversioned keys from earlier builds already have the 1.0 shape.
  { from: "legacy", to: "1.0", up: d => d },
  // Example for the next release:
  // { from: "1.0", to: "1.1", up: d => ({ ...d, density: "comfortable" }) },
];
const CACHE_OPTIONS = [[15, "15 minutes"], [60, "1 hour"], [360, "6 hours"], [1440, "24 hours"]];
const MAX_COUNT = 50;
const FETCH_TIMEOUT_MS = 12000;
const MAX_RATE_WAIT_MS = 70000;

// Search API queries that build the category pool (all AI-related).

// Public CORS proxies (option C). Tried in order, last working one first.
const PUBLIC_PROXIES = [

  { id: "allorigins", label: "allorigins.win", wrap: u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u) },

];

const DEFAULT_CATEGORIES = [
  { name: "Agent skills", keywords: "agent skills, claude skills, ai skills, skill, skills, skill.md" },
  { name: "Design / UI", keywords: "design, ui, ux, ui design, frontend, diagram, figma, css, tailwind, slides, landing page, design system" },

const WORKER_CODE = `// Cloudflare Worker: relays only github.com/trending, adds CORS.
export default {
  async fetch(req) {
    const target = new URL(req.url).searchParams.get("url") || "";
    const allowed = /^https:\\/\\/github\\.com\\/trending(\\/[\\w.+-]+)?(\\?since=(daily|weekly|monthly))?$/;
    if (!allowed.test(target)) return new Response("Only github.com/trending is allowed", { status: 400 });
    const r = await fetch(target, {
      headers: { "User-Agent": "ai-repo-radar" },
      cf: { cacheTtl: 900, cacheEverything: true },

    return new Response(await r.text(), {

        "cache-control": "public, max-age=900",
      },
    });
  },
};`;

/* =========================================================================
   STORAGE (settings + cache). Every access is guarded: storage can be absent.
   ========================================================================= */
function readRaw(key) { try { return JSON.parse(localStorage.getItem(key) || "null"); } catch { return null; } }
function writeRaw(key, v) {
  try { localStorage.setItem(key, JSON.stringify(v)); return true; }
  catch { return false; }
}
function removeKey(key) { try { localStorage.removeItem(key); } catch {} }
function allKeys() { try { return Object.keys(localStorage); } catch { return []; } }

// "1.10" > "1.9": compare numerically per segment.
function cmpVersion(a, b) {
  const pa = String(a).split(".").map(Number), pb = String(b).split(".").map(Number);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const d = (pa[i] || 0) - (pb[i] || 0);
    if (d) return d;
  }
  return 0;
}

function defaultSettings() {
  return {
    period: "daily", sort: "hot", trendingCount: 10,
    categories: DEFAULT_CATEGORIES.map((c, i) => ({ id: "c" + i, name: c.name, keywords: c.keywords, count: 10, visible: true })),
    proxyUrl: "", publicProxies: true, token: "", cacheMinutes: 60, lastGoodProxy: null,
  };
}

// Whatever comes out of storage or an import is cleaned to a valid shape.
// Unknown fields are dropped; bad values fall back to defaults.
function sanitizeSettings(raw) {
  const d = defaultSettings();
  const s = raw && typeof raw === "object" ? raw : {};
  const int = (v, lo, hi, dflt) => { const n = parseInt(v, 10); return Number.isFinite(n) ? Math.max(lo, Math.min(hi, n)) : dflt; };
  const str = (v, max, dflt = "") => typeof v === "string" ? v.slice(0, max) : dflt;
  const seen = new Set();
  const categories = Array.isArray(s.categories) ? s.categories
    .filter(c => c && typeof c === "object" && str(c.name, 40).trim())
    .map((c, i) => {
      let id = str(c.id, 40) || "m" + i;
      while (seen.has(id)) id += "x";
      seen.add(id);
      return { id, name: str(c.name, 40).trim(), keywords: str(c.keywords, 2000), count: int(c.count, 1, MAX_COUNT, 10), visible: c.visible !== false };
    }) : d.categories;
  return {
    period: PERIODS.includes(s.period) ? s.period : d.period,
    sort: ["hot", "stars"].includes(s.sort) ? s.sort : d.sort,
    trendingCount: int(s.trendingCount, 1, MAX_COUNT, d.trendingCount),
    categories,
    proxyUrl: str(s.proxyUrl, 500).trim(),
    publicProxies: typeof s.publicProxies === "boolean" ? s.publicProxies : d.publicProxies,
    token: str(s.token, 300).trim(),
    cacheMinutes: CACHE_OPTIONS.some(([v]) => v === s.cacheMinutes) ? s.cacheMinutes : d.cacheMinutes,
    lastGoodProxy: PUBLIC_PROXIES.some(p => p.id === s.lastGoodProxy) ? s.lastGoodProxy : null,
  };
}

// Run every migration step between the stored version and this page's version.
function migrateSettings(data, fromVersion) {
  let v = fromVersion, d = data;
  for (let guard = 0; guard < 50 && v !== APP_VERSION; guard++) {
    const step = SETTINGS_MIGRATIONS.find(m => m.from === v);
    if (!step) break; // newer data (rollback) or no path: sanitize best-effort below
    d = step.up(d); v = step.to;
  }
  return sanitizeSettings(d);
}

// Accepts an envelope {v, savedAt, data} or a bare settings object (legacy / hand-edited).
function unwrap(obj, fallbackVersion) {
  if (obj && typeof obj === "object" && "data" in obj && "v" in obj) return { v: String(obj.v), data: obj.data, savedAt: obj.savedAt || 0 };
  return { v: fallbackVersion, data: obj, savedAt: 0 };
}

const store = { ok: true, savedAt: 0, migratedFrom: null };

function loadSettings() {
  const own = readRaw(KEY.settings);
  if (own) {
    const u = unwrap(own, APP_VERSION);
    store.savedAt = u.savedAt;
    return migrateSettings(u.data, u.v);
  }
  // First run of this version: take the newest older versioned settings, then legacy keys.
  const older = allKeys()
    .map(k => { const m = k.match(KEY_RE); return m && m[2] === "settings" ? { k, v: m[1] } : null; })
    .filter(x => x && cmpVersion(x.v, APP_VERSION) !== 0)
    .sort((a, b) => cmpVersion(b.v, a.v));
  for (const o of older) {
    const raw = readRaw(o.k);
    if (!raw) continue;
    const u = unwrap(raw, o.v);
    store.migratedFrom = o.v;
    return migrateSettings(u.data, u.v);
  }
  for (const k of LEGACY_SETTINGS_KEYS) {
    const raw = readRaw(k);
    if (raw) { store.migratedFrom = k; return migrateSettings(raw, "legacy"); }
  }
  return defaultSettings();
}

// Keep this version + the newest older settings (for rollback). Drop everything else.
function cleanupOldKeys() {
  const versions = allKeys()
    .map(k => { const m = k.match(KEY_RE); return m ? { k, v: m[1], kind: m[2] } : null; })
    .filter(Boolean);
  const olderSettings = versions
    .filter(x => x.kind === "settings" && cmpVersion(x.v, APP_VERSION) < 0)
    .sort((a, b) => cmpVersion(b.v, a.v));
  olderSettings.slice(1).forEach(x => removeKey(x.k));
  versions.filter(x => x.kind === "cache" && x.v !== APP_VERSION).forEach(x => removeKey(x.k));
  LEGACY_CACHE_KEYS.forEach(removeKey);
  if (olderSettings.length || readRaw(KEY.settings)) LEGACY_SETTINGS_KEYS.forEach(removeKey);
}

let settings = loadSettings();
function saveSettings() {
  store.savedAt = Date.now();
  store.ok = writeRaw(KEY.settings, { v: APP_VERSION, savedAt: store.savedAt, data: settings });
  return store.ok;
}
if (!readRaw(KEY.settings)) saveSettings();   // persist migrated/default settings under this version
cleanupOldKeys();

// cache shape: { trending: { daily: {at, kind, label, rows} }, queries: { q: {at, items} } }
// The cache is disposable, so it is never migrated: a new version starts empty.
function loadCache() {
  const raw = readRaw(KEY.cache);
  const u = unwrap(raw, APP_VERSION);
  const c = u.v === APP_VERSION && u.data && typeof u.data === "object" ? u.data : null;
  return { trending: (c && c.trending) || {}, queries: (c && c.queries) || {} };
}
let cache = loadCache();
function saveCache() {
  const wrap = () => ({ v: APP_VERSION, savedAt: Date.now(), data: cache });
  if (writeRaw(KEY.cache, wrap())) return;
  cache.queries = {};               // quota hit: drop the bulky part, keep trending
  writeRaw(KEY.cache, wrap());
}

// Export without the token so a shared file never leaks it.
function exportSettings() {
  const { token, lastGoodProxy, ...rest } = settings;
  return JSON.stringify({ v: APP_VERSION, savedAt: Date.now(), data: rest }, null, 2);
}
function importSettings(text) {
  const parsed = JSON.parse(text);              // throws on invalid JSON, caller shows message
  const u = unwrap(parsed, APP_VERSION);
  const next = migrateSettings(u.data, u.v);
  next.token = settings.token;                  // keep the local token; exports never carry one
  settings = next;
  saveSettings();
}

const isFresh = at => at && Date.now() - at < settings.cacheMinutes * 60000;

/* =========================================================================
   STATE
   ========================================================================= */
const SNAPSHOT = JSON.parse(document.getElementById("radar-snapshot").textContent || "null");
const db = {
  repos: {},                                    // name -> repo
  trending: { daily: [], weekly: [], monthly: [] }, // period -> [{name, rank, gained}]
  src: {                                        // where each piece of data came from
    trending: { daily: null, weekly: null, monthly: null }, // {kind, label, at}
    pool: { kind: "none", at: 0, live: 0, total: SEARCH_QUERIES.length, busy: false, waitUntil: 0 },
  },
  busy: new Set(),
  log: [],
  netBlocked: 0, netTried: 0,
};
const hayMemo = new Map();

function mergeRepo(r) {
  if (!r || !r.name) return;
  db.repos[r.name] = { ...(db.repos[r.name] || {}), ...r };
  hayMemo.delete(r.name);
}
function setTrending(p, rows, src) {
  db.trending[p] = rows.map(r => ({ name: r.name, rank: r.rank, gained: r.gained }));
  rows.forEach(r => r.repo && mergeRepo(r.repo));
  db.src.trending[p] = src;
}
function logEvent(what, ok, note) {
  db.log.unshift({ t: new Date(), what, ok, note });
  db.log.length = Math.min(db.log.length, 40);
}

/* =========================================================================
   NETWORK
   ========================================================================= */
async function fetchT(url, opts = {}) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), FETCH_TIMEOUT_MS);
  db.netTried++;
  try { return await fetch(url, { ...opts, signal: ctl.signal }); }
  catch (e) {
    // TypeError = blocked by CORS/CSP/offline. Counted to explain "live data blocked here".
    if (e.name === "TypeError") db.netBlocked++;
    throw new Error(e.name === "AbortError" ? "timed out" : "network blocked or offline");
  }
  finally { clearTimeout(timer); }
}
async function fetchText(url) {
  const r = await fetchT(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.text();
}

// GitHub API: one request at a time, honours rate-limit headers.
const rate = { remaining: null, reset: 0 };
let apiChain = Promise.resolve();
function api(url) {
  const run = async () => {
    for (let attempt = 0; attempt < 2; attempt++) {
      if (rate.remaining === 0 && Date.now() < rate.reset) {
        const wait = rate.reset - Date.now() + 1000;
        if (wait > MAX_RATE_WAIT_MS) throw new Error(`rate limited until ${new Date(rate.reset).toLocaleTimeString()}`);
        db.src.pool.waitUntil = Date.now() + wait; scheduleRender();
        await new Promise(r => setTimeout(r, wait));
        db.src.pool.waitUntil = 0;
      }
      const headers = { Accept: "application/vnd.github+json" };
      if (settings.token) headers.Authorization = "Bearer " + settings.token.trim();
      const r = await fetchT(url, { headers });
      const rem = r.headers.get("x-ratelimit-remaining"), rst = r.headers.get("x-ratelimit-reset");
      if (rem !== null) rate.remaining = Number(rem);
      if (rst !== null) rate.reset = Number(rst) * 1000;
      if (r.status === 401) throw new Error("GitHub token rejected; remove or replace it");
      if ((r.status === 403 || r.status === 429) && rate.remaining === 0 && attempt === 0) continue;
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }
    throw new Error("rate limited");
  };
  const p = apiChain.then(run, run);
  apiChain = p.catch(() => {});
  return p;
}

/* =========================================================================
   PARSE
   ========================================================================= */
const toInt = s => parseInt(String(s || "").replace(/[^\d]/g, ""), 10) || 0;

function parseTrendingHTML(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const rows = [];
  doc.querySelectorAll("article.Box-row").forEach((art, i) => {
    const href = art.querySelector("h2 a")?.getAttribute("href") || "";
    const name = href.replace(/^\/+/, "").replace(/\/+$/, "");
    if (!/^[^/]+\/[^/]+$/.test(name)) return;
    const gained = (art.textContent.match(/([\d,]+)\s+stars\s+(today|this week|this month)/) || [])[1];
    rows.push({
      name, rank: i + 1, gained: toInt(gained),
      repo: {
        name,
        desc: (art.querySelector("p")?.textContent || "").trim().replace(/\s+/g, " "),
        lang: (art.querySelector('[itemprop="programmingLanguage"]')?.textContent || "").trim(),
        stars: toInt(art.querySelector('a[href$="/stargazers"]')?.textContent),
        forks: toInt(art.querySelector('a[href$="/forks"]')?.textContent),
      },
    });
  });
  return rows;
}
function fromApi(r) {
  return {
    name: r.full_name, desc: r.description || "", stars: r.stargazers_count, forks: r.forks_count,
    lang: r.language || "", topics: r.topics || [], pushed: (r.pushed_at || "").slice(0, 10),
    created: (r.created_at || "").slice(0, 10),
  };
}

/* =========================================================================
   SOURCES: pick the right strategy per situation
   ========================================================================= */
function ownProxyUrl(target) {
  const base = settings.proxyUrl.trim();
  return base.includes("{url}") ? base.replace("{url}", encodeURIComponent(target)) : base + encodeURIComponent(target);
}

async function trendingLive(p) {
  const target = `https://github.com/trending?since=${p}`;
  const attempts = [];
  // B: your own proxy
  if (settings.proxyUrl.trim()) attempts.push({ id: "own", label: "your proxy", url: ownProxyUrl(target) });
  // C: public proxies, last good one first
  if (settings.publicProxies) {
    const list = PUBLIC_PROXIES.slice().sort((a, b) => (b.id === settings.lastGoodProxy) - (a.id === settings.lastGoodProxy));
    list.forEach(x => attempts.push({ id: x.id, label: x.label, url: x.wrap(target) }));
  }
  for (const a of attempts) {
    try {
      const rows = parseTrendingHTML(await fetchText(a.url));
      if (rows.length < 3) throw new Error("response was not a trending page");
      if (a.id !== "own" && settings.lastGoodProxy !== a.id) { settings.lastGoodProxy = a.id; saveSettings(); }
      logEvent(`Trending ${PERIOD_SUFFIX[p]} via ${a.label}`, true, `${rows.length} repos`);
      return { rows, src: { kind: "live", label: a.label, at: Date.now() } };
    } catch (e) {
      logEvent(`Trending ${PERIOD_SUFFIX[p]} via ${a.label}`, false, e.message);
    }
  }
  // A: Search API approximation (new repos in the window, by stars)
  try {
    const since = new Date(Date.now() - PERIOD_DAYS[p] * 864e5).toISOString().slice(0, 10);
    const data = await api(`https://api.github.com/search/repositories?q=${encodeURIComponent("created:>" + since)}&sort=stars&order=desc&per_page=25`);
    const rows = (data.items || []).map((r, i) => {
      const repo = fromApi(r);
      return { name: repo.name, rank: i + 1, gained: repo.stars, repo };
    });
    if (!rows.length) throw new Error("no results");
    logEvent(`Trending ${PERIOD_SUFFIX[p]} via API approximation`, true, `${rows.length} new repos`);
    return { rows, src: { kind: "approx", label: "new repos via GitHub API", at: Date.now() } };
  } catch (e) {
    logEvent(`Trending ${PERIOD_SUFFIX[p]} via API approximation`, false, e.message);
  }
  return null;
}

const APPROX_TTL_MS = 10 * 60000;
function trendingCacheFresh(c) {
  if (!c || !isFresh(c.at)) return false;
  return c.kind !== "approx" || Date.now() - c.at < APPROX_TTL_MS;
}
async function refreshTrending(p, force) {
  const c = cache.trending[p];
  if (!force && trendingCacheFresh(c)) return;
  db.busy.add("t:" + p); scheduleRender();
  const res = await trendingLive(p);
  db.busy.delete("t:" + p);
  if (res) {
    // Never let an approximation overwrite a fresh real trending result.
    const keepReal = res.src.kind === "approx" && c?.kind === "live" && isFresh(c.at);
    if (!keepReal) {
      setTrending(p, res.rows, res.src);
      cache.trending[p] = { at: res.src.at, kind: res.src.kind, label: res.src.label, rows: res.rows };
      saveCache();
    }
  }
  scheduleRender();
}

async function refreshPool(force) {
  const pool = db.src.pool;
  pool.busy = true; scheduleRender();
  let failed = 0;
  for (const q of SEARCH_QUERIES) {
    const c = cache.queries[q];
    if (!force && c && isFresh(c.at)) continue;
    try {
      const data = await api(`https://api.github.com/search/repositories?q=${encodeURIComponent(q)}&sort=stars&order=desc&per_page=100`);
      const items = (data.items || []).map(fromApi);
      items.forEach(mergeRepo);
      cache.queries[q] = { at: Date.now(), items };
      saveCache();
      scheduleRender();
    } catch (e) {
      failed++;
      logEvent(`Repos "${q}"`, false, e.message);
      if (/blocked|token/.test(e.message)) break; // pointless to continue
    }
  }
  pool.live = SEARCH_QUERIES.filter(q => cache.queries[q] && isFresh(cache.queries[q].at)).length;
  pool.kind = pool.live === SEARCH_QUERIES.length ? "live" : pool.live ? "cache" : pool.kind;
  const cachedAt = Object.values(cache.queries).map(x => x.at || 0);
  if (cachedAt.length) pool.at = Math.max(...cachedAt);
  pool.busy = false;
  if (!failed) logEvent("Category repos via GitHub API", true, `${pool.live}/${SEARCH_QUERIES.length} queries fresh`);
  scheduleRender();
}

// A trending route changed: drop approximations and try the real list again.
function retryTrending() {
  PERIODS.forEach(p => { if (cache.trending[p]?.kind === "approx") delete cache.trending[p]; });
  saveCache();
  const order = [settings.period, ...PERIODS.filter(x => x !== settings.period)];
  Promise.all(order.map(p => refreshTrending(p, false))).then(() => { if (dlg.open && settingsTab === "data") renderDataTab(true); });
}
let refreshing = false;
async function refreshAll(force = false) {
  if (refreshing) return;
  refreshing = true; db.netBlocked = 0; db.netTried = 0;
  document.getElementById("refreshBtn").classList.add("spinning");
  // Current period first so the visible list updates soonest.
  const order = [settings.period, ...PERIODS.filter(p => p !== settings.period)];
  await Promise.all([Promise.all(order.map(p => refreshTrending(p, force))), refreshPool(force)]);
  document.getElementById("refreshBtn").classList.remove("spinning");
  refreshing = false;
  scheduleRender();
}

/* Layering at boot: snapshot (oldest) -> any cache (newer) -> live (refreshAll). */
function bootData() {
  if (SNAPSHOT) {
    Object.values(SNAPSHOT.repos || {}).forEach(mergeRepo);
    const at = Date.parse(String(SNAPSHOT.generated).replace("Z", ":00Z")) || 0;
    PERIODS.forEach(p => {
      if (SNAPSHOT.trending?.[p]?.length) {
        db.trending[p] = SNAPSHOT.trending[p];
        db.src.trending[p] = { kind: "snapshot", label: "built-in snapshot", at };
      }
    });
    db.src.pool = { ...db.src.pool, kind: "snapshot", at };
  }
  Object.values(cache.queries || {}).forEach(c => (c.items || []).forEach(mergeRepo));
  const cachedQ = Object.values(cache.queries || {});
  if (cachedQ.length) {
    db.src.pool.kind = "cache";
    db.src.pool.at = Math.max(...cachedQ.map(x => x.at || 0));
    db.src.pool.live = SEARCH_QUERIES.filter(q => cache.queries[q] && isFresh(cache.queries[q].at)).length;
  }
  PERIODS.forEach(p => {
    const c = cache.trending?.[p];
    if (c?.rows?.length) setTrending(p, c.rows, { kind: isFresh(c.at) ? c.kind : "cache", label: c.label, at: c.at });
  });
}

/* =========================================================================
   COMPOSE: categories, matching, ranking
   ========================================================================= */
const norm = s => String(s || "").toLowerCase().replace(/[-_/]+/g, " ");
function hay(name) {
  let h = hayMemo.get(name);
  if (h === undefined) {
    const r = db.repos[name];
    h = " " + norm(name) + " " + norm(r.desc) + " " + (r.topics || []).map(norm).join(" ") + " ";
    hayMemo.set(name, h);
  }
  return h;
}
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function parseKeywords(text) {
  return [...new Set(String(text).split(/[,\n]/).map(k => norm(k).trim().replace(/\s+/g, " ")).filter(Boolean))];
}
function matches(keywords) {
  const ks = parseKeywords(keywords);
  if (!ks.length) return [];
  // whole-word match so "ui" does not hit "build" or "guide"
  const re = new RegExp("(^|[^a-z0-9])(" + ks.map(reEsc).join("|") + ")(?=$|[^a-z0-9])");
  return Object.keys(db.repos).filter(n => re.test(hay(n)));
}
function gainMap(p) {
  const m = {};
  (db.trending[p] || []).forEach(t => { m[t.name] = t; });
  return m;
}
function rankCategory(names, g) {
  return names.slice().sort((a, b) => {
    if (settings.sort === "hot") {
      const d = (g[b]?.gained || 0) - (g[a]?.gained || 0);
      if (d) return d;
    }
    return (db.repos[b].stars || 0) - (db.repos[a].stars || 0);
  });
}

/* =========================================================================
   RENDER
   ========================================================================= */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "k" : String(n || 0);
const full = n => Number(n || 0).toLocaleString("en-US");
function ago(at) {
  if (!at) return "";
  const m = Math.round((Date.now() - at) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60);
  if (h < 48) return h + " h ago";
  return Math.round(h / 24) + " days ago";
}
const splitName = n => { const i = n.indexOf("/"); return [n.slice(0, i + 1), n.slice(i + 1)]; };
const repoUrl = n => "https://github.com/" + n.split("/").map(encodeURIComponent).join("/");
const isApprox = p => db.src.trending[p]?.kind === "approx";
const gainSuffix = p => isApprox(p) ? `since created, new ${PERIOD_SUFFIX[p]}` : PERIOD_SUFFIX[p];

let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  setTimeout(() => { renderQueued = false; renderAll(); }, 120);
}

function rowHTML(name, i, gained, maxGain) {
  const r = db.repos[name] || { desc: "", stars: 0 };
  const [owner, repo] = splitName(name);
  const meta = [`<span>★ <b>${short(r.stars)}</b></span>`];
  if (r.lang) meta.push(`<span>${esc(r.lang)}</span>`);
  if (r.forks) meta.push(`<span>${short(r.forks)} forks</span>`);
  const bar = gained && maxGain ? `<div class="mbar" aria-hidden="true"><i style="width:${Math.max(3, Math.round(gained / maxGain * 100))}%;animation-delay:${i * 30}ms"></i></div>` : "";
  return `<li><a class="row" href="${repoUrl(name)}" target="_blank" rel="noopener">
    <span class="rank">${i + 1}</span>
    <span class="name"><span>${esc(owner)}</span>${esc(repo)}</span>
    ${gained ? `<span class="gain" title="${full(gained)} stars ${esc(gainSuffix(settings.period))}">+${short(gained)}</span>` : "<span></span>"}
    ${r.desc ? `<span class="desc">${esc(r.desc)}</span>` : ""}
    <span class="meta">${meta.join("")}</span>
    ${bar}
  </a></li>`;
}

function renderStatus() {
  const p = settings.period;
  const t = db.src.trending[p];
  const tBusy = db.busy.has("t:" + p);
  const tKind = tBusy ? "busy" : (t?.kind || "none");
  const tText = tBusy ? "fetching…"
    : !t ? "no data"
    : t.kind === "live" ? `live via ${esc(t.label)}, ${ago(t.at)}`
    : t.kind === "approx" ? `approximation, ${ago(t.at)}`
    : t.kind === "cache" ? `cached ${ago(t.at)}`
    : `snapshot from ${new Date(t.at).toLocaleDateString(undefined, { dateStyle: "medium" })}`;

  const pool = db.src.pool;
  const waiting = pool.waitUntil && pool.waitUntil > Date.now();
  const pKind = pool.busy ? "busy" : pool.kind;
  const pText = waiting ? `rate limited, resuming in ${Math.ceil((pool.waitUntil - Date.now()) / 1000)} s`
    : pool.busy ? `fetching ${pool.live}/${pool.total}…`
    : pool.kind === "live" ? `live, ${ago(pool.at)}`
    : pool.kind === "cache" ? `${pool.live}/${pool.total} fresh, rest cached`
    : pool.kind === "snapshot" ? `snapshot from ${new Date(pool.at).toLocaleDateString(undefined, { dateStyle: "medium" })}`
    : "no data";

  document.getElementById("status").innerHTML =
    `<button class="pill" data-open="data"><span class="dot ${tKind}"></span>Trending: <b>${tText}</b></button>` +
    `<button class="pill" data-open="data"><span class="dot ${pKind}"></span>${full(Object.keys(db.repos).length)} repos: <b>${pText}</b></button>`;

  // Explain the environment once every live route has failed at the network level.
  const blockedEverywhere = !refreshing && db.netTried > 0 && db.netBlocked === db.netTried;
  document.getElementById("envNote").innerHTML = blockedEverywhere
    ? `<div class="note">Live requests are blocked here, so you are seeing ${db.src.pool.kind === "cache" ? "cached" : "built-in snapshot"} data. Save this page as an HTML file and open it, or host it anywhere, to get live data.</div>`
    : (isApprox(p) && !db.busy.has("t:" + p))
      ? `<div class="note">GitHub Trending could not be reached, so this list shows new repos created ${PERIOD_SUFFIX[p]} ranked by stars. Add your own proxy under Customize, Data for the real list.</div>`
      : "";
}

function renderPodium() {
  document.getElementById("podium").innerHTML = PERIODS.map(p => {
    const list = db.trending[p] || [];
    if (!list.length) return `<div class="champ"><div class="champ-when">${PERIOD_LABEL[p]}</div><div class="champ-desc">${db.busy.has("t:" + p) ? "Fetching…" : "No data yet."}</div></div>`;
    const top = list[0], r = db.repos[top.name] || {};
    const [owner, repo] = splitName(top.name);
    const gainer = list.reduce((a, b) => (b.gained > a.gained ? b : a), list[0]);
    const alt = gainer.name !== top.name
      ? `<div class="champ-alt">Most stars gained: <a href="${repoUrl(gainer.name)}" target="_blank" rel="noopener">${esc(gainer.name.split("/")[1])}</a> +${full(gainer.gained)}</div>` : "";
    return `<div class="champ">
      <div class="champ-when">${PERIOD_LABEL[p]} #1${isApprox(p) ? " (new repos)" : ""}</div>
      <a class="champ-name" href="${repoUrl(top.name)}" target="_blank" rel="noopener" style="text-decoration:none"><span>${esc(owner)}</span>${esc(repo)}</a>
      <div class="champ-desc">${esc(r.desc || "")}</div>
      <div class="champ-gain"><b>+${full(top.gained)}</b><small>${esc(gainSuffix(p))}, ${short(r.stars || 0)} total</small></div>

}

function sectionHTML({ id, title, countLabel, rowsHTML, more, adjustId, emptyHTML }) {

const expanded = new Set();
function renderLists() {

  const t = db.trending[p] || [];

/* =========================================================================
   DOWNLOADS: platform save on claude.ai, normal browser download elsewhere
   ========================================================================= */
// window.claude only exists inside the claude.ai viewer; elsewhere this resolves null at once.
const platformDownloads = (window.claude && typeof window.claude.use === "function")
  ? window.claude.use("downloads").catch(() => null)
  : Promise.resolve(null);

async function downloadJSON(filename, obj) {
  const text = JSON.stringify(obj, null, 2);
  const dl = await Promise.race([platformDownloads, new Promise(r => setTimeout(() => r(null), 3000))]);
  if (dl) {
    try { await dl.save({ filename, data: text }); return "Saved."; }
    catch (e) {
      if (e?.code === "declined") return "Download cancelled.";
      if (e?.code === "rate_limited") return "A save prompt is already open.";
      return "Downloads are not available here. Use Copy instead.";
    }
  }
  try {
    const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    const a = Object.assign(document.createElement("a"), { href: url, download: filename });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return "Downloaded.";
  } catch { return "Download failed. Use Copy instead."; }
}
const stamp = () => new Date().toISOString().slice(0, 10);

// Exactly what the page shows: selected period, visible lists, current counts and sort.
function buildListsExport() {
  const p = settings.period, g = gainMap(p);
  const item = (name, rank) => {
    const r = db.repos[name] || {};
    return {
      rank, name, url: repoUrl(name), stars: r.stars || 0, gained: g[name]?.gained || 0,
      language: r.lang || "", description: r.desc || "", topics: r.topics || [],
    };
  };
  const t = (db.trending[p] || []).slice(0, settings.trendingCount);
  const src = db.src.trending[p];
  return {
    app: "ai-repo-radar", version: APP_VERSION, exportedAt: new Date().toISOString(),
    period: p, sort: settings.sort,
    sources: {
      trending: src ? { kind: src.kind, via: src.label, fetchedAt: src.at ? new Date(src.at).toISOString() : null } : null,
      repos: { kind: db.src.pool.kind, fetchedAt: db.src.pool.at ? new Date(db.src.pool.at).toISOString() : null, total: Object.keys(db.repos).length },
    },
    trending: t.map((x, i) => item(x.name, i + 1)),
    categories: settings.categories.filter(c => c.visible).map(c => {
      const all = rankCategory(matches(c.keywords), g);
      return { name: c.name, keywords: parseKeywords(c.keywords), shown: Math.min(c.count, all.length), matching: all.length,
        repos: all.slice(0, c.count).map((n, i) => item(n, i + 1)) };
    }),
  };
}

function stepper(key, value) {

    <button type="button" data-delta="-1" aria-label="Fewer" ${value <= 1 ? "disabled" : ""}>−</button>
    <input type="number" inputmode="numeric" min="1" max="${MAX_COUNT}" value="${value}" aria-label="Number of repos">
    <button type="button" data-delta="1" aria-label="More" ${value >= MAX_COUNT ? "disabled" : ""}>+</button>
  </div>`;
}

function renderListsTab(focusId) {
  const cats = settings.categories;
  sBody.innerHTML = `
  <div class="group">
    <h4>Trending list</h4>
    <div class="card"><div class="item">
      <div class="label"><strong>Repos shown</strong><small>GitHub lists up to 25 per period</small></div>
      ${stepper("trending", settings.trendingCount)}
    </div></div>
  </div>
  <div class="group">
    <h4>Categories</h4>
    <div class="card">
    ${cats.map((c, i) => {
      const open = editing.has(c.id);
      return `<div class="item ${c.visible ? "" : "hidden"}" data-cat="${c.id}">
        <label class="switch"><input type="checkbox" data-toggle ${c.visible ? "checked" : ""} aria-label="Show ${esc(c.name)}"><span></span></label>
        <div class="label"><strong>${esc(c.name)}</strong><small>${matches(c.keywords).length} matching repos</small></div>
        ${stepper(c.id, c.count)}
        <div class="tools">
          <button class="tool" data-move="-1" aria-label="Move up" ${i === 0 ? "disabled" : ""}>${ICON.up}</button>
          <button class="tool" data-move="1" aria-label="Move down" ${i === cats.length - 1 ? "disabled" : ""}>${ICON.down}</button>
          <button class="tool" data-edit aria-label="Edit ${esc(c.name)}" aria-expanded="${open}">${ICON.edit}</button>
        </div>
        ${open ? `<div class="editor">
          <label class="field">Name<input data-f="name" value="${esc(c.name)}" maxlength="40"></label>
          <label class="field">Keywords, comma separated<textarea data-f="keywords">${esc(c.keywords)}</textarea></label>
          <div class="hint">Matches repo name, description and topics as whole words.</div>
          <div class="row-actions"><button class="btn danger" data-delete>Delete category</button></div>
        </div>` : ""}
      </div>`;
    }).join("")}
    </div>
  </div>
  <div class="group">
    <h4>Add a category</h4>
    <div class="card"><div class="item"><div class="editor" style="padding:2px 0">
      <label class="field">Name<input id="newName" maxlength="40" placeholder="e.g. Security"></label>
      <label class="field">Keywords, comma separated<textarea id="newKeys" placeholder="security, pentest, vulnerability"></textarea></label>
      <div class="hint" id="newHint">Type keywords to preview matches.</div>
      <div class="row-actions"><button class="btn primary" id="addCat" disabled>Add category</button></div>
    </div></div></div>
  </div>
  <div class="group" style="margin-bottom:8px">
    <div class="row-actions" style="justify-content:space-between;align-items:center">
      <span class="hint">Saved in this browser and synced across open tabs.</span>
      <button class="btn" id="resetLists">Reset lists to defaults</button>
    </div>
  </div>`;
  if (focusId) {
    const target = focusId === "trending" ? sBody.querySelector('[data-step="trending"]') : sBody.querySelector(`[data-cat="${focusId}"]`);
    if (target) setTimeout(() => target.scrollIntoView({ block: "center" }), 30);
  }
}

function renderDataTab(onlyLog) {
  const logHTML = db.log.length
    ? `<ul class="log">${db.log.slice(0, 15).map(l => `<li><span>${l.t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span><span class="${l.ok ? "ok" : "bad"}">${l.ok ? "✓" : "✕"}</span><span><b>${esc(l.what)}</b> ${esc(l.note || "")}</span></li>`).join("")}</ul>`
    : `<div class="empty" style="padding:12px">No requests yet in this session.</div>`;
  if (onlyLog) { const el = document.getElementById("logBox"); if (el) el.innerHTML = logHTML; return; }
  sBody.innerHTML = `
  <div class="group">
    <h4>How data is picked</h4>
    <div class="hint" style="font-size:13.5px;line-height:1.55">
      Trending tries fresh cache, then your proxy, then public proxies, then a GitHub API approximation (new repos ranked by stars), then older cache, then the built-in snapshot. Category repos come from the GitHub API, with the same cache and snapshot fallbacks.
    </div>
  </div>
  <div class="group">
    <h4>Your proxy for real Trending</h4>
    <div class="card"><div class="item"><div class="editor" style="padding:2px 0">
      <label class="field">Proxy URL <small>Put {url} where the GitHub address goes, or it is appended.</small>
        <input id="proxyUrl" type="url" inputmode="url" placeholder="https://radar.yourname.workers.dev/?url=" value="${esc(settings.proxyUrl)}"></label>
      <details class="howto"><summary>Set up a free proxy in 3 minutes</summary>
        <div>In Cloudflare, create a Worker, paste this code, deploy, then paste the Worker URL followed by <code>?url=</code> above.</div>
        <pre class="code">${esc(WORKER_CODE)}</pre>
        <button class="btn" id="copyWorker">Copy code</button>
      </details>
    </div></div></div>
  </div>
  <div class="group">
    <h4>Public proxies</h4>
    <div class="card"><div class="item">
      <label class="switch"><input type="checkbox" id="publicProxies" ${settings.publicProxies ? "checked" : ""} aria-label="Use public proxies"><span></span></label>
      <div class="label"><strong>Use public proxies when needed</strong><small>${PUBLIC_PROXIES.map(x => x.label).join(", ")}. Only the public Trending URL is sent. They can be slow or down.</small></div>
    </div></div>
  </div>
  <div class="group">
    <h4>GitHub API</h4>
    <div class="card"><div class="item"><div class="editor" style="padding:2px 0">
      <label class="field">Token <small>Optional. Raises search limit from 10 to 30 requests per minute.</small>
        <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…" value="${esc(settings.token)}"></label>
      <div class="hint">Stored in this browser and sent only to api.github.com. A fine-grained token with no permissions is enough for public data.</div>
    </div></div>
    <div class="item">
      <div class="label"><strong>Remaining searches</strong><small>${rate.remaining === null ? "unknown until the first request" : `${rate.remaining} left, resets ${new Date(rate.reset).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`}</small></div>
    </div></div>
  </div>
  <div class="group">
    <h4>Cache</h4>
    <div class="card"><div class="item">
      <div class="label"><strong>Reuse data for</strong><small>Fewer requests and faster loads</small></div>
      <label class="field"><select id="cacheMinutes" aria-label="Cache duration">${CACHE_OPTIONS.map(([v, l]) => `<option value="${v}" ${settings.cacheMinutes === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
    </div>
    <div class="item"><div class="row-actions" style="width:100%">
      <button class="btn" id="clearCache">Clear cache</button>
      <button class="btn primary" id="refreshNow">Refresh now</button>
    </div></div></div>
  </div>
  <div class="group">
    <h4>Settings storage</h4>
    <div class="card">
      <div class="item"><div class="label"><strong>${esc(KEY.settings)}</strong><small>${store.ok ? `Saved ${store.savedAt ? ago(store.savedAt) : "not yet"}, synced across open tabs` : "This browser is not saving settings (private mode or storage full)"}${store.migratedFrom ? `. Carried over from ${esc(store.migratedFrom)}` : ""}</small></div></div>
      <div class="item"><div class="editor" style="padding:2px 0">
        <label class="field">Back up or move settings <small>Exports never include your token.</small>
          <textarea id="ioBox" spellcheck="false" placeholder="Paste exported settings JSON here, then Import"></textarea></label>
        <div class="hint" id="ioHint"></div>
        <div class="row-actions">
          <button class="btn" id="exportBtn">Copy</button>
          <button class="btn" id="downloadSettings">Download .json</button>
          <button class="btn" id="importBtn">Import text</button>
          <label class="btn" style="display:inline-flex;align-items:center">Import file<input id="importFile" type="file" accept=".json,application/json" hidden></label>
        </div>
        <div class="row-actions"><button class="btn danger" id="resetEverything">Reset everything</button></div>
      </div></div>
    </div>
  </div>
  <div class="group">
    <h4>Export lists</h4>
    <div class="card"><div class="item">
      <div class="label"><strong>Current lists as JSON</strong><small id="listsSummary">${(() => { const x = buildListsExport(); return `${PERIOD_LABEL[x.period]}, trending + ${x.categories.length} categories, ${x.trending.length + x.categories.reduce((n, c) => n + c.repos.length, 0)} repos with stars, gains and source info`; })()}</small></div>
      <button class="btn primary" id="downloadLists">Download .json</button>
    </div>
    <div class="item" style="padding-top:0;border-top:0"><div class="hint" id="listsHint"></div></div></div>
  </div>
  <div class="group" style="margin-bottom:8px">
    <h4>Recent requests</h4>
    <div class="card" id="logBox">${logHTML}</div>
  </div>`;
}

function renderSettings(focusId) {
  document.querySelectorAll("#tabSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.tab === settingsTab));
  settingsTab === "lists" ? renderListsTab(focusId) : renderDataTab();
}
function openSettings(tab, focusId) {
  settingsTab = tab || "lists";
  if (focusId && focusId !== "trending") editing.add(focusId);
  renderSettings(focusId);
  if (typeof dlg.showModal === "function") { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute("open", "");
}
function closeSettings() { if (dlg.open) dlg.close(); }
dlg.addEventListener("close", () => editing.clear());
dlg.addEventListener("click", e => { if (e.target === dlg) closeSettings(); });
document.getElementById("closeSettings").addEventListener("click", closeSettings);
document.getElementById("openSettings").addEventListener("click", () => openSettings("lists"));
document.getElementById("tabSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  settingsTab = b.dataset.tab; renderSettings(); sBody.scrollTop = 0;
});

const catById = id => settings.categories.find(c => c.id === id);
function setCount(key, v) {
  v = Math.max(1, Math.min(MAX_COUNT, parseInt(v, 10) || 1));
  if (key === "trending") settings.trendingCount = v; else { const c = catById(key); if (c) c.count = v; }
  saveSettings(); renderLists();
  return v;
}
function syncStepper(st, v) {
  st.querySelector("input").value = v;
  st.querySelector('[data-delta="-1"]').disabled = v <= 1;
  st.querySelector('[data-delta="1"]').disabled = v >= MAX_COUNT;
}

sBody.addEventListener("click", e => {
  const delta = e.target.closest("[data-delta]");
  if (delta) {
    const st = delta.closest("[data-step]");
    syncStepper(st, setCount(st.dataset.step, parseInt(st.querySelector("input").value, 10) + Number(delta.dataset.delta)));
    return;
  }
  const item = e.target.closest("[data-cat]");
  const c = item && catById(item.dataset.cat);
  const move = e.target.closest("[data-move]");
  if (move && c) {
    const i = settings.categories.indexOf(c), j = i + Number(move.dataset.move);
    if (j < 0 || j >= settings.categories.length) return;
    [settings.categories[i], settings.categories[j]] = [settings.categories[j], settings.categories[i]];
    saveSettings(); renderListsTab(); renderLists();
    sBody.querySelector(`[data-cat="${c.id}"] [data-move="${move.dataset.move}"]`)?.focus();
    return;
  }
  if (e.target.closest("[data-edit]") && c) {
    editing.has(c.id) ? editing.delete(c.id) : editing.add(c.id);
    renderListsTab(); sBody.querySelector(`[data-cat="${c.id}"] [data-edit]`)?.focus();
    return;
  }
  if (e.target.closest("[data-delete]") && c) {
    if (!confirm(`Delete "${c.name}"?`)) return;
    settings.categories = settings.categories.filter(x => x !== c);
    saveSettings(); renderListsTab(); renderLists();
    return;
  }
  switch (e.target.id) {
    case "addCat": {
      const name = document.getElementById("newName").value.trim();
      const keywords = document.getElementById("newKeys").value.trim();
      if (!name || !parseKeywords(keywords).length) return;
      const id = "u" + Date.now().toString(36);
      settings.categories.push({ id, name, keywords, count: 10, visible: true });
      saveSettings(); renderListsTab(); renderLists();
      sBody.querySelector(`[data-cat="${id}"]`)?.scrollIntoView({ block: "center" });
      return;
    }
    case "resetLists": {
      if (!confirm("Reset all lists and categories to defaults?")) return;
      const d = defaultSettings();
      Object.assign(settings, { trendingCount: d.trendingCount, categories: d.categories, sort: d.sort });
      saveSettings(); renderListsTab(); renderAll();
      return;
    }
    case "copyWorker":
      navigator.clipboard?.writeText(WORKER_CODE).then(() => { e.target.textContent = "Copied"; }, () => { e.target.textContent = "Select the code above to copy"; });
      return;
    case "exportBtn": {
      const box = document.getElementById("ioBox"), hint = document.getElementById("ioHint");
      box.value = exportSettings(); box.select();
      navigator.clipboard?.writeText(box.value).then(() => { hint.textContent = "Copied to clipboard."; }, () => { hint.textContent = "Copy the text above."; });
      return;
    }
    case "downloadSettings": {
      const hint = document.getElementById("ioHint");
      hint.textContent = "Preparing…";
      downloadJSON(`ai-repo-radar-settings-v${APP_VERSION}-${stamp()}.json`, JSON.parse(exportSettings()))
        .then(msg => { hint.textContent = msg; });
      return;
    }
    case "downloadLists": {
      const hint = document.getElementById("listsHint");
      hint.textContent = "Preparing…";
      downloadJSON(`ai-repo-radar-lists-${settings.period}-${stamp()}.json`, buildListsExport())
        .then(msg => { hint.textContent = msg; });
      return;
    }
    case "importBtn": {
      const box = document.getElementById("ioBox"), hint = document.getElementById("ioHint");
      try {
        importSettings(box.value);
        renderAll(); renderDataTab();
        document.getElementById("ioHint").textContent = "Imported.";
      } catch { hint.textContent = "That text is not valid exported settings."; }
      return;
    }
    case "resetEverything":
      if (!confirm("Reset all settings and clear cached data? Your token is removed too.")) return;
      settings = defaultSettings(); saveSettings();
      cache = { trending: {}, queries: {} }; saveCache();
      renderAll(); renderDataTab();
      return;
    case "clearCache":
      cache = { trending: {}, queries: {} }; saveCache();
      e.target.textContent = "Cache cleared";
      return;
    case "refreshNow":
      refreshAll(true); renderDataTab();
      return;
  }
});
sBody.addEventListener("change", e => {
  const st = e.target.closest("[data-step]");
  if (st && e.target.tagName === "INPUT") { syncStepper(st, setCount(st.dataset.step, e.target.value)); return; }
  if (e.target.matches("[data-toggle]")) {
    const item = e.target.closest("[data-cat]"); const c = catById(item.dataset.cat);
    c.visible = e.target.checked; item.classList.toggle("hidden", !c.visible);
    saveSettings(); renderLists(); return;
  }
  if (e.target.id === "importFile") {
    const file = e.target.files && e.target.files[0];
    const hint = document.getElementById("ioHint");
    if (!file) return;
    if (file.size > 1e6) { hint.textContent = "That file is too large to be settings."; return; }
    file.text().then(text => {
      try { importSettings(text); renderAll(); renderDataTab(); document.getElementById("ioHint").textContent = `Imported ${file.name}.`; }
      catch { hint.textContent = "That file is not valid exported settings."; }
    });
    e.target.value = "";
    return;
  }
  if (e.target.id === "publicProxies") { settings.publicProxies = e.target.checked; saveSettings(); retryTrending(); }
  if (e.target.id === "cacheMinutes") { settings.cacheMinutes = Number(e.target.value); saveSettings(); }
  if (e.target.id === "proxyUrl") { settings.proxyUrl = e.target.value.trim(); saveSettings(); retryTrending(); }
  if (e.target.id === "token") { settings.token = e.target.value.trim(); saveSettings(); }
});
let typing;
sBody.addEventListener("input", e => {
  const f = e.target.dataset.f;
  if (f) {
    const item = e.target.closest("[data-cat]"); const c = catById(item.dataset.cat);
    c[f] = e.target.value;
    if (f === "name" && !c.name.trim()) return;
    saveSettings();
    clearTimeout(typing);
    typing = setTimeout(() => {
      item.querySelector(".label strong").textContent = c.name;
      item.querySelector(".label small").textContent = `${matches(c.keywords).length} matching repos`;
      renderLists();
    }, 250);
    return;
  }
  if (e.target.id === "newName" || e.target.id === "newKeys") {
    const name = document.getElementById("newName").value.trim();
    const keys = document.getElementById("newKeys").value;
    const n = parseKeywords(keys).length ? matches(keys).length : null;
    document.getElementById("newHint").innerHTML = n === null ? "Type keywords to preview matches." : `Matches <b>${n}</b> repos currently loaded.`;
    document.getElementById("addCat").disabled = !(name && n !== null);
  }
});

/* =========================================================================
   PAGE EVENTS + BOOT
   ========================================================================= */
document.getElementById("periodSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  settings.period = b.dataset.p; saveSettings(); renderAll();
});
document.getElementById("sortSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  settings.sort = b.dataset.s; saveSettings(); renderAll();
});
document.getElementById("refreshBtn").addEventListener("click", () => refreshAll(true));
document.getElementById("status").addEventListener("click", e => { if (e.target.closest("[data-open]")) openSettings("data"); });
document.querySelector("main").addEventListener("click", e => {
  const m = e.target.closest("[data-more]");
  if (m) { const k = m.dataset.more; expanded.has(k) ? expanded.delete(k) : expanded.add(k); renderLists(); return; }
  const a = e.target.closest("[data-adjust]");
  if (a) openSettings("lists", a.dataset.adjust || undefined);
});
// keep the rate-limit countdown ticking
setInterval(() => { if (db.src.pool.waitUntil > Date.now()) renderStatus(); }, 1000);

document.getElementById("foot").innerHTML =
  `v${APP_VERSION}. ` + "Trending comes from github.com/trending when reachable. Category repos come from GitHub Search across AI topics, so a category only finds repos in that pool. Rising means the repo is on the selected period's trending list.";

// ---- Cross-tab sync: another tab saved, apply here ----
window.addEventListener("storage", e => {
  if (e.key === KEY.settings) {
    const u = unwrap(readRaw(KEY.settings), APP_VERSION);
    if (!u.data) return;
    settings = migrateSettings(u.data, u.v);
    store.savedAt = u.savedAt;
    renderAll();
    // Do not yank the form away from someone typing in this tab.
    const typingHere = dlg.open && dlg.contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (dlg.open && !typingHere) renderSettings();
  } else if (e.key === KEY.cache) {
    cache = loadCache();
    PERIODS.forEach(p => {
      const c = cache.trending[p];
      if (c?.rows?.length) setTrending(p, c.rows, { kind: isFresh(c.at) ? c.kind : "cache", label: c.label, at: c.at });
    });
    Object.values(cache.queries).forEach(q => (q.items || []).forEach(mergeRepo));
    scheduleRender();
  }
});

bootData();
renderAll();
refreshAll(false);
})();
</script>
</body>
</html>
