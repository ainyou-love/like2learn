<svg viewBox="0 0 680 300" role="img" aria-labelledby="pb-gate-t"><title id="pb-gate-t">Human gate between select and execute</title><desc>The LLM selects a tool call; code checks risk; low-risk calls execute and loop back; high-risk calls save the thread and pause until a webhook resumes.</desc><defs><marker id="pb-gate-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9z" fill="var(--ink-3)"/></marker></defs><rect class="n-new" x="40" y="30" width="170" height="56" rx="8"/><text class="t t-b" x="125" y="49" text-anchor="middle" dominant-baseline="central">LLM selects step</text><text class="t-s" x="125" y="68" text-anchor="middle" dominant-baseline="central">Structured output</text><line class="w" x1="210" y1="58" x2="248" y2="58" marker-end="url(#pb-gate-ah)"/><rect class="n-box" x="250" y="30" width="170" height="56" rx="8"/><text class="t t-b" x="335" y="49" text-anchor="middle" dominant-baseline="central">Risk check</text><text class="t-s" x="335" y="68" text-anchor="middle" dominant-baseline="central">Code, not judgment</text><line class="w" x1="420" y1="58" x2="458" y2="58" marker-end="url(#pb-gate-ah)"/><rect class="n-box" x="460" y="30" width="180" height="56" rx="8"/><text class="t t-b" x="550" y="49" text-anchor="middle" dominant-baseline="central">Execute</text><text class="t-s" x="550" y="68" text-anchor="middle" dominant-baseline="central">Low risk</text><line class="w" x1="335" y1="86" x2="335" y2="148" marker-end="url(#pb-gate-ah)"/><rect class="n-warn" x="250" y="150" width="170" height="56" rx="8"/><text class="t t-b" x="335" y="169" text-anchor="middle" dominant-baseline="central">Save and pause</text><text class="t-s" x="335" y="188" text-anchor="middle" dominant-baseline="central">Notify approver</text><line class="w" x1="420" y1="178" x2="458" y2="178" marker-end="url(#pb-gate-ah)"/><rect class="n-warn" x="460" y="150" width="180" height="56" rx="8"/><text class="t t-b" x="550" y="169" text-anchor="middle" dominant-baseline="central">Webhook resumes</text><text class="t-s" x="550" y="188" text-anchor="middle" dominant-baseline="central">Approve or reject</text><path class="w-dash" d="M550 206 L550 250 L125 250 L125 88" marker-end="url(#pb-gate-ah)"/><text class="t-s" x="338" y="272" text-anchor="middle">Result or human answer is appended; the loop continues</text></svg>
