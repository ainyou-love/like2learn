<script>
// Old reader links (/read.html?p=<path under resources/>) now live at /post/<file name>.
function showMissing() {
  document.title = "404 · Like2Learn";
  const main = document.createElement("main");
  main.innerHTML = '<h1>404</h1><p>Không tìm thấy bài viết.</p><p><a href="/">← Trang chủ</a></p>';
  document.body.append(main);
}

const key = (new URLSearchParams(location.search).get("p") || "").normalize("NFC");
const path = RESOURCE_PATHS.find((p) => resourceKey(p) === key) || resourceRedirect(key);
if (path) location.replace(resourceReadUrl(path) + location.hash);
else showMissing();
</script>

</body>
