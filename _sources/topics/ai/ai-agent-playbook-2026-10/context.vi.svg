<svg viewBox="0 0 680 250" role="img" aria-labelledby="pb-context-t"><title id="pb-context-t">Context window là một ngân sách</title><desc>Prefix ổn định đã cache, phần giữa chú ý yếu chứa tool output cũ, các step gần đây được chú ý nhiều, recitation todo ở cuối, và chỗ trống.</desc><defs><marker id="pb-context-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9z" fill="var(--ink-3)"/></marker></defs><text class="t-s" x="280" y="62" text-anchor="middle">Vùng lost-in-the-middle</text><text class="t-s" x="615" y="62" text-anchor="middle">Chỗ trống</text><rect class="n-info" x="40" y="80" width="140" height="48" rx="4"/><rect class="n-box" x="180" y="80" width="200" height="48"/><rect class="n-new" x="380" y="80" width="120" height="48"/><rect class="n-warn" x="500" y="80" width="90" height="48"/><rect class="w-dash" x="590" y="80" width="50" height="48" rx="4"/><text class="t t-b" x="110" y="160" text-anchor="middle">Prefix ổn định</text><text class="t-s" x="110" y="180" text-anchor="middle">Đã cache, đừng sửa</text><text class="t t-b" x="280" y="160" text-anchor="middle">Tool output cũ</text><text class="t-s" x="280" y="180" text-anchor="middle">Xóa hoặc compact</text><text class="t t-b" x="440" y="160" text-anchor="middle">Step gần đây</text><text class="t-s" x="440" y="180" text-anchor="middle">Được chú ý nhiều</text><line class="w-dash" x1="545" y1="128" x2="545" y2="198"/><text class="t t-b" x="545" y="216" text-anchor="middle">Recitation todo</text><text class="t-s" x="545" y="234" text-anchor="middle">Mục tiêu ở cuối</text></svg>
