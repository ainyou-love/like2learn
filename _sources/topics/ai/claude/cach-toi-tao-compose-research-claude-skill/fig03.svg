<svg viewBox="0 0 880 676" role="img" aria-labelledby="rc3-t"><title id="rc3-t">Toàn tuyến bảy chặng</title><defs><marker id="rc3-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-3)"/></marker></defs><rect class="n-info" x="64" y="14" width="752" height="74" rx="4" stroke-dasharray="5 4"/><circle class="n-box" cx="92" cy="51" r="15"/><text class="t-m t-b" style="font-size:13px;fill:var(--ink)" x="92" y="56" text-anchor="middle">0</text><text class="t-m t-b" style="font-size:13px;fill:var(--ink)" x="120" y="41" text-anchor="start">PRE-FLIGHT</text><text class="t-s" x="120" y="59" text-anchor="start">akm find "&lt;từ khoá chủ đề&gt;"</text><text class="t-s" x="120" y="75" text-anchor="start">đã kết luận rồi? → thu hẹp chủ đề</text><path class="w" d="M440 88 L440 108" marker-end="url(#rc3-ah)"/><rect class="n-new" x="64" y="108" width="752" height="74" rx="4"/><circle class="n-box" cx="92" cy="145" r="15"/><text class="t-m t-b" style="font-size:13px;fill:var(--ink)" x="92" y="150" text-anchor="middle">1</text><text class="t-m t-b" style="font-size:13px;fill:var(--ink)" x="120" y="129" text-anchor="start">INIT</text><text class="t-s" x="120" y="146" text-anchor="start">run_id = date +%Y%m%d%H%M%S (lấy tươi)</text><text class="t-s" x="120" y="161" text-anchor="start">compose.py init --topic --atoms …</text><text class="t-s" x="120" y="176" text-anchor="start">→ mọi atom = pending</text><path class="w" d="M440 182 L440 202" marker-end="url(#rc3-ah)"/><rect class="n-new" x="64" y="202" width="752" height="74" rx="4"/><circle class="n-box" cx="92" cy="239" r="15"/><text class="t-m t-b" style="font-size:13px;fill:var(--ink)" x="92" y="244" text-anchor="middle">2</text><text class="t-m t-b" style="font-size:13px;fill:var(--ink)" x="120" y="229" text-anchor="start">FAN-OUT</text><text class="t-s" x="120" y="247" text-anchor="start">mark … running, rồi dispatch CẢ 6</text><text class="t-s" x="120" y="263" text-anchor="start">trong MỘT message → song song</text><path class="w" d="M440 276 L440 296" marker-end="url(#rc3-ah)"/><rect class="n-new" x="64" y="296" width="752" height="74" rx="4"/><circle class="n-box" cx="92" cy="333" r="15"/><text class="t-m t-b" style="font-size:13px;fill:var(--ink)" x="92" y="338" text-anchor="middle">3</text><text class="t-m t-b" style="font-size:13px;fill:var(--ink)" x="120" y="323" text-anchor="start">GATE</text><text class="t-s" x="120" y="341" text-anchor="start">lưu &lt;id&gt;.json → validate</text><text class="t-s" x="120" y="357" text-anchor="start">VALID → done · INVALID → 1 lần retry → error</text><path class="w" d="M440 370 L440 390" marker-end="url(#rc3-ah)"/><rect class="n-new" x="64" y="390" width="752" height="74" rx="4"/><circle class="n-box" cx="92" cy="427" r="15"/><text class="t-m t-b" style="font-size:13px;fill:var(--ink)" x="92" y="432" text-anchor="middle">4</text><text class="t-m t-b" style="font-size:13px;fill:var(--ink)" x="120" y="417" text-anchor="start">SYNTHESIS</text><text class="t-s" x="120" y="435" text-anchor="start">lens_outputs = ghép các lăng kính thành công</text><text class="t-s" x="120" y="451" text-anchor="start">research-lens: synthesis(topic, goal, …)</text><path class="w" d="M440 464 L440 484" marker-end="url(#rc3-ah)"/><rect class="n-new" x="64" y="484" width="752" height="74" rx="4"/><circle class="n-box" cx="92" cy="521" r="15"/><text class="t-m t-b" style="font-size:13px;fill:var(--ink)" x="92" y="526" text-anchor="middle">5</text><text class="t-m t-b" style="font-size:13px;fill:var(--ink)" x="120" y="511" text-anchor="start">COMPLETE</text><text class="t-s" x="120" y="529" text-anchor="start">compose.py complete &lt;run_id&gt;</text><text class="t-s" x="120" y="545" text-anchor="start">trình báo cáo cho người dùng</text><path class="w" d="M440 558 L440 578" marker-end="url(#rc3-ah)"/><rect class="n-info" x="64" y="578" width="752" height="74" rx="4" stroke-dasharray="5 4"/><circle class="n-box" cx="92" cy="615" r="15"/><text class="t-m t-b" style="font-size:13px;fill:var(--ink)" x="92" y="620" text-anchor="middle">6</text><text class="t-m t-b" style="font-size:13px;fill:var(--ink)" x="120" y="605" text-anchor="start">RECORD</text><text class="t-s" x="120" y="623" text-anchor="start">chỉ khi kết quả dẫn dắt quyết định/phiên sau</text><text class="t-s" x="120" y="639" text-anchor="start">akm: hypothesis / question + evidence</text><text class="t-s" x="830" y="54" text-anchor="end">tuỳ chọn</text><text class="t-s" x="830" y="618" text-anchor="end">tuỳ chọn</text></svg>
