<svg viewBox="0 0 680 470" role="img" aria-labelledby="pb-anatomy-t"><title id="pb-anatomy-t">Micro-agent bên trong code cố định</title><desc>Lấy dữ liệu, kiểm tra chính sách và thực thi đều là code; một bước LLM chỉ đề xuất; human gate chỉ áp dụng khi nằm ngoài chính sách.</desc><defs><marker id="pb-anatomy-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9z" fill="var(--ink-3)"/></marker></defs><rect class="n-box" x="200" y="20" width="280" height="56" rx="8"/><text class="t t-b" x="340" y="39" text-anchor="middle" dominant-baseline="central">Lấy ticket và đơn hàng</text><text class="t-s" x="340" y="58" text-anchor="middle" dominant-baseline="central">Code cố định, không LLM</text><line class="w" x1="340" y1="76" x2="340" y2="104" marker-end="url(#pb-anatomy-ah)"/><rect class="n-new" x="200" y="106" width="280" height="56" rx="8"/><text class="t t-b" x="340" y="125" text-anchor="middle" dominant-baseline="central">Đề xuất phương án hoàn tiền</text><text class="t-s" x="340" y="144" text-anchor="middle" dominant-baseline="central">LLM loop, tối đa 10 step</text><line class="w" x1="340" y1="162" x2="340" y2="190" marker-end="url(#pb-anatomy-ah)"/><rect class="n-box" x="200" y="192" width="280" height="56" rx="8"/><text class="t t-b" x="340" y="211" text-anchor="middle" dominant-baseline="central">Kiểm tra chính sách</text><text class="t-s" x="340" y="230" text-anchor="middle" dominant-baseline="central">Trên $200 hoặc quá 30 ngày?</text><line class="w" x1="340" y1="248" x2="340" y2="276" marker-end="url(#pb-anatomy-ah)"/><rect class="n-warn" x="200" y="278" width="280" height="56" rx="8"/><text class="t t-b" x="340" y="297" text-anchor="middle" dominant-baseline="central">Người duyệt</text><text class="t-s" x="340" y="316" text-anchor="middle" dominant-baseline="central">Loop tạm dừng, chạy tiếp sau</text><line class="w" x1="340" y1="334" x2="340" y2="362" marker-end="url(#pb-anatomy-ah)"/><rect class="n-box" x="200" y="364" width="280" height="56" rx="8"/><text class="t t-b" x="340" y="383" text-anchor="middle" dominant-baseline="central">Hoàn tiền và gửi email</text><text class="t-s" x="340" y="402" text-anchor="middle" dominant-baseline="central">Code cố định, không LLM</text><path class="w" d="M480 220 L560 220 L560 392 L484 392" marker-end="url(#pb-anatomy-ah)"/><text class="t-s" x="570" y="310" text-anchor="start">Đúng chính sách</text></svg>
