<svg viewBox="0 0 680 250" role="img" aria-labelledby="pb-protocol-t"><title id="pb-protocol-t">Design protocol</title><desc>Nine phases from Need to Iterate, with Iterate looping back to Verify.</desc><defs><marker id="pb-protocol-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9z" fill="var(--ink-3)"/></marker></defs><rect class="n-box" x="22" y="30" width="112" height="56" rx="8"/><text class="t t-b" x="78" y="58" text-anchor="middle" dominant-baseline="central">0 Need?</text><line class="w" x1="134" y1="58" x2="148" y2="58" marker-end="url(#pb-protocol-ah)"/><rect class="n-ok" x="150" y="30" width="112" height="56" rx="8"/><text class="t t-b" x="206" y="58" text-anchor="middle" dominant-baseline="central">1 Verify</text><line class="w" x1="262" y1="58" x2="276" y2="58" marker-end="url(#pb-protocol-ah)"/><rect class="n-box" x="278" y="30" width="112" height="56" rx="8"/><text class="t t-b" x="334" y="58" text-anchor="middle" dominant-baseline="central">2 Shape</text><line class="w" x1="390" y1="58" x2="404" y2="58" marker-end="url(#pb-protocol-ah)"/><rect class="n-box" x="406" y="30" width="112" height="56" rx="8"/><text class="t t-b" x="462" y="58" text-anchor="middle" dominant-baseline="central">3 Tools</text><line class="w" x1="518" y1="58" x2="532" y2="58" marker-end="url(#pb-protocol-ah)"/><rect class="n-box" x="534" y="30" width="112" height="56" rx="8"/><text class="t t-b" x="590" y="58" text-anchor="middle" dominant-baseline="central">4 Context</text><rect class="n-warn" x="86" y="130" width="112" height="56" rx="8"/><text class="t t-b" x="142" y="158" text-anchor="middle" dominant-baseline="central">5 Control</text><line class="w" x1="198" y1="158" x2="212" y2="158" marker-end="url(#pb-protocol-ah)"/><rect class="n-box" x="214" y="130" width="112" height="56" rx="8"/><text class="t t-b" x="270" y="158" text-anchor="middle" dominant-baseline="central">6 Long run</text><line class="w" x1="326" y1="158" x2="340" y2="158" marker-end="url(#pb-protocol-ah)"/><rect class="n-bad" x="342" y="130" width="112" height="56" rx="8"/><text class="t t-b" x="398" y="158" text-anchor="middle" dominant-baseline="central">7 Security</text><line class="w" x1="454" y1="158" x2="468" y2="158" marker-end="url(#pb-protocol-ah)"/><rect class="n-ok" x="470" y="130" width="112" height="56" rx="8"/><text class="t t-b" x="526" y="158" text-anchor="middle" dominant-baseline="central">8 Iterate</text><path class="w" d="M590 86 L590 108 L142 108 L142 128" marker-end="url(#pb-protocol-ah)"/><path class="w-dash" d="M598 158 L640 158 L640 14 L206 14 L206 28" marker-end="url(#pb-protocol-ah)"/><text class="t-s" x="360" y="230" text-anchor="middle">Iterate loops back to Verify: evals are re-run after every change</text></svg>
