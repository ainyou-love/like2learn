<svg viewBox="0 0 900 568" role="img" aria-labelledby="pt-schema-vi-t"><title id="pt-schema-vi-t">Một lõi nhỏ, các miền treo vào Module</title><desc>Lõi: catalog, session, profile. Mọi bảng miền có FK tới Module; mũi tên chỉ vài liên kết giữa các miền.</desc><defs><marker id="pt-schema-vi-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9z" fill="var(--ink-3)"/></marker></defs><rect class="n-new" x="12" y="12" width="12" height="12" rx="3"/><text class="t-s" x="30" y="18" text-anchor="start" dominant-baseline="central">lõi</text><rect class="n-box" x="64.6" y="12" width="12" height="12" rx="3"/><text class="t-s" x="82.6" y="18" text-anchor="start" dominant-baseline="central">miền engine</text><rect class="n-info" x="166.8" y="12" width="12" height="12" rx="3"/><text class="t-s" x="184.8" y="18" text-anchor="start" dominant-baseline="central">dùng chung nhiều miền</text><rect class="band" x="12" y="34" width="876" height="146" rx="12"/><text class="t-h" x="24" y="52">LÕI · mọi bảng bên dưới có FK tới Module</text><rect class="n-new" x="24" y="66" width="160" height="100" rx="8"/><text class="t t-b" x="36" y="84" text-anchor="start" dominant-baseline="central">profile · 1</text><text class="t-m" x="36" y="104" text-anchor="start" dominant-baseline="central">Profile</text><text class="t-s" x="36" y="122" text-anchor="start" dominant-baseline="central">ngày sinh cho</text><text class="t-s" x="36" y="140" text-anchor="start" dominant-baseline="central">các module huyền học</text><rect class="n-new" x="196" y="66" width="332" height="100" rx="8"/><text class="t t-b" x="208" y="84" text-anchor="start" dominant-baseline="central">session · 7</text><text class="t-m" x="208" y="104" text-anchor="start" dominant-baseline="central">Session, Message, Report, Note,</text><text class="t-m" x="208" y="122" text-anchor="start" dominant-baseline="central">LearningPoint, TurnLatency, PeriodSummary</text><text class="t-s" x="208" y="140" text-anchor="start" dominant-baseline="central">một lượt chạy của mọi module; trục lineage</text><rect class="n-new" x="540" y="66" width="336" height="100" rx="8"/><text class="t t-b" x="552" y="84" text-anchor="start" dominant-baseline="central">catalog · 5</text><text class="t-m" x="552" y="104" text-anchor="start" dominant-baseline="central">Module, Category, Tag, Voice,</text><text class="t-m" x="552" y="122" text-anchor="start" dominant-baseline="central">ResearchTopic</text><text class="t-s" x="552" y="140" text-anchor="start" dominant-baseline="central">Module = kind + workflow_config: trục chính</text><line class="w" x1="196" y1="116" x2="186" y2="116" marker-end="url(#pt-schema-vi-ah)"/><line class="w" x1="528" y1="116" x2="538" y2="116" marker-end="url(#pt-schema-vi-ah)"/><rect class="band" x="12" y="196" width="876" height="112" rx="12"/><text class="t-h" x="876" y="214" text-anchor="end" dominant-baseline="central">GẮN VỚI LƯỢT CHẠY · qua Session, Profile</text><rect class="n-box" x="24" y="226" width="160" height="72" rx="8"/><text class="t t-b" x="36" y="244" text-anchor="start" dominant-baseline="central">forecast · 2</text><text class="t-m" x="36" y="264" text-anchor="start" dominant-baseline="central">ForecastRun, Outcome</text><text class="t-m" x="36" y="282" text-anchor="start" dominant-baseline="central">→ Profile</text><rect class="n-box" x="196" y="226" width="160" height="72" rx="8"/><text class="t t-b" x="208" y="244" text-anchor="start" dominant-baseline="central">planner · 4</text><text class="t-m" x="208" y="264" text-anchor="start" dominant-baseline="central">Goal, PlanItem, …</text><text class="t-m" x="208" y="282" text-anchor="start" dominant-baseline="central">→ Session, Topic, Tag</text><rect class="n-box" x="368" y="226" width="160" height="72" rx="8"/><text class="t t-b" x="380" y="244" text-anchor="start" dominant-baseline="central">must_win_goal · 2</text><text class="t-m" x="380" y="264" text-anchor="start" dominant-baseline="central">MustWinGoal, …Log</text><text class="t-m" x="380" y="282" text-anchor="start" dominant-baseline="central">→ Session, FocusGoal</text><rect class="n-box" x="540" y="226" width="160" height="72" rx="8"/><text class="t t-b" x="552" y="244" text-anchor="start" dominant-baseline="central">focus · 3</text><text class="t-m" x="552" y="264" text-anchor="start" dominant-baseline="central">FocusGoal, …Task</text><text class="t-m" x="552" y="282" text-anchor="start" dominant-baseline="central">→ chỉ Module</text><rect class="band" x="12" y="320" width="876" height="112" rx="12"/><text class="t-h" x="876" y="338" text-anchor="end" dominant-baseline="central">MIỀN ENGINE · bảng riêng, gắn với Module</text><rect class="n-box" x="24" y="350" width="160" height="72" rx="8"/><text class="t t-b" x="36" y="368" text-anchor="start" dominant-baseline="central">learning_os · 15</text><text class="t-m" x="36" y="388" text-anchor="start" dominant-baseline="central">Concept, Hypothesis…</text><text class="t-m" x="36" y="406" text-anchor="start" dominant-baseline="central">→ Point ×3</text><rect class="n-box" x="196" y="350" width="160" height="72" rx="8"/><text class="t t-b" x="208" y="368" text-anchor="start" dominant-baseline="central">event_reasoning · 11</text><text class="t-m" x="208" y="388" text-anchor="start" dominant-baseline="central">Event, Run, Law, …</text><text class="t-m" x="208" y="406" text-anchor="start" dominant-baseline="central">→ Point, ChangeItem</text><rect class="n-box" x="368" y="350" width="160" height="72" rx="8"/><text class="t t-b" x="380" y="368" text-anchor="start" dominant-baseline="central">training · 5</text><text class="t-m" x="380" y="388" text-anchor="start" dominant-baseline="central">Case, Drill, Mastery</text><text class="t-m" x="380" y="406" text-anchor="start" dominant-baseline="central">→ Tag</text><rect class="n-box" x="540" y="350" width="160" height="72" rx="8"/><text class="t t-b" x="552" y="368" text-anchor="start" dominant-baseline="central">decision · 5</text><text class="t-m" x="552" y="388" text-anchor="start" dominant-baseline="central">Decision, Layer, …</text><text class="t-m" x="552" y="406" text-anchor="start" dominant-baseline="central">→ Tag</text><rect class="n-box" x="712" y="350" width="160" height="72" rx="8"/><text class="t t-b" x="724" y="368" text-anchor="start" dominant-baseline="central">paragraph · 2</text><text class="t-m" x="724" y="388" text-anchor="start" dominant-baseline="central">Paragraph, Sentence</text><text class="t-m" x="724" y="406" text-anchor="start" dominant-baseline="central">→ chỉ Module</text><rect class="band" x="12" y="444" width="876" height="112" rx="12"/><text class="t-h" x="876" y="462" text-anchor="end" dominant-baseline="central">NGUỒN HỌC VÀ TRỢ LÝ</text><rect class="n-info" x="24" y="474" width="160" height="72" rx="8"/><text class="t t-b" x="36" y="492" text-anchor="start" dominant-baseline="central">knowledge · 4</text><text class="t-m" x="36" y="512" text-anchor="start" dominant-baseline="central">Resource, Point, …</text><text class="t-m" x="36" y="530" text-anchor="start" dominant-baseline="central">nạp bởi vòng sync</text><rect class="n-info" x="196" y="474" width="160" height="72" rx="8"/><text class="t t-b" x="208" y="492" text-anchor="start" dominant-baseline="central">agent · 4</text><text class="t-m" x="208" y="512" text-anchor="start" dominant-baseline="central">AiAgentProfile, …</text><text class="t-m" x="208" y="530" text-anchor="start" dominant-baseline="central">cấu hình học + site</text><rect class="n-box" x="368" y="474" width="160" height="72" rx="8"/><text class="t t-b" x="380" y="492" text-anchor="start" dominant-baseline="central">ebook · 4</text><text class="t-m" x="380" y="512" text-anchor="start" dominant-baseline="central">Book, Chapter, …</text><text class="t-m" x="380" y="530" text-anchor="start" dominant-baseline="central">→ SourceDocument…</text><rect class="n-info" x="540" y="474" width="160" height="72" rx="8"/><text class="t t-b" x="552" y="492" text-anchor="start" dominant-baseline="central">canonical · 13</text><text class="t-m" x="552" y="512" text-anchor="start" dominant-baseline="central">Source*, Lesson, …</text><text class="t-m" x="552" y="530" text-anchor="start" dominant-baseline="central">→ Module ×3</text><rect class="n-box" x="712" y="474" width="160" height="72" rx="8"/><text class="t t-b" x="724" y="492" text-anchor="start" dominant-baseline="central">assistant · 3</text><text class="t-m" x="724" y="512" text-anchor="start" dominant-baseline="central">Thread, Message, …</text><text class="t-m" x="724" y="530" text-anchor="start" dominant-baseline="central">→ ConceptLesson</text><line class="w" x1="104" y1="226" x2="104" y2="168" marker-end="url(#pt-schema-vi-ah)"/><line class="w" x1="276" y1="226" x2="276" y2="168" marker-end="url(#pt-schema-vi-ah)"/><line class="w" x1="448" y1="226" x2="448" y2="168" marker-end="url(#pt-schema-vi-ah)"/><line class="w" x1="528" y1="262" x2="538" y2="262" marker-end="url(#pt-schema-vi-ah)"/><line class="w" x1="196" y1="386" x2="186" y2="386" marker-end="url(#pt-schema-vi-ah)"/><line class="w" x1="104" y1="422" x2="104" y2="472" marker-end="url(#pt-schema-vi-ah)"/><path class="w" d="M226 422 L176 472" marker-end="url(#pt-schema-vi-ah)"/><line class="w" x1="528" y1="510" x2="538" y2="510" marker-end="url(#pt-schema-vi-ah)"/><line class="w" x1="712" y1="510" x2="702" y2="510" marker-end="url(#pt-schema-vi-ah)"/></svg>
