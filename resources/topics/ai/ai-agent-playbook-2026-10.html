<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent field manual: from principles to practice</title>
<meta name="description" content="A field manual for building AI agents: the fundamentals of the agent loop, eleven design principles from minimum context to the lethal trifecta, and how each one diagnoses real production failures.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F3; --surface:#F8F9FB; --ink:#18202B; --muted:#566070; --line:#C7CFD8;
  --code-bg:#E2E7ED;
  --llm:#0F6B66; --llm-bg:#D8EEEB;
  --gate:#9A6300; --gate-bg:#F5E7C6;
  --risk:#A8352A; --risk-bg:#F5DCD8;
  --ok:#2C6A2D; --ok-bg:#DCEAD7;
  --focus:#2B59C3;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --side:252px; --bar:58px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151B23; --surface:#1C242E; --ink:#E5E9EE; --muted:#9BA6B4; --line:#2F3B48;
    --code-bg:#222C38; --llm:#62C9BF; --llm-bg:#12332F; --gate:#E3B04B; --gate-bg:#3A2C10;
    --risk:#EF8C80; --risk-bg:#3E1B17; --ok:#8FCB8C; --ok-bg:#1B3320; --focus:#8AB0FF;
  }
}
:root[data-theme="dark"]{
  --paper:#151B23; --surface:#1C242E; --ink:#E5E9EE; --muted:#9BA6B4; --line:#2F3B48;
  --code-bg:#222C38; --llm:#62C9BF; --llm-bg:#12332F; --gate:#E3B04B; --gate-bg:#3A2C10;
  --risk:#EF8C80; --risk-bg:#3E1B17; --ok:#8FCB8C; --ok-bg:#1B3320; --focus:#8AB0FF;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--bar) + 12px);height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.62 var(--f-body);-webkit-text-size-adjust:100%}
a{color:var(--ink);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--llm)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
code{font-family:var(--f-mono);font-size:.84em;background:var(--code-bg);padding:.08em .35em;border-radius:4px}
img,svg{max-width:100%}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--bar);display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .brand{font:700 17px/1 var(--f-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .spacer{flex:1}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:40px;height:40px;border-radius:8px;cursor:pointer;font-size:20px;line-height:1}
.tabs{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 14px var(--f-body);padding:8px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}

.layout{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:calc(100% - var(--bar))}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bar));align-self:start;height:calc(100vh - var(--bar));overflow:auto;padding:22px 14px 40px 18px;border-right:1px solid var(--line)}
.side h2{font:600 13px var(--f-body);color:var(--muted);margin:0 0 8px 8px;letter-spacing:.01em}
.side ol{list-style:none;margin:0;padding:0}
.side a{display:block;padding:7px 10px;border-radius:7px;text-decoration:none;color:var(--muted);font-size:15px}
.side a:hover{background:var(--surface);color:var(--ink)}
.side a[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--llm)}
.legend{margin:22px 8px 0;display:grid;gap:7px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}
.sw{width:14px;height:14px;border-radius:3px;border:1.5px solid;flex:none}
.sw.code{background:var(--surface);border-color:var(--ink)}
.sw.llm{background:var(--llm-bg);border-color:var(--llm)}
.sw.gate{background:var(--gate-bg);border-color:var(--gate)}
.sw.risk{background:var(--risk-bg);border-color:var(--risk)}
.scrim{display:none}

main{min-width:0;padding:0 28px 80px}
.view{max-width:820px;margin:0 auto}
.view[hidden]{display:none}

.hero{padding:56px 0 30px;border-bottom:1px solid var(--line)}
.hero h1{font:700 clamp(36px,6vw,62px)/1.02 var(--f-display);letter-spacing:-.03em;margin:0 0 18px;max-width:14ch}
.hero p{font-size:19px;color:var(--muted);max-width:60ch;margin:0 0 26px}

section.s{padding:44px 0 8px;border-bottom:1px solid var(--line)}
section.s>h2{font:700 30px/1.15 var(--f-display);letter-spacing:-.02em;margin:0 0 10px}
section.s>.lead{color:var(--muted);max-width:66ch;margin:0 0 24px}
h3{font:700 20px/1.25 var(--f-display);margin:30px 0 10px;letter-spacing:-.01em}
p{max-width:70ch}

.items{display:grid;gap:0;border-top:1px solid var(--line);margin:0 0 24px}
.item{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.item .id{font:600 14px var(--f-mono);color:var(--llm);padding-top:3px}
.item h4{margin:0 0 4px;font:700 17px/1.3 var(--f-body)}
.item p{margin:0;color:var(--ink)}
.item .src{display:block;margin-top:6px;font-size:13.5px;color:var(--muted)}

dl.gloss{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);gap:0;margin:0 0 24px;border-top:1px solid var(--line)}
dl.gloss dt,dl.gloss dd{margin:0;padding:12px 0;border-bottom:1px solid var(--line)}
dl.gloss dt{font-weight:700;padding-right:16px}

.tbl{overflow-x:auto;margin:0 0 26px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:560px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-weight:700;background:var(--code-bg)}
tr:last-child td{border-bottom:0}

pre{font:13.5px/1.55 var(--f-mono);background:var(--code-bg);padding:14px 16px;border-radius:10px;overflow-x:auto;margin:10px 0 18px;white-space:pre}
pre code{background:none;padding:0;font-size:inherit}

figure{margin:12px 0 30px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
figure .fig{overflow-x:auto}
figure svg{display:block;width:100%;min-width:520px;height:auto}
figcaption{font-size:14px;color:var(--muted);margin-top:10px}

.tag{display:inline-block;font:600 12.5px var(--f-mono);padding:2px 7px;border-radius:5px;margin-right:6px;vertical-align:1px}
.tag.bad{background:var(--risk-bg);color:var(--risk)}
.tag.good{background:var(--ok-bg);color:var(--ok)}
.tag.llm{background:var(--llm-bg);color:var(--llm)}
.tag.gate{background:var(--gate-bg);color:var(--gate)}

.ex{border-left:3px solid var(--line);padding:2px 0 2px 16px;margin:0 0 26px}
.ex h4{margin:0 0 8px;font:700 17px var(--f-body)}
.ex .why{color:var(--muted);margin:6px 0 0}
.ex ul{margin:6px 0;padding-left:20px}

.note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:0 0 24px;font-size:15.5px}
.note b{color:var(--llm)}

.phases{list-style:none;margin:0 0 26px;padding:0;counter-reset:ph;border-top:1px solid var(--line)}
.phases li{display:grid;grid-template-columns:48px 130px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.phases .n{font:700 22px/1 var(--f-display);color:var(--llm)}
.phases .k{font-weight:700}

.check{list-style:none;padding:0;margin:0 0 26px}
.check li{padding:6px 0 6px 30px;position:relative}
.check li::before{content:"";position:absolute;left:0;top:10px;width:16px;height:16px;border:1.5px solid var(--muted);border-radius:4px}
.check li.on::before{background:var(--ok);border-color:var(--ok)}
.check li.part::before{background:var(--gate-bg);border-color:var(--gate)}

.refs{list-style:none;margin:0 0 26px;padding:0;border-top:1px solid var(--line)}
.refs li{padding:12px 0;border-bottom:1px solid var(--line)}
.refs .by{color:var(--muted);font-size:14.5px}
.refs .v{font-size:12.5px;margin-left:6px;padding:1px 6px;border-radius:5px}
.refs .v.yes{background:var(--ok-bg);color:var(--ok)}
.refs .v.mem{background:var(--gate-bg);color:var(--gate)}

.md-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:32px 0 14px}
.md-head h2{font:700 26px var(--f-display);margin:0}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);font:700 14px var(--f-body);padding:9px 16px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btns{display:flex;gap:8px}
.status{font-size:14px;color:var(--muted);min-height:1.4em;margin:0 0 8px}
#md-out{white-space:pre-wrap;word-break:break-word;font-size:13.5px;max-height:none}

svg .n-code rect{fill:var(--surface);stroke:var(--ink)}
svg .n-llm rect{fill:var(--llm-bg);stroke:var(--llm)}
svg .n-gate rect{fill:var(--gate-bg);stroke:var(--gate)}
svg .n-risk rect{fill:var(--risk-bg);stroke:var(--risk)}
svg .n-ok rect{fill:var(--ok-bg);stroke:var(--ok)}
svg rect{stroke-width:1.2}
svg .t1{font:700 14px var(--f-body);fill:var(--ink)}
svg .t2{font:400 12px var(--f-body);fill:var(--muted)}
svg .n-llm .t1{fill:var(--llm)} svg .n-gate .t1{fill:var(--gate)} svg .n-risk .t1{fill:var(--risk)} svg .n-ok .t1{fill:var(--ok)}
svg .lbl{font:400 12px var(--f-body);fill:var(--muted)}
svg .ln{stroke:var(--muted);stroke-width:1.3;fill:none}
svg .ln.risk{stroke:var(--risk)} svg .ln.ok{stroke:var(--ok);stroke-dasharray:5 4} svg .ln.dash{stroke-dasharray:4 4}
svg .frame{fill:none;stroke:var(--line);stroke-dasharray:5 4}
svg .axis{stroke:var(--line)}
svg .curve-a{stroke:var(--risk);stroke-width:2.2;fill:none}
svg .curve-b{stroke:var(--llm);stroke-width:2.2;fill:none}
svg .seg-prefix{fill:var(--llm-bg);stroke:var(--llm)}
svg .seg-old{fill:var(--code-bg);stroke:var(--line)}
svg .seg-recent{fill:var(--gate-bg);stroke:var(--gate)}
svg .seg-todo{fill:var(--ok-bg);stroke:var(--ok)}

@media (max-width: 900px){
  .layout{grid-template-columns:1fr}
  .menu-btn{display:inline-block}
  .side{position:fixed;top:calc(env(safe-area-inset-top,0px) + var(--bar));left:0;bottom:0;width:min(300px,86vw);height:auto;background:var(--paper);z-index:40;transform:translateX(-102%);transition:transform .22s ease;border-right:1px solid var(--line);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  body.menu-open .side{transform:none}
  body.menu-open .scrim{display:block;position:fixed;inset:0;top:calc(env(safe-area-inset-top,0px) + var(--bar));background:rgba(10,14,20,.45);z-index:35}
  main{padding:0 18px 64px}
  .hero{padding-top:34px}
  .item{grid-template-columns:48px minmax(0,1fr)}
  dl.gloss{grid-template-columns:1fr}
  dl.gloss dt{border-bottom:0;padding-bottom:0}
  .phases li{grid-template-columns:36px minmax(0,1fr)}
  .phases li .d{grid-column:2}
  .bar .brand{font-size:15px}
}
@media (prefers-reduced-motion: reduce){ .side{transition:none} }
</style>
</head>
<body>
<header class="bar">
  <button class="menu-btn" id="menu-btn" aria-label="Open section menu" aria-expanded="false" aria-controls="side">&#9776;</button>
  <div class="brand">Agent field manual</div>
  <div class="spacer"></div>
  <div class="tabs" role="tablist" aria-label="View format">
    <button role="tab" id="tab-html" aria-selected="true" aria-controls="view-html" data-tab="html">HTML</button>
    <button role="tab" id="tab-md" aria-selected="false" aria-controls="view-md" data-tab="md">Markdown</button>
  </div>
</header>
<div class="layout">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <div class="scrim" id="scrim"></div>
  <main>
    <div class="view" id="view-html" role="tabpanel" aria-labelledby="tab-html"></div>
    <div class="view" id="view-md" role="tabpanel" aria-labelledby="tab-md" hidden>
      <div class="md-head">
        <h2>Markdown</h2>
        <div class="btns">
          <button class="btn" id="copy-md">Copy markdown</button>
          <button class="btn ghost" id="dl-md" hidden>Download .md</button>
        </div>
      </div>
      <p class="status" id="md-status" aria-live="polite"></p>
      <pre id="md-out" tabindex="0"></pre>
    </div>
  </main>
</div>

<script>
/* =========================================================
   LAYER 1 · DATA STATE  (single source of truth)
   ========================================================= */
const DATA = {
  meta: {
    title: "Agent field manual: from principles to practice",
    hero: "An agent is a loop. The rest is software.",
    intro: "A working reference for building LLM agents that survive production: what an agent is, the vocabulary, the principles the field converged on, how to diagnose symptoms, the rules of thumb, and worked examples on one running scenario.",
    scenario: "RefundBot: a support agent that reads a ticket, looks up the order, decides on a refund, issues it, and emails the customer."
  },

  fundamentals: [
    { id:"F1", title:"An agent is a loop", body:"The LLM picks the next step as structured output, your code executes it, the result is appended, and the loop repeats until a terminal step. Good agents are mostly ordinary software with an LLM at a few decision points.", src:"12-Factor Agents; Anthropic, Building effective agents" },
    { id:"F2", title:"The LLM is a stateless function", body:"Every turn the input is “what happened so far, what next?”. The model knows only what is in the context window, so the context is your only control surface.", src:"12-Factor Agents, factor 3" },
    { id:"F3", title:"Context is a finite attention budget", body:"Recall degrades as tokens grow (context rot). More context is not free: every token spends attention.", src:"Anthropic, Effective context engineering" },
    { id:"F4", title:"A tool is a contract with a non-deterministic caller", body:"The caller may hallucinate arguments, skip the tool, or misuse it. Tools are designed for agents, not wrapped from APIs written for developers.", src:"Anthropic, Writing tools for agents" },
    { id:"F5", title:"Errors compound across steps", body:"Per-step reliability multiplies. 95% per step over 10 steps is about 60% task success. Fewer steps often beats a better prompt.", src:"12-Factor Agents (90% is not production-grade)" },
    { id:"F6", title:"Agency has a cost", body:"Agents trade latency and cost for task performance. Autonomy must earn its place against a single call or a fixed workflow.", src:"Anthropic, Building effective agents" }
  ],

  glossary: [
    ["Agent", "An LLM autonomously using tools in a loop, deciding its own path."],
    ["Workflow", "LLM calls orchestrated through predefined code paths. Predictable; the default choice."],
    ["Micro-agent", "A small agent (3–20 steps) embedded in a mostly deterministic pipeline."],
    ["Context window", "All tokens the model sees at one inference: prompt, tools, history, retrieved data."],
    ["Context engineering", "Curating the smallest high-signal set of tokens for each step, not just writing the prompt."],
    ["Context rot", "Degrading recall and reasoning as the context grows longer."],
    ["Lost in the middle", "Models attend less to material buried mid-context than to its start and end."],
    ["KV-cache / prefix caching", "Reuse of computation for an identical prompt prefix. Any change to the prefix invalidates everything after it."],
    ["Compaction", "Summarizing a long history into a new, shorter context so work can continue."],
    ["Restorable compression", "Dropping content but keeping a pointer (URL, file path, ID) so it can be reloaded."],
    ["Structured note-taking", "The agent writes notes or a todo file outside the context and re-reads them later."],
    ["Recitation", "Rewriting the plan at the end of the context to keep the goal in recent attention."],
    ["Just-in-time context", "Keeping lightweight references and loading data with tools only when needed."],
    ["Sub-agent", "A child agent with a clean context that returns a distilled summary to a lead agent."],
    ["Orchestrator-worker", "A lead LLM decomposes a task at runtime and delegates to workers."],
    ["ACI", "Agent-computer interface: tool names, parameters, descriptions, outputs, errors."],
    ["Poka-yoke", "Designing an interface so the wrong call is hard or impossible to make."],
    ["Human-in-the-loop", "A human approves, rejects, or answers at defined points, modeled as a tool call."],
    ["Outer-loop agent", "An agent triggered by events or schedules that contacts humans when needed."],
    ["Stateless reducer", "Agent as a pure function: (thread, event) → next thread. Enables pause, resume, fork."],
    ["Prompt injection", "Untrusted content containing instructions the model follows."],
    ["Lethal trifecta", "Private data + untrusted content + external communication in one agent: exploitable."],
    ["Eval", "A repeatable task set with verifiable outcomes, used to measure changes."],
    ["Trace", "The full record of a run: inputs, tool calls, results, outputs. The raw material for error analysis."],
    ["Research → plan → implement", "Coding-agent workflow where research and plan documents, not chat history, carry context forward."]
  ],

  principles: [
    { id:"P1", title:"Simplest thing first", rule:"Add complexity only when it measurably improves outcomes. Often no agent is needed.", src:"Anthropic" },
    { id:"P2", title:"Own the stack", rule:"Own your prompts, your context format, and your control flow. Don’t hide them in a framework you can’t inspect.", src:"12-Factor" },
    { id:"P3", title:"Minimum high-signal context", rule:"Find the smallest set of tokens that makes the right next step likely.", src:"Anthropic" },
    { id:"P4", title:"Share context; actions carry implicit decisions", rule:"Pass full traces or decision records. Parallel writers with partial context make conflicting choices.", src:"Cognition" },
    { id:"P5", title:"Small agents inside deterministic code", rule:"Keep each agent to a short, scoped task. Everything that can be code, is code.", src:"12-Factor" },
    { id:"P6", title:"Design the ACI like an HCI", rule:"Invest in tool names, parameters, docs and outputs as much as in a human UI. Poka-yoke the arguments.", src:"Anthropic" },
    { id:"P7", title:"Restorable compression", rule:"Compress by dropping content while keeping a pointer to reload it.", src:"Manus" },
    { id:"P8", title:"Errors are evidence, but bounded", rule:"Keep failures visible so the model adapts; cap retries and escalate.", src:"Manus; 12-Factor" },
    { id:"P9", title:"Contacting a human is a tool call", rule:"High-stakes actions pause between tool selection and tool execution.", src:"12-Factor" },
    { id:"P10", title:"Iterate from evals", rule:"Realistic tasks with verifiable outcomes, a held-out set, and regular trace reading.", src:"Hamel Husain; Anthropic" },
    { id:"P11", title:"Never combine the lethal trifecta", rule:"Remove at least one leg: private data, untrusted content, or an exfiltration channel.", src:"Simon Willison" }
  ],

  thinking: [
    ["Agent gets lost after many turns", "Attention budget", "Compact, offload to notes or sub-agents, or restart with artifacts"],
    ["“Should this be multi-agent?”", "Read-parallel vs write-coupled", "Parallelize only independent, read-heavy work"],
    ["Tool is called wrongly", "The tool user is a new hire", "Rename params, add examples, constrain types"],
    ["Too many tools, wrong picks", "Affordances, not API coverage", "Consolidate into workflow-level tools"],
    ["Cost or latency is high", "KV-cache and prefill ratio", "Stable prefix, append-only context, deterministic serialization"],
    ["Same mistake repeats", "Errors as evidence", "Keep the error in context, cap at ~3, escalate"],
    ["Agent drifts from the goal", "Recitation and recency", "Rewrite a todo list at the end of the context"],
    ["Rigid repeated pattern", "The model mimics its context", "Add structured variation, or one fresh context per item"],
    ["Risky action needs approval", "Pause/resume state machine", "Serialize the thread, break the loop, resume on webhook"],
    ["Security exposure", "Capability combinations", "Cut one trifecta leg; don’t rely on filters"],
    ["“Is it getting better?”", "Traces and evals", "Read traces first, then define metrics"],
    ["Coding agent in a brownfield repo", "Artifacts over conversation", "Research → plan → implement, review the plan"]
  ],

  protocol: [
    { n:0, k:"Need?", d:"Can one LLM call plus retrieval do it? If yes, stop." },
    { n:1, k:"Verify", d:"Write realistic eval tasks with verifiable outcomes before building." },
    { n:2, k:"Shape", d:"Workflow (fixed path) or agent (open-ended)? Default to workflow." },
    { n:3, k:"Tools", d:"Few, consolidated, namespaced, token-efficient, with actionable errors." },
    { n:4, k:"Context", d:"Stable prefix, append-only history, compact format, just-in-time loading." },
    { n:5, k:"Control", d:"Own the loop: step cap, retry cap, human gates, stop condition." },
    { n:6, k:"Long run", d:"Escalate in order: compaction, then notes/files, then sub-agents." },
    { n:7, k:"Security", d:"Trifecta audit per agent; least privilege on every tool." },
    { n:8, k:"Iterate", d:"Read traces, fix one tool or prompt, re-run evals on the held-out set." }
  ],

  bestBad: [
    ["Architecture", "Deterministic flow with micro-agents at decision points", "A prompt, 40 tools, and “loop until done”"],
    ["Frameworks", "Raw API calls first; know what any framework does", "Black-box Agent(role, goal, tools)"],
    ["System prompt", "Right altitude: strong heuristics plus canonical examples", "Brittle if/else rules, or vague guidance"],
    ["Examples", "A few diverse, canonical examples", "A laundry list of edge cases"],
    ["Tools", "search_logs, get_customer_context", "One tool per endpoint: list_contacts, read_logs"],
    ["Tool output", "Semantic names, concise/detailed switch, pagination", "Raw UUIDs, mime types, full payload dumps"],
    ["Tool errors", "Actionable: what to change and the expected format", "Opaque codes or stack traces"],
    ["Tool set", "Static definitions; mask or prefix to restrict choices", "Adding or removing tools mid-run"],
    ["Prompt prefix", "Stable, deterministic serialization", "A seconds-precision timestamp at the top"],

};

    const cell = c => String(c).replace(/\|/g, "\\|");

      rows.map(r => `| ${r.map(cell).join(" | ")} |`).join("\n") + "\n\n";

};

    md: () => d.fundamentals.map(f => MD.h(3, `${f.id}. ${f.title}`) + MD.p(f.body) + MD.p(`_Source: ${f.src}_`)).join("") + MD.fig("Anatomy: fetch (code) → propose plan (LLM) → policy check (code) → human approval (gate) → execute (code).") + MD.fig("Compounding: 0.95^10 ≈ 60%, 0.99^10 ≈ 90%.") },

  { id:"glossary", nav:"Glossary", title:"Glossary",
    lead:"Shared vocabulary, so design reviews argue about decisions rather than words.",
    html: () => `<dl class="gloss">${d.glossary.map(([t, def]) => `<dt>${esc(t)}</dt><dd>${esc(def)}</dd>`).join("")}</dl>`,
    md: () => MD.table(["Term", "Meaning"], d.glossary) },

  { id:"principles", nav:"Principles", title:"Principles",
    lead:"Eleven principles the sources converge on. Each has a worked example in “Principles to practice”.",
    html: () => A.items(d.principles.map(p => A.item(p.id, p.title, p.rule, p.src))) +
      A.figure(D.context(), "P3 and P7 as one picture: protect the cached prefix, clean the weak middle, keep the goal at the end."),
    md: () => MD.table(["#", "Principle", "Rule", "Source"], d.principles.map(p => [p.id, p.title, p.rule, p.src])) + MD.fig("Context budget: stable prefix (cached) | old tool outputs (clear or compact) | recent steps (high attention) | todo recitation | headroom.") },

  { id:"thinking", nav:"Thinking in X for issue Y", title:"Thinking in X when facing issue Y",
    lead:"Map the symptom you observe to the mental model that explains it, then to the move that fixes it.",
    html: () => A.table(["Issue Y (symptom)", "Think in X", "Move"], d.thinking) +
      A.figure(D.multi(), "The multi-agent question is about read versus write, not about agent count.") +
      A.h3("Where the sources disagree") + A.table(["Debate", "Side A", "Side B", "Working resolution"], d.tensions),
    md: () => MD.table(["Issue Y (symptom)", "Think in X", "Move"], d.thinking) + MD.fig("Read-parallel sub-agents synthesize cleanly; write-parallel sub-agents clash at merge.") + MD.h(3, "Where the sources disagree") + MD.table(["Debate", "Side A", "Side B", "Working resolution"], d.tensions) },

  { id:"protocol", nav:"Protocol, rules, practices", title:"Protocol, rules, best and bad practice",
    lead:"Design in this order: decide what is right before deciding how to build it.",
    html: () => A.figure(D.protocol(), "Nine phases. Verify comes before any building; Iterate always returns to Verify.") +
      `<ol class="phases">${d.protocol.map(p => `<li><span class="n">${p.n}</span><span class="k">${esc(p.k)}</span><span class="d">${esc(p.d)}</span></li>`).join("")}</ol>` +
      A.h3("Best versus bad practice") + A.table(["Area", "Best", "Bad"], d.bestBad) +
      A.figure(D.gate(), "The one rule frameworks most often break: the gate must sit between selecting a tool call and executing it.") +
      A.h3("Design review checklist") +
      `<ul class="check">${d.checklist.map(([t, s]) => `<li class="${s}">${esc(t)}</li>`).join("")}</ul>` +
      A.note("Legend:", "filled = done, amber = partial, empty = missing. States shown are an example, not a default."),
    md: () => d.protocol.map(p => `${p.n}. **${p.k}** ${p.d}`).join("\n") + "\n\n" + MD.h(3, "Best versus bad practice") + MD.table(["Area", "Best", "Bad"], d.bestBad) + MD.fig("Human gate: LLM selects → code risk check → execute (low risk) or save, pause, notify (high risk) → webhook resumes.") + MD.h(3, "Design review checklist") + d.checklist.map(([t]) => `- [ ] ${t}`).join("\n") + "\n\n" },

  { id:"practice", nav:"Principles to practice", title:"From principles to practice",
    lead:"Every rule above on one running example. " + d.meta.scenario,
    html: () =>
      A.h3("Fundamentals in practice") +
      d.practiceFundamentals.map(x => A.example(`${x.id}. ${x.title}`, [x.code ? A.code(x.code) : "", A.badGood(x.bad, x.good), A.why(x.why)])).join("") +
      A.h3("Principles in practice") +
      d.practicePrinciples.map(x => A.example(`${x.id}. ${x.title}`, [A.badGood(x.bad, x.good), x.code ? A.code(x.code) : ""])).join("") +
      A.figure(D.trifecta(), "P11: don’t try to filter malicious text out of inputs. Remove the exit so injected instructions have nowhere to send data.") +
      A.h3("Thinking in X: four worked cases") +
      d.cases.map(c => A.example(`Case ${c.id}: ${c.title}`, [`<ul>${c.lines.map(([k, v]) => `<li><strong>${esc(k)}:</strong> ${esc(v)}</li>`).join("")}</ul>`])).join("") +
      A.h3("The protocol applied to RefundBot") + A.table(["Phase", "Decision"], d.walkthrough) +
      A.h3(`Real audit: ${d.audit.name}`) + A.p(d.audit.shape) +
      A.note("Already right:", d.audit.good.join("; ") + ".") +
      A.table(["ID", "Risk", "Finding", "Fix"], d.audit.rows) +
      A.note("Fix order:", "D4 → D1 → D6 → D2 → D5 → D3. The first three are each under five lines of code."),
    md: () =>
      MD.h(3, "Fundamentals in practice") +
      d.practiceFundamentals.map(x => MD.h(4, `${x.id}. ${x.title}`) + (x.code ? MD.code(x.code) : "") + (x.bad ? MD.p(`**Bad:** ${x.bad}`) : "") + (x.good ? MD.p(`**Good:** ${x.good}`) : "") + MD.p(`_Why:_ ${x.why}`)).join("") +
      MD.h(3, "Principles in practice") +
      d.practicePrinciples.map(x => MD.h(4, `${x.id}. ${x.title}`) + (x.bad ? MD.p(`**Bad:** ${x.bad}`) : "") + (x.good ? MD.p(`**Good:** ${x.good}`) : "") + (x.code ? MD.code(x.code) : "")).join("") +
      MD.fig("Lethal trifecta: private data + untrusted content → agent context → exfiltration channel; fix = recipient fixed by code.") +
      MD.h(3, "Thinking in X: four worked cases") +
      d.cases.map(c => MD.h(4, `Case ${c.id}: ${c.title}`) + MD.list(c.lines.map(([k, v]) => `**${k}:** ${v}`))).join("") +
      MD.h(3, "The protocol applied to RefundBot") + MD.table(["Phase", "Decision"], d.walkthrough) +
      MD.h(3, `Real audit: ${d.audit.name}`) + MD.p(d.audit.shape) + MD.p("**Already right:** " + d.audit.good.join("; ") + ".") +
      MD.table(["ID", "Risk", "Finding", "Fix"], d.audit.rows) + MD.p("**Fix order:** D4 → D1 → D6 → D2 → D5 → D3.") },

/* =========================================================
   LAYER 4 · COMPOSE + WORKFLOW / EVENTS
   ========================================================= */
const $ = id => document.getElementById(id);

function renderNav() {
  $("side").innerHTML =
    `<h2>Sections</h2><ol>${SECTIONS.map(s => `<li><a href="#${s.id}" data-id="${s.id}">${esc(s.nav)}</a></li>`).join("")}</ol>` +
    `<div class="legend" aria-label="Diagram color legend"><span><i class="sw code"></i>Code</span><span><i class="sw llm"></i>LLM decides</span><span><i class="sw gate"></i>Human gate</span><span><i class="sw risk"></i>Risk</span></div>`;
}

function renderHtml() {
  const hero = `<header class="hero"><h1>${esc(d.meta.hero)}</h1><p>${esc(d.meta.intro)}</p></header>`;
  $("view-html").innerHTML = hero + SECTIONS.map(s => A.section(s.id, s.title, s.lead, s.html())).join("");
}

function buildMarkdown() {
  UI.md = MD.h(1, d.meta.title) + MD.p(`> ${d.meta.hero}`) + MD.p(d.meta.intro) +
    SECTIONS.map(s => MD.h(2, s.title) + MD.p(s.lead) + s.md()).join("");
  $("md-out").textContent = UI.md;
}

function setTab(tab) {
  UI.tab = tab;
  document.querySelectorAll(".tabs [role=tab]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  $("view-html").hidden = tab !== "html";
  $("view-md").hidden = tab !== "md";
  window.scrollTo({ top: 0 });
}

function setMenu(open) {
  UI.menuOpen = open;
  document.body.classList.toggle("menu-open", open);
  $("menu-btn").setAttribute("aria-expanded", String(open));
  $("menu-btn").setAttribute("aria-label", open ? "Close section menu" : "Open section menu");
}

function setStatus(t) { $("md-status").textContent = t; }

async function copyMarkdown() {
  try {
    await navigator.clipboard.writeText(UI.md);
    setStatus("Markdown copied to clipboard.");
  } catch (e) {
    const range = document.createRange();
    range.selectNodeContents($("md-out"));
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (_) {}
    setStatus(ok ? "Markdown copied to clipboard." : "Clipboard blocked here. The text is selected: press Ctrl+C or Cmd+C.");
  }
}

function bindEvents() {
  document.querySelectorAll(".tabs [role=tab]").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
  document.querySelector(".tabs").addEventListener("keydown", e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    const next = UI.tab === "html" ? "md" : "html";
    setTab(next); $("tab-" + next).focus();
  });
  $("menu-btn").addEventListener("click", () => setMenu(!UI.menuOpen));
  $("scrim").addEventListener("click", () => setMenu(false));
  document.addEventListener("keydown", e => { if (e.key === "Escape" && UI.menuOpen) { setMenu(false); $("menu-btn").focus(); } });
  $("side").addEventListener("click", e => {
    const a = e.target.closest("a[data-id]"); if (!a) return;
    e.preventDefault();
    if (UI.tab !== "html") setTab("html");
    setMenu(false);
    const target = $(a.dataset.id);
    if (target) { target.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); target.setAttribute("tabindex", "-1"); target.focus({ preventScroll: true }); }
  });
  $("copy-md").addEventListener("click", copyMarkdown);

  if ("IntersectionObserver" in window) {
    const links = new Map([...document.querySelectorAll("#side a[data-id]")].map(a => [a.dataset.id, a]));
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (!en.isIntersecting) return;
        links.forEach(l => l.removeAttribute("aria-current"));
        const l = links.get(en.target.id); if (l) l.setAttribute("aria-current", "true");
      });
    }, { rootMargin: "-20% 0px -70% 0px" });
    SECTIONS.forEach(s => { const el = $(s.id); if (el) io.observe(el); });
  }
}

async function enableDownload() {
  try {
    if (!window.claude || typeof window.claude.use !== "function") return;
    const downloads = await window.claude.use("downloads");
    if (!downloads) return;
    const btn = $("dl-md"); btn.hidden = false;
    btn.addEventListener("click", async () => {
      try { await downloads.save({ filename: "agent-field-manual.md", data: UI.md }); setStatus("Download started."); }
      catch (e) { setStatus("Download was not completed."); }
    });
  } catch (_) {}
}

function init() {
  renderNav();
  renderHtml();
  buildMarkdown();
  bindEvents();
  enableDownload();
}
init();
</script>
