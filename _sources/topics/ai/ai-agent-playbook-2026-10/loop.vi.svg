<svg viewBox="0 0 680 350" role="img" aria-labelledby="pb-loop-t"><title id="pb-loop-t">Agent loop của RefundBot</title><desc>Thread được gửi tới LLM, LLM chọn step tiếp theo, code của bạn chạy step đó, kết quả được nối vào thread, và loop lặp lại cho đến khi LLM trả về done hoặc chạm step cap.</desc><defs><marker id="pb-loop-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9z" fill="var(--ink-3)"/></marker></defs><rect class="n-box" x="10" y="40" width="200" height="64" rx="8"/><text class="t t-b" x="110" y="62" text-anchor="middle" dominant-baseline="central">1 · Thread hiện có</text><text class="t-s" x="110" y="84" text-anchor="middle" dominant-baseline="central">ticket, các step, kết quả</text><line class="w" x1="210" y1="72" x2="248" y2="72" marker-end="url(#pb-loop-ah)"/><rect class="n-new" x="250" y="40" width="200" height="64" rx="8"/><text class="t t-b" x="350" y="62" text-anchor="middle" dominant-baseline="central">2 · LLM chọn step kế</text><text class="t-m" x="350" y="84" text-anchor="middle" dominant-baseline="central">find_order(email, date)</text><line class="w" x1="450" y1="72" x2="488" y2="72" marker-end="url(#pb-loop-ah)"/><text class="t-s" x="469" y="60" text-anchor="middle">done</text><rect class="n-ok" x="490" y="40" width="180" height="64" rx="8"/><text class="t t-b" x="580" y="62" text-anchor="middle" dominant-baseline="central">Loop dừng</text><text class="t-s" x="580" y="84" text-anchor="middle" dominant-baseline="central">trả về phương án hoàn tiền</text><line class="w" x1="350" y1="104" x2="350" y2="208" marker-end="url(#pb-loop-ah)"/><text class="t-s" x="360" y="160" text-anchor="start">step khác</text><rect class="n-box" x="250" y="210" width="200" height="64" rx="8"/><text class="t t-b" x="350" y="232" text-anchor="middle" dominant-baseline="central">3 · Code của bạn chạy</text><text class="t-s" x="350" y="254" text-anchor="middle" dominant-baseline="central">truy vấn database đơn hàng</text><line class="w" x1="250" y1="242" x2="212" y2="242" marker-end="url(#pb-loop-ah)"/><rect class="n-box" x="10" y="210" width="200" height="64" rx="8"/><text class="t t-b" x="110" y="232" text-anchor="middle" dominant-baseline="central">4 · Nối kết quả vào</text><text class="t-m" x="110" y="254" text-anchor="middle" dominant-baseline="central">order 8812 · $64 · paid</text><line class="w" x1="110" y1="210" x2="110" y2="106" marker-end="url(#pb-loop-ah)"/><text class="t-s" x="120" y="160" text-anchor="start">lặp lại</text><rect class="n-box" x="10" y="300" width="660" height="40" rx="8"/><text class="t-s" x="340" y="320" text-anchor="middle" dominant-baseline="central">Code của bạn cũng đếm số lượt: nó dừng loop ở 10 step kể cả khi LLM không bao giờ trả về done.</text></svg>
