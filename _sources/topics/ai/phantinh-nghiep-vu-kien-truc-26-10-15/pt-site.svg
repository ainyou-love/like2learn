<svg viewBox="0 0 900 748" role="img" aria-labelledby="pt-site-t"><title id="pt-site-t">Real values live only in the browser; the server and the model see tokens and module ids</title><desc>Three lanes: browser, server, model. Seven steps from a typed question to a prefilled module form, a variant for a missing value, and the guards.</desc><defs><marker id="pt-site-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9z" fill="var(--ink-3)"/></marker></defs><rect class="n-bad" x="12" y="12" width="12" height="12" rx="3"/><text class="t-s" x="30" y="18" text-anchor="start" dominant-baseline="central">real value</text><rect class="n-ok" x="108.0" y="12" width="12" height="12" rx="3"/><text class="t-s" x="126.0" y="18" text-anchor="start" dominant-baseline="central">token (masked)</text><rect class="n-warn" x="228.8" y="12" width="12" height="12" rx="3"/><text class="t-s" x="246.8" y="18" text-anchor="start" dominant-baseline="central">left for the user to type</text><rect class="band" x="12" y="40" width="288" height="552" rx="12"/><text class="t-h" x="24" y="60" text-anchor="start" dominant-baseline="central">BROWSER</text><text class="t-s" x="24" y="78" text-anchor="start" dominant-baseline="central">The only place real values live.</text><rect class="band" x="306" y="40" width="288" height="552" rx="12"/><text class="t-h" x="318" y="60" text-anchor="start" dominant-baseline="central">SERVER · api</text><text class="t-s" x="318" y="78" text-anchor="start" dominant-baseline="central">Tokens and module ids. Checks everything.</text><rect class="band" x="600" y="40" width="288" height="552" rx="12"/><text class="t-h" x="612" y="60" text-anchor="start" dominant-baseline="central">MODEL · claude -p</text><text class="t-s" x="612" y="78" text-anchor="start" dominant-baseline="central">Tokens and the module catalog only.</text><rect class="n-box" x="24" y="96" width="264" height="84" rx="8"/><text class="t t-b" x="36" y="116" dominant-baseline="central">1 Type the question</text><text class="t-m" x="36" y="140" dominant-baseline="central">đau đầu, sốt nhẹ từ <tspan class="t-bad">12/10/2026</tspan></text><text class="t-s" x="36" y="158" dominant-baseline="central">“headache, mild fever since …”</text><rect class="n-box" x="24" y="200" width="264" height="112" rx="8"/><text class="t t-b" x="36" y="220" dominant-baseline="central">2 Masked in the browser</text><text class="t-m" x="36" y="244" dominant-baseline="central">đau đầu, sốt nhẹ từ <tspan class="t-ok">&lt;DATE_1&gt;</tspan></text><text class="t-s" x="36" y="262" dominant-baseline="central">token map in sessionStorage (this tab):</text><text class="t-m" x="36" y="280" dominant-baseline="central"><tspan class="t-ok">&lt;DATE_1&gt;</tspan> = <tspan class="t-bad">12/10/2026</tspan></text><rect class="n-box" x="318" y="200" width="264" height="112" rx="8"/><text class="t t-b" x="330" y="220" dominant-baseline="central">3 Server re-checks</text><text class="t-m" x="330" y="244" dominant-baseline="central">sendSiteAssistantMessage</text><text class="t-s" x="330" y="262" dominant-baseline="central">same mask rules again: tokens only</text><text class="t-s" x="330" y="280" dominant-baseline="central">raw value: refused before any write</text><text class="t-s" x="330" y="298" dominant-baseline="central">and before the model is called</text><rect class="n-box" x="612" y="200" width="264" height="112" rx="8"/><text class="t t-b" x="624" y="220" dominant-baseline="central">4 What the model receives</text><text class="t-m" x="624" y="244" dominant-baseline="central">… từ <tspan class="t-ok">&lt;DATE_1&gt;</tspan></text><text class="t-m" x="624" y="262" dominant-baseline="central">dongy_triage | prefill:</text><text class="t-m" x="624" y="280" dominant-baseline="central">  symptom, started_when</text><text class="t-s t-b" x="624" y="298" dominant-baseline="central">No path, no real value</text><rect class="n-box" x="612" y="334" width="264" height="112" rx="8"/><text class="t t-b" x="624" y="354" dominant-baseline="central">5 The model picks a module</text><text class="t-m" x="624" y="378" dominant-baseline="central">module: dongy_triage</text><text class="t-m" x="624" y="396" dominant-baseline="central">symptom: đau đầu, sốt nhẹ</text><text class="t-m" x="624" y="414" dominant-baseline="central">started_when: <tspan class="t-ok">&lt;DATE_1&gt;</tspan></text><text class="t-s" x="624" y="432" dominant-baseline="central">it can name a value only by its token</text><rect class="n-box" x="318" y="334" width="264" height="112" rx="8"/><text class="t t-b" x="330" y="354" dominant-baseline="central">6 Validate, then build the link</text><text class="t-s" x="330" y="378" dominant-baseline="central">module in catalog · field exists</text><text class="t-s" x="330" y="396" dominant-baseline="central">value is a substring of the question</text><text class="t-m" x="330" y="414" dominant-baseline="central">/m/dongy_triage?f.symptom=…</text><text class="t-m" x="330" y="432" dominant-baseline="central">&amp;f.started_when=<tspan class="t-ok">&lt;DATE_1&gt;</tspan></text><rect class="n-box" x="24" y="334" width="264" height="112" rx="8"/><text class="t t-b" x="36" y="354" dominant-baseline="central">7 Unmask and open</text><text class="t-m" x="36" y="378" dominant-baseline="central">…started_when=<tspan class="t-bad">12%2F10%2F2026</tspan></text><text class="t-s" x="36" y="396" dominant-baseline="central">the triage form opens prefilled</text><text class="t-s" x="36" y="414" dominant-baseline="central">the user still presses Run</text><text class="t-s" x="36" y="432" dominant-baseline="central">value not in this tab: no Open button</text><text class="t-h" x="24" y="470" text-anchor="start" dominant-baseline="central">Variant: the question lacks a value</text><rect class="n-box" x="612" y="486" width="264" height="92" rx="8" stroke-dasharray="5 4"/><text class="t t-b" x="624" y="506" dominant-baseline="central">The model leaves it out</text><text class="t-m" x="624" y="530" dominant-baseline="central">prefill: symptom only</text><text class="t-s" x="624" y="548" dominant-baseline="central">told never to invent a value</text><text class="t-s" x="624" y="566" dominant-baseline="central">an invented one is dropped at step 6</text><rect class="n-box" x="318" y="486" width="264" height="92" rx="8" stroke-dasharray="5 4"/><text class="t t-b" x="330" y="506" dominant-baseline="central">No placeholder in the link</text><text class="t-m" x="330" y="530" dominant-baseline="central">/m/dongy_triage?f.symptom=…</text><text class="t-s" x="330" y="548" dominant-baseline="central">unlike Moza's {input:…} field</text><text class="t-s" x="330" y="566" dominant-baseline="central">the module's own form asks instead</text><rect class="n-box" x="24" y="486" width="264" height="92" rx="8" stroke-dasharray="5 4"/><text class="t t-b" x="36" y="506" dominant-baseline="central">The user types it in the form</text><text class="t-m" x="36" y="530" dominant-baseline="central">started_when [ <tspan class="t-warn">__________</tspan> ]</text><text class="t-s" x="36" y="548" dominant-baseline="central">the module's form is the input field</text><text class="t-s" x="36" y="566" dominant-baseline="central">never asked inside the chat popup</text><line class="w" x1="156" y1="180" x2="156" y2="198" marker-end="url(#pt-site-ah)"/><line class="w" x1="288" y1="256" x2="316" y2="256" marker-end="url(#pt-site-ah)"/><line class="w" x1="582" y1="256" x2="610" y2="256" marker-end="url(#pt-site-ah)"/><line class="w" x1="744" y1="312" x2="744" y2="332" marker-end="url(#pt-site-ah)"/><line class="w" x1="612" y1="390" x2="584" y2="390" marker-end="url(#pt-site-ah)"/><line class="w" x1="318" y1="390" x2="290" y2="390" marker-end="url(#pt-site-ah)"/><line class="w" x1="612" y1="532" x2="584" y2="532" marker-end="url(#pt-site-ah)"/><line class="w" x1="318" y1="532" x2="290" y2="532" marker-end="url(#pt-site-ah)"/><rect class="n-box" x="12" y="608" width="876" height="128" rx="10"/><text class="t-h" x="28" y="630" text-anchor="start" dominant-baseline="central">Guards · each covered by a test</text><text class="t-s" x="28" y="656" dominant-baseline="central"><tspan class="t-ok">✓ </tspan>Raw value in the question: refused before any write or model call</text><text class="t-s" x="28" y="680" dominant-baseline="central"><tspan class="t-ok">✓ </tspan>Module outside the catalog or unknown field: the link is dropped</text><text class="t-s" x="28" y="704" dominant-baseline="central"><tspan class="t-ok">✓ </tspan>Prefill not found in the masked question: that value is dropped</text><text class="t-s" x="464" y="656" dominant-baseline="central"><tspan class="t-ok">✓ </tspan>URLs in the reply text are stripped; replies render as plain text</text><text class="t-s" x="464" y="680" dominant-baseline="central"><tspan class="t-ok">✓ </tspan>Stored mask rules that no longer parse: the router turns off</text><text class="t-s" x="464" y="704" dominant-baseline="central"><tspan class="t-ok">✓ </tspan>At most 3 links; an over-long path sheds prefills until it fits</text></svg>
