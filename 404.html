---
layout: null
---

<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
</head>
<body>

{% assign resource_files = site.static_files
  | where_exp: "file", "file.path contains '/resources/'"
  | where_exp: "file", "file.extname == '.html'"
  | sort: "name"
%}

<script>
const resources = {
{% for file in resource_files %}
  {% assign number = file.name | split: "-" | first %}
  "{{ number }}": "{{ file.path }}"{% unless forloop.last %},{% endunless %}
{% endfor %}
};

const key = location.pathname.replace(/^\/+|\/+$/g, "");

if (resources[key]) {
  location.replace(resources[key]);
} else {
  document.body.innerHTML = `
    <h1>404</h1>
    <p>Không tìm thấy: ${key}</p>
    <p><a href="/">← Trang chủ</a></p>
  `;
}
</script>

</body>
</html>
