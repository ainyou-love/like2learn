k)" x="213" y="313">run của project khác ?</text><polyline class="w" points="640 308 744 308" marker-end="url(#rc6-ah)"/><text class="t-s" x="760" y="312" text-anchor="start">bỏ qua</text><rect class="n-box" x="200" y="330" width="440" height="32" rx="4"/><text class="t-m" style="font-size:12px;fill:var(--ink)" x="213" y="351">updated_at &gt; 30 phút ?</text><polyline class="w" points="640 346 744 346" marker-end="url(#rc6-ah)"/><text class="t-s" x="760" y="350" text-anchor="start">bỏ qua</text><rect class="n-box" x="200" y="368" width="440" height="32" rx="4"/><text class="t-m" style="font-size:12px;fill:var(--ink)" x="213" y="389">nudge_count &gt;= 5 ?</text><polyline class="w" points="640 384 744 384" marker-end="url(#rc6-ah)"/><text class="t-s" x="760" y="388" text-anchor="start">bỏ qua</text><path class="w" d="M420 406 L420 428" marker-end="url(#rc6-ah)"/><rect class="n-new" x="180" y="428" width="520" height="38" rx="4"/><text class="t-m" style="font-size:12px;fill:var(--ink)" x="193" y="449">còn atom nào ngoài {done, error, skipped} ?</text><polyline class="w" points="700 447 770 447 770 480" marker-end="url(#rc6-ah)"/><text class="t-s" x="724" y="440" text-anchor="middle">không</text><rect class="n-info" x="686" y="480" width="170" height="34" rx="4"/><text class="t-m" style="font-size:12px;fill:var(--ink)" x="699" y="501">exit 0 · cho dừng</text><path class="w" d="M300 466 L300 492" marker-end="url(#rc6-ah)"/><text class="t-s" x="312" y="484" text-anchor="start">còn</text><rect class="n-warn" x="120" y="492" width="400" height="56" rx="4"/><text class="t-m" style="font-size:12px;fill:var(--ink)" x="133" y="513">nudge_count++ · exit 1 → exit 2 + stderr</text><text class="t-m" style="font-size:12px;fill:var(--ink)" x="133" y="530">LƯỢT BỊ CHẶN, model phải làm nốt</text><rect class="n-info" x="120" y="558" width="736" height="34" rx="4" stroke-dasharray="5 4"/><text class="t-m" style="font-size:12px;fill:var(--ink)" x="133" y="579">mọi lỗi bên trong hook → exi