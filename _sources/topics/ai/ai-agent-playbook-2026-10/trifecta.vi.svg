<svg viewBox="0 0 680 360" role="img" aria-labelledby="pb-trifecta-t"><title id="pb-trifecta-t">Lethal trifecta</title><desc>Dữ liệu riêng tư và nội dung không tin cậy gặp nhau trong context của agent; một kênh exfiltration khiến nó bị khai thác được; allowlist cắt bỏ chân đó.</desc><defs><marker id="pb-trifecta-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9z" fill="var(--ink-3)"/></marker></defs><rect class="n-box" x="60" y="30" width="220" height="56" rx="8"/><text class="t t-b" x="170" y="49" text-anchor="middle" dominant-baseline="central">Dữ liệu riêng tư</text><text class="t-s" x="170" y="68" text-anchor="middle" dominant-baseline="central">Hồ sơ nội bộ</text><rect class="n-box" x="400" y="30" width="220" height="56" rx="8"/><text class="t t-b" x="510" y="49" text-anchor="middle" dominant-baseline="central">Nội dung không tin cậy</text><text class="t-s" x="510" y="68" text-anchor="middle" dominant-baseline="central">Email, ticket, web</text><rect class="n-new" x="230" y="150" width="220" height="56" rx="8"/><text class="t t-b" x="340" y="169" text-anchor="middle" dominant-baseline="central">Context của agent</text><text class="t-s" x="340" y="188" text-anchor="middle" dominant-baseline="central">Mọi chân gặp nhau ở đây</text><line class="w" x1="190" y1="86" x2="290" y2="148" marker-end="url(#pb-trifecta-ah)"/><line class="w" x1="490" y1="86" x2="390" y2="148" marker-end="url(#pb-trifecta-ah)"/><line class="w-bad" x1="290" y1="206" x2="190" y2="268" marker-end="url(#pb-trifecta-ah)"/><rect class="n-bad" x="60" y="270" width="220" height="56" rx="8"/><text class="t t-b" x="170" y="289" text-anchor="middle" dominant-baseline="central">Kênh exfiltration</text><text class="t-s" x="170" y="308" text-anchor="middle" dominant-baseline="central">Gửi tới địa chỉ bất kỳ</text><rect class="n-ok" x="400" y="270" width="220" height="56" rx="8"/><text class="t t-b" x="510" y="289" text-anchor="middle" dominant-baseline="central">Cắt chân này</text><text class="t-s" x="510" y="308" text-anchor="middle" dominant-baseline="central">Người nhận do code cố định</text><line class="w-ok" x1="398" y1="298" x2="284" y2="298" marker-end="url(#pb-trifecta-ah)"/></svg>
