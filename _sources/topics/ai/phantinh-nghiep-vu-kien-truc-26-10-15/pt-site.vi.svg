<svg viewBox="0 0 900 748" role="img" aria-labelledby="pt-site-vi-t"><title id="pt-site-vi-t">Giá trị thật chỉ nằm trong trình duyệt; server và model chỉ thấy token và id module</title><desc>Ba làn: trình duyệt, server, model. Bảy bước từ câu hỏi đến form module đã điền sẵn, một biến thể khi thiếu giá trị, và các chốt chặn.</desc><defs><marker id="pt-site-vi-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9z" fill="var(--ink-3)"/></marker></defs><rect class="n-bad" x="12" y="12" width="12" height="12" rx="3"/><text class="t-s" x="30" y="18" text-anchor="start" dominant-baseline="central">giá trị thật</text><rect class="n-ok" x="120.4" y="12" width="12" height="12" rx="3"/><text class="t-s" x="138.4" y="18" text-anchor="start" dominant-baseline="central">token (đã che)</text><rect class="n-warn" x="241.2" y="12" width="12" height="12" rx="3"/><text class="t-s" x="259.2" y="18" text-anchor="start" dominant-baseline="central">để người dùng tự gõ</text><rect class="band" x="12" y="40" width="288" height="552" rx="12"/><text class="t-h" x="24" y="60" text-anchor="start" dominant-baseline="central">TRÌNH DUYỆT</text><text class="t-s" x="24" y="78" text-anchor="start" dominant-baseline="central">Nơi duy nhất có giá trị thật.</text><rect class="band" x="306" y="40" width="288" height="552" rx="12"/><text class="t-h" x="318" y="60" text-anchor="start" dominant-baseline="central">SERVER · api</text><text class="t-s" x="318" y="78" text-anchor="start" dominant-baseline="central">Token và id module. Kiểm mọi thứ.</text><rect class="band" x="600" y="40" width="288" height="552" rx="12"/><text class="t-h" x="612" y="60" text-anchor="start" dominant-baseline="central">MODEL · claude -p</text><text class="t-s" x="612" y="78" text-anchor="start" dominant-baseline="central">Chỉ token và danh mục module.</text><rect class="n-box" x="24" y="96" width="264" height="84" rx="8"/><text class="t t-b" x="36" y="116" dominant-baseline="central">1 Gõ câu hỏi</text><text class="t-m" x="36" y="140" dominant-baseline="central">đau đầu, sốt nhẹ từ <tspan class="t-bad">12/10/2026</tspan></text><text class="t-s" x="36" y="158" dominant-baseline="central">ngày khớp luật che DATE trong DB</text><rect class="n-box" x="24" y="200" width="264" height="112" rx="8"/><text class="t t-b" x="36" y="220" dominant-baseline="central">2 Che ngay trong trình duyệt</text><text class="t-m" x="36" y="244" dominant-baseline="central">đau đầu, sốt nhẹ từ <tspan class="t-ok">&lt;DATE_1&gt;</tspan></text><text class="t-s" x="36" y="262" dominant-baseline="central">bảng token trong sessionStorage (tab này):</text><text class="t-m" x="36" y="280" dominant-baseline="central"><tspan class="t-ok">&lt;DATE_1&gt;</tspan> = <tspan class="t-bad">12/10/2026</tspan></text><rect class="n-box" x="318" y="200" width="264" height="112" rx="8"/><text class="t t-b" x="330" y="220" dominant-baseline="central">3 Server kiểm lại</text><text class="t-m" x="330" y="244" dominant-baseline="central">sendSiteAssistantMessage</text><text class="t-s" x="330" y="262" dominant-baseline="central">chạy lại cùng luật che: chỉ còn token</text><text class="t-s" x="330" y="280" dominant-baseline="central">còn giá trị thô: từ chối trước khi ghi</text><text class="t-s" x="330" y="298" dominant-baseline="central">và trước khi gọi model</text><rect class="n-box" x="612" y="200" width="264" height="112" rx="8"/><text class="t t-b" x="624" y="220" dominant-baseline="central">4 Model nhận được gì</text><text class="t-m" x="624" y="244" dominant-baseline="central">… từ <tspan class="t-ok">&lt;DATE_1&gt;</tspan></text><text class="t-m" x="624" y="262" dominant-baseline="central">dongy_triage | điền sẵn:</text><text class="t-m" x="624" y="280" dominant-baseline="central">  symptom, started_when</text><text class="t-s t-b" x="624" y="298" dominant-baseline="central">Không đường dẫn, không giá trị thật</text><rect class="n-box" x="612" y="334" width="264" height="112" rx="8"/><text class="t t-b" x="624" y="354" dominant-baseline="central">5 Model chọn module</text><text class="t-m" x="624" y="378" dominant-baseline="central">module: dongy_triage</text><text class="t-m" x="624" y="396" dominant-baseline="central">symptom: đau đầu, sốt nhẹ</text><text class="t-m" x="624" y="414" dominant-baseline="central">started_when: <tspan class="t-ok">&lt;DATE_1&gt;</tspan></text><text class="t-s" x="624" y="432" dominant-baseline="central">chỉ gọi được giá trị bằng token</text><rect class="n-box" x="318" y="334" width="264" height="112" rx="8"/><text class="t t-b" x="330" y="354" dominant-baseline="central">6 Kiểm rồi mới dựng link</text><text class="t-s" x="330" y="378" dominant-baseline="central">module có trong danh mục · field có thật</text><text class="t-s" x="330" y="396" dominant-baseline="central">giá trị là chuỗi con của câu hỏi</text><text class="t-m" x="330" y="414" dominant-baseline="central">/m/dongy_triage?f.symptom=…</text><text class="t-m" x="330" y="432" dominant-baseline="central">&amp;f.started_when=<tspan class="t-ok">&lt;DATE_1&gt;</tspan></text><rect class="n-box" x="24" y="334" width="264" height="112" rx="8"/><text class="t t-b" x="36" y="354" dominant-baseline="central">7 Bỏ che rồi mở</text><text class="t-m" x="36" y="378" dominant-baseline="central">…started_when=<tspan class="t-bad">12%2F10%2F2026</tspan></text><text class="t-s" x="36" y="396" dominant-baseline="central">form “Quyết định đi khám” mở, đã điền</text><text class="t-s" x="36" y="414" dominant-baseline="central">người dùng vẫn tự bấm Run</text><text class="t-s" x="36" y="432" dominant-baseline="central">tab không có giá trị: không có nút Mở</text><text class="t-h" x="24" y="470" text-anchor="start" dominant-baseline="central">Biến thể: câu hỏi thiếu giá trị</text><rect class="n-box" x="612" y="486" width="264" height="92" rx="8" stroke-dasharray="5 4"/><text class="t t-b" x="624" y="506" dominant-baseline="central">Model để trống field</text><text class="t-m" x="624" y="530" dominant-baseline="central">prefill: chỉ symptom</text><text class="t-s" x="624" y="548" dominant-baseline="central">được dặn không bao giờ bịa giá trị</text><text class="t-s" x="624" y="566" dominant-baseline="central">giá trị bịa vẫn bị bỏ ở bước 6</text><rect class="n-box" x="318" y="486" width="264" height="92" rx="8" stroke-dasharray="5 4"/><text class="t t-b" x="330" y="506" dominant-baseline="central">Link không có ô giữ chỗ</text><text class="t-m" x="330" y="530" dominant-baseline="central">/m/dongy_triage?f.symptom=…</text><text class="t-s" x="330" y="548" dominant-baseline="central">khác ô {input:…} của Moza</text><text class="t-s" x="330" y="566" dominant-baseline="central">form của module sẽ hỏi thay</text><rect class="n-box" x="24" y="486" width="264" height="92" rx="8" stroke-dasharray="5 4"/><text class="t t-b" x="36" y="506" dominant-baseline="central">Người dùng gõ trong form</text><text class="t-m" x="36" y="530" dominant-baseline="central">started_when [ <tspan class="t-warn">__________</tspan> ]</text><text class="t-s" x="36" y="548" dominant-baseline="central">form của module chính là ô nhập</text><text class="t-s" x="36" y="566" dominant-baseline="central">không hỏi trong popup chat</text><line class="w" x1="156" y1="180" x2="156" y2="198" marker-end="url(#pt-site-vi-ah)"/><line class="w" x1="288" y1="256" x2="316" y2="256" marker-end="url(#pt-site-vi-ah)"/><line class="w" x1="582" y1="256" x2="610" y2="256" marker-end="url(#pt-site-vi-ah)"/><line class="w" x1="744" y1="312" x2="744" y2="332" marker-end="url(#pt-site-vi-ah)"/><line class="w" x1="612" y1="390" x2="584" y2="390" marker-end="url(#pt-site-vi-ah)"/><line class="w" x1="318" y1="390" x2="290" y2="390" marker-end="url(#pt-site-vi-ah)"/><line class="w" x1="612" y1="532" x2="584" y2="532" marker-end="url(#pt-site-vi-ah)"/><line class="w" x1="318" y1="532" x2="290" y2="532" marker-end="url(#pt-site-vi-ah)"/><rect class="n-box" x="12" y="608" width="876" height="128" rx="10"/><text class="t-h" x="28" y="630" text-anchor="start" dominant-baseline="central">Chốt chặn · mỗi cái có test</text><text class="t-s" x="28" y="656" dominant-baseline="central"><tspan class="t-ok">✓ </tspan>Còn giá trị thô: từ chối trước khi ghi hay gọi model</text><text class="t-s" x="28" y="680" dominant-baseline="central"><tspan class="t-ok">✓ </tspan>Module ngoài danh mục hoặc field lạ: bỏ cả link</text><text class="t-s" x="28" y="704" dominant-baseline="central"><tspan class="t-ok">✓ </tspan>Giá trị không có trong câu hỏi đã che: bỏ giá trị đó</text><text class="t-s" x="464" y="656" dominant-baseline="central"><tspan class="t-ok">✓ </tspan>URL trong lời đáp bị xóa; lời đáp hiện dạng chữ thường</text><text class="t-s" x="464" y="680" dominant-baseline="central"><tspan class="t-ok">✓ </tspan>Luật che trong DB không còn parse được: router tự tắt</text><text class="t-s" x="464" y="704" dominant-baseline="central"><tspan class="t-ok">✓ </tspan>Tối đa 3 link; path quá dài thì bớt giá trị điền sẵn</text></svg>
