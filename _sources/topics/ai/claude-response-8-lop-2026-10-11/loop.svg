<svg viewBox="0 0 640 320" role="img" aria-labelledby="lp-t"><title id="lp-t">Vòng lặp agent: gửi request, Claude trả lời, đọc stop_reason, chạy công cụ hoặc trả lời người dùng</title>
  <defs><marker id="lp-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker></defs>
  <rect class="n-box" x="20" y="120" width="160" height="62" rx="10"/>
  <text class="t t-b" x="100" y="146" text-anchor="middle">Ứng dụng</text>
  <text class="t-s" x="100" y="166" text-anchor="middle">gửi request</text>
  <rect class="n-box" x="240" y="20" width="160" height="62" rx="10"/>
