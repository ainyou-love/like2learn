<svg viewBox="0 0 680 350" role="img" aria-labelledby="pb-loop-t"><title id="pb-loop-t">RefundBot's agent loop</title><desc>The thread goes to the LLM, the LLM names the next step, your code runs it, the result is appended to the thread, and the loop repeats until the LLM names done or the step cap is hit.</desc><defs><marker id="pb-loop-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9z" fill="var(--ink-3)"/></marker></defs><rect class="n-box" x="10" y="40" width="200" height="64" rx="8"/><text class="t t-b" x="110" y="62" text-anchor="middle" dominant-baseline="central">1 · Thread so far</text><text class="t-s" x="110" y="84" text-anchor="middle" dominant-baseline="central">ticket, steps, results</text><line class="w" x1="210" y1="72" x2="248" y2="72" marker-end="url(#pb-loop-ah)"/><rect class="n-new" x="250" y="40" width="200" height="64" rx="8"/><text class="t t-b" x="350" y="62" text-anchor="middle" dominant-baseline="central">2 · LLM names next step</text><text class="t-m" x="350" y="84" text-anchor="middle" dominant-baseline="central">find_order(email, date)</text><line class="w" x1="450" y1="72" x2="488" y2="72" marker-end="url(#pb-loop-ah)"/><text class="t-s" x="469" y="60" text-anchor="middle">done</text><rect class="n-ok" x="490" y="40" width="180" height="64" rx="8"/><text class="t t-b" x="580" y="62" text-anchor="middle" dominant-baseline="central">Loop stops</text><text class="t-s" x="580" y="84" text-anchor="middle" dominant-baseline="central">refund plan returned</text><line class="w" x1="350" y1="104" x2="350" y2="208" marker-end="url(#pb-loop-ah)"/><text class="t-s" x="360" y="160" text-anchor="start">any other step</text><rect class="n-box" x="250" y="210" width="200" height="64" rx="8"/><text class="t t-b" x="350" y="232" text-anchor="middle" dominant-baseline="central">3 · Your code runs it</text><text class="t-s" x="350" y="254" text-anchor="middle" dominant-baseline="central">queries the order database</text><line class="w" x1="250" y1="242" x2="212" y2="242" marker-end="url(#pb-loop-ah)"/><rect class="n-box" x="10" y="210" width="200" height="64" rx="8"/><text class="t t-b" x="110" y="232" text-anchor="middle" dominant-baseline="central">4 · Result appended</text><text class="t-m" x="110" y="254" text-anchor="middle" dominant-baseline="central">order 8812 · $64 · paid</text><line class="w" x1="110" y1="210" x2="110" y2="106" marker-end="url(#pb-loop-ah)"/><text class="t-s" x="120" y="160" text-anchor="start">repeat</text><rect class="n-box" x="10" y="300" width="660" height="40" rx="8"/><text class="t-s" x="340" y="320" text-anchor="middle" dominant-baseline="central">Your code also counts the turns: it stops the loop at 10 steps even if the LLM never names done.</text></svg>
