<rect class="n-warn" x="380.0" y="14" width="200" height="40" rx="8"/>
<text class="t t-b" x="480" y="39.0" text-anchor="middle">YOU (captain)</text>
<rect class="n-new" x="350.0" y="84" width="260" height="40" rx="8"/>
