<style>
  html.reading { height: 100%; }
  html.reading body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: none; margin: 0; padding: 0; }
  .bar { display: flex; flex: none; align-items: center; gap: .5rem; padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent); background: Canvas; color: CanvasText; }
  .bar .crumbs { flex: 1; }
  .bar .raw { display: grid; flex: none; place-items: center; width: 44px; height: 44px; text-decoration: none; }
  .feature { display: grid; flex: none; place-items: center; margin: 0; background: color-mix(in srgb, currentColor 8%, transparent); }
  .feature img { display: block; max-width: 100%; max-height: 24dvh; }
  .reader { display: block; flex: 1; width: 100%; border: 0; }
  @media (min-width: 640px) and (min-height: 500px) {
    .feature img { max-height: 30dvh; }
  }
  @media (pointer: fine) {
    .bar .raw { width: 2rem; height: 2rem; }
  }
</style>
<script>
function followFrameLinks(frame) {
  const doc = frame.contentDocument;
  if (!doc) return;
  doc.addEventListener("click", (event) => {
    const a = event.target.closest?.("a[href]");
    if (!a || event.defaultPrevented) return;
    const url = new URL(a.href, doc.baseURI);
    if (url.origin !== location.origin) {
      a.target = "_blank";
      a.rel = "noopener";
      return;
    }
    if (url.pathname === frame.contentWindow.location.pathname) return;
    event.preventDefault();
    const pathname = decodeURI(url.pathname);
    const next = RESOURCE_PATHS.find((p) => p.normalize("NFC") === pathname.normalize("NFC"));
    location.assign(next ? resourceReadUrl(next) + url.hash : url.href);
  });
}

function featureImage(metadata, meta) {
  if (metadata.feature_image_enabled === false || !meta?.feature_img) return null;
  const figure = document.createElement("figure");
  figure.className = "feature";
  const img = document.createElement("img");
  img.src = resourceFileUrl(`/${RESOURCE_ROOT}/${meta.feature_img}`);
  img.alt = "";
  img.decoding = "async";
  img.addEventListener("error", () => figure.remove());
  figure.append(img);
  return figure;
}

async function showReader(path) {
  document.documentElement.classList.add("reading");
  const dirs = path.split("/").slice(2, -1);
  const metadata = await loadPostMetadata();
  const meta = metadata[resourceKey(path)];
  const subject = meta?.subject || resourceFileLabel(path.split("/").pop());
  document.title = `${subject} · Like2Learn`;

  const raw = document.createElement("a");
  raw.className = "raw";
  raw.href = encodeURI(path) + location.hash;
  raw.target = "_blank";
  raw.rel = "noopener";
  raw.title = "Mở trang gốc";
  raw.setAttribute("aria-label", raw.title);
  raw.textContent = "↗";

  const bar = document.createElement("header");
  bar.className = "bar";
  bar.append(resourceBreadcrumb(dirs, subject), raw);

  const frame = document.createElement("iframe");
  frame.className = "reader";
  frame.title = subject;
  frame.src = encodeURI(path) + location.hash;
  frame.addEventListener("load", () => followFrameLinks(frame));
  const hero = featureImage(metadata, meta);
  document.body.append(bar, ...(hero ? [hero] : []), frame);
}
</script>
