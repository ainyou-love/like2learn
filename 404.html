<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Redirecting...</title>
  {% include resource-tree.html %}
  {% include post-views.html %}
  {% include gallery.html %}
</head>
<body>

<script>
function decodedPath() {
  try { return decodeURIComponent(location.pathname); } catch (e) { return location.pathname; }
}

function link(href, text) {
  const a = document.createElement("a");
  a.href = href;
  a.textContent = text;
  return a;
}

function showFolder(key, posts) {
  const dirs = key.split("/").slice(1);
  const current = dirs.pop() || RESOURCE_ROOT;
  document.title = `${current} · Like2Learn`;
  document.body.append(resourceBreadcrumb(dirs, current), posts);
}

function showNotFound(key) {
  document.title = "404 · Like2Learn";
  const heading = document.createElement("h1");
  heading.textContent = "404";
  const message = document.createElement("p");
  message.textContent = `Không tìm thấy: ${key}`;
  const back = document.createElement("p");
  back.append(link("/", "← Trang chủ"));
  document.body.append(heading, message, back);
}

function galleryTarget(key) {
  const match = key.match(/^resources\/galleries(?:\/([^/]+))?$/);
  if (!match) return null;
  const album = match[1] && galleryAlbum(match[1]);
  return album ? galleryAlbumUrl(album.name) + location.hash : match[1] ? null : "/#gallery";
}

// The Nghệ thuật đàm phán notes were published as No.13–16 before the book folder restarted at 01.
const OLD_BOOK_FOLDER = "resources/ebooks/Donald-Trump/Nghe-thuat-dam-phan/";
const OLD_BOOK_NUMBERS = { "13": "01", "14": "02", "15": "03", "16": "04" };

function oldBookNote(number) {
  const renumbered = OLD_BOOK_NUMBERS[number];
  return renumbered && RESOURCE_PATHS.find((path) =>
    path.startsWith(`/${OLD_BOOK_FOLDER}`) && path.split("/").pop().startsWith(`${renumbered}-`));
}

const key = decodedPath().replace(/^\/+|\/+$/g, "");
const shortLinks = resourceShortLinks();
const flatNote = key.match(/^resources\/(\d+)-[^/]+$/);
const oldBookPath = key.startsWith(OLD_BOOK_FOLDER) && key.match(/\/(\d+)-[^/]+$/);
const target = shortLinks[key] || oldBookNote(key)
  || (flatNote && (oldBookNote(flatNote[1]) || shortLinks[flatNote[1]]))
  || (oldBookPath && oldBookNote(oldBookPath[1]));
const posts = document.createElement("div");

const gallery = galleryTarget(key);

if (gallery) {
  location.replace(gallery);
} else if (target) {
  location.replace(resourceReadUrl(target));
} else {
  renderResourcePosts(posts, key).then((found) => (found ? showFolder(key, posts) : showNotFound(key)));
}
</script>

</body>
</html>
