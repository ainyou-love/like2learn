<svg viewBox="0 0 900 516" role="img" aria-labelledby="pt-trouble-vi-t"><title id="pt-trouble-vi-t">Từ triệu chứng tới trang admin giải thích nó, và cách sửa</title><desc>Bảy triệu chứng thường gặp; mỗi hàng đọc từ trái sang phải: xem ở đâu, thấy gì, sửa thế nào.</desc><defs><marker id="pt-trouble-vi-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9z" fill="var(--ink-3)"/></marker></defs><text class="t-h" x="24" y="40" text-anchor="start" dominant-baseline="central">TRIỆU CHỨNG</text><text class="t-h" x="236" y="40" text-anchor="start" dominant-baseline="central">XEM Ở ĐÂU</text><text class="t-h" x="432" y="40" text-anchor="start" dominant-baseline="central">THẤY GÌ</text><text class="t-h" x="668" y="40" text-anchor="start" dominant-baseline="central">CÁCH SỬA</text><rect class="n-warn" x="24" y="56" width="196" height="52" rx="8"/><text class="t t-b" x="122.0" y="82.0" text-anchor="middle" dominant-baseline="central">Không mở được chat</text><rect class="n-box" x="236" y="56" width="180" height="52" rx="8"/><text class="t t-b" x="326.0" y="73.0" text-anchor="middle" dominant-baseline="central">Tab Bridge</text><text class="t-s" x="326.0" y="92.0" text-anchor="middle" dominant-baseline="central">doctor: ok hay degraded</text><rect class="n-info" x="432" y="56" width="220" height="52" rx="8"/><text class="t t-b" x="542.0" y="73.0" text-anchor="middle" dominant-baseline="central">SHIM_UNREACHABLE</text><text class="t-s" x="542.0" y="92.0" text-anchor="middle" dominant-baseline="central">hoặc SHIM_REFUSED trong lỗi</text><rect class="n-ok" x="668" y="56" width="208" height="52" rx="8"/><text class="t t-b" x="772.0" y="73.0" text-anchor="middle" dominant-baseline="central">Bật host-shim</text><text class="t-s" x="772.0" y="92.0" text-anchor="middle" dominant-baseline="central">make dev; token phải khớp</text><line class="w" x1="220" y1="82" x2="234" y2="82" marker-end="url(#pt-trouble-vi-ah)"/><l