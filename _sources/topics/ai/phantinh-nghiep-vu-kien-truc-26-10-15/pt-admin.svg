<svg viewBox="0 0 900 600" role="img" aria-labelledby="pt-admin-t"><title id="pt-admin-t">Admin settings: seeded from files, edited in one place, read by the runtime</title><desc>Seven settings tabs, each between a source and the code that reads it, plus the two operating pages.</desc><defs><marker id="pt-admin-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9z" fill="var(--ink-3)"/></marker></defs><rect class="n-new" x="12" y="12" width="12" height="12" rx="3"/><text class="t-s" x="30" y="18" text-anchor="start" dominant-baseline="central">writes the DB</text><rect class="n-box" x="126.60000000000001" y="12" width="12" height="12" rx="3"/><text class="t-s" x="144.60000000000002" y="18" text-anchor="start" dominant-baseline="central">read-only view</text><rect class="n-info" x="247.4" y="12" width="12" height="12" rx="3"/><text class="t-s" x="265.4" y="18" text-anchor="start" dominant-baseline="central">acts on the host through the bridge</text><text class="t-h" x="24" y="50" text-anchor="start" dominant-baseline="central">WHERE IT STARTS</text><text class="t-h" x="300" y="50" text-anchor="start" dominant-baseline="central">/admin/settings TAB</text><text class="t-h" x="636" y="50" text-anchor="start" dominant-baseline="central">WHO READS IT</text><rect class="n-box" x="24" y="64" width="230" height="50" rx="8"/><text class="t t-b" x="139.0" y="80.0" text-anchor="middle" dominant-baseline="central">modules/*.yaml</text><text class="t-s" x="139.0" y="99.0" text-anchor="middle" dominant-baseline="central">seed_modules · insert-only</text><rect class="n-new" x="300" y="64" width="290" height="50" rx="8"/><text class="t t-b" x="445.0" y="80.0" text-anchor="middle" dominant-baseline="central">Modules</text><text class="t-s" x="445.0" y="99.0" text-anchor="middle" dominant-baseline="central">editor · kinds.py check · preview</text><rect class="n-box" x="636" y="64" width="240" height="50" rx="8"/><text class="t t-b" x="756.0" y="80.0" text-anchor="middle" dominant-baseline="central">Module rows</text><text class="t-s" x="756.0" y="99.0" text-anchor="middle" dominant-baseline="central">/m/[module], engines, Raycast, UzAI</text><line class="w-acc" x1="254" y1="89" x2="298" y2="89" marker-end="url(#pt-admin-ah)"/><line class="w-acc" x1="590" y1="89" x2="634" y2="89" marker-end="url(#pt-admin-ah)"/><rect class="n-box" x="24" y="124" width="230" height="50" rx="8"/><text class="t t-b" x="139.0" y="140.0" text-anchor="middle" dominant-baseline="central">modules/_meta.yaml</text><text class="t-s" x="139.0" y="159.0" text-anchor="middle" dominant-baseline="central">category list</text><rect class="n-new" x="300" y="124" width="290" height="50" rx="8"/><text class="t t-b" x="445.0" y="140.0" text-anchor="middle" dominant-baseline="central">Categories</text><text class="t-s" x="445.0" y="159.0" text-anchor="middle" dominant-baseline="central">create · rename · reorder</text><rect class="n-box" x="636" y="124" width="240" height="50" rx="8"/><text class="t t-b" x="756.0" y="140.0" text-anchor="middle" dominant-baseline="central">Category rows</text><text class="t-s" x="756.0" y="159.0" text-anchor="middle" dominant-baseline="central">catalog groups, UzAI catalogue</text><line class="w-acc" x1="254" y1="149" x2="298" y2="149" marker-end="url(#pt-admin-ah)"/><line class="w-acc" x1="590" y1="149" x2="634" y2="149" marker-end="url(#pt-admin-ah)"/><rect class="n-box" x="24" y="184" width="230" height="50" rx="8"/><text class="t t-b" x="139.0" y="200.0" text-anchor="middle" dominant-baseline="central">agents.yaml</text><text class="t-s" x="139.0" y="219.0" text-anchor="middle" dominant-baseline="central">seed_agents · insert-only</text><rect class="n-new" x="300" y="184" width="290" height="50" rx="8"/><text class="t t-b" x="445.0" y="200.0" text-anchor="middle" dominant-baseline="central">AI agent</text><text class="t-s" x="445.0" y="219.0" text-anchor="middle" dominant-baseline="central">1 profile · 2 per module · 3 whole site</text><rect class="n-box" x="636" y="184" width="240" height="50" rx="8"/><text class="t t-b" x="756.0" y="200.0" text-anchor="middle" dominant-baseline="central">UzAI</text><text class="t-s" x="756.0" y="219.0" text-anchor="middle" dominant-baseline="central">lesson assistant + site router</text><line class="w-acc" x1="254" y1="209" x2="298" y2="209" marker-end="url(#pt-admin-ah)"/><line class="w-acc" x1="590" y1="209" x2="634" y2="209" marker-end="url(#pt-admin-ah)"/><rect class="n-box" x="24" y="244" width="230" height="50" rx="8"/><text class="t t-b" x="139.0" y="260.0" text-anchor="middle" dominant-baseline="central">voices.yaml</text><text class="t-s" x="139.0" y="279.0" text-anchor="middle" dominant-baseline="central">seeded voices</text><rect class="n-new" x="300" y="244" width="290" height="50" rx="8"/><text class="t t-b" x="445.0" y="260.0" text-anchor="middle" dominant-baseline="central">Voice</text><text class="t-s" x="445.0" y="279.0" text-anchor="middle" dominant-baseline="central">default voice · speak test</text><rect class="n-box" x="636" y="244" width="240" height="50" rx="8"/><text class="t t-b" x="756.0" y="260.0" text-anchor="middle" dominant-baseline="central">Read aloud</text><text class="t-s" x="756.0" y="279.0" text-anchor="middle" dominant-baseline="central">bridge say (macOS)</text><line class="w-acc" x1="254" y1="269" x2="298" y2="269" marker-end="url(#pt-admin-ah)"/><line class="w-acc" x1="590" y1="269" x2="634" y2="269" marker-end="url(#pt-admin-ah)"/><rect class="n-box" x="24" y="304" width="230" height="50" rx="8"/><text class="t t-b" x="139.0" y="320.0" text-anchor="middle" dominant-baseline="central">macOS keychain</text><text class="t-s" x="139.0" y="339.0" text-anchor="middle" dominant-baseline="central">a grant per CLAUDE_CONFIG_DIR</text><rect class="n-info" x="300" y="304" width="290" height="50" rx="8"/><text class="t t-b" x="445.0" y="320.0" text-anchor="middle" dominant-baseline="central">Credentials</text><text class="t-s" x="445.0" y="339.0" text-anchor="middle" dominant-baseline="central">status · sync · log in on the web</text><rect class="n-box" x="636" y="304" width="240" height="50" rx="8"/><text class="t t-b" x="756.0" y="320.0" text-anchor="middle" dominant-baseline="central">bridge credential</text><text class="t-s" x="756.0" y="339.0" text-anchor="middle" dominant-baseline="central">login check before every spawn</text><line class="w" x1="254" y1="329" x2="298" y2="329" marker-end="url(#pt-admin-ah)"/><line class="w" x1="590" y1="329" x2="634" y2="329" marker-end="url(#pt-admin-ah)"/><rect class="n-box" x="24" y="364" width="230" height="50" rx="8"/><text class="t t-b" x="139.0" y="380.0" text-anchor="middle" dominant-baseline="central">bridge/settings.json</text><text class="t-s" x="139.0" y="399.0" text-anchor="middle" dominant-baseline="central">machine paths, CLI args</text><rect class="n-box" x="300" y="364" width="290" height="50" rx="8"/><text class="t t-b" x="445.0" y="380.0" text-anchor="middle" dominant-baseline="central">Bridge</text><text class="t-s" x="445.0" y="399.0" text-anchor="middle" dominant-baseline="central">read-only · doctor + active sessions</text><rect class="n-box" x="636" y="364" width="240" height="50" rx="8"/><text class="t t-b" x="756.0" y="380.0" text-anchor="middle" dominant-baseline="central">phantinh-bridge</text><text class="t-s" x="756.0" y="399.0" text-anchor="middle" dominant-baseline="central">every host command</text><line class="w-dash" x1="254" y1="389" x2="298" y2="389" marker-end="url(#pt-admin-ah)"/><line class="w-dash" x1="590" y1="389" x2="634" y2="389" marker-end="url(#pt-admin-ah)"/><rect class="n-box" x="24" y="424" width="230" height="50" rx="8"/><text class="t t-b" x="139.0" y="440.0" text-anchor="middle" dominant-baseline="central">.env · compose</text><text class="t-s" x="139.0" y="459.0" text-anchor="middle" dominant-baseline="central">ports, URLs, limits</text><rect class="n-box" x="300" y="424" width="290" height="50" rx="8"/><text class="t t-b" x="445.0" y="440.0" text-anchor="middle" dominant-baseline="central">Infra</text><text class="t-s" x="445.0" y="459.0" text-anchor="middle" dominant-baseline="central">read-only · secrets redacted</text><rect class="n-box" x="636" y="424" width="240" height="50" rx="8"/><text class="t t-b" x="756.0" y="440.0" text-anchor="middle" dominant-baseline="central">api settings</text><text class="t-s" x="756.0" y="459.0" text-anchor="middle" dominant-baseline="central">read once per process</text><line class="w-dash" x1="254" y1="449" x2="298" y2="449" marker-end="url(#pt-admin-ah)"/><line class="w-dash" x1="590" y1="449" x2="634" y2="449" marker-end="url(#pt-admin-ah)"/><rect class="band" x="12" y="492" width="876" height="98" rx="12"/><text class="t-h" x="24" y="510">OPERATE · the two pages beside settings</text><rect class="n-box" x="24" y="524" width="420" height="54" rx="8"/><text class="t t-b" x="234.0" y="542.0" text-anchor="middle" dominant-baseline="central">/admin/sessions</text><text class="t-s" x="234.0" y="561.0" text-anchor="middle" dominant-baseline="central">Session rows ↔ tmux: close, delete, reconcile, quality score</text><rect class="n-box" x="456" y="524" width="420" height="54" rx="8"/><text class="t t-b" x="666.0" y="542.0" text-anchor="middle" dominant-baseline="central">/admin/performance</text><text class="t-s" x="666.0" y="561.0" text-anchor="middle" dominant-baseline="central">TurnLatency: model / proxy / ingest / tool time per turn</text></svg>
