<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AKM — Hay để tôi bổ sung thông tin</title>
<meta name="description" content="AKM lưu lập luận thành đồ thị trên Neo4j và đẩy ngữ cảnh vào phiên làm việc mà agent không phải gọi. Kiến trúc, bề mặt dùng được, và phần bên trong.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap">
<style>:root{
  --ground:#F4F2EE; --surface:#FFFFFF; --panel:#EDEAE4; --line:#D8D3CA; --line-soft:#E6E2DB;
  --ink:#1A1916; --muted:#5E5A52; --faint:#8A857B;
  --trace:#2C5F63; --trace-soft:#DFEBEB;
  --est:#2F6B4F;  --hyp:#9A6414;  --unv:#5E5A52;  --asm:#7A4E86;
  --alarm:#8E2F26; --alarm-soft:#F6E5E2;
  --serif:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#14150F; --surface:#1C1E18; --panel:#22241D; --line:#32352B; --line-soft:#26291F;
  --ink:#E8E6DE; --muted:#9B9A90; --faint:#7C7A70;
  --trace:#7FBDBF; --trace-soft:#172A2B;
  --est:#77BC93;  --hyp:#DFAE5E;  --unv:#9B9A90;  --asm:#C39AD0;
  --alarm:#E0897E; --alarm-soft:#2C1B18;
}}
:root[data-theme="dark"]{
  --ground:#14150F; --surface:#1C1E18; --panel:#22241D; --line:#32352B; --line-soft:#26291F;
  --ink:#E8E6DE; --muted:#9B9A90; --faint:#7C7A70;
  --trace:#7FBDBF; --trace-soft:#172A2B;
  --est:#77BC93;  --hyp:#DFAE5E;  --unv:#9B9A90;  --asm:#C39AD0;
  --alarm:#E0897E; --alarm-soft:#2C1B18;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--serif);
  font-size:17.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--trace);outline-offset:3px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;scroll-behavior:auto}}

/* ── top bar ─────────────────────────────────────────────── */
.bar{position:sticky;top:0;z-index:40;background:var(--ground);
  border-bottom:1px solid var(--line);
  padding:9px 18px;padding-top:calc(9px + env(safe-area-inset-top,0px));
  display:flex;gap:10px;align-items:center}
.bar .sp{flex:1}
button{font-family:var(--mono);font-size:12px;letter-spacing:.03em;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:3px;padding:7px 12px;transition:color .12s,border-color .12s}
button:hover{color:var(--ink);border-color:var(--trace)}
button[aria-pressed="true"]{color:var(--ground);background:var(--trace);border-color:var(--trace)}
#navbtn{display:inline-flex}
@media (min-width:1180px){#navbtn{display:none}}

/* ── drawer ──────────────────────────────────────────────── */
#nav{position:fixed;z-index:50;top:0;left:0;width:290px;height:100dvh;overflow-y:auto;
  background:var(--surface);border-right:1px solid var(--line);
  padding:22px 16px calc(22px + env(safe-area-inset-bottom,0px));
  transform:translateX(-100%);transition:transform .2s}
#nav.open{transform:none}
#scrim{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.42)}
@media (min-width:1180px){
  #nav{transform:none;border-right:1px solid var(--line-soft);background:transparent}
  #scrim{display:none}
  body{padding-left:290px}
  .bar{padding-left:26px}
}
#nav .navhead{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);margin:0 0 12px;padding-left:11px}
#toc a{display:block;text-decoration:none;color:var(--muted);font-size:13.5px;line-height:1.42;
  padding:6px 0 6px 11px;border-left:2px solid var(--line-soft)}
#toc a:hover{color:var(--ink);border-left-color:var(--trace)}
#toc a.lv3{padding-left:22px;font-size:12.5px;color:var(--faint)}
#toc a.on{color:var(--ink);border-left-color:var(--trace);font-weight:600}
#toc a.part{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink);margin-top:16px;border-left-color:var(--trace)}
#toc a.part:first-child{margin-top:0}

/* ── page ────────────────────────────────────────────────── */
.wrap{max-width:820px;margin:0 auto;padding:0 20px 90px}
.hero{padding:52px 0 26px;border-bottom:1px solid var(--line)}
.kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;
  color:var(--trace);margin:0 0 16px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(30px,6vw,46px);line-height:1.1;
  letter-spacing:-.015em;margin:0 0 20px;text-wrap:balance}
.lede p{font-size:clamp(17px,2.2vw,19.5px);color:var(--muted);margin:0 0 13px;max-width:64ch}
h2,h3,h4{scroll-margin-top:78px}
h2{font-family:var(--serif);font-weight:600;font-size:clamp(23px,4vw,31px);line-height:1.2;
  letter-spacing:-.012em;margin:54px 0 18px;text-wrap:balance}
h2 .eyebrow{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--trace);font-weight:400;margin-bottom:11px;letter-spacing:.16em}
h3{font-family:var(--serif);font-weight:600;font-size:20.5px;margin:38px 0 12px}
h4{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);margin:28px 0 10px}
p{margin:0 0 17px;max-width:66ch}
ul,ol{margin:0 0 18px;padding-left:22px;max-width:66ch}
li{margin-bottom:8px}
li::marker{color:var(--trace)}
strong{font-weight:600}
blockquote{margin:0 0 20px;padding:2px 0 2px 18px;border-left:2px solid var(--trace);
  color:var(--muted);max-width:64ch}
blockquote p:last-child{margin-bottom:0}
hr{border:0;border-top:1px solid var(--line);margin:46px 0}
code{font-family:var(--mono);font-size:.845em;background:var(--panel);
  border-radius:2px;padding:1.5px 5px;color:var(--ink);overflow-wrap:break-word}
.pre{overflow-x:auto;margin:0 0 22px;background:var(--panel);border-radius:3px;
  border-left:2px solid var(--line)}
.pre pre{margin:0;padding:15px 17px;font-family:var(--mono);font-size:12.5px;line-height:1.55}
.pre code{background:none;padding:0;border-radius:0;font-size:inherit}
.tw{overflow-x:auto;margin:0 0 24px;border:1px solid var(--line);border-radius:3px;
  background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:400px}
th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);text-align:left;font-weight:500;padding:10px 13px;
  border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
td{padding:10px 13px;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.55}
tr:last-child td{border-bottom:0}

/* ── figures ─────────────────────────────────────────────── */
figure{margin:0 0 28px}
.fig{border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:20px 18px}
figcaption{font-size:13.5px;color:var(--muted);margin-top:11px;max-width:64ch;line-height:1.6}
.fmono{font-family:var(--mono)}

/* four questions + score */
.qlist{list-style:none;margin:0;padding:0;counter-reset:q}
.qlist li{counter-increment:q;display:flex;gap:13px;margin:0 0 11px;font-size:16px}
.qlist li::before{content:counter(q);font-family:var(--mono);font-size:11px;color:var(--trace);
  border:1px solid var(--trace);border-radius:50%;width:21px;height:21px;flex:none;
  display:grid;place-items:center;margin-top:3px}
.score{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px;padding-top:15px;
  border-top:1px solid var(--line-soft)}
.sc{flex:1 1 150px;padding:11px 13px;border-radius:3px;background:var(--panel)}
.sc b{display:block;font-family:var(--mono);font-size:26px;line-height:1;margin-bottom:5px}
.sc span{font-size:12.5px;color:var(--muted)}
.sc.good b{color:var(--est)} .sc.bad b{color:var(--alarm)}
.sc.bad{background:var(--alarm-soft)}

/* the boldness: delta proof */
.proof{display:grid;gap:0}
.proof-row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
  padding:16px 0;border-bottom:1px solid var(--line-soft)}
.proof-row:last-child{border-bottom:0}
.proof-what{font-size:15.5px}
.proof-what em{font-style:normal;font-family:var(--mono);font-size:12.5px;color:var(--muted);
  display:block;margin-top:4px}
.proof-n{font-family:var(--mono);font-size:34px;line-height:1;letter-spacing:-.02em}
.proof-row.keep .proof-n{color:var(--est)}
.proof-row.gone .proof-n{color:var(--alarm)}
.proof-note{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);
  font-size:13.5px;color:var(--muted)}

/* graph */
.gnodes{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.gn{font-family:var(--mono);font-size:11.5px;padding:5px 9px;border-radius:3px;
  border:1px solid var(--line);background:var(--panel)}
.gn.core{border-color:var(--trace);color:var(--trace);background:var(--trace-soft)}
.gedges{display:grid;gap:8px}
.ge{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:9px;align-items:center;
  font-family:var(--mono);font-size:11.5px}
.ge i{font-style:normal;color:var(--muted);text-align:right}
.ge b{font-weight:500;color:var(--trace);white-space:nowrap;font-size:10.5px;letter-spacing:.04em}
.ge s{text-decoration:none;color:var(--muted)}
.gsplit{margin:15px 0 9px;padding-top:13px;border-top:1px solid var(--line-soft);
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}

/* loop */
.loop{display:grid;gap:9px}
.lp{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border-radius:3px;
  background:var(--panel)}
.lp em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--trace);
  flex:none;width:18px;padding-top:3px}
.lp div{font-size:14.5px}
.lp code{background:var(--surface)}
.loop-back{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:center;
  padding:8px;border:1px dashed var(--line);border-radius:3px}

/* levels */
.lvl{margin-bottom:17px}
.lvl:last-child{margin-bottom:0}
.lvl-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--trace);margin-bottom:10px}
.lvl-h span{color:var(--faint);letter-spacing:0;text-transform:none;font-size:11.5px}
.tool{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:12px;
  padding:7px 0;border-top:1px solid var(--line-soft);font-size:14px}
.tool:first-of-type{border-top:0}
.tool b{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink)}
.tool span{color:var(--muted)}

/* provenance routes */
.routes{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:620px){.routes{grid-template-columns:1fr 1fr}}
.rt{padding:12px 13px;border-radius:3px;border:1px solid var(--line);background:var(--panel)}
.rt b{display:block;font-family:var(--mono);font-size:12px;margin-bottom:5px;color:var(--trace)}
.rt span{font-size:13.5px;color:var(--muted)}
.routes-top,.routes-bot{font-family:var(--mono);font-size:11.5px;text-align:center;
  padding:10px;border-radius:3px}
.routes-top{background:var(--trace-soft);color:var(--trace);margin-bottom:12px}
.routes-bot{background:var(--alarm-soft);color:var(--alarm);margin-top:12px}

/* push hooks */
.hooks{display:grid;gap:0}
.hk{display:grid;gap:4px;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.hk:last-child{border-bottom:0}
.hk b{font-family:var(--mono);font-size:12.5px;font-weight:500}
.hk i{font-style:normal;font-size:12.5px;color:var(--trace);font-family:var(--mono)}
.hk span{font-size:14px;color:var(--muted)}
.hk.none b,.hk.none i{color:var(--faint)}

/* gates */
.gates{display:grid;gap:7px}
.gt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;align-items:baseline;
  padding:9px 12px;border-radius:3px;background:var(--panel);font-size:14px}
.gt b{font-family:var(--mono);font-size:12px;font-weight:500}
.gt span{color:var(--muted);font-size:13px}

/* islands */
.isl{display:grid;gap:9px}
.is{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:11px;align-items:center;
  font-family:var(--mono);font-size:12px}
.is s{text-decoration:none;color:var(--muted)}
.is b{color:var(--trace);font-weight:500}
.is i{font-style:normal;color:var(--faint);font-size:15px}
.is.shared b{color:var(--hyp)}
.isl-note{margin-top:12px;padding-top:11px;border-top:1px solid var(--line-soft);
  font-family:var(--mono);font-size:11.5px;color:var(--muted)}

/* warm bars */
.bars{display:grid;gap:13px}
.br b{display:block;font-size:13.5px;margin-bottom:6px}
.br-track{display:flex;align-items:center;gap:10px}
.br-fill{height:15px;border-radius:2px;background:var(--trace);flex:none;min-width:3px}
.br.cold .br-fill{background:var(--alarm)}
.br-val{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* guards */
.guards{display:grid;gap:12px}
.gd{padding:14px 15px;border-radius:3px;border-left:3px solid var(--line);background:var(--panel)}
.gd.fast{border-left-color:var(--hyp)}
.gd.bound{border-left-color:var(--est)}
.gd b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.13em;
  text-transform:uppercase;margin-bottom:7px}
.gd.fast b{color:var(--hyp)} .gd.bound b{color:var(--est)}
.gd p{margin:0;font-size:14px;color:var(--muted);max-width:none}
.gd p code{font-size:.9em}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;padding-top:13px;
  border-top:1px solid var(--line-soft);font-family:var(--mono);font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:2px;flex:none;font-style:normal}

/* ── markdown view ───────────────────────────────────────── */
#md{padding-top:26px}
.md-note{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px;
  padding:13px 15px;border:1px solid var(--line);border-radius:3px;background:var(--surface)}
.md-note p{margin:0;font-size:13.5px;color:var(--muted);flex:1 1 220px;max-width:none}
#mdbox{overflow-x:auto;border:1px solid var(--line);border-radius:3px;background:var(--panel)}
#mdbox pre{margin:0;padding:16px 18px;font-family:var(--mono);font-size:12.5px;line-height:1.6;
  white-space:pre}
#mdbox code{background:none;padding:0;border-radius:0;font-size:inherit;color:inherit}
footer{margin-top:58px;padding-top:22px;border-top:1px solid var(--line)}
footer p{font-size:13.5px;color:var(--faint);max-width:64ch;margin:0 0 9px}
</style>
</head>

<header class="bar">
  <button id="navbtn" type="button" aria-expanded="false" aria-controls="nav"></button>
  <span class="sp"></span>
  <button id="viewbtn" type="button" aria-pressed="false"></button>
</header>

<aside id="nav" aria-label="Mục lục">
  <p class="navhead" id="navhead"></p>

</aside>

<div class="wrap">
  <header class="hero">
    <p class="kick" id="kick"></p>

  <main id="docview">
    <div id="doc"></div>

      <button id="copybtn" type="button"></button>

  </section>
</div>

<script type="text/plain" id="src"># AKM — Hay để tôi bổ sung thông tin

> Lập luận là phần đắt nhất của một phiên làm việc, và là phần bay hơi nhanh nhất. Kết luận sống sót trong commit message; còn bằng chứng, các giả thuyết đã bị loại, và câu hỏi thật sự đang được trả lời thì biến mất cùng phiên đó.
> AKM là một workspace tri thức trên Neo4j, mở ra cho agent qua MCP, dựng để trả lời đúng một câu: có thể tái dựng **vì sao** hiểu biết hiện tại tồn tại, mà không cần lịch sử chat, hay không?

---

# PHẦN 1 — Vấn đề, và quyết định thiết kế duy nhất đáng nhớ

## Bốn câu hỏi, và một phép đo

Hệ này không tự nhận là hữu ích. Nó chọn bốn câu hỏi cụ thể, bắt buộc phải trả lời được **từ đồ thị, qua MCP, không có lịch sử chat**, rồi đo xem trả lời được mấy câu.

@fig:fourQ
    1. Vì sao ProblemState này tồn tại?
    2. Điều gì đã đổi so với state trước?
    3. Bằng chứng nào gây ra thay đổi đó?
    4. Câu hỏi nào đang được trả lời?

    baseline:  0/4        sau slice này:  4/4
@endfig

Đây là **vertical slice về traceability**, không phải MVP đầy đủ. Phạm vi hẹp là cố ý: một câu hỏi, một phép đo, và một con số để đối chiếu.

## Cạnh `NEXT_STATE` không mang theo lý do

Spec cho đúng một cạnh giữa hai trạng thái — `ProblemState -[:NEXT_STATE]-> ProblemState` — và cạnh đó **không mang theo biện minh nào**.

Hệ quả rất cụ thể. Giả sử một state làm nảy ra ba câu hỏi, và năm node Information trả lời chúng. Không có gì ghi lại rằng *cái nào trong số đó* thật sự biện minh cho state kế tiếp. Không gian câu hỏi và con đường lập luận thực sự đã đi bị gộp làm một — đúng thứ mà spec cấm gộp.

Nên `ReasoningDelta` được **lưu thành node**, thay vì tan biến lúc commit, mang theo năm cạnh: `FROM_STATE`, `TO_STATE`, `ANSWERED`, `USED`, `INTRODUCED`.

## Nó chịu lực — và điều đó được đo, không phải được lập luận

Đây là chỗ đáng nhớ nhất của toàn bộ hệ. Lấy một chuỗi ba state đã hoàn chỉnh, xoá **chỉ** các node `ReasoningDelta`, giữ nguyên toàn bộ 13 node tri thức. Tri thức còn nguyên vẹn. Điểm rơi từ 4/4 xuống 0/4.

@fig:deltaProof
    chuỗi 3 state, 13 node tri thức, có ReasoningDelta   ->  4/4
    chuỗi 3 state, 13 node tri thức, xoá ReasoningDelta  ->  0/4
@endfig

Tri thức sống sót. Lập luận thì không. Một kho chứa claim mà không giữ delta thì vẫn tra cứu được, nhưng không tái dựng được suy nghĩ — và tái dựng suy nghĩ mới là thứ đắt.

## Bảy loại node, và các cạnh giữa chúng

@fig:graph
    Task --HAS_STATE--> ProblemState --NEXT_STATE--> ProblemState
                             |  RAISES
                             v
                         Question <--ANSWERS-- Information --DERIVED_FROM--> Evidence --FROM--> Source
                                                    |  SUPERSEDES
                                                    v
                                              Information (cũ)

    ReasoningDelta --FROM_STATE--> ProblemState (trước)
                   --TO_STATE----> ProblemState (sau)
                   --ANSWERED----> Question
                   --USED--------> Information (đã có)
                   --INTRODUCED--> Information / Question (mới)
@endfig

Sáu cạnh đầu đến từ spec. Năm cạnh của delta là phần mở rộng — chính là phần làm bốn câu hỏi trả lời được. `SUPERSEDES` là phần mở rộng thứ hai: claim không bao giờ bị sửa tại chỗ, nên nếu không có cạnh này, người đọc sau gặp hai claim mâu thuẫn và không có gì nói cái nào còn hiệu lực.

## Vòng lặp

@fig:loop
    find_information  ->  "thứ này đã biết chưa?"
             |
    open_task --+                                              |
                +--> get_work_context -> điều tra -> submit_reasoning_delta --+
    list_tasks -+            ^                                               |
                             +-----------------------------------------------+
@endfig

Mỗi delta trả lời một câu hỏi và thường làm nảy ra câu tiếp theo. Đó là động cơ của hệ: một trạng thái làm nảy câu hỏi, bằng chứng trả lời một câu, câu trả lời sinh ra trạng thái mới.

Điểm hay bị bỏ qua nằm ở `open_task`: trường `initial_understanding` là thứ bạn tin **trước khi** điều tra. Một câu "chưa rõ nguyên nhân; chỉ biết nó trùng với lần deploy hôm thứ Ba nhưng diff hôm đó không đụng tới đường truy vấn" là khởi điểm tốt hơn hẳn một phỏng đoán tự tin — vì toàn bộ giá trị nằm ở chỗ nhìn hiểu biết thay đổi.

# PHẦN 2 — Bề mặt dùng được

## Bảy công cụ, hai mức bộc lộ

Năm công cụ giữ ngữ cảnh nhỏ, hai công cụ trả về toàn văn khi một con trỏ nào đó cho thấy có thứ đáng đọc kỹ.

@fig:levels
    MỨC 1 — giữ gói nhỏ
      open_task            mở một hướng điều tra
      list_tasks           cách duy nhất lấy lại task id của phiên trước
      find_information     tìm toàn văn trong claim đã ghi
      get_work_context     gói tối thiểu để đi tiếp
      submit_reasoning_delta   đề xuất một bước

    MỨC 2 — toàn văn, khi con trỏ mức 1 chỉ tới
      get_state            rationale đầy đủ của một bước
      get_information      claim đầy đủ + bằng chứng + nguồn
@endfig

`get_work_context` cố tình **không** trả về toàn bộ lịch sử, toàn đồ thị, hay thân bằng chứng. Nó trả state hiện tại, câu hỏi đang mở, `key_information`, `provenance`, và `state_history` — một dòng cho mỗi bước.

Có một cái bẫy đếm ở đây, đáng biết trước khi tin vào gói dữ liệu: khi gói bị cắt cho vừa trần, `truncated` bật lên và `truncated_lists` nói rõ danh sách nào mất bao nhiêu mục. Nhưng câu hỏi đang mở còn bị chặn bởi `default_top_k` **trước** khi việc cắt diễn ra, và chuyện đó chỉ lộ ra ở chỗ `active_questions_shown` nhỏ hơn `active_questions_total`. Nói cách khác: `truncated_lists` rỗng **không** có nghĩa là bạn đã thấy hết.

Tìm kiếm là toàn văn có stemming tiếng Anh, **không phải ngữ nghĩa**: "subagents" khớp "subagent", nhưng "pricing" sẽ không khớp một claim chỉ viết bằng chữ "cost". Thử vài cách diễn đạt trước khi kết luận là chưa ai ghi gì.

## Luật chứng cứ, được máy thực thi

Đây là ràng buộc nghiêm nhất của hệ. Mọi `Information` có kiểu thuộc nhóm factual — tức là mọi kiểu **trừ** `assumption` — phải thoả một trong bốn lối:

@fig:provenance
    fact · rule · definition · constraint · observation · derived_fact
                              |
        +-----------+---------+---------+-------------------+
        |           |                   |                   |
    derived_from  human_asserted   system_observed   epistemic_status thuộc
    -> Evidence     : true            : true         assumption/hypothesis/unverified
        |           |                   |                   |
        +-----------+---------+---------+-------------------+
                              |
                      không có lối nào -> server từ chối delta
@endfig

Lý do tồn tại của luật này được nói thẳng trong skill: thứ nguy hại nhất mà một hệ lập luận có thể làm là để output của model trở thành một sự thật không có xuất xứ, rồi việc sau xây tiếp lên đó. Khi bạn đang suy ra chứ không phải đang quan sát, hãy nói ra — `derived_fact` kèm bằng chứng đã suy từ đó, hoặc `assumption` khi thật sự không biết. **Một phỏng đoán được ghi đúng là phỏng đoán thì có ích; một phỏng đoán được ghi thành sự thật là một quả mìn.**

Bằng chứng **trỏ tới, không sao chép**. Một locator là `src/queue/worker.py:88-140`, một truy vấn log, một URL, một commit sha. Dán nội dung file vào đồ thị vừa phá mục đích vừa làm gói dữ liệu phình to.

## Ghi một bước bằng template

Viết delta bằng tay là phần đắt nhất của việc ghi: 28 delta thật đo ngày 14·09·2026 có trung vị khoảng **3.000 ký tự JSON**, mỗi cái do model tự viết ra. Lệnh `record` dựng delta từ một template cộng vài cờ.

Năm template: `observation`, `question`, `answer`, `hypothesis`, `correction`. Chỉ tự viết JSON khi bước đó cần thứ không template nào phủ.

Trường không hợp lệ bị từ chối thẳng, nên gõ sai tên trường thì hỏng to tiếng, thay vì âm thầm làm rơi mất một liên kết.

## Push — ngữ cảnh không cần gọi

Đây là quan sát sắc nhất trong cả dự án. Agent **không chủ động đọc**. Tính trên mọi transcript từng chạm tới AKM, số lần đọc bằng số lần ghi; và phiên tiêu thụ duy nhất được đo đã ghi 14 lần, đọc 0 lần.

Kết luận không phải là "dạy agent đọc nhiều hơn", mà là **đẩy ngữ cảnh tới nó**.

@fig:pushHooks
    SessionStart        -> luồng chính, lúc mở/khôi phục/clear/sau nén
                           task đang mở trong scope, và task phiên đang gắn
    UserPromptSubmit    -> luồng chính, mỗi prompt
                           claim và câu hỏi khớp prompt, chưa có trong cửa sổ
    PreToolUse on Agent -> subagent sắp được sinh ra
                           claim khớp prompt uỷ nhiệm, nối vào prompt đó
    SubagentStart       -> mỗi subagent, mỗi lượt teammate
                           hiểu biết hiện tại + câu hỏi mở của task đang gắn
    PostToolUse         -> không đẩy gì
                           gắn phiên vào những task mà lệnh AKM của nó chạm tới
@endfig

Cách chia này đến từ một lần dò thực tế trên Claude Code: `PreToolUse` là nơi **duy nhất** nhìn thấy được nội dung việc giao cho subagent, còn `SubagentStart` bắn ra *trước khi* transcript của con tồn tại. Mọi block đều mở đầu bằng cùng một dòng header, nên đếm được từ transcript agent nào đã nhận ngữ cảnh và đã làm gì với nó.

## Những cái van giữ cho push không thành rác

@fig:gates
    điểm tìm kiếm >= 3.0      chủ đề đã ghi chấm 3.5-9.7; không liên quan <= 2.3
    không đẩy hai lần         trong cùng một cửa sổ ngữ cảnh
    trần ký tự mỗi block      và ngân sách ký tự mỗi phiên
    claim đã bị thay thế      không đẩy
    prompt < 3 từ có nghĩa    không tìm kiếm
    agent type bị cô lập      không nhận gì
@endfig

Cái van thứ năm có một ví dụ đắt: chính chuỗi "commit and push" từng kéo về hai claim không liên quan, trong đó một cái đã cũ. Prompt quá ngắn thì không đủ tín hiệu để tìm.

Cái van thứ sáu là chỗ AKM gặp research-compose. Hai agent type không nhận gì: **reviewer** phải phán xét code mà không thừa hưởng lời kể của tác giả, và **research lens** chỉ được nhận đúng các input đã khai báo. Với reviewer đó là để tránh mồi sẵn kết luận; với lens đó là điều kiện để sáu góc nhìn thật sự độc lập.

Còn một luật nữa giữ cho luồng chính không bị đẩy lại thứ nó vừa tự viết: những claim, câu hỏi và thay đổi trạng thái mà chính luồng chính tạo ra trong cửa sổ hiện tại sẽ không được đẩy ngược về nó — và hệ quên chúng đi khi cửa sổ không còn giữ chúng nữa, tức là lúc khởi động, lúc `/clear`, và sau khi nén ngữ cảnh.

# PHẦN 3 — Bên trong

## Cô lập: một server, nhiều hòn đảo

Neo4j bản Community **không tạo được database** — `CREATE DATABASE` trả về `UnsupportedAdministrationCommand`, và chỉ tồn tại `neo4j` với `system`. Tách theo database hay theo schema vì thế nằm ngoài tầm nếu không mua Enterprise.

Nên cô lập được làm bằng một thuộc tính `scope` đóng dấu lên **mọi node**, và mọi lượt đọc đều lọc theo nó. Scope lấy từ **tên repository git** của thư mục mà server được khởi động.

@fig:islands
    ~/projects/alpha   -> scope "alpha"    [ task, state, claim... ]
    ~/projects/beta    -> scope "beta"     [ task, state, claim... ]
    ngoài mọi repo     -> scope "un-git-repo"  (thùng chung, không bị từ chối)

    AKM_SCOPE ghi đè cả hai — để nhiều checkout dùng chung một đồ thị
@endfig

Có một chi tiết tách đôi làm cho cơ chế này chạy được, và rất dễ bỏ sót: **credential lấy từ thư mục cài đặt, còn scope lấy từ thư mục làm việc của người gọi.**

Task ở scope khác thì vô hình và không ghi được. Quan trọng hơn: cơ chế khử trùng lặp **không** gộp một claim của dự án này vào một claim câu chữ y hệt của dự án khác — vì cùng một câu nói về một codebase khác là một claim khác.

Cái bẫy còn lại là hai repo trùng tên thư mục sẽ dùng chung một scope. Và mọi dự án nằm dưới một repo mà bản thân chúng không phải repo thì gộp chung scope của repo cha. Vì thế `list_tasks` và `open_task` báo `scope_spread`: có bao nhiêu thư mục làm việc đã ghi task vào scope này, kèm cảnh báo khi nhiều hơn một.

## Server ấm: vì sao có thêm một tiến trình

Một tiến trình Python mới tốn khoảng **234 ms** để import và khoảng **235 ms** cho truy vấn đầu tiên. Cùng truy vấn đó trong một tiến trình đã ấm mất **9–19 ms**.

@fig:warm
    tiến trình nguội   import 234ms  +  truy vấn đầu 235ms   ~ 469ms
    tiến trình ấm      truy vấn                              9-19ms
    pool mới, tiến trình ấm   kết nối                        10ms
@endfig

Mỗi lần hook bắn và mỗi lệnh CLI trước đây đều là một tiến trình mới như vậy — nên không cái nào từng được ấm, và một hook lúc tải nặng có thể quá hạn rồi **không đẩy được gì**.

Lời giải là một tiến trình sống lâu giữ sẵn một driver Neo4j và pool kết nối của nó, chạy truy vấn đầu tiên **trước khi** nhận khách. Nó nói HTTP loopback trên `127.0.0.1`, ba đường: `/health`, `/hook`, `/cli`.

Ba tính chất đáng nhớ. Nó **tự khởi động** khi hook hoặc CLI không thấy ai trả lời, với một "spawn claim" độc quyền để một loạt hook bắn cùng lúc không mỗi cái dựng một server. Nó **ấm trước rồi mới mở cổng**, nên trong lúc khởi động khách bị từ chối và rơi về đường chạy trực tiếp, thay vì xếp hàng chờ. Và nó **tự thoát khi rảnh** sau 30 phút không có request.

Một điểm tinh tế về cấu hình: server được khởi động **không** kèm biến môi trường `AKM_*` của người gọi đầu tiên. Mỗi request mang theo thư mục làm việc và biến môi trường của **người gọi đó**, rồi server dựng scope và settings theo từng request. Request không có thư mục thật thì bị từ chối, chứ không được trả lời bằng thư mục của chính server.

## Tương tranh: cái nào là bảo đảm?

Có hai cơ chế, và phân biệt được cái nào là bảo đảm mới là điều quan trọng.

@fig:guards
    compare-and-swap trên Task.current_state_id
      -> ĐƯỜNG NHANH. Sinh ra lời từ chối thân thiện, và trong bài test
         tương tranh thì chính nó là cái loại người thua.

    ràng buộc duy nhất trên (ProblemState.task_id, predecessor_id)
      -> RANH GIỚI ĐÚNG ĐẮN. Neo4j mặc định read-committed và Cypher không
         lấy write lock cho SET, nên vẫn tồn tại thứ tự đan xen lọt qua được
         CAS. Ràng buộc làm cho một nhánh trạng thái rẽ đôi là bất khả, bất kể.
@endfig

Vì CAS luôn thắng trong thực tế, ràng buộc được test **trực tiếp** — bằng cách đi vòng qua CAS và ghi tay một lineage rẽ đôi — chứ không dựa vào bài test tương tranh để chạm tới nó. Đây là một thói quen tốt nói chung: nếu đường nhanh luôn chắn trước, ranh giới đúng đắn phía sau nó sẽ không bao giờ được thực thi trong test, và ta sẽ tin vào một thứ chưa từng được kiểm.

Hai chi tiết nhỏ mà đắt. State gốc dùng một giá trị canh `"ROOT"` thay cho `null`, bởi ràng buộc duy nhất của Neo4j **không áp dụng khi thuộc tính là null** — để null thì state gốc được miễn trừ một cách âm thầm. Và một lượt từ chối luôn **ném ra ngoài** transaction chứ không return, vì một hàm transaction được quản lý mà return bình thường thì coi như đã commit.

## Delta bị từ chối không phải là lỗi

`submit_reasoning_delta` trả về một kết quả có cấu trúc thay vì ném lỗi, khi task đã đi tiếp:

    {"committed": false, "reason": "base_state_conflict", "current_state_id": "..."}

Trong một hệ có tương tranh, chuyện này là kết quả **được trông đợi**, và người gọi cần chính cái id đó để rebase: đọc lại ngữ cảnh, xem phát hiện của mình còn đứng vững trước state mới không, rồi gửi lại. Chỉ lỗi thật — một tham chiếu treo, một claim factual không có xuất xứ — mới ném ra.

## Không có trong slice này

Sáu công cụ MVP còn lại; `InformationProfile` và `Artifact`; REST API, UI, vector DB, workflow engine, cluster, consensus, sinh báo cáo; hai chính sách tương tranh `branch` và `merge`; khử trùng lặp theo ngữ nghĩa; và việc di trú kho tài liệu sẵn có vào đồ thị.

Danh sách này đáng đọc không phải để biết thiếu gì, mà để thấy một slice được cắt gọn thì trông ra sao: một câu hỏi, bốn tiêu chí, một phép đo, và một danh sách rõ ràng những thứ **cố ý** chưa làm.

/* ===================================================================
   LAYER 2 . COMPONENTS
   Pure: data in, DOM out. Must not read STATE.
   =================================================================== */

function esc(s){ return String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function el(tag, attrs, kids){
  var n = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k === 'html') n.innerHTML = attrs[k];
    else if(k === 'text') n.textContent = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function(c){ if(c) n.appendChild(c); });
  return n;
}

/* Code spans are pulled out before escaping and put back after, so that
   markup inside them is never interpreted. The sentinel is ordinary text,
   not a control character, so the source stays copy-paste safe. */
function inline(s){
  var keep = [];
  s = String(s).replace(/`([^`]+)`/g, function(_, c){
    keep.push(c); return 'K0DE' + (keep.length - 1) + 'K0DE';
  });
  s = esc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*]+)\*(?![*\w])/g, '$1<em>$2</em>');
  return s.replace(/K0DE(\d+)K0DE/g, function(_, i){
    return '<code>' + esc(keep[+i]) + '</code>';
  });
}

var BLOCK = {
  h: function(b){
    var tag = b.level === 1 ? 'h2' : b.level === 2 ? 'h3' : 'h4';
    var m = /^(PHAN|PHẦN|PART)\s+(\d+)\s*—\s*(.*)$/.exec(b.text);
    if(tag === 'h2' && m){
      return el('h2', null, [
        el('span', { class: 'eyebrow', text: m[1] + ' ' + m[2] }),
        el('span', { html: inline(m[3]) })
      ]);
    }
    return el(tag, { html: inline(b.text) });
  },
  p:  function(b){ return el('p', { html: inline(b.text) }); },
  ul: function(b){ return el('ul', null, b.items.map(function(t){
        return el('li', { html: inline(t) }); })); },
  ol: function(b){ return el('ol', null, b.items.map(function(t){
        return el('li', { html: inline(t) }); })); },
  quote: function(b){ return el('blockquote', null, b.items.map(function(t){
        return el('p', { html: inline(t) }); })); },
  code: function(b){
    return el('div', { class: 'pre' }, [ el('pre', { text: b.text }) ]);
  },
  hr: function(){ return el('hr'); },
  table: function(b){
    var head = el('tr', null, b.head.map(function(c){
      return el('th', { html: inline(c) }); }));
    var body = b.rows.map(function(r){
      return el('tr', null, r.map(function(c){ return el('td', { html: inline(c) }); }));
    });
    return el('div', { class: 'tw' }, [
      el('table', null, [ el('thead', null, [head]), el('tbody', null, body) ])
    ]);
  },
  fig: function(b){
    var f = FIG[b.id];
    if(!f) return el('p', { text: '[missing figure: ' + b.id + ']' });
    var render = FIGURE[f.type];
    if(!render) return el('p', { text: '[no renderer: ' + f.type + ']' });
    return el('figure', null, [
      el('div', { class: 'fig' }, [ render(f) ]),
      f.cap ? el('figcaption', { html: inline(f.cap) }) : null
    ]);
  }
};

/* -- markdown ------------------------------------------------------- */

var MD = {
  parse: function(src){
    var lines = src.split('\n'), out = [], i = 0;
    function blank(s){ return !s.trim(); }
    function cells(s){
      return s.trim().replace(/^\|/, '').replace(/\|$/, '')
              .split('|').map(function(c){ return c.trim(); });
    }

    while(i < lines.length){
      var ln = lines[i];
      if(blank(ln)){ i++; continue; }

      /* figure directive: keep the id, skip the ASCII fallback body */
      var fm = /^@fig:(\S+)\s*$/.exec(ln);
      if(fm){
        var id = fm[1]; i++;
        while(i < lines.length && !/^@endfig\s*$/.test(lines[i])) i++;
        i++;
        out.push({ t: 'fig', id: id });
        continue;
      }

      var hm = /^(#{1,4})\s+(.*)$/.exec(ln);
      if(hm){ out.push({ t: 'h', level: hm[1].length, text: hm[2].trim() }); i++; continue; }

      if(/^---\s*$/.test(ln)){ out.push({ t: 'hr' }); i++; continue; }

      if(/^\|/.test(ln) && i + 1 < lines.length && /^\|[\s:|-]+\|?\s*$/.test(lines[i + 1])){
        var head = cells(ln); i += 2;
        var rows = [];
        while(i < lines.length && /^\|/.test(lines[i])){ rows.push(cells(lines[i])); i++; }
        out.push({ t: 'table', head: head, rows: rows });
        continue;
      }

      if(/^>\s?/.test(ln)){
        var q = [];
        while(i < lines.length && /^>\s?/.test(lines[i])){
          q.push(lines[i].replace(/^>\s?/, '')); i++;
        }
        out.push({ t: 'quote', items: q });
        continue;
      }

      var lm = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(ln);
      if(lm){
        var ordered = /\d/.test(lm[2]), items = [];
        while(i < lines.length){
          var m2 = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(lines[i]);
          if(m2){ items.push(m2[3]); i++; }
          else if(/^\s{2,}\S/.test(lines[i]) && items.length){
            items[items.length - 1] += ' ' + lines[i].trim(); i++;
          } else break;
        }
        out.push({ t: ordered ? 'ol' : 'ul', items: items });
        continue;
      }

      /* Four-space indented code. Blank lines inside one block are kept,
         then trimmed off the end, so a diagram split by blank lines stays
         a single block instead of becoming several. */
      if(/^ {4}\S/.test(ln)){
        var buf = [];
        while(i < lines.length){
          if(/^ {4}/.test(lines[i])){ buf.push(lines[i].slice(4)); i++; }
          else if(blank(lines[i]) && /^ {4}/.test(lines[i + 1] || '')){ buf.push(''); i++; }
          else break;
        }
        while(buf.length && !buf[buf.length - 1].trim()) buf.pop();
        out.push({ t: 'code', text: buf.join('\n') });
        continue;
      }

      var para = [ln.trim()]; i++;
      while(i < lines.length && !blank(lines[i]) &&
            !/^(#{1,4}\s|@fig:|@endfig|---\s*$|\||>\s?|\s*([-*]|\d+\.)\s|\s{4}\S)/.test(lines[i])){
        para.push(lines[i].trim()); i++;
      }
      out.push({ t: 'p', text: para.join(' ') });
    }
    return out;
  },

  render: function(blocks){
    var frag = document.createDocumentFragment();
    blocks.forEach(function(b){
      var fn = BLOCK[b.t];
      if(fn) frag.appendChild(fn(b));
    });
    return frag;
  }
};

  hooks: function(f){

/* ===================================================================
   LAYER 3 . LOGIC
   Binds DATA to COMPONENTS. The only layer that touches STATE.
   Pipeline:  SRC -> sections(front | body | footer) -> MD.parse
                  -> MD.render -> DOM -> table of contents
   Both views read the SAME text, so they cannot drift apart.
   =================================================================== */

/* front matter (title + lede) | body | footer, split on the outer rules */
function sections(){
  var t = SRC.replace(/^﻿/, '');
  var first = t.indexOf('\n---\n');
  var last = t.lastIndexOf('\n---\n');
  var head = t.slice(0, first).split('\n');
  return {
    title: (head.filter(function(l){ return l.indexOf('# ') === 0; })[0] || '# ').slice(2),
    lede: head
           .filter(function(l){ return l.indexOf('> ') === 0; })
           .map(function(l){ return l.slice(2); }),
    body: t.slice(first + 5, last),
    footer: t.slice(last + 5).split('\n\n')
             .map(function(p){ return p.trim(); })
             .filter(Boolean)
  };
}

/* the copy-out markdown drops layout directives; prose and ASCII stay */
function forCopy(){
  return SRC.split('\n')
    .filter(function(l){ return !/^@(fig:|endfig|box:|endbox)/.test(l); })
    .join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}

function slug(s, i){
  var base = String(s).toLowerCase()
    .replace(/[^a-z0-9À-ỹ]+/g, '-')
    .replace(/^-+|-+$/g, '').slice(0, 44);
  return (base || 'muc') + '-' + i;
}

/* ---- rendering -------------------------------------------------- */

function buildToc(root){
  var toc = document.getElementById('toc');
  toc.textContent = '';
  var heads = root.querySelectorAll('h2, h3');
  var n = 0;
  Array.prototype.forEach.call(heads, function(h){
    n++;
    if(!h.id) h.id = slug(h.textContent, n);
    var isPart = h.tagName === 'H2';
    var label = h.textContent;
    if(isPart){
      var eb = h.querySelector('.eyebrow');
      if(eb) label = eb.textContent + ' — ' + label.slice(eb.textContent.length);
    }
    var a = el('a', {
      href: '#' + h.id,
      class: isPart ? 'part' : 'lv3',
      text: label
    });
    a.addEventListener('click', function(){ if(!wide()) setNav(false); });
    toc.appendChild(a);
  });
}

function render(){
  var s = sections();

  var h1 = document.getElementById('title');
  h1.textContent = s.title;
  document.title = s.title;

  var lede = document.getElementById('lede');
  lede.textContent = '';
  s.lede.forEach(function(p){ lede.appendChild(el('p', { html: inline(p) })); });

  var doc = document.getElementById('doc');
  doc.textContent = '';
  doc.appendChild(MD.render(MD.parse(s.body)));

  var foot = document.getElementById('foot');
  foot.textContent = '';
  s.footer.forEach(function(p){ foot.appendChild(el('p', { html: inline(p) })); });

  document.getElementById('mdtext').textContent = forCopy();

  buildToc(doc);

  var isDoc = STATE.view === 'doc';
  document.getElementById('docview').hidden = !isDoc;
  document.getElementById('md').hidden = isDoc;
  var vb = document.getElementById('viewbtn');
  vb.textContent = isDoc ? I18N.md : I18N.doc;
  vb.setAttribute('aria-pressed', isDoc ? 'false' : 'true');

  /* no anchors to jump to in the markdown view */
  var nb = document.getElementById('navbtn');
  nb.hidden = !isDoc;
  if(!isDoc && STATE.nav) setNav(false);

  spy();
}

/* ---- controls ---------------------------------------------------- */

function wide(){ return (window.innerWidth || 1280) >= 1180; }

function setView(v){ STATE.view = v; render(); }

function setNav(open){
  STATE.nav = open;
  document.getElementById('nav').classList.toggle('open', open);
  document.getElementById('scrim').hidden = !open || wide();
  document.getElementById('navbtn').setAttribute('aria-expanded', open ? 'true' : 'false');
}

function copyMd(){
  var btn = document.getElementById('copybtn');
  var text = document.getElementById('mdtext').textContent;
  function flash(msg){
    var old = btn.textContent; btn.textContent = msg;
    setTimeout(function(){ btn.textContent = old; }, 1600);
  }
  function fallback(){
    try{
      var r = document.createRange();
      r.selectNodeContents(document.getElementById('mdtext'));
      var sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(r);
      var ok = false;
      try{ ok = document.execCommand('copy'); }catch(e){}
      flash(ok ? I18N.done : 'Đã bôi đen — Cmd/Ctrl+C');
    }catch(e){ flash('Bôi đen thủ công'); }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ flash(I18N.done); }, fallback);
  } else fallback();
}

/* ---- scrollspy ---------------------------------------------------- */

var spyTimer = null;
function spy(){
  if(spyTimer) return;
  spyTimer = setTimeout(function(){
    spyTimer = null;
    var links = document.querySelectorAll('#toc a');
    var best = null, bestTop = -1e9;
    Array.prototype.forEach.call(links, function(a){
      var t = document.getElementById(a.getAttribute('href').slice(1));
      if(!t) return;
      var top = t.getBoundingClientRect().top - 90;
      if(top <= 0 && top > bestTop){ bestTop = top; best = a; }
    });
    Array.prototype.forEach.call(links, function(a){
      a.classList.toggle('on', a === best);
    });
  }, 90);
}

/* ---- wiring ------------------------------------------------------- */

function boot(){
  document.getElementById('kick').textContent = I18N.kick;
  document.getElementById('navhead').textContent = I18N.navHead;
  document.getElementById('copybtn').textContent = I18N.copy;
  document.getElementById('mdnote').textContent = I18N.mdNote;
  document.getElementById('navbtn').textContent = I18N.contents;

  document.getElementById('viewbtn').addEventListener('click', function(){
    setView(STATE.view === 'doc' ? 'md' : 'doc');
  });
  document.getElementById('navbtn').addEventListener('click', function(){
    setNav(!STATE.nav);
  });
  document.getElementById('scrim').addEventListener('click', function(){ setNav(false); });
  document.getElementById('copybtn').addEventListener('click', copyMd);

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && STATE.nav) setNav(false);
  });
  window.addEventListener('scroll', spy, { passive: true });
  window.addEventListener('resize', function(){
    setNav(wide() ? false : STATE.nav);
  });

  render();
  setNav(false);
}

boot();
</script>
