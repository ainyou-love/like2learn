{% assign resource_files = site.static_files
  | where_exp: "file", "file.path contains '/resources/'"
  | where_exp: "file", "file.extname == '.html'"
  | sort: "path"
%}
<style>
  body { font-family: system-ui, sans-serif; line-height: 1.6; max-width: 48rem; margin: 2rem auto; padding: 0 16px; }
  .crumbs { min-width: 0; font-size: .9rem; }
  .crumbs ol { display: flex; align-items: center; gap: .35rem; margin: 0; padding: 0; list-style: none; white-space: nowrap; }
  .crumbs li { display: flex; flex: none; align-items: center; max-width: 6.5em; }
  .crumbs li:first-child, .crumbs .gap { max-width: none; }
  .crumbs li + li::before { content: "›"; flex: none; margin-right: .35rem; opacity: .5; }
  .crumbs li > * { min-width: 0; padding: .7rem 0; overflow: hidden; text-overflow: ellipsis; }
  .crumbs li[aria-current] { flex: 0 1 auto; min-width: 0; max-width: none; font-weight: 600; }
  .crumbs .mid { display: none; }
  @media (min-width: 640px) {
    .crumbs li { max-width: none; }
    .crumbs .mid { display: flex; }
    .crumbs .gap { display: none; }
  }
  .tree, .tree ul { list-style: none; margin: 0; padding-left: .75rem; }
  .tree { padding-left: 0; }
  .tree summary { cursor: pointer; font-weight: 600; }
  .tree .count { font-weight: 400; opacity: .6; }
  .tree a { overflow-wrap: anywhere; }
  .tree .post { margin: .75rem 0; padding-left: .75rem; border-left: 3px solid color-mix(in srgb, currentColor 18%, transparent); }
  .tree .post-subject { display: block; font-weight: 600; line-height: 1.4; }
  .tree .post-desc { margin: .15rem 0 0; font-size: .9rem; line-height: 1.5; opacity: .75; }
  .tree summary, .tree li > a { padding: .7rem 0; }
  .tree li > a { display: inline-block; }
  .tree .post-link { font-size: .85rem; }
  @media (min-width: 640px) {
    .tree ul { padding-left: 1.25rem; }
  }
  @media (pointer: fine) {
    .tree summary, .tree li > a { padding: .15rem 0; }
    .crumbs li > * { padding: .3rem 0; }
  }
</style>
<script>
const RESOURCE_ROOT = "resources";
const POST_METADATA_URL = `/${RESOURCE_ROOT}/post_metadata.json`;
const SHORT_LINK_FOLDER = "/resources/Custom-Post/";
const RESOURCE_PATHS = [
{% for file in resource_files %}  {{ file.path | jsonify }},
{% endfor %}].filter((path) => path.startsWith(`/${RESOURCE_ROOT}/`));

const resourceCollator = new Intl.Collator("vi", { numeric: true });

function resourceKey(path) {
  return path.slice(RESOURCE_ROOT.length + 2).normalize("NFC");
}

function resourceFileUrl(path) {
  return encodeURI(path).replace(/[#?]/g, encodeURIComponent);
}

function resourceReadUrl(path) {
  return `/read.html?p=${encodeURI(resourceKey(path)).replace(/[#?&+]/g, encodeURIComponent)}`;
}

function resourceBreadcrumb(dirs, current, folderHref = (i) => `/${RESOURCE_ROOT}/${dirs.slice(0, i + 1).join("/")}/`) {
  const ol = document.createElement("ol");
  const crumb = (text, href, className) => {
    const li = document.createElement("li");
    if (className) li.className = className;
    const item = document.createElement(href ? "a" : "span");
    if (href) item.href = encodeURI(href);
    item.textContent = text;
    li.append(item);
    ol.append(li);
    return li;
  };
  crumb("Like2Learn", "/");
  if (dirs.length > 1) crumb("…", folderHref(dirs.length - 2), "gap").title = dirs.slice(0, -1).join(" › ");
  dirs.forEach((dir, i) => crumb(dir, folderHref(i), i < dirs.length - 1 ? "mid" : ""));
  const last = crumb(current, "");
  last.setAttribute("aria-current", "page");
  last.title = current;

  const nav = document.createElement("nav");
  nav.className = "crumbs";
  nav.setAttribute("aria-label", "Breadcrumb");
  nav.append(ol);
  return nav;
}

function resourceTree() {
  const root = { dirs: new Map(), files: [] };
  for (const path of RESOURCE_PATHS) {
    const parts = path.split("/").slice(2);
    const name = parts.pop();
    let node = root;
    for (const dir of parts) {
      if (!node.dirs.has(dir)) node.dirs.set(dir, { dirs: new Map(), files: [] });
      node = node.dirs.get(dir);
    }
    node.files.push({ name, path });
  }
  return root;
}

function resourceShortLinks() {
  const links = {};
  for (const path of RESOURCE_PATHS.filter((p) => p.startsWith(SHORT_LINK_FOLDER))) {
    const number = path.split("/").pop().match(/^(\d+)-/);
    if (number && Number(number[1]) > 0) links[number[1]] = path;
  }
  return links;
}

function resourceFileLabel(name) {
  const base = name.normalize("NFC").replace(/\.html$/i, "");
  const numbered = base.match(/^(\d+)-(.+)$/);
  return numbered ? `${numbered[1]} — ${numbered[2].replace(/-/g, " ")}` : base.replace(/[-_]/g, " ");
}

function loadPostMetadata() {
  loadPostMetadata.cache ??= fetch(POST_METADATA_URL, { signal: AbortSignal.timeout(3000) })
    .then((res) => (res.ok ? res.json() : {}))
    .catch(() => ({}));
  return loadPostMetadata.cache;
}

function resourceFolderItem(name, node, metadata) {
  const summary = document.createElement("summary");
  const count = document.createElement("span");
  count.className = "count";
  summary.append(name, count);

  const details = document.createElement("details");
  details.open = true;
  details.append(summary, resourceList(node, metadata));

  const li = document.createElement("li");
  li.className = "group";
  li.append(details);
  return li;
}

function resourcePostItem(name, path, meta) {
  const li = document.createElement("li");
  li.className = "file";
  li.dataset.category = meta?.categories?.[0] ?? "";
  const link = document.createElement("a");
  link.href = resourceReadUrl(path);
  link.textContent = resourceFileLabel(name);
  if (!meta?.subject) {
    li.append(link);
    return li;
  }
  li.classList.add("post");
  link.className = "post-link";
  const subject = document.createElement("span");
  subject.className = "post-subject";
  subject.textContent = meta.subject;
  li.append(subject);
  if (meta.description) {
    const description = document.createElement("p");
    description.className = "post-desc";
    description.textContent = meta.description;
    li.append(description);
  }
  li.append(link);
  return li;
}

function resourceList(node, metadata) {
  const ul = document.createElement("ul");
  for (const name of [...node.dirs.keys()].sort(resourceCollator.compare)) {
    ul.append(resourceFolderItem(name, node.dirs.get(name), metadata));
  }
  for (const { name, path } of node.files.sort((a, b) => resourceCollator.compare(a.name, b.name))) {
    ul.append(resourcePostItem(name, path, metadata[resourceKey(path)]));
  }
  return ul;
}
</script>
