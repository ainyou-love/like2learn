<script type="text/plain" id="src"># video-marker — làm demo video không hao như bạn nghĩ

> Một skill Claude Code ghép ảnh chụp màn hình với giọng đọc máy thành video demo có phụ đề nung sẵn vào khung hình.
> Toàn bộ khâu dựng nằm trong 410 dòng bash gọi bốn binary chạy cục bộ. Không API trả phí, không một byte nào rời khỏi máy.
> Thứ bạn viết tay cho mỗi cảnh chỉ có hai trường bắt buộc; còn độ dài mỗi cảnh thì không phải lựa chọn của bạn.
> Ghi chép đọc từ mã nguồn ngày 18/09/2026 — SKILL.md, ba file trong `references/`, template manifest, và trọn vẹn script pipeline.

---

# PHẦN 1 — Bài toán, và một quyết định thiết kế đáng nhớ

Làm một video demo thường tốn ở chỗ không ai ngờ: không phải khâu quay, mà khâu dựng. Quay màn hình xong là có một file thô dài mười phút, và từ đó trở đi mọi thứ đều thủ công — cắt, lồng tiếng, gõ phụ đề, canh timing, xuất lại khi một bước trong luồng đổi.

`video-marker` giải bài toán đó bằng cách từ chối luôn việc quay. Frontmatter của skill nói thẳng nó làm gì:

> Generate demo videos from (text, snapshot) pairs — narration + still images with title overlays and subtitles burned in

Đầu vào là các cặp (chữ, ảnh tĩnh). Đầu ra là một file MP4. Ở giữa không có timeline nào để kéo.

## Ảnh tĩnh cộng giọng máy, không phải screen recording

Mục `Role` trong SKILL.md tự đặt giới hạn vai trò ngay câu đầu: "You are a video assembly orchestrator. Your job is to turn (text, snapshot) pairs into a narrated demo video — not to edit video content, add effects, or do post-production."

Quyết định thiết kế đáng nhớ nằm ở chỗ này: **độ dài mỗi cảnh không phải một con số bạn chọn, mà là độ dài đoạn audio đọc ra**. Script đưa ảnh vào `ffmpeg` với `-loop 1` (lặp ảnh vô hạn) rồi để cờ `-shortest` cắt clip theo luồng ngắn hơn — luôn là luồng audio.

Hệ quả rất dễ chịu khi viết kịch bản: bạn sửa câu narration, cảnh tự dài ra hoặc ngắn lại theo. Không có timing nào để canh lại, vì không có timing nào được viết ra ngay từ đầu.

## Skill từ chối tự chụp ảnh — và đó là chủ ý

Trong năm ràng buộc mà SKILL.md liệt kê ở mục `Constraints`, có một dòng đáng chú ý: "Does NOT capture screenshots — expects them as input".

Manifest chỉ yêu cầu `image` là đường dẫn tới một file có thật trên đĩa. Hàm `validate_manifest` kiểm tra đúng một điều về ảnh: `[[ ! -f "$image" ]]`. Ảnh đến từ đâu là chuyện của bạn.

@fig:source
    yêu cầu duy nhất: một đường dẫn file ảnh có thật

      agent-browser / công cụ automation   ->  chụp từng bước của luồng web
      screencapture (có sẵn trên macOS)    ->  chụp thủ công từng màn hình
      artifact của test runner             ->  ảnh sinh ra khi test chạy
      ảnh xuất từ file thiết kế            ->  demo một thứ chưa build xong

    video-marker không tự chụp bất cứ thứ gì
@endfig

Đây là kiểu ràng buộc dễ bị đọc nhầm là thiếu sót. Thật ra nó cắt đúng chỗ: chụp màn hình là việc phụ thuộc hoàn toàn vào thứ đang được demo — web, app desktop, terminal, thiết kế tĩnh — trong khi khâu dựng thì giống nhau ở mọi trường hợp. Gộp hai việc vào một skill sẽ khiến nửa giá trị của nó chết theo trình duyệt.

Cũng cần nói rõ một điểm: **bản thân skill không nhắc tên một công cụ chụp ảnh nào**. Nó không đề cập `agent-browser`, không đề cập `screencapture`, không đề cập test runner. Nó chỉ đòi một file tồn tại. Những cái tên trong sơ đồ trên là các nguồn tương thích, không phải thứ được viết trong mã nguồn.

## Manifest là toàn bộ kịch bản

Một file JSON mô tả cả video. Điều đáng để ý không nằm ở số trường — chỉ có bảy — mà ở chỗ một trường được dùng lại ở hai nơi khác nhau.

@fig:fields
    output   -> tên file đích của bước ghép cuối
    voice    -> say -v <voice>
    text     -> say (audio)  VÀ  phụ đề nung dưới đáy khung hình
    image    -> khung hình nền
    title    -> chữ ở đỉnh khung hình
    status   -> màu viền + màu chữ title
@endfig

`text` vừa là kịch bản đọc vừa là phụ đề. Trong `generate_video`, cùng một biến `$text` được truyền cho `text_to_audio` rồi truyền tiếp làm tham số phụ đề cho `image_audio_to_clip` — bạn không thể để lời đọc và phụ đề lệch nhau, vì chỉ có một nguồn.

# PHẦN 2 — Bề mặt bạn thật sự chạm vào

## Bảy trường, hai trong đó bắt buộc

| Trường | Bắt buộc | Mặc định | Nó làm gì |
|---|---|---|---|
| `output` | không | `output.mp4` | đường dẫn file video đích |
| `voice` | không | `Samantha` | tên giọng truyền thẳng cho `say -v` |
| `slides` | có | — | mảng các cảnh |
| `slides[].text` | **có** | — | lời đọc, đồng thời là phụ đề |
| `slides[].image` | **có** | — | ảnh nền của cảnh |
| `slides[].title` | không | — | chữ ở đỉnh khung hình |
| `slides[].status` | không | — | `pass` hoặc `fail` |

Một manifest tối thiểu hợp lệ chỉ cần thế này:

    {
      "slides": [
        { "text": "Người dùng mở trang đăng nhập", "image": "shots/01.png" }
      ]
    }

## `status`: một chữ đổi màu cả khung hình

Trường `status` là thứ khiến skill này hợp với video báo cáo kết quả kiểm thử hơn là video giới thiệu sản phẩm. Ba nhánh, đọc thẳng từ `annotate_image`:

| `status` | Viền | Màu chữ title |
|---|---|---|
| `pass` | 6px xanh `#22c55e` | `#22c55e` |
| `fail` | 6px đỏ `#ef4444` | `#ef4444` |
| bỏ trống | không viền | trắng |

Phụ đề thì luôn màu vàng, cỡ 28pt, viền chữ đen — không đổi theo `status`.

Có một hệ quả kỹ thuật nằm sau lựa chọn "viền" này. Viền được thêm bằng `magick -border 6`, tức là **phóng to canvas thêm 12px mỗi chiều**, chứ không vẽ đè lên ảnh. Trộn cảnh có viền và cảnh không viền trong cùng một manifest sẽ cho ra các clip khác độ phân giải, trong khi bước ghép cuối chạy `-c copy`. File `manifest-format.md` cảnh báo đúng chỗ này: "All images should ideally be the same resolution for smooth concatenation."

## Hai cách gọi script

Không có hệ thống subcommand. Hàm `main` chỉ phân biệt đúng hai dạng:

    # dạng 1 — chạy cả pipeline
    bash .claude/skills/video-marker/scripts/video-marker.sh manifest.json

    # dạng 2 — gọi thẳng một hàm để thử
    bash .claude/skills/video-marker/scripts/video-marker.sh --fn check_dependencies

Dạng thứ hai đáng giá hơn vẻ ngoài của nó. `--fn` dùng `declare -f "$fn_name"` để kiểm tra hàm có tồn tại rồi gọi thẳng, nên mọi hàm trong file đều gọi được độc lập từ dòng lệnh. Comment ngay trên khối hàm nói rõ ý đồ: "Each function is self-contained and independently testable via --fn flag". Đây là cách rẻ nhất để có tính kiểm thử trong một script bash không có framework test nào.

## Cửa kiểm tra đặt trước lúc đốt CPU

`validate_manifest` chạy trước bất kỳ lời gọi `say` hay `ffmpeg` nào. Nó kiểm sáu điều:

@fig:gate
    1. file manifest tồn tại
    2. jq empty parse được (JSON hợp lệ)
    3. .slides | length khác 0
    4. mỗi slide có text khác null và khác rỗng
    5. mỗi slide có image khác null và khác rỗng
    6. mỗi đường dẫn image trỏ tới file có thật

    -> không dừng ở lỗi đầu tiên: đếm hết rồi mới báo "FAIL: N error(s)"
@endfig

Chi tiết đáng học ở đây là nó **không dừng ở lỗi đầu tiên**. Vòng lặp tăng biến `errors` rồi đi tiếp, in ra từng dòng `ERROR: Slide N ...`, cuối cùng mới trả về mã lỗi. Với một manifest hai mươi cảnh và ba đường dẫn ảnh gõ sai, bạn sửa một lần thay vì chạy lại ba lần.

# PHẦN 3 — Bên trong 410 dòng

Script có 9 hàm: 7 hàm nguyên tử, 1 hàm workflow (`generate_video`) và `main`. Bốn bước của pipeline được đánh số ngay trong output để bạn biết nó đang ở đâu.

## Bốn bước, và một vòng lặp nằm trong bước ba

    [1/4] check_dependencies     — ffmpeg, say, jq, magick
    [2/4] validate_manifest      — sáu kiểm tra ở trên
    [3/4] mỗi slide -> một clip  — vòng lặp bên dưới
    [4/4] concat_clips           — ghép, báo dung lượng, gợi ý `open`

Bước 3 làm việc trong một thư mục tạm tạo bằng `mktemp -d`, và thư mục đó bị `rm -rf` ở cả nhánh thành công lẫn nhánh lỗi:

@fig:slideloop
    với slide thứ i:
      1. jq đọc 4 trường: text, image, title, status
      2. say -v <voice> "<text>" -o audio_i.aiff
      3. magick: viền -> title đỉnh -> phụ đề đáy  (ra file _annotated.png)
      4. ffmpeg: ảnh đã chú thích + audio -> clip_i.mp4
      5. xoá _annotated.png
    -> slide kế tiếp
@endfig

## Tham số ffmpeg thật sự được dùng

Chỉ có đúng hai lời gọi `ffmpeg` trong cả script. Lời gọi thứ nhất, dựng một clip:

    ffmpeg -y -loop 1 -i "$use_image" -i "$audio" \
      -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" \
      -c:v libx264 -tune stillimage \
      -c:a aac -b:a 192k \
      -pix_fmt yuv420p -shortest \
      -loglevel warning \
      "$clip_out"

Hai cờ ít gặp đáng giải thích. `-tune stillimage` báo cho libx264 biết nội dung gần như không đổi giữa các khung, nên bitrate dồn hết vào một khung hình sắc nét thay vì chia đều cho chuyển động không tồn tại. Còn `scale=trunc(iw/2)*2:trunc(ih/2)*2` là để làm tròn xuống số chẵn cho cả hai chiều: libx264 với `yuv420p` không nhận cạnh lẻ, mà ảnh chụp màn hình thì thường xuyên lẻ — nhất là sau khi `magick` cộng thêm 6px viền mỗi bên.

Lời gọi thứ hai, ghép:

    ffmpeg -y -f concat -safe 0 -i "$list_file" -c copy -loglevel warning "$output"

`-c copy` nghĩa là không encode lại: các clip được nối ở mức stream. Nhanh và không mất chất lượng — đổi lại, mọi clip phải cùng codec và cùng độ phân giải, đúng như phần `status` ở trên đã nói.

## Chữ được nung vào ảnh, không phải vào video

Đây là chỗ mã nguồn khác với chính tài liệu của nó, và dấu vết còn lại kể được cả một lần đổi hướng thiết kế.

`SKILL.md` mô tả title là "top bar, white text on semi-transparent dark background", và `manifest-format.md` cũng nói "white text, dark background". Trong `annotate_image` không hề có thanh nền nào. Nó vẽ chữ trực tiếp lên ảnh bằng ba lệnh `magick` nối nhau, và độ đọc được đến từ viền chữ đen (`-stroke black`) chứ không đến từ nền:

    magick "$output" -font "$font" -pointsize 42 -strokewidth 3 \
      -stroke black -fill "$title_color" \
      -gravity North -annotate +0+8 "$title" "$output"

Chỉ có `references/dependencies.md` ghi đúng: "No background bars — text drawn directly over screenshot."

Vì sao hai file kia lệch? Vì thiết kế ban đầu dùng bộ lọc `drawtext` của `ffmpeg`, và cách làm đó có thanh nền thật (`box=1:boxcolor=black@0.6`). Ba mẩu hoá thạch còn sót lại đủ để dựng lại câu chuyện:

@fig:fossils
    10  tên hàm được liệt kê trong usage text của script
     7  trong số đó thật sự tồn tại
     3  không tồn tại ở đâu cả: word_wrap_text, escape_drawtext, build_vf_filter
     1  hàm có thật nhưng không được liệt kê: annotate_image
    11  hằng số cấu hình khai báo ở đầu file
     2  không được tham chiếu ở bất cứ đâu khác: OVERLAY_FONT_SIZE, OVERLAY_BAR_ALPHA
@endfig

Hai hằng số chết chính là chữ ký. `OVERLAY_BAR_ALPHA=0.6` khớp chính xác với `boxcolor=black@0.6` trong `references/ffmpeg-patterns.md` — file đó tới giờ vẫn chép nguyên công thức `drawtext` cũ. Và bảng troubleshooting trong `dependencies.md` có một dòng chốt lại toàn bộ suy luận:

| Lỗi | Nguyên nhân | Cách xử lý |
|---|---|---|
| `No such filter: drawtext` | ffmpeg thiếu libfreetype | Not needed — we use ImageMagick instead |

Đổi hướng ấy không phải chuyện thẩm mỹ. Với `drawtext`, chữ được vẽ trong lúc encode nên mọi ký tự phải được escape để sống sót qua chuỗi filter của ffmpeg — dấu nháy, dấu hai chấm, dấu phẩy đều là ký tự điều khiển, và đó chính là lý do một hàm tên `escape_drawtext` từng được đặt tên. Đẩy việc vẽ chữ sang ImageMagick ở bước trước khiến bài toán escape biến mất: `magick` nhận chữ như một tham số argv bình thường.

Cái giá phải trả là một dependency nữa. Đếm số công cụ trong `check_dependencies` xác nhận điều đó: danh sách hiện tại là `ffmpeg say jq magick`.

Việc xuống dòng phụ đề cũng được viết tay ngay trong `annotate_image` — một vòng `for word in $subtitle` cộng dồn từng từ cho tới khi chạm ngưỡng `SUBTITLE_MAX_CHARS=60`. Không dùng `fold`, không dùng `-caption` của ImageMagick. Đó là lý do cái tên `word_wrap_text` từng có mặt trong usage text.

## Khi một slide hỏng: hai cách bash đối xử với cùng một dòng lệnh

Script mở đầu bằng `set -euo pipefail`, và cả `validate_manifest` lẫn vòng lặp slide đều dùng đúng một thành ngữ để đếm lỗi: `((errors++))` và `((failed++))`. Hai chỗ lại cho hai kết quả khác hẳn nhau — không phải vì dòng lệnh khác, mà vì **cách hàm chứa nó được gọi**.

@fig:seterr
    validate_manifest "$manifest" || return 1     <- gọi trong ngữ cảnh điều kiện
        set -e bị vô hiệu bên trong
        ((errors++)) trả mã 1 khi errors=0 -> bị bỏ qua
        vòng lặp chạy hết, liệt kê đủ mọi lỗi

    generate_video "$1"                           <- gọi trực tiếp
        set -e vẫn còn hiệu lực
        ((failed++)) trả mã 1 khi failed=0 -> shell thoát ngay
        slide hỏng đầu tiên kết thúc cả lần chạy
@endfig

Cơ chế nằm ở chỗ `((failed++))` là hậu tố: nó trả về *giá trị cũ*. Khi `failed` đang bằng 0, lệnh số học trả về 0, và một lệnh số học trả về 0 được bash coi là **thất bại** — mã thoát 1. Dưới `set -e`, thế là đủ để dừng script. Còn khi cả lời gọi hàm nằm bên trái một `||`, bash tắt `set -e` cho toàn bộ thân hàm, nên chính dòng đó lại vô hại.

Tôi đã dựng lại đúng khuôn hình này bằng một đoạn bash tối giản để kiểm chứng (18/09/2026): bản gọi trực tiếp thoát ở vòng lặp đầu tiên với mã 1; bản gọi qua `||` chạy hết ba vòng và in ra `failed=3`.

Điều này làm nhánh báo cáo cuối script trở nên không tới được: khối in `Failed: N slide(s)` chỉ chạy khi `failed` lớn hơn 0, mà mọi đường làm `failed` tăng đều kết thúc lần chạy trước đó. Nói cách khác, ý định "bỏ qua slide hỏng rồi đi tiếp" có trong mã nguồn, nhưng thành ngữ đếm lỗi đứng chắn trước nó.

Đây là một bài học bash đáng nhớ hơn là một chi tiết vụn: `((i++))` an toàn ở mọi nơi, trừ dưới `set -e`, trừ khi biến đang bằng 0. Viết `((i++)) || true` hoặc `i=$((i+1))` thì cả hai vị trí hành xử như nhau.

# PHẦN 4 — Những gì bị cắt có chủ ý

Mục `Constraints` của SKILL.md liệt kê đúng năm dòng, và không dòng nào trong đó là lời xin lỗi. Đọc chúng cạnh mã nguồn sẽ thấy rõ đường biên mà tác giả cố tình vẽ ra.

## Bốn binary, và cái ràng buộc thật sự nằm ở một trong số đó

@fig:deps
    check_dependencies chạy `command -v` cho bốn lệnh:

      ffmpeg   encode + ghép                 brew install ffmpeg
      say      TTS                           có sẵn trên macOS
      jq       đọc manifest JSON             brew install jq
      magick   vẽ title/phụ đề/viền          brew install imagemagick

    + một font: /System/Library/Fonts/Helvetica.ttc (macOS 12+)
@endfig

Ba trong bốn công cụ có trên mọi hệ điều hành. Chỉ `say` là không — nó là TTS dựng sẵn của macOS, và SKILL.md ghi thẳng ràng buộc đó ở dòng đầu mục `Constraints`: "macOS only (depends on `say` command for TTS)". Cùng với đó là một ràng buộc thứ hai đi kèm: "No cloud TTS APIs — uses local `say` only".

Đây chính là chỗ chữ "không hao" trong tiêu đề được trả bằng tiền thật. Grep toàn bộ script tìm `curl`, `wget`, `http`, `api_key`, `token`: không một kết quả nào. Không có khoá API để xin, không có hạn mức để theo dõi, không có đoạn ghi âm nào rời khỏi máy. Đổi lại, script chỉ chạy được trên macOS — và chất giọng là chất giọng mà macOS có sẵn.

Một điều kiện nữa không được ghi ở đâu nhưng có thật trong mã nguồn: `annotate_image` dùng `${status,,}` để hạ chữ thường, cú pháp này cần **bash 4 trở lên**. Bản `/bin/bash` mà macOS đóng gói là 3.2, và trên đó biểu thức này báo `bad substitution` (kiểm chứng trực tiếp ngày 18/09/2026). Câu lệnh mà SKILL.md hướng dẫn là `bash <script>`, tức là lấy `bash` đầu tiên trên `PATH` — máy nào đã cài bash qua Homebrew thì chạy bình thường, máy chỉ có bash hệ thống thì không.

## Tiếng Việt: chưa bị chặn, nhưng cũng chưa được chứng minh

Không chỗ nào trong skill nhắc tới tiếng Việt, theo cả hai nghĩa: nó không hứa hỗ trợ, và cũng không tuyên bố loại trừ. Đây là những gì mã nguồn thật sự cho phép kết luận.

Trường `voice` được truyền thẳng, không kiểm tra, vào `say -v "$voice"`. Trên máy tôi kiểm tra ngày 18/09/2026, `say -v '?'` liệt kê 184 giọng, trong đó có `Linh vi_VN`. Về mặt cơ chế, đặt `"voice": "Linh"` trong manifest là hợp lệ và `say` sẽ đọc tiếng Việt.

Ba điểm còn lại thì tôi không kiểm chứng được nếu không render thật:

- Phụ đề xuống dòng theo ngưỡng 60 ký tự — con số được chọn cho tiếng Anh. Tiếng Việt nhiều từ ngắn hơn nhưng có dấu, nên số dòng thực tế sẽ khác.
- Chữ có dấu phải qua được `magick -annotate` với font `Helvetica.ttc`. Tôi không dựng khung hình nào để xem dấu có rơi hay không.
- Giọng `Linh` phải được cài sẵn trên máy chạy; danh sách giọng của macOS khác nhau tuỳ máy.

Nói ngắn gọn: skill này được viết cho tiếng Anh, còn tiếng Việt thì không bị chặn ở tầng mã nguồn mà chỉ là chưa ai chứng minh nó chạy được.

## Không hiệu ứng, không hậu kỳ, không tự chụp ảnh

Ba ràng buộc còn lại trong danh sách năm dòng đều là những thứ bị cắt để giữ pipeline ở dạng một chiều:

| Ràng buộc trong SKILL.md | Điều nó loại trừ |
|---|---|
| No animated effects, transitions, or post-production | không fade, không zoom, không chuyển cảnh; mỗi cảnh là một ảnh đứng yên |
| No cloud TTS APIs — uses local `say` only | không giọng neural, không chọn nhà cung cấp, không chi phí theo ký tự |
| Does NOT capture screenshots — expects them as input | nguồn ảnh là việc của công cụ khác |

Hãy để ý cái được đổi lấy: vì không có hiệu ứng và không có chuyển cảnh, mọi clip đều cùng codec, cùng khung hình đứng yên, nên bước ghép cuối chạy được `-c copy` — nối stream, không encode lại. Thêm một hiệu ứng chuyển cảnh thôi là buộc phải encode lại toàn bộ, và thời gian dựng sẽ tỉ lệ với độ dài video thay vì gần như bằng không.

Đó là hình dạng chung của mọi lựa chọn trong skill này: cắt bỏ phần mềm dẻo để phần còn lại rẻ và đoán trước được.

## Vậy quy trình dùng nó trông thế nào

SKILL.md mô tả bốn pha, và pha đầu tiên có một cửa chặn: sau khi dựng manifest, agent phải xác nhận nội dung với người dùng trước khi generate. Nguyên văn trong file là "**GATE**: Confirm manifest contents with user before generating".

Cửa chặn đó đặt đúng chỗ. Manifest là toàn bộ kịch bản; đọc lại một file JSON mười dòng thì rẻ, còn render xong mới phát hiện sai câu chữ thì phải chạy lại cả pipeline.

function esc(s){ return String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function el(tag, attrs, kids){
  var n = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k === 'html') n.innerHTML = attrs[k];
    else if(k === 'text') n.textContent = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function(c){ if(c) n.appendChild(c); });
  return n;
}

/* Code spans are pulled out before escaping and put back after, so that
   markup inside them is never interpreted. The sentinel is ordinary text,
   not a control character, so the source stays copy-paste safe. */
function inline(s){
  var keep = [];
  s = String(s).replace(/`([^`]+)`/g, function(_, c){
    keep.push(c); return 'K0DE' + (keep.length - 1) + 'K0DE';
  });
  s = esc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*]+)\*(?![*\w])/g, '$1<em>$2</em>');
  return s.replace(/K0DE(\d+)K0DE/g, function(_, i){
    return '<code>' + esc(keep[+i]) + '</code>';
  });
}

var BLOCK = {
  h: function(b){
    var tag = b.level === 1 ? 'h2' : b.level === 2 ? 'h3' : 'h4';
    var m = /^(PHAN|PHẦN|PART)\s+(\d+)\s*—\s*(.*)$/.exec(b.text);
    if(tag === 'h2' && m){
      return el('h2', null, [
        el('span', { class: 'eyebrow', text: m[1] + ' ' + m[2] }),
        el('span', { html: inline(m[3]) })
      ]);
    }
    return el(tag, { html: inline(b.text) });
  },
  p:  function(b){ return el('p', { html: inline(b.text) }); },
  ul: function(b){ return el('ul', null, b.items.map(function(t){
        return el('li', { html: inline(t) }); })); },
  ol: function(b){ return el('ol', null, b.items.map(function(t){
        return el('li', { html: inline(t) }); })); },
  quote: function(b){ return el('blockquote', null, b.items.map(function(t){
        return el('p', { html: inline(t) }); })); },
  code: function(b){
    return el('div', { class: 'pre' }, [ el('pre', { text: b.text }) ]);
  },
  hr: function(){ return el('hr'); },
  table: function(b){
    var head = el('tr', null, b.head.map(function(c){
      return el('th', { html: inline(c) }); }));
    var body = b.rows.map(function(r){
      return el('tr', null, r.map(function(c){ return el('td', { html: inline(c) }); }));
    });
    return el('div', { class: 'tw' }, [
      el('table', null, [ el('thead', null, [head]), el('tbody', null, body) ])
    ]);
  },
  fig: function(b){
    var f = FIG[b.id];
    if(!f) return el('p', { text: '[missing figure: ' + b.id + ']' });
    var render = FIGURE[f.type];
    if(!render) return el('p', { text: '[no renderer: ' + f.type + ']' });
    return el('figure', null, [
      el('div', { class: 'fig' }, [ render(f) ]),
      f.cap ? el('figcaption', { html: inline(f.cap) }) : null
    ]);
  }
};

/* -- markdown ------------------------------------------------------- */

var MD = {
  parse: function(src){
    var lines = src.split('\n'), out = [], i = 0;
    function blank(s){ return !s.trim(); }
    function cells(s){
      return s.trim().replace(/^\|/, '').replace(/\|$/, '')
              .split('|').map(function(c){ return c.trim(); });
    }

    while(i < lines.length){
      var ln = lines[i];
      if(blank(ln)){ i++; continue; }

      /* figure directive: keep the id, skip the ASCII fallback body */
      var fm = /^@fig:(\S+)\s*$/.exec(ln);
      if(fm){
        var id = fm[1]; i++;
        while(i < lines.length && !/^@endfig\s*$/.test(lines[i])) i++;
        i++;
        out.push({ t: 'fig', id: id });
        continue;
      }

      var hm = /^(#{1,4})\s+(.*)$/.exec(ln);
      if(hm){ out.push({ t: 'h', level: hm[1].length, text: hm[2].trim() }); i++; continue; }

      if(/^---\s*$/.test(ln)){ out.push({ t: 'hr' }); i++; continue; }

      if(/^\|/.test(ln) && i + 1 < lines.length && /^\|[\s:|-]+\|?\s*$/.test(lines[i + 1])){
        var head = cells(ln); i += 2;
        var rows = [];
        while(i < lines.length && /^\|/.test(lines[i])){ rows.push(cells(lines[i])); i++; }
        out.push({ t: 'table', head: head, rows: rows });
        continue;
      }

      if(/^>\s?/.test(ln)){
        var q = [];
        while(i < lines.length && /^>\s?/.test(lines[i])){
          q.push(lines[i].replace(/^>\s?/, '')); i++;
        }
        out.push({ t: 'quote', items: q });
        continue;
      }

      var lm = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(ln);
      if(lm){
        var ordered = /\d/.test(lm[2]), items = [];
        while(i < lines.length){
          var m2 = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(lines[i]);
          if(m2){ items.push(m2[3]); i++; }
          else if(/^\s{2,}\S/.test(lines[i]) && items.length){
            items[items.length - 1] += ' ' + lines[i].trim(); i++;
          } else break;
        }
        out.push({ t: ordered ? 'ol' : 'ul', items: items });
        continue;
      }

      /* Four-space indented code. Blank lines inside one block are kept,
         then trimmed off the end, so a diagram split by blank lines stays
         a single block instead of becoming several. */
      if(/^ {4}\S/.test(ln)){
        var buf = [];
        while(i < lines.length){
          if(/^ {4}/.test(lines[i])){ buf.push(lines[i].slice(4)); i++; }
          else if(blank(lines[i]) && /^ {4}/.test(lines[i + 1] || '')){ buf.push(''); i++; }
          else break;
        }
        while(buf.length && !buf[buf.length - 1].trim()) buf.pop();
        out.push({ t: 'code', text: buf.join('\n') });
        continue;
      }

      var para = [ln.trim()]; i++;
      while(i < lines.length && !blank(lines[i]) &&
            !/^(#{1,4}\s|@fig:|@endfig|---\s*$|\||>\s?|\s*([-*]|\d+\.)\s|\s{4}\S)/.test(lines[i])){
        para.push(lines[i].trim()); i++;
      }
      out.push({ t: 'p', text: para.join(' ') });
    }
    return out;
  },

  render: function(blocks){
    var frag = document.createDocumentFragment();
    blocks.forEach(function(b){
      var fn = BLOCK[b.t];
      if(fn) frag.appendChild(fn(b));
    });
    return frag;
  }
};


/* -- figure renderers ---------------------------------------------- */

  hooks: function(f){

  },

  islands: function(f){
    var kids = f.rows.map(function(r){
      return el('div', { class: 'is' + (r.shared ? ' shared' : '') }, [

      ]);
    });
    if(f.note) kids.push(el('div', { class: 'isl-note', text: f.note }));
    return el('div', { class: 'isl' }, kids);
  },

  bars: function(f){
    var max = Math.max.apply(null, f.rows.map(function(r){ return r.ms; }));
    return el('div', { class: 'bars' }, f.rows.map(function(r){
      var pct = Math.max(2, Math.round(r.ms / max * 100));
      return el('div', { class: 'br' + (r.cold ? ' cold' : '') }, [
        el('b', { html: inline(r.label) }),
        el('div', { class: 'br-track' }, [
          el('div', { class: 'br-fill', style: 'width:' + pct + '%' }),
          el('span', { class: 'br-val', text: r.val })
        ])
      ]);
    }));
  },

  guards: function(f){
    return el('div', { class: 'guards' }, f.rows.map(function(r){
      return el('div', { class: 'gd ' + r.kind }, [
        el('b', { text: r.tag }),
        el('p', { html: inline(r.text) })
      ]);
    }));
  }
};



/* ===================================================================
   LAYER 3 . LOGIC
   Binds DATA to COMPONENTS. The only layer that touches STATE.
   Pipeline:  SRC -> sections(front | body | footer) -> MD.parse
                  -> MD.render -> DOM -> table of contents
   Both views read the SAME text, so they cannot drift apart.
   =================================================================== */

/* front matter (title + lede) | body | footer, split on the outer rules */
function sections(){
  var t = SRC.replace(/^﻿/, '');
  var first = t.indexOf('\n---\n');
  var last = t.lastIndexOf('\n---\n');
  var head = t.slice(0, first).split('\n');
  return {
    title: (head.filter(function(l){ return l.indexOf('# ') === 0; })[0] || '# ').slice(2),
    lede: head
           .filter(function(l){ return l.indexOf('> ') === 0; })
           .map(function(l){ return l.slice(2); }),
    body: t.slice(first + 5, last),
    footer: t.slice(last + 5).split('\n\n')
             .map(function(p){ return p.trim(); })
             .filter(Boolean)
  };
}

/* the copy-out markdown drops layout directives; prose and ASCII stay */
function forCopy(){
  return SRC.split('\n')
    .filter(function(l){ return !/^@(fig:|endfig|box:|endbox)/.test(l); })
    .join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}

function slug(s, i){
  var base = String(s).toLowerCase()
    .replace(/[^a-z0-9À-ỹ]+/g, '-')
    .replace(/^-+|-+$/g, '').slice(0, 44);
  return (base || 'muc') + '-' + i;
}

/* ---- rendering -------------------------------------------------- */

function buildToc(root){
  var toc = document.getElementById('toc');
  toc.textContent = '';
  var heads = root.querySelectorAll('h2, h3');
  var n = 0;
  Array.prototype.forEach.call(heads, function(h){
    n++;
    if(!h.id) h.id = slug(h.textContent, n);
    var isPart = h.tagName === 'H2';
    var label = h.textContent;
    if(isPart){
      var eb = h.querySelector('.eyebrow');
      if(eb) label = eb.textContent + ' — ' + label.slice(eb.textContent.length);
    }
    var a = el('a', {
      href: '#' + h.id,
      class: isPart ? 'part' : 'lv3',
      text: label
    });
    a.addEventListener('click', function(){ if(!wide()) setNav(false); });
    toc.appendChild(a);
  });
}

function render(){
  var s = sections();

  var h1 = document.getElementById('title');
  h1.textContent = s.title;
  document.title = s.title;

  var lede = document.getElementById('lede');
  lede.textContent = '';
  s.lede.forEach(function(p){ lede.appendChild(el('p', { html: inline(p) })); });

  var doc = document.getElementById('doc');
  doc.textContent = '';
  doc.appendChild(MD.render(MD.parse(s.body)));

  var foot = document.getElementById('foot');
  foot.textContent = '';
  s.footer.forEach(function(p){ foot.appendChild(el('p', { html: inline(p) })); });

  document.getElementById('mdtext').textContent = forCopy();

  buildToc(doc);

  var isDoc = STATE.view === 'doc';
  document.getElementById('docview').hidden = !isDoc;
  document.getElementById('md').hidden = isDoc;
  var vb = document.getElementById('viewbtn');
  vb.textContent = isDoc ? I18N.md : I18N.doc;
  vb.setAttribute('aria-pressed', isDoc ? 'false' : 'true');

  /* no anchors to jump to in the markdown view */
  var nb = document.getElementById('navbtn');
  nb.hidden = !isDoc;
  if(!isDoc && STATE.nav) setNav(false);

  spy();
}

/* ---- controls ---------------------------------------------------- */

function wide(){ return (window.innerWidth || 1280) >= 1180; }

function setView(v){ STATE.view = v; render(); }

function setNav(open){
  STATE.nav = open;
  document.getElementById('nav').classList.toggle('open', open);
  document.getElementById('scrim').hidden = !open || wide();
  document.getElementById('navbtn').setAttribute('aria-expanded', open ? 'true' : 'false');
}

function copyMd(){
  var btn = document.getElementById('copybtn');
  var text = document.getElementById('mdtext').textContent;
  function flash(msg){
    var old = btn.textContent; btn.textContent = msg;
    setTimeout(function(){ btn.textContent = old; }, 1600);
  }
  function fallback(){
    try{
      var r = document.createRange();
      r.selectNodeContents(document.getElementById('mdtext'));
      var sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(r);
      var ok = false;
      try{ ok = document.execCommand('copy'); }catch(e){}
      flash(ok ? I18N.done : 'Đã bôi đen — Cmd/Ctrl+C');
    }catch(e){ flash('Bôi đen thủ công'); }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ flash(I18N.done); }, fallback);
  } else fallback();
}

/* ---- scrollspy ---------------------------------------------------- */

var spyTimer = null;
function spy(){
  if(spyTimer) return;
  spyTimer = setTimeout(function(){
    spyTimer = null;
    var links = document.querySelectorAll('#toc a');
    var best = null, bestTop = -1e9;
    Array.prototype.forEach.call(links, function(a){
      var t = document.getElementById(a.getAttribute('href').slice(1));
      if(!t) return;
      var top = t.getBoundingClientRect().top - 90;
      if(top <= 0 && top > bestTop){ bestTop = top; best = a; }
    });
    Array.prototype.forEach.call(links, function(a){
      a.classList.toggle('on', a === best);
    });
  }, 90);
}

/* ---- wiring ------------------------------------------------------- */

function boot(){
  document.getElementById('kick').textContent = I18N.kick;
  document.getElementById('navhead').textContent = I18N.navHead;
  document.getElementById('copybtn').textContent = I18N.copy;
  document.getElementById('mdnote').textContent = I18N.mdNote;
  document.getElementById('navbtn').textContent = I18N.contents;

  document.getElementById('viewbtn').addEventListener('click', function(){
    setView(STATE.view === 'doc' ? 'md' : 'doc');
  });
  document.getElementById('navbtn').addEventListener('click', function(){
    setNav(!STATE.nav);
  });
  document.getElementById('scrim').addEventListener('click', function(){ setNav(false); });
  document.getElementById('copybtn').addEventListener('click', copyMd);

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && STATE.nav) setNav(false);
  });
  window.addEventListener('scroll', spy, { passive: true });
  window.addEventListener('resize', function(){
    setNav(wide() ? false : STATE.nav);
  });

  render();
  setNav(false);
}

boot();
</script>
