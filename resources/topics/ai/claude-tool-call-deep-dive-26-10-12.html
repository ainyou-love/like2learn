<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deep Dive: Tool Call trong Claude</title>
<meta name="description" content="Tool call trong Claude: là gì, bao nhiêu loại, dùng ở đâu, nguyên tắc, ranh giới, best/bad practice và ví dụ từ atomic đến workflow.">
<style>
/* =========================================================
   DESIGN TOKENS
   ========================================================= */
:root{
  --paper:#F3F5F8; --surface:#FFFFFF; --sunk:#E9EDF2;
  --ink:#16223A; --muted:#566377; --line:#D5DCE5;
  --amber:#B97A06; --amber-soft:#FBEFD3;
  --teal:#11736A; --teal-soft:#DCEFEC;
  --blue:#2D5AA0; --blue-soft:#E0E9F6;
  --slate:#4A5568; --slate-soft:#E4E8EE;
  --rust:#A8402C; --rust-soft:#F7E2DC;
  --focus:#2D5AA0;
  --nav-w:272px; --top-h:60px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1522; --surface:#152032; --sunk:#1B283D;
    --ink:#E4EAF3; --muted:#9AA8BB; --line:#2A3A52;
    --amber:#E3A72F; --amber-soft:#3A2D12;
    --teal:#42B8AB; --teal-soft:#123532;
    --blue:#7FA6E3; --blue-soft:#1A2D4C;
    --slate:#A9B4C4; --slate-soft:#233046;
    --rust:#E2826D; --rust-soft:#3D211B;
    --focus:#7FA6E3;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1522; --surface:#152032; --sunk:#1B283D;
  --ink:#E4EAF3; --muted:#9AA8BB; --line:#2A3A52;
  --amber:#E3A72F; --amber-soft:#3A2D12;
  --teal:#42B8AB; --teal-soft:#123532;
  --blue:#7FA6E3; --blue-soft:#1A2D4C;
  --slate:#A9B4C4; --slate-soft:#233046;
  --rust:#E2826D; --rust-soft:#3D211B;
  --focus:#7FA6E3;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(var(--top-h) + 16px + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.65}
a{color:var(--blue)}
code{font-family:var(--mono);font-size:.86em;background:var(--sunk);padding:.08em .35em;border-radius:4px;word-break:break-word}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
html{scroll-behavior:smooth}

/* =========================================================
   APP CHROME: top bar, tabs, nav
   ========================================================= */
.topbar{position:sticky;top:0;z-index:30;height:var(--top-h);display:flex;align-items:center;gap:12px;
  padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;
  border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--sunk)}
.brand{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;flex:none}
.tab{border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:600;padding:6px 14px;border-radius:7px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}

.shell{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);min-height:calc(100vh - var(--top-h))}
body.nav-collapsed .shell{grid-template-columns:0 minmax(0,1fr)}
.nav{position:sticky;top:var(--top-h);align-self:start;height:calc(100vh - var(--top-h));overflow-y:auto;
  border-right:1px solid var(--line);background:var(--surface);padding:20px 14px 40px}
body.nav-collapsed .nav{visibility:hidden;padding:0;border:0}
.nav h2{font-size:13px;color:var(--muted);font-weight:600;margin:18px 10px 6px}
.nav h2:first-child{margin-top:0}
.nav a{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.35}
.nav a:hover{background:var(--sunk)}
.nav a.is-active{background:var(--blue-soft);color:var(--blue);font-weight:600}
.nav .num{font-variant-numeric:tabular-nums;color:var(--muted);min-width:1.4em;font-size:13px}
.nav a.is-active .num{color:inherit}
.backdrop{display:none}

@media (max-width: 959px){
  .shell,body.nav-collapsed .shell{grid-template-columns:minmax(0,1fr)}
  .nav{position:fixed;top:calc(var(--top-h) + env(safe-area-inset-top,0px));left:0;bottom:0;height:auto;width:min(86vw,320px);z-index:40;
    transform:translateX(-102%);transition:transform .22s ease;visibility:hidden;
    padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  body.nav-open .nav{transform:none;visibility:visible}
  body.nav-open .backdrop{display:block;position:fixed;inset:0;z-index:35;background:rgba(10,16,28,.45)}
  .brand{font-size:14px}
}
@media (max-width: 420px){ .tab{padding:6px 10px} .brand{display:none} .topbar{justify-content:space-between} }

/* =========================================================
   DOCUMENT
   ========================================================= */
.panel[hidden]{display:none}
.doc{max-width:800px;margin:0 auto;padding:40px 22px 96px}
.doc section{margin-bottom:72px}
.doc h1{font-size:clamp(30px,5.6vw,46px);line-height:1.1;letter-spacing:-.02em;margin:0 0 16px;font-weight:800}
.doc h2.sec{font-size:clamp(23px,3.6vw,30px);line-height:1.2;letter-spacing:-.01em;margin:0 0 18px;font-weight:750;
  padding-bottom:12px;border-bottom:2px solid var(--ink)}
.doc h3{font-size:19px;margin:30px 0 10px;line-height:1.3}
.doc h4{font-size:15.5px;margin:22px 0 8px}
.doc p{margin:0 0 14px;max-width:70ch}
.lead{font-size:18.5px;color:var(--ink)}
.meta{color:var(--muted);font-size:14px;margin-bottom:28px}
.muted{color:var(--muted)}

/* Hero stack: the one memorable element */
.stack{margin:32px 0 12px;border:1.5px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--surface)}
.stack-cap{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--ink);color:var(--paper);font-size:13.5px;font-weight:600}
.stack-row{display:grid;grid-template-columns:8px 44px minmax(0,1fr) auto;align-items:center;gap:0 12px;width:100%;
  border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;text-align:left;padding:0 16px 0 0;cursor:pointer;min-height:58px}
.stack-row:first-of-type{border-top:0}
.stack-row:hover{background:var(--sunk)}
.stack-row .bar{align-self:stretch}
.stack-row .n{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center}
.stack-row .t{display:flex;flex-direction:column;padding:9px 0;line-height:1.3}
.stack-row .t b{font-size:16px}
.stack-row .t span{font-size:13.5px;color:var(--muted)}
.stack-row .g{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.g-order .bar{background:var(--slate)} .g-order .n{color:var(--slate)} .g-order .g{background:var(--slate-soft);color:var(--slate)}
.g-inside .bar{background:var(--amber)} .g-inside .n{color:var(--amber)} .g-inside .g{background:var(--amber-soft);color:var(--amber)}
.g-journey .bar{background:var(--teal)} .g-journey .n{color:var(--teal)} .g-journey .g{background:var(--teal-soft);color:var(--teal)}
.g-records .bar{background:var(--blue)} .g-records .n{color:var(--blue)} .g-records .g{background:var(--blue-soft);color:var(--blue)}
.stack-note{font-size:13.5px;color:var(--muted);margin:0 0 24px}
@media (max-width:520px){ .stack-row{grid-template-columns:6px 36px minmax(0,1fr)} .stack-row .g{display:none} .stack-row .n{font-size:20px} }

/* Callouts */
.callout{border-left:4px solid var(--blue);background:var(--blue-soft);padding:14px 16px;border-radius:0 10px 10px 0;margin:18px 0}
.callout p:last-child{margin-bottom:0}
.callout.warn{border-color:var(--rust);background:var(--rust-soft)}
.callout.key{border-color:var(--ink);background:var(--sunk)}
.callout .ct{font-weight:700;display:block;margin-bottom:4px;font-size:14.5px}

/* Benefits */
.benefits{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:20px}
.benefit{background:var(--surface);padding:18px}
.benefit h3{margin:0 0 6px;font-size:16.5px}
.benefit p{font-size:15px;margin:0 0 10px}
.who{font-size:13px;color:var(--muted)}

/* Glossary */
.gloss{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);border-top:1px solid var(--line);margin:0}
.gloss dt,.gloss dd{margin:0;padding:11px 0;border-bottom:1px solid var(--line)}
.gloss dt{font-weight:700;padding-right:16px}
.gloss dt small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.gloss dd{font-size:15.5px}
@media (max-width:600px){ .gloss{grid-template-columns:1fr} .gloss dt{border-bottom:0;padding-bottom:0} .gloss dd{padding-top:2px} }

/* Layer detail */
.layer{border-top:1.5px solid var(--line);padding-top:30px}
.layer-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:center;margin-bottom:16px}
.layer-num{font-size:64px;line-height:.9;font-weight:850;font-variant-numeric:tabular-nums;grid-row:span 2}
.layer-head h3{margin:0;font-size:clamp(22px,3.4vw,27px)}
.layer-tech{color:var(--muted);font-size:14.5px}
.layer.g-order .layer-num{color:var(--slate)} .layer.g-inside .layer-num{color:var(--amber)}
.layer.g-journey .layer-num{color:var(--teal)} .layer.g-records .layer-num{color:var(--blue)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 18px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.fact span{display:block;font-size:12.5px;color:var(--muted)}
.fact b{font-size:15.5px}

.dos{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
.dos > div{border-radius:10px;padding:14px 16px;border:1px solid var(--line);background:var(--surface)}
.dos h4{margin:0 0 6px;display:flex;align-items:center;gap:8px}
.dos ul{margin:0;padding-left:18px}
.dos li{margin:4px 0;font-size:15px}
.dos .do h4{color:var(--teal)} .dos .dont h4{color:var(--rust)}
.mark{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;font-size:12px;color:#fff}
.do .mark{background:var(--teal)} .dont .mark{background:var(--rust)}
@media (max-width:640px){ .dos{grid-template-columns:1fr} }
.owner{font-size:14.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:14px}
.owner b{color:var(--ink)}

/* Tables */
.tbl{overflow-x:auto;margin:14px 0 20px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:14.5px}
.tbl caption{text-align:left;font-weight:700;padding:10px 14px 0;font-size:14.5px}
.tbl th,.tbl td{padding:9px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl th{font-size:13px;color:var(--muted);font-weight:600;background:var(--sunk)}
.tbl tr:last-child td{border-bottom:0}

/* Figures (visuals) */
figure.viz{margin:20px 0 22px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
figure.viz figcaption{font-size:13.5px;color:var(--muted);margin-top:12px}
.scroll-x{overflow-x:auto}
.scroll-x svg{min-width:560px;width:100%;height:auto;display:block}
svg text{font-family:var(--sans);fill:var(--ink)}
svg .s-muted{fill:var(--muted)}
svg .s-line{stroke:var(--line)}
svg .s-ink{stroke:var(--ink)}
svg .s-box{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
svg .f-amber{fill:var(--amber)} svg .f-teal{fill:var(--teal)} svg .f-blue{fill:var(--blue)} svg .f-rust{fill:var(--rust)} svg .f-slate{fill:var(--slate)}
svg .f-amber-soft{fill:var(--amber-soft)} svg .f-teal-soft{fill:var(--teal-soft)} svg .f-blue-soft{fill:var(--blue-soft)}
svg .arrowhead{fill:var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:13px;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--sunk)}
.resp{border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.resp-h{background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:13px;padding:6px 12px}
.resp-b{padding:12px;display:grid;gap:8px}
.blk{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:start;padding:8px 10px;border-radius:8px;font-size:14px}
.blk code{background:transparent;padding:0;font-weight:700}
.blk.text{background:var(--amber-soft)} .blk.think{background:var(--slate-soft)} .blk.tool{background:var(--teal-soft)} .blk.server{background:var(--blue-soft)}
@media (max-width:520px){ .blk{grid-template-columns:1fr;gap:2px} }
.fork{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.fork div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--paper)}
.fork b{display:block;font-size:14.5px}
@media (max-width:560px){ .fork{grid-template-columns:1fr} }

.stops{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.stop{border-radius:10px;padding:10px 12px;border:1px solid var(--line);font-size:14px;background:var(--paper)}
.stop code{display:block;background:transparent;padding:0;font-weight:700;margin-bottom:2px;font-size:13px}
.stop.ok{border-left:5px solid var(--teal)} .stop.act{border-left:5px solid var(--amber)} .stop.bad{border-left:5px solid var(--rust)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}

.order{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);gap:8px;align-items:center}
.order .col{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--paper)}
.order .col b{display:block;margin-bottom:8px;font-size:14.5px}
.order .knob{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
.order .knob:last-child{border-bottom:0}
.order .arrow{text-align:center;font-size:22px;color:var(--muted)}
@media (max-width:600px){ .order{grid-template-columns:1fr} .order .arrow{transform:rotate(90deg)} }

.receipt{max-width:380px;margin:0 auto;background:var(--paper);border:1px dashed var(--muted);border-radius:6px;padding:16px 18px;font-family:var(--mono);font-size:13.5px}
.receipt .r{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.receipt hr{border:0;border-top:1px dashed var(--muted);margin:8px 0}
.receipt .tt{text-align:center;font-weight:700;margin-bottom:8px;font-family:var(--sans)}

.label{max-width:440px;margin:0 auto;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--paper)}
.label .lh{background:var(--ink);color:var(--paper);padding:6px 12px;font-size:13px;font-weight:700}
.label .lb{padding:12px}
.label .row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:4px 0}
.label .row code{background:transparent;padding:0}
.meter{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden;margin:6px 0 2px}
.meter i{display:block;height:100%;background:var(--amber)}
.barcode{height:34px;margin-top:10px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 13px)}

.triage{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.triage div{border-radius:10px;padding:12px;border:1px solid var(--line);background:var(--paper)}
.triage b{display:block;margin-bottom:6px}
.triage .t1{border-top:5px solid var(--slate)} .triage .t2{border-top:5px solid var(--teal)} .triage .t3{border-top:5px solid var(--rust)}
.triage .chips{gap:6px}
@media (max-width:620px){ .triage{grid-template-columns:1fr} }

.bstack{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bstack span{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#fff;min-width:0}
.bs-ok{background:var(--teal)} .bs-err{background:var(--rust)} .bs-can{background:var(--slate)} .bs-exp{background:var(--amber)}

.pipe{display:grid;grid-template-columns:1fr 30px 1fr 30px 1fr;align-items:center;gap:6px}
.pipe div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--paper)}
.pipe b{display:block}
.pipe .ar{border:0;background:none;text-align:center;font-size:20px;color:var(--muted);padding:0}
@media (max-width:600px){ .pipe{grid-template-columns:1fr} .pipe .ar{transform:rotate(90deg)} }

/* Flow steps */
.steps{list-style:none;padding:0;margin:18px 0;counter-reset:s}
.steps li{position:relative;padding:0 0 18px 48px;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--paper);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.steps li::after{content:"";position:absolute;left:15px;top:34px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps b{display:block}
.steps .lay{display:inline-block;font-size:12.5px;color:var(--muted);margin-top:2px}

/* Checklist */
.progress{display:flex;align-items:center;gap:12px;margin:8px 0 14px;font-size:14px;color:var(--muted)}
.progress .meter{flex:1;margin:0}
.progress .meter i{background:var(--teal);transition:width .2s}
.checks{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.checks li{border-bottom:1px solid var(--line)}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:11px 4px;cursor:pointer;font-size:15.5px}
.checks input{width:19px;height:19px;margin-top:3px;flex:none;accent-color:var(--teal)}
.checks .l{font-size:12.5px;color:var(--muted);display:block}
.checks li.done .txt{color:var(--muted);text-decoration:line-through}

/* References */
.refs{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.refs li{padding:12px 0;border-bottom:1px solid var(--line)}
.refs a{font-weight:600;text-decoration:none}
.refs a:hover{text-decoration:underline}
.refs .u{display:block;font-family:var(--mono);font-size:12.5px;color:var(--muted);word-break:break-all}
.refs p{margin:4px 0 0;font-size:14.5px}

/* Markdown panel */
.md{max-width:980px;margin:0 auto;padding:28px 22px 80px}
.md-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.md-bar h1{font-size:22px;margin:0;flex:1;min-width:200px}
.btn{font:inherit;font-size:14.5px;font-weight:600;border-radius:8px;padding:9px 16px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:hover{opacity:.9}
.md textarea{width:100%;height:70vh;min-height:360px;font-family:var(--mono);font-size:13.5px;line-height:1.55;padding:16px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical;tab-size:2}
.md .muted{font-size:13.5px;margin-top:8px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;transition:all .2s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}

## 1. Mục tiêu và phạm vi

### Mục tiêu

Sau khi đọc, người đọc nên trả lời được:

| Câu hỏi | Phần |
|---|---|
| Tool call là gì, ai thực sự chạy công cụ? | 2 |
| Có bao nhiêu loại tool, khác nhau ở đâu? | 3 |
| Mỗi loại dùng được trên sản phẩm nào? | 4 |
| Tool trong Messages API, trong Skill và qua MCP vận hành ra sao? | 5 |
| Nguyên tắc, hợp đồng kỹ thuật và ranh giới an toàn là gì? | 6 |
| Áp dụng vào tình huống thực tế thế nào? | 7 |
| Nên và tránh làm gì? | 8 |

### Phạm vi (scope)

Tài liệu chia tool thành ba phạm vi theo **ai sở hữu năng lực**:

| Scope | Ý nghĩa | Ví dụ |
|---|---|---|
| **Built-in Claude** | Năng lực có sẵn do Anthropic hoặc harness của Anthropic cung cấp | Tìm kiếm web, chạy code, đọc/ghi file trong Claude Code |
| **External integration** | Kết nối tới dịch vụ bên thứ ba có sẵn connector | Slack, Jira, Google Drive qua MCP |
| **Custom business** | Năng lực do chính doanh nghiệp xây dựng | API nội bộ, MCP server riêng, Skill quy trình nghiệp vụ |

Và ba **cơ chế** để Claude chạm tới công cụ:

| Cơ chế | Một câu mô tả |
|---|---|
| **Tool trong Message** | Ứng dụng khai báo tool trong request Messages API, tự thực thi khi Claude yêu cầu |
| **Tool call trong Skill** | Skill là gói hướng dẫn và script; Claude làm theo bằng cách dùng các tool khác |
| **Tool qua MCP** | Tool nằm trên một MCP server, được khám phá và gọi qua giao thức chuẩn |

---

## 2. Tool call là gì

### 2.1 Mental model một câu

> **Claude không bao giờ tự thực thi công cụ. Claude chỉ đề xuất; một chương trình bao quanh (harness) quyết định có chạy hay không, chạy thế nào, rồi báo kết quả lại.**

Harness có thể là:

- Backend của bạn (khi dùng Messages API với custom tool).
- Claude Code hoặc Claude Agent SDK.
- Ứng dụng claude.ai.
- Hạ tầng của Anthropic (với server tool như tìm kiếm web).

### 2.2 Giải phẫu một tool call

Một tool call gồm ba mảnh:

```text
1. TOOL DEFINITION   (ứng dụng khai báo)    tên + mô tả + JSON Schema đầu vào
2. TOOL_USE          (Claude trả về)        "tôi muốn gọi tool X với input Y"
3. TOOL_RESULT       (harness gửi lại)      kết quả, gắn đúng id của tool_use
```

**Tool definition** (gửi trong request):

```json
{
  "name": "tra_don",
  "description": "Tra trạng thái đơn hàng theo mã đơn. Dùng khi khách hỏi đơn đang ở đâu.",
  "input_schema": {
    "type": "object",
    "properties": {
      "ma_don": { "type": "string", "description": "Mã đơn, dạng DH-xxxx" }
    },
    "required": ["ma_don"]
  }
}
```

**tool_use** (Claude trả về trong `content`, kèm `stop_reason: "tool_use"`):

```json
{
  "type": "tool_use",
  "id": "toolu_01ABC",
  "name": "tra_don",
  "input": { "ma_don": "DH-1024" }
}
```

**tool_result** (harness gửi lại trong message `user` kế tiếp):

```json
{
  "type": "tool_result",
  "tool_use_id": "toolu_01ABC",
  "content": "{\"trang_thai\": \"dang_giao\", \"du_kien\": \"2026-10-14\"}"
}
```

### 2.3 Vòng lặp agent

```text
        ┌──────────────────────────┐
        │ Harness gửi request      │◀─────────────────────────┐
        │ (messages + tools)       │                          │
        └────────────┬─────────────┘                          │
                     ▼                                        │
        ┌──────────────────────────┐                          │
        │ Claude trả response      │                          │
        └────────────┬─────────────┘                          │
                     ▼                                        │
        ┌──────────────────────────┐   tool_use    ┌──────────┴─────────┐
        │ Đọc stop_reason          ├──────────────▶│ Kiểm tra quyền,    │
        └────────────┬─────────────┘               │ thực thi tool,     │
                     │ end_turn                    │ gửi tool_result    │
                     ▼                             └────────────────────┘
        ┌──────────────────────────┐
        │ Trả kết quả cho người    │
        └──────────────────────────┘
```

Các giá trị `stop_reason` liên quan trực tiếp tới tool:

| Giá trị | Ý nghĩa với tool | Harness làm gì |
|---|---|---|
| `tool_use` | Claude chờ harness chạy tool phía client | Thực thi, gửi `tool_result`, gọi lại |
| `pause_turn` | Vòng lặp server tool (phía Anthropic) tạm dừng | Gửi lại hội thoại để Claude đi tiếp |
| `end_turn` | Đã xong | Dùng kết quả |
| `max_tokens` | Bị cắt, có thể cắt ngang giữa một tool_use | Không thực thi tool bị cắt dở |

> `pause_turn` chỉ liên quan tới server tool. Khi Claude chờ tool phía bạn, lý do dừng luôn là `tool_use`.

---

## 3. Phân loại: bao nhiêu loại tool

### 3.1 Bản đồ tổng quát

```text
                         ┌─ A1. Server tool         Anthropic thực thi
          Built-in ──────┤                          (web search, web fetch, code execution)
          Claude         └─ A2. Harness built-in    Claude Code / Agent SDK thực thi
                                                    (Read, Write, Edit, Glob, Grep, Bash…)

          External  ─────── B1. Connector MCP       MCP server của bên thứ ba
          integration                               (Slack, Jira, Google Drive…)

                         ┌─ C1. Custom tool         Backend của bạn thực thi
          Custom   ──────┼─ C2. MCP server riêng    Server MCP của bạn thực thi
          business       └─ C3. Skill               KHÔNG phải tool: gói hướng dẫn + script,
                                                    thực hiện qua tool khác (A1, A2, B1, C2)
```

### 3.2 So sánh chi tiết

| Loại | Ai định nghĩa | Ai thực thi | Block Claude trả về | Kiểm soát chính |
|---|---|---|---|---|
| A1. Server tool | Anthropic | Anthropic | `server_tool_use` + `*_tool_result` | Tham số cấu hình (giới hạn số lần, domain) |
| A2. Harness built-in | Anthropic (trong harness) | Harness, trên máy/server của bạn | `tool_use` | Permission + hook |
| B1. Connector MCP | Bên thứ ba | MCP server bên thứ ba | `tool_use` (host chuyển sang MCP) | OAuth của dịch vụ + permission phía host |
| C1. Custom tool | Bạn, trong request | Backend của bạn | `tool_use` | Toàn quyền trong code |
| C2. MCP server riêng | Bạn, trên server | MCP server của bạn | `tool_use` hoặc `mcp_tool_use` | Auth ở server + permission phía host |
| C3. Skill | Bạn hoặc tổ chức | Tool khác đảm nhận | Không có block riêng | Nội dung skill + kiểm soát của tool được dùng |

### 3.3 Hai điểm hay nhầm

**Skill không phải tool.** Skill là thư mục có `SKILL.md` (hướng dẫn) và có thể kèm `scripts/`. Khi Claude chạy script, model chỉ thấy một tool call kiểu `Bash: python scripts/tinh_phi.py`. Không tồn tại block `skill_use`.

**MCP là giao thức, không phải loại tool.** Cùng một MCP server có thể được dùng qua Claude Code, claude.ai, Messages API (MCP connector) hoặc backend của bạn đóng vai MCP client. Cách dùng quyết định ai thực thi và ai kiểm soát (xem 5.3).

---

## 4. Được sử dụng ở đâu

| Bề mặt sử dụng | A1 Server tool | A2 Harness built-in | B1/C2 MCP | C1 Custom tool | C3 Skill |
|---|---|---|---|---|---|
| **Messages API** (tự viết backend) | Có | Không | Có, qua tham số `mcp_servers` hoặc backend làm MCP client | Có, đây là cơ chế gốc | Có, khi dùng cùng môi trường chạy code |
| **claude.ai** (web, app) | Có | Không | Có, qua connector | Không | Có |
| **Claude Code** | Có (dạng WebSearch, WebFetch) | Có | Có | Không trực tiếp | Có |
| **Claude Agent SDK** | Có | Có | Có | Có, dưới dạng hàm của bạn | Có |

Gợi ý đọc bảng:

- **Xây sản phẩm cho khách hàng** thường dùng Messages API hoặc Agent SDK.
- **Nhân viên nội bộ làm việc** thường dùng claude.ai hoặc Claude Code kèm MCP và Skill.
- **Agent SDK** là cách dùng lại vòng lặp của Claude Code (tool có sẵn, permission, hook, subagent) bên trong ứng dụng của bạn, thay vì tự viết vòng lặp.

## 5. Ba cơ chế chi tiết: Message, Skill, MCP

### 5.1 Tool trong Message (Messages API)

#### Cách hoạt động

Backend của bạn chính là harness: khai báo tool, nhận `tool_use`, tự thực thi, gửi `tool_result`, lặp tới khi xong.

```text
User ─▶ Chat backend ──(tools=[…])──▶ Claude API
             ▲                             │ tool_use
             │◀────────────────────────────┘
             ├─▶ Business API (backend tự gọi, biết user là ai)
             └──(tool_result)──▶ Claude API ─▶ … ─▶ end_turn ─▶ User
```

#### Các tham số điều khiển

| Tham số | Tác dụng |
|---|---|
| `tools` | Danh sách tool Claude được phép đề xuất |
| `tool_choice: auto` | Claude tự quyết có dùng tool hay không (mặc định khi có tools) |
| `tool_choice: any` | Bắt buộc dùng ít nhất một tool |
| `tool_choice: {type: tool, name}` | Bắt buộc dùng đúng tool chỉ định |
| `tool_choice: none` | Không cho dùng tool |
| `disable_parallel_tool_use` | Trong `tool_choice`: chỉ cho tối đa một tool call mỗi lượt |
| `strict: true` (trên từng tool) | Đảm bảo input của tool đúng JSON Schema |

#### Vòng lặp tối thiểu (Python, minh họa)

```python
import anthropic

client = anthropic.Anthropic()
MAX_STEPS = 10

def run_agent(user_text, tools, executors):
    messages = [{"role": "user", "content": user_text}]
    for _ in range(MAX_STEPS):
        resp = client.messages.create(
            model=MODEL, max_tokens=2048, tools=tools, messages=messages
        )
        messages.append({"role": "assistant", "content": resp.content})

        if resp.stop_reason == "end_turn":
            return resp
        if resp.stop_reason == "tool_use":
            results = []
            for block in resp.content:
                if block.type != "tool_use":
                    continue
                try:
                    output = executors[block.name](**block.input)   # kiểm tra quyền bên trong
                    results.append({"type": "tool_result",
                                    "tool_use_id": block.id,
                                    "content": output})
                except Exception as e:
                    results.append({"type": "tool_result",
                                    "tool_use_id": block.id,
                                    "content": f"Lỗi: {e}",
                                    "is_error": True})
            messages.append({"role": "user", "content": results})
            continue
        if resp.stop_reason == "pause_turn":
            continue                      # gửi lại để server tool đi tiếp
        handle_other(resp)                # max_tokens, refusal, giá trị lạ…
        return resp
    raise RuntimeError("Vượt số bước tối đa")
```

Điểm cần chú ý trong vòng lặp:

- **Parallel tool use:** một response có thể chứa nhiều `tool_use`. Trả **tất cả** `tool_result` trong **cùng một** message `user`, mỗi kết quả khớp đúng `tool_use_id`.
- **Thinking block:** nếu bật extended thinking, giữ nguyên các block `thinking` khi gửi lại trong vòng lặp, không chỉnh sửa.
- **`is_error: true`:** báo lỗi có cấu trúc để Claude tự điều chỉnh, thay vì làm sập vòng lặp.
- **Giới hạn số bước:** luôn có trần để tránh vòng lặp vô hạn và chi phí mất kiểm soát.

#### Server tool trong Messages API

Server tool được khai báo trong cùng tham số `tools`, nhưng do Anthropic thực thi:

```json
{ "type": "web_search_20250305", "name": "web_search", "max_uses": 5 }
```

Response trả về `server_tool_use` và `web_search_tool_result`. Backend không cần thực thi gì, nhưng phải xử lý `pause_turn`.

### 5.2 Tool call trong Skill

#### Cấu trúc một skill

```text
quy-trinh-hoan-tien/
├── SKILL.md          ← bắt buộc: frontmatter (name, description) + hướng dẫn
├── references/       ← tùy chọn: chính sách, bảng phí, ví dụ
└── scripts/          ← tùy chọn: code tất định (tính toán, validate, định dạng)
```

```markdown
---
name: quy-trinh-hoan-tien
description: Xử lý yêu cầu hoàn tiền của khách. Dùng khi khách yêu cầu hoàn tiền, trả hàng hoặc khiếu nại thanh toán.
---

# Quy trình hoàn tiền

1. Dùng tool `tra_don` để lấy trạng thái và giá trị đơn.
2. Chạy `scripts/kiem_tra_dieu_kien.py` với dữ liệu đơn để xác định điều kiện hoàn.
3. Nếu đủ điều kiện, gọi `tao_hoan_tien`. Hệ thống sẽ yêu cầu người duyệt nếu vượt ngưỡng.
4. Soạn phản hồi cho khách theo mẫu trong `references/mau_phan_hoi.md`.
```

#### Progressive disclosure

Skill được nạp theo ba tầng, nên có thể cài nhiều skill mà không làm phình context:

| Tầng | Nạp khi nào | Nội dung |
|---|---|---|
| 1 | Luôn luôn, từ đầu phiên | Tên và mô tả (frontmatter) |
| 2 | Khi yêu cầu khớp mô tả | Toàn bộ `SKILL.md` |
| 3 | Khi đang làm tới bước cần | File trong `references/`, `scripts/` |

Hệ quả thiết kế: **phần `description` quyết định skill có được kích hoạt hay không.** Mô tả phải nói rõ cả skill làm gì lẫn khi nào dùng.

#### Ba đường để skill chạm tới hệ thống

```text
                     ┌─ (A) SKILL.md hướng dẫn → Claude gọi MCP/custom tool ──┐
Skill ── Claude ─────┤                                                        ├──▶ Business API
                     ├─ (B) script ── gọi HTTP API trực tiếp ─────────────────┤
                     └─ (C) script ── gọi MCP server bằng code ───────────────┘
```

| Đường | Dùng khi | Policy được thực thi ở đâu | Rủi ro |
|---|---|---|---|
| (A) Hướng dẫn gọi tool | Hành động nghiệp vụ, nhất là ghi dữ liệu | Hook + MCP server + API | Thấp nhất |
| (B) Script gọi API | Đọc, tính toán, công cụ legacy | Chỉ ở API | Hook chỉ thấy `Bash: python …`, không thấy ý nghĩa nghiệp vụ; credential nằm trong môi trường |
| (C) Script gọi MCP | Dữ liệu lớn, chuỗi xử lý nhiều bước | MCP server + API | Mất tính minh bạch theo từng hành động |

Đường (C) là pattern Anthropic đề xuất trong bài "Code execution with MCP": trình bày MCP server như API dạng code để agent viết code gọi, giúp nạp tool khi cần, lọc dữ liệu trước khi tới model, và giữ kết quả trung gian trong môi trường thực thi.

> Script trong skill có gọi được mạng hay không phụ thuộc môi trường. Ví dụ sandbox của claude.ai giới hạn mạng ra theo danh sách domain cho phép, nên script gọi API nội bộ có thể chạy trong Claude Code trên máy dev nhưng bị chặn trên claude.ai.

### 5.3 Tool qua MCP

#### Giao thức

MCP (Model Context Protocol) là giao thức mở để expose tool, resource và prompt. Hai lệnh cốt lõi với tool:

```json
{ "jsonrpc": "2.0", "id": 1, "method": "tools/list" }
```

```json
{
  "jsonrpc": "2.0", "id": 2, "method": "tools/call",
  "params": { "name": "create_issue", "arguments": { "project": "SUP", "title": "Khách phản ánh giao trễ" } }
}
```

Trong Claude Code, tool MCP được đặt tên theo mẫu `mcp__<server>__<tool>` và đi qua cùng hệ thống permission và hook như tool có sẵn.

#### Bốn cách dùng MCP

| # | Cách dùng | Ai thực thi | Ai giữ vòng lặp | Phù hợp |
|---|---|---|---|---|
| 1 | Host có sẵn (Claude Code, claude.ai) | Host gọi MCP server | Host | Nhân viên nội bộ |
| 2 | MCP connector trong Messages API (`mcp_servers`) | Anthropic gọi MCP server | Phía Claude API | Prototype, công cụ ít rủi ro |
| 3 | Backend làm MCP client, chuyển MCP tool thành custom tool | Backend gọi MCP server | Backend | Sản phẩm cho khách hàng |
| 4 | Script gọi MCP bằng code (code execution with MCP) | Môi trường chạy code | Code do agent viết | Xử lý dữ liệu lớn |

#### MCP connector (cách 2) và custom tool: khác biệt quan trọng

| Tiêu chí | Custom tool / backend làm MCP client | MCP connector |
|---|---|---|
| Biết user cuối là ai | Có sẵn trong session của backend | Phải truyền token riêng theo từng user |
| Lọc dữ liệu trước khi model đọc | Được, backend lọc trước khi gửi `tool_result` | Không, phải lọc ngay tại MCP server |
| Chèn bước người duyệt | Dễ, backend dừng vòng lặp | Khó, phải thiết kế ở MCP server |
| Đường mạng | Nội bộ | MCP server phải truy cập được từ internet |
| Công sức backend | Phải tự viết vòng lặp | Ít |

Response khi dùng MCP connector chứa block `mcp_tool_use` và `mcp_tool_result`: backend chỉ thấy kết quả **sau khi** model đã đọc.

#### Skill và MCP bổ trợ nhau

| | Skill | MCP |
|---|---|---|
| Trả lời câu hỏi | **Làm thế nào** | **Làm được gì** |
| Chứa | Quy trình, tiêu chí, script hỗ trợ | Năng lực truy cập hệ thống thật |
| Quan hệ | SKILL.md nhắc tên tool MCP cần dùng | Không cần biết skill nào đang dùng mình |

## 6. Nguyên tắc, protocol và ranh giới

### 6.1 Mười nguyên tắc

1. **AI đề xuất, hệ thống tất định quyết định.** Mọi hành động có tác động thật đi qua code mà bạn kiểm soát.
2. **Policy nằm ở nơi hành động xảy ra.** Business rule bắt buộc nằm ở Business API; hook và permission là lớp phòng thủ sớm, không phải lớp duy nhất.
3. **Hook cho điều bắt buộc, prompt/skill cho điều nên biết.** “Hoàn trên 2 triệu cần người duyệt” là code; “xưng hô thân thiện” là hướng dẫn.
4. **Một năng lực, một cổng.** Mỗi business API expose qua một MCP server (hoặc một lớp tool); không viết lại auth trong từng script.
5. **Tool nhỏ, đơn nhiệm, tên rõ nghĩa.** Tránh tool vạn năng như “chạy SQL bất kỳ”.
6. **Tách đọc và ghi.** Tool đọc có thể tự chạy; tool ghi có kiểm soát quyền, chống trùng lặp và ngưỡng duyệt.
7. **Quyền tối thiểu.** Credential theo từng agent, từng user, phạm vi hẹp nhất.
8. **Model chọn, code tính, server cho phép.** Không để model tự tính tiền hay tự quyết quyền hạn.
9. **Lỗi là dữ liệu.** Trả lỗi có cấu trúc trong `tool_result` để Claude tự điều chỉnh.
10. **Truy vết đầu-cuối.** Mọi tác động ghi truy ngược được: user → phiên → `request-id` → tool call → API call.

### 6.2 Protocol: những điều kiện bắt buộc của vòng lặp

| Quy tắc | Nếu vi phạm |
|---|---|
| Mỗi `tool_use` phải có đúng một `tool_result` với `tool_use_id` khớp | API trả lỗi 400 ở lượt tiếp theo |
| `tool_result` nằm trong message `user` ngay sau message `assistant` chứa `tool_use` | API trả lỗi |
| Kết quả của các tool call song song trả trong cùng một message | Claude có thể hiểu sai thứ tự hoặc API báo lỗi |
| Giữ nguyên block `thinking` khi tiếp tục vòng lặp có tool | Lỗi hoặc mất mạch suy luận |
| Kiểm tra `stop_reason` trước khi dùng nội dung | Thực thi tool bị cắt dở, hoặc agent dừng nửa đường |
| Có nhánh xử lý cho `stop_reason` chưa biết | Code vỡ khi API bổ sung giá trị mới |
| Có trần số bước | Vòng lặp vô hạn, chi phí mất kiểm soát |

### 6.3 Ranh giới (boundaries)

```text
┌──────────────────────────────────────────────────────────────────────┐
│ Skill / prompt     "Làm thế nào"     có thể sai, có thể bị bỏ qua     │
├──────────────────────────────────────────────────────────────────────┤
│ Model              "Quyết định"      không tất định                   │
├──────────────────────────────────────────────────────────────────────┤
│ Harness: hook,     "Phòng thủ sớm"   có thể bị đi vòng (script gọi    │
│ permission                           API trực tiếp)                   │
├──────────────────────────────────────────────────────────────────────┤
│ MCP server / tool  "Cổng chuẩn"      auth theo agent, validate input  │
├──────────────────────────────────────────────────────────────────────┤
│ Business API       "Nguồn sự thật"   rule, quyền, idempotency         │
└──────────────────────────────────────────────────────────────────────┘
        Càng xuống dưới càng tất định, càng khó bị đi vòng
```

| Ranh giới | Câu hỏi kiểm tra | Biện pháp |
|---|---|---|
| **Tin cậy** | Nội dung nào đến từ nguồn không tin cậy (email khách, trang web, tool bên thứ ba)? | Coi là dữ liệu, không là chỉ thị; quyền ghi không phụ thuộc vào nội dung đó |
| **Danh tính** | Tool biết đang phục vụ user nào? | Token theo user/phiên; lọc dữ liệu theo user ở API |
| **Dữ liệu** | Dữ liệu nào rời khỏi hệ thống, đi tới model hay bên thứ ba? | Che dữ liệu nhạy cảm trước khi trả `tool_result`; không đưa dữ liệu mật vào query tìm kiếm web |
| **Quyền hạn** | Agent làm được những gì, tối đa bao nhiêu? | Ma trận allow / ask / deny; hạn mức ở API |
| **Đảo ngược** | Hành động có hoàn tác được không? | Không hoàn tác được thì phải có người duyệt hoặc ngưỡng chặt |
| **Context** | Bao nhiêu tool và dữ liệu đang chiếm context? | Progressive disclosure, gom nhóm tool, lọc dữ liệu trong code |

### 6.4 Ma trận quyền mẫu

| Nhóm hành động | Mặc định | Ví dụ |
|---|---|---|
| Đọc dữ liệu không nhạy cảm | Allow | `tra_don`, Read file trong `src/` |
| Ghi rủi ro thấp, hoàn tác được | Allow + log | Tạo ticket, sửa file trong repo có git |
| Ghi có tác động tiền, khách hàng, production | Ask (người duyệt) | Hoàn tiền vượt ngưỡng, `git push`, gửi email hàng loạt |
| Không hoàn tác được, phá hủy | Deny hoặc không cấp tool | Xóa tài khoản, `rm -rf`, đọc `.env` |

## 7. Ví dụ từ atomic đến workflow

Các ví dụ được xếp theo bốn cấp độ:

| Cấp độ | Đặc điểm | Ví dụ |
|---|---|---|
| **L1 Atomic** | Một tool call, một mục đích | E1 đến E3 |
| **L2 Composite** | Vài tool call phối hợp, có bước kiểm tra | E4 đến E6 |
| **L3 Business** | Tool nghiệp vụ qua MCP hoặc custom tool | E7 đến E10 |
| **L4 Workflow** | Nhiều cơ chế, nhiều bước, có người tham gia | E11 đến E13 |

Mỗi ví dụ trình bày: yêu cầu, loại tool, luồng, payload, nên và tránh.

---

### L1. Atomic

#### E1. Tìm kiếm và đọc thông tin trên web

**Yêu cầu:** “Tìm xem giới hạn kích thước request của Claude API hiện là bao nhiêu.”

| | |
|---|---|
| Scope | Built-in Claude |
| Loại | A1 Server tool (`web_search`, `web_fetch`) |
| Bề mặt | Messages API, claude.ai, Claude Code |

**Luồng:**

```text
Claude ─ server_tool_use: web_search {"query": "Claude API request size limit"}
       ◀ web_search_tool_result: danh sách kết quả
Claude ─ server_tool_use: web_fetch {"url": "<trang tài liệu trong kết quả>"}
       ◀ web_fetch_tool_result: nội dung trang
Claude ─ text: câu trả lời kèm trích dẫn nguồn         stop_reason: end_turn
```

**Khai báo trong Messages API:**

```json
{ "type": "web_search_20250305", "name": "web_search", "max_uses": 3 }
```

**Nên:**

- Giới hạn số lần tìm và, nếu cần, giới hạn domain được phép.
- Yêu cầu trích dẫn nguồn trong câu trả lời.
- Xử lý `pause_turn` khi vòng lặp tìm kiếm chạy dài.

**Tránh:**

- Đưa dữ liệu nội bộ hoặc dữ liệu khách hàng vào câu truy vấn web.
- Coi nội dung trang web là chỉ thị: trang web có thể chứa prompt injection.

---

#### E2. Đọc, liệt kê, ghi file trong thư mục

**Yêu cầu:** “Liệt kê các file cấu hình trong `config/`, đọc file `app.yaml`, rồi đổi `timeout` thành 30.”

| | |
|---|---|
| Scope | Built-in Claude |
| Loại | A2 Harness built-in (Glob, Read, Edit) |
| Bề mặt | Claude Code, Agent SDK |

**Luồng:**

```text
tool_use: Glob  {"pattern": "config/**/*.yaml"}       → danh sách file
tool_use: Read  {"file_path": "config/app.yaml"}      → nội dung file
tool_use: Edit  {"file_path": "config/app.yaml",
                 "old_string": "timeout: 10",
                 "new_string": "timeout: 30"}          → permission check → sửa file
text: "Đã đổi timeout từ 10 thành 30 trong config/app.yaml."
```

**Cấu hình permission minh họa** (`.claude/settings.json`; kiểm tra cú pháp hiện hành trong tài liệu Claude Code):

```json
{
  "permissions": {
    "allow": ["Read(./config/**)", "Glob"],
    "ask":   ["Edit(./config/**)"],
    "deny":  ["Read(./.env)", "Read(./secrets/**)"]
  }
}
```

**Nên:**

- Đọc trước khi sửa; dùng sửa từng đoạn (`Edit`) thay vì ghi đè cả file khi chỉ đổi một dòng.
- Chặn đọc file bí mật bằng `deny`.
- Làm việc trong repo có git để mọi thay đổi hoàn tác được.

**Tránh:**

- Cho phép ghi tự động vào thư mục cấu hình production.
- Để agent đọc `.env` rồi vô tình đưa secret vào câu trả lời hoặc log.

---

#### E3. Chạy một lệnh bash

**Yêu cầu:** “Chạy test của module thanh toán.”

| | |
|---|---|
| Scope | Built-in Claude |
| Loại | A2 Harness built-in (Bash) |
| Bề mặt | Claude Code, Agent SDK |

**Luồng:**

```text
tool_use: Bash {"command": "npm test -- payments"}
   → PreToolUse hook (nếu có) → permission: allow "Bash(npm test:*)" → chạy
tool_result: "42 passed, 1 failed: refund.spec.ts …"
text: tóm tắt kết quả và test bị lỗi
```

**Nên:**

- Allow-list theo tiền tố lệnh an toàn (`npm test`, `git status`).
- Đặt timeout cho lệnh chạy lâu.
- Trả output gọn: cắt bớt log quá dài trước khi đưa vào context.

**Tránh:**

- Allow toàn bộ `Bash`.
- Chạy lệnh có tác động ra ngoài (deploy, push, gọi API production) mà không hỏi.

---

### L2. Composite

#### E4. Tìm lệnh bash theo yêu cầu rồi thực thi

**Yêu cầu:** “Tìm và xóa các file log cũ hơn 30 ngày trong `logs/`.”

Đây là mẫu **đề xuất → xem trước → duyệt → thực thi → xác minh**, áp dụng cho mọi lệnh có tác động phá hủy.

| | |
|---|---|
| Scope | Built-in Claude |
| Loại | A2 Harness built-in (Bash) + permission `ask` + hook |
| Bề mặt | Claude Code, Agent SDK |

**Luồng:**

```text
1. Xem trước (chỉ đọc)
   tool_use: Bash {"command": "find logs/ -name '*.log' -mtime +30 -print"}
   tool_result: 128 file, tổng 2,3 GB

2. Đề xuất lệnh thực thi, kèm giải thích
   text: "Lệnh sẽ xóa 128 file ở trên: find logs/ -name '*.log' -mtime +30 -delete"

3. Thực thi, đi qua kiểm soát
   tool_use: Bash {"command": "find logs/ -name '*.log' -mtime +30 -delete"}
   → PreToolUse hook: kiểm tra đường dẫn nằm trong logs/, không chứa ký tự nguy hiểm
   → permission: ask → người dùng duyệt

4. Xác minh
   tool_use: Bash {"command": "find logs/ -name '*.log' -mtime +30 | wc -l"}
   tool_result: 0
```

**Hook minh họa** (PreToolUse, matcher `Bash`): script đọc input JSON từ stdin, chặn nếu lệnh xóa nằm ngoài thư mục cho phép. Hook chặn bằng cách trả quyết định deny hoặc thoát với mã lỗi chặn theo tài liệu hooks; Claude nhận lý do và tự điều chỉnh.

**Nên:**

- Luôn có bước xem trước bằng lệnh chỉ đọc.
- Dùng hook để giới hạn phạm vi đường dẫn, không chỉ dựa vào việc người duyệt đọc kỹ.
- Xác minh kết quả sau khi chạy.

**Tránh:**

- Gộp tìm và xóa vào một lệnh không có bước xem trước.
- Dùng chế độ bỏ qua permission cho tác vụ có xóa dữ liệu.
- Duyệt theo phản xạ: nếu người dùng phải duyệt quá nhiều, cần thu hẹp phạm vi `ask`.

#### E5. Trích xuất dữ liệu có cấu trúc

**Yêu cầu (backend):** “Từ email khách gửi, trích ra mã đơn, loại yêu cầu, mức độ khẩn cấp.”

| | |
|---|---|
| Scope | Custom business |
| Loại | Structured outputs, hoặc C1 Custom tool với `tool_choice` bắt buộc |
| Bề mặt | Messages API |

**Cách 1, structured outputs** (khuyến nghị khi chỉ cần dữ liệu trả về):

```json
{
  "output_config": {
    "format": {
      "type": "json_schema",
      "schema": {
        "type": "object",
        "properties": {
          "ma_don":   { "type": "string" },
          "loai":     { "type": "string", "enum": ["hoan_tien", "doi_hang", "hoi_trang_thai", "khac"] },
          "khan_cap": { "type": "string", "enum": ["thap", "trung_binh", "cao"] }
        },
        "required": ["ma_don", "loai", "khan_cap"],
        "additionalProperties": false
      }
    }
  }
}
```

**Cách 2, ép dùng một tool** (khi đang trong một vòng lặp có nhiều tool khác):

```json
{ "tool_choice": { "type": "tool", "name": "ghi_nhan_yeu_cau" } }
```

**Nên:**

- Dùng `enum` cho mọi giá trị hữu hạn.
- Validate nghiệp vụ sau khi nhận (mã đơn có tồn tại không).

**Tránh:**

- Dặn “chỉ trả JSON” trong prompt rồi parse bằng regex.
- Tin rằng đúng schema nghĩa là đúng nội dung.

#### E6. Gọi nhiều tool song song

**Yêu cầu:** “So sánh trạng thái ba đơn DH-1, DH-2, DH-3.”

| | |
|---|---|
| Scope | Custom business |
| Loại | C1 Custom tool, parallel tool use |
| Bề mặt | Messages API |

**Luồng:**

```text
assistant content:
  tool_use id=a  tra_don {"ma_don": "DH-1"}
  tool_use id=b  tra_don {"ma_don": "DH-2"}
  tool_use id=c  tra_don {"ma_don": "DH-3"}
stop_reason: tool_use

user content (MỘT message, đủ ba kết quả):
  tool_result tool_use_id=a …
  tool_result tool_use_id=b …
  tool_result tool_use_id=c …
```

**Nên:**

- Thực thi song song phía backend nếu tool độc lập và chỉ đọc.
- Trả đủ mọi kết quả trong cùng một message, đúng id.

**Tránh:**

- Gửi từng kết quả trong các message riêng.
- Cho chạy song song các tool ghi có phụ thuộc lẫn nhau; khi đó dùng `disable_parallel_tool_use`.

#### E7. Gọi MCP theo nghiệp vụ

**Yêu cầu (nhân viên support trong Claude Code hoặc claude.ai):** “Tạo ticket Jira cho lỗi giao hàng trễ mà khách vừa báo, gán cho team Logistics, rồi báo vào kênh Slack #support.”

| | |
|---|---|
| Scope | External integration |
| Loại | B1 Connector MCP (Jira, Slack) |
| Bề mặt | claude.ai, Claude Code |

**Luồng:**

```text
tool_use: mcp__jira__create_issue {"project": "LOG", "summary": "Giao trễ đơn DH-1024", "assignee": "logistics"}
   → host gọi tools/call tới Jira MCP server (OAuth của nhân viên)
tool_result: {"key": "LOG-311"}
tool_use: mcp__slack__send_message {"channel": "#support", "text": "Đã tạo LOG-311 cho đơn DH-1024"}
   → permission: ask (gửi tin nhắn là hành động ra bên ngoài)
tool_result: ok
```

**Nên:**

- Dùng OAuth theo từng nhân viên để hành động mang danh tính thật.
- Đặt `ask` cho tool gửi tin nhắn, email ra bên ngoài.
- Chỉ kết nối MCP server từ nguồn tin cậy, vì mô tả tool của server đi thẳng vào context của model.

**Tránh:**

- Dùng chung một tài khoản bot có quyền rộng cho mọi người.
- Bật quá nhiều connector cùng lúc khi không cần, gây phình context và chọn nhầm tool.

#### E8. Custom API tool trong Message rồi backend thực thi

**Yêu cầu (khách hàng trên chatbot của công ty):** “Đơn DH-1024 của tôi đang ở đâu?”

| | |
|---|---|
| Scope | Custom business |
| Loại | C1 Custom tool (hoặc C2 MCP server riêng, backend làm MCP client) |
| Bề mặt | Messages API |

**Luồng:**

```text
Chat backend (biết session: khach_id = K-77)
  → request: tools=[tra_don], messages=[…]
  ◀ tool_use: tra_don {"ma_don": "DH-1024"}
  → backend gọi Order API: GET /orders/DH-1024?owner=K-77     ← lọc theo user Ở API
  ◀ 200 {trang_thai, du_kien, dia_chi, so_dien_thoai}
  → backend che dữ liệu: bỏ số điện thoại, rút gọn địa chỉ
  → tool_result: {"trang_thai": "dang_giao", "du_kien": "14/10"}
  ◀ text: "Đơn của bạn đang được giao, dự kiến ngày 14/10."   stop_reason: end_turn
```

**Nên:**

- Gắn danh tính user từ session vào lời gọi API; không lấy user id từ input của model.
- Che dữ liệu nhạy cảm trước khi trả `tool_result`.
- Trả lỗi nghiệp vụ rõ ràng, ví dụ “Không tìm thấy đơn thuộc tài khoản này”.

**Tránh:**

- Cho model truyền `khach_id` làm tham số tool: prompt injection có thể đổi sang khách khác.
- Trả nguyên bản ghi database vào `tool_result`.

#### E9. Tool lỗi và Claude tự điều chỉnh

**Yêu cầu:** “Hoàn tiền 3 triệu cho đơn DH-1024.”

| | |
|---|---|
| Scope | Custom business |
| Loại | C1 Custom tool với `is_error` |
| Bề mặt | Messages API, Agent SDK |

**Luồng:**

```text
tool_use: tao_hoan_tien {"ma_don": "DH-1024", "so_tien": 3000000}
tool_result (is_error: true):
  "VUOT_HAN_MUC: giá trị đơn là 2.400.000. Số tiền hoàn tối đa bằng giá trị đơn."
tool_use: tao_hoan_tien {"ma_don": "DH-1024", "so_tien": 2400000}
tool_result: {"trang_thai": "cho_duyet", "ma_yeu_cau": "RF-88"}
text: "Yêu cầu hoàn 2.400.000 đã được tạo và đang chờ duyệt."
```

**Nên:**

- Mã lỗi ổn định cùng thông điệp đủ để model hiểu cách sửa.
- Giới hạn số lần thử lại cho cùng một tool.

**Tránh:**

- Ném exception làm sập vòng lặp.
- Lỗi mơ hồ như “Error 500” khiến model đoán mò.

**Yêu cầu (quản lý trong claude.ai hoặc Claude Code):** “Làm báo cáo doanh thu tuần này theo mẫu công ty.”

| | |
|---|---|
| Scope | Custom business |
| Loại | C3 Skill + C2 MCP server riêng + A2/A1 chạy script |
| Bề mặt | claude.ai, Claude Code, Agent SDK |

**Phân vai:**

| Thành phần | Nằm ở | Lý do |
|---|---|---|
| Định nghĩa “doanh thu thuần”, cấu trúc báo cáo | `SKILL.md` | Know-how theo domain |
| Lấy dữ liệu bán hàng | MCP `sales.query` | Auth và phân quyền ở server |
| Tính tăng trưởng, vẽ biểu đồ | `scripts/tinh_toan.py` | Thuần tính toán, tất định |

**Luồng:**

```text
Yêu cầu khớp description → nạp SKILL.md

text: bản nháp báo cáo

```

**Nên:**

- Script chỉ tính toán; hành động có tác động đi qua tool MCP để được nhìn thấy và duyệt.
- Mô tả skill nêu rõ khi nào dùng.

**Tránh:**

- Script tự chứa API key và tự gọi API ghi dữ liệu.
- Business rule chỉ nằm trong `SKILL.md`.

### L4. Workflow

#### E11. Agent hỗ trợ hoàn tiền end-to-end

**Bối cảnh:** chatbot cho khách hàng, có quyền tạo hoàn tiền.

| | |
|---|---|
| Scope | Custom business |
| Loại | C1/C2 qua backend làm MCP client + structured outputs + người duyệt |
| Bề mặt | Messages API hoặc Agent SDK |

**Kiến trúc:**

```text
                      ┌─▶ Claude Code / claude.ai   ← nhân viên (MCP qua host)
Business API ◀─ MCP ──┤
 (authz, rule,        └─▶ Chat backend làm MCP client ← khách hàng
  idempotency)              session user, che dữ liệu, người duyệt, trần số bước
```

**Luồng:**

```text
1. Khách: "Đơn DH-1024 giao trễ 5 ngày, tôi muốn hoàn tiền."
2. tool_use: tra_don                    → allow                   (đọc)
3. tool_use: kiem_tra_chinh_sach        → allow                   (đọc)
4. Claude trả dữ liệu có cấu trúc: {hanh_dong: "hoan_tien", so_tien: 2400000, ly_do: "giao_tre"}
5. Backend validate nghiệp vụ:
     ≤ 500.000             → tự tạo hoàn tiền
     > 500.000             → tạo yêu cầu chờ duyệt, dừng vòng lặp
     đơn đã hoàn trước đó  → từ chối, trả lý do cho Claude
6. tool_use: tao_hoan_tien (idempotency_key = phiên + mã đơn) → API trả "cho_duyet"
7. Giữa chừng gặp lỗi 529 → backend thử lại có giãn cách, khách không thấy lỗi
8. text (streaming): "Yêu cầu hoàn tiền đã được ghi nhận, bạn sẽ nhận phản hồi trong 24 giờ."
9. Nhân viên duyệt trên hệ thống nội bộ → API thực hiện hoàn tiền → thông báo cho khách
```

**Nên:**

- Ngưỡng và quy tắc nằm ở API; backend chỉ là lớp kiểm tra sớm để cho trải nghiệm tốt hơn.
- Idempotency key cho mọi tool ghi.
- Log `request-id`, `usage`, user, tool call cho từng bước.

**Tránh:**

- Dùng MCP connector với một token hệ thống chung cho chatbot khách hàng.
- Để model tự quyết số tiền hoàn mà không có kiểm tra phía code.

#### E12. Xử lý dữ liệu lớn bằng code execution với MCP

**Yêu cầu:** “Trong 50.000 giao dịch tháng này, tìm các giao dịch bất thường và tóm tắt.”

| | |
|---|---|
| Scope | Custom business |
| Loại | MCP được gọi từ code (cách 4 ở mục 5.3) |
| Bề mặt | Môi trường có code execution và MCP client |

**Ý tưởng:**

```text
Không nên:  tool_use lấy 50.000 dòng → toàn bộ đi vào context → model tự đọc
Nên:        Claude viết code:
              rows = sales.query(thang="2026-09")      # gọi MCP trong môi trường chạy code
              bat_thuong = loc_bat_thuong(rows)        # lọc trong code
              print(tom_tat(bat_thuong[:50]))          # chỉ phần nhỏ quay về model
```

**Nên:**

- Lọc và tổng hợp trong môi trường chạy code, chỉ đưa kết quả gọn về model.
- Giữ dữ liệu nhạy cảm trong môi trường thực thi.

**Tránh:**

- Đưa toàn bộ dữ liệu thô vào context.
- Quên rằng hook ở tầng agent chỉ thấy một lần chạy code, không thấy từng lời gọi MCP bên trong: quyền phải được kiểm soát ở MCP server.

## 8. Best practice và bad practice tổng hợp

### 8.1 Thiết kế tool

| Nên | Tránh |
|---|---|
| Tên động từ + danh từ rõ nghĩa: `tra_don`, `tao_hoan_tien` | Tên chung chung: `process`, `handle` |
| Mô tả nói rõ khi nào dùng và khi nào không | Mô tả một dòng, không có ngữ cảnh |
| Schema chặt: `enum`, `required`, `additionalProperties: false`, bật `strict` | Tham số string tự do cho mọi thứ |
| Một tool một việc; tách đọc và ghi | Tool vạn năng: “chạy SQL”, “gọi API bất kỳ” |
| Kết quả gọn, chỉ trường cần thiết | Trả nguyên bản ghi hoặc log hàng nghìn dòng |

### 8.2 Thực thi và vòng lặp

| Nên | Tránh |
|---|---|
| Kiểm tra `stop_reason` mọi lượt, có nhánh cho giá trị lạ | Chỉ kiểm tra `tool_use` |
| Trả đủ `tool_result` khớp id, gom kết quả song song vào một message | Bỏ sót hoặc tách rời kết quả |
| Trần số bước, timeout cho từng tool | Vòng lặp không giới hạn |
| Lỗi có cấu trúc với `is_error` | Exception làm sập vòng lặp |
| Idempotency key cho tool ghi | Thử lại tạo hành động trùng |

### 8.3 Bảo mật

| Nên | Tránh |
|---|---|
| Danh tính user lấy từ session, không từ input model | Cho model truyền `user_id` |
| Rule bắt buộc ở API; hook là lớp thêm | Rule chỉ nằm trong prompt hoặc skill |
| Che dữ liệu nhạy cảm trước khi trả kết quả | Trả số thẻ, CMND, secret vào context |
| Chỉ kết nối MCP server và cài skill từ nguồn tin cậy, review script | Cài skill hoặc MCP lạ mà không review |
| Coi nội dung web, email, tài liệu là dữ liệu | Để nội dung bên ngoài điều khiển quyền ghi |

### 8.4 Vận hành

| Nên | Tránh |
|---|---|
| Log `request-id`, user, tool, input đã che, kết quả | Chỉ log câu trả lời cuối |
| Đo tỷ lệ chọn đúng tool, tỷ lệ lỗi tool, số bước trung bình | Không có số liệu về hành vi agent |
| Version định nghĩa tool, ma trận quyền, hook như code | Sửa trực tiếp trên production |
| Theo dõi số tool đang nạp vào context | Thêm tool liên tục không đánh giá |

## 9. Hướng dẫn chọn cơ chế

```text
Cần năng lực chung (tìm web, chạy code)?
 └─ Có → A1 Server tool

Làm việc với file, lệnh trong môi trường dev?
 └─ Có → A2 Claude Code / Agent SDK built-in

Cần kết nối dịch vụ bên thứ ba phổ biến (Slack, Jira, Drive)?
 └─ Có → B1 Connector MCP

Cần đưa năng lực của hệ thống nội bộ cho agent?
 ├─ Nhiều client dùng chung (nhân viên, nhiều app)  → C2 MCP server riêng
 ├─ Chỉ một app, cần kiểm soát chặt từng user     → C1 Custom tool
 └─ Cả hai                                         → C2, và app khách hàng làm MCP client (C2 + vòng lặp ở backend)

Cần đóng gói cách làm, quy trình, tiêu chuẩn?
 └─ Có → C3 Skill (kết hợp với tool ở trên để thực hiện)

Cần quy tắc bắt buộc tuân thủ?
 └─ Có → Business API, cộng thêm hook ở harness
```

| Tình huống | Lựa chọn |
|---|---|
| Chatbot khách hàng, có dữ liệu cá nhân và hành động tốn tiền | C1, hoặc C2 với backend làm MCP client |
| Nhân viên tra cứu, thao tác hệ thống nội bộ | C2 qua Claude Code hoặc claude.ai |
| Prototype nhanh, rủi ro thấp | C2 qua MCP connector trong Messages API |
| Xử lý dữ liệu lớn | MCP gọi từ code (code execution with MCP) |
| Chuẩn hóa cách làm việc của team | C3 Skill |

## 10. Checklist triển khai

**Thiết kế**

- [ ] Mỗi tool có tên rõ nghĩa, mô tả nêu khi nào dùng, schema chặt với `strict`.
- [ ] Đọc và ghi được tách thành tool riêng.
- [ ] Có ma trận allow / ask / deny cho toàn bộ tool.
- [ ] Business rule bắt buộc nằm ở API, không chỉ ở prompt, skill hoặc hook.

**Vòng lặp**

- [ ] Mỗi `tool_use` có đúng một `tool_result` khớp id; kết quả song song gom một message.
- [ ] Có trần số bước và timeout.
- [ ] Lỗi tool trả về có cấu trúc với `is_error`.

**Bảo mật**

- [ ] Danh tính user lấy từ session; API lọc dữ liệu theo user.
- [ ] Tool ghi có idempotency key và ngưỡng duyệt.
- [ ] Dữ liệu nhạy cảm được che trước khi vào context.
- [ ] Credential theo agent và theo user, phạm vi hẹp.
- [ ] MCP server và skill bên ngoài đã được review.
- [ ] Đã thử prompt injection qua nội dung bên ngoài (web, email, ticket).

**Vận hành**

- [ ] Log `request-id`, user, tool, input đã che, kết quả cho từng bước.
- [ ] Có số liệu: tỷ lệ chọn đúng tool, tỷ lệ lỗi, số bước trung bình, chi phí mỗi tác vụ.
- [ ] Định nghĩa tool, quyền và hook được version và review như code.
- [ ] Đã test ba đường đi vòng (tool, script gọi API, script gọi MCP) đều bị chặn ở API khi vi phạm rule.

## 11. Thuật ngữ

| Thuật ngữ | Giải thích |
|---|---|
| **Tool** | Chức năng Claude được phép đề xuất sử dụng, mô tả bằng tên, mô tả và JSON Schema |
| **Tool call** | Việc Claude trả về khối `tool_use` yêu cầu chạy một tool với input cụ thể |
| **Harness** | Chương trình bao quanh model: giữ vòng lặp, thực thi tool, áp quyền |
| **Server tool** | Tool do Anthropic thực thi (tìm web, chạy code) |
| **Client tool** | Tool do ứng dụng của bạn thực thi |
| **MCP** | Model Context Protocol, giao thức mở để expose tool, resource, prompt |
| **MCP connector** | Tính năng của Messages API cho phép Anthropic gọi trực tiếp MCP server từ xa |
| **Skill** | Thư mục chứa `SKILL.md` và tài nguyên kèm theo, dạy agent cách làm một việc |
| **Progressive disclosure** | Nạp thông tin theo tầng, chỉ khi cần |
| **Hook** | Code tất định chạy tại điểm cố định trong vòng lặp, ví dụ trước mỗi tool call |
| **Permission** | Quy tắc allow / ask / deny cho từng tool hoặc mẫu lệnh |
| **Agent SDK** | Thư viện chạy vòng lặp agent của Claude Code trong ứng dụng của bạn |
| **Idempotency** | Thiết kế để một hành động chạy lại nhiều lần chỉ có tác dụng một lần |
| **Prompt injection** | Nội dung bên ngoài cố tình chứa chỉ dẫn để điều khiển model |
| **Tool poisoning** | Chỉ dẫn độc hại được cài trong mô tả tool của một MCP server |

    }
    if (l.startsWith("|")) {

      while (i < lines.length && lines[i].startsWith("|")) rows.push(splitRow(lines[i++]));
      blocks.push({ type: "table", head: rows[0], rows: rows.slice(2) }); continue;
    }
    if (/^\s*- \[( |x)\] /.test(l)) {
      const items = [];
      while (i < lines.length && /^\s*- \[( |x)\] /.test(lines[i])) items.push(lines[i++].replace(/^\s*- \[( |x)\] /, ""));
      blocks.push({ type: "tasks", items }); continue;
    }
    if (/^\s*- /.test(l)) {
      const items = [];
      while (i < lines.length && /^\s*- /.test(lines[i]) && !/^\s*- \[( |x)\] /.test(lines[i])) items.push(lines[i++].replace(/^\s*- /, ""));
      blocks.push({ type: "ul", items }); continue;
    }
    if (/^\d+\.\s/.test(l)) {
      const items = [];
      while (i < lines.length && /^\d+\.\s/.test(lines[i])) items.push(lines[i++].replace(/^\d+\.\s/, ""));
      blocks.push({ type: "ol", items }); continue;
    }
    const buf = [lines[i++].trim()];
    while (i < lines.length && lines[i].trim() && !isStart(lines[i])) buf.push(lines[i++].trim());
    blocks.push({ type: "p", text: buf.join(" ") });
  }
  return blocks;
}

  let value = initial; const subs = new Set();

    get: () => value,
    set(next) {

      if (Object.is(v, value)) return;
      value = v; subs.forEach(fn => fn(value));
    },
    sub(fn) { subs.add(fn); fn(value); return () => subs.delete(fn); }
  };
}

    }</div></div>`).join("")}</div>`, "Bốn cấp độ ví dụ. Chạm vào E1 đến E13 để tới ví dụ."),
  decision: () => Figure(`<div class="dec">${VIEW.decision.map(([q, a, k]) => `<div class="dec-row"><div class="q">${esc(q)}</div><div class="ar" aria-hidden="true">→</div><div class="a${k ? " rule" : ""}">${esc(a)}</div></div>`).join("")}</div>`,
    "Chọn theo việc bạn cần đưa cho agent, không theo cơ chế nào mạnh hơn."),
  progress: () => `<div class="progress"><span id="ck-count"></span><div class="meter"><i id="ck-bar" style="width:0"></i></div></div>
    <p class="muted">Đánh dấu để tự rà soát. Trạng thái chỉ tồn tại trong lần xem này.</p>`
};

/* ============================== 5. BUSINESS COMPONENTS ============================== */
function splitNum(text) {
  const m = plain(text).match(/^([A-Z]?\d+(?:\.\d+)?)\.?\s+(.*)$/);
  return m ? { n: m[1], label: m[2] } : { n: "", label: plain(text) };
}

function Nav() {
  let html = "", inSkip = false, inExamples = false;
  DOC.outline.forEach(h => {
    if (h.level === 2) { inSkip = h.id === VIEW.skipSection; inExamples = /^7\./.test(h.text); }
    if (inSkip) return;
    const { n, label } = splitNum(h.text);
    const link = cls => `<a href="#${h.id}" class="${cls}" data-action="goto" data-target="${h.id}" data-nav="${h.id}"><span class="num">${esc(n)}</span><span>${esc(label)}</span></a>`;
    if (h.level === 2) html += (html ? "" : "") + link("top");
    else if (h.level === 3 && !inExamples && n) html += link("sub");
    else if (h.level === 4 && inExamples && /^E\d+/.test(n)) html += link("sub");
  });
  return html;
}

function Hero(blocks) {
  const h1 = blocks.find(b => b.type === "heading" && b.level === 1);
  const quote = blocks.find(b => b.type === "quote");
  return `<header id="top">
    <h1>${inline(h1.text)}</h1>
    <div class="intro-box">${quote.paras.map(P).join("")}</div>
    <p class="statement">${esc(VIEW.statement)}</p>
    ${Visuals.anatomy()}
    <p class="stack-note">Ba mảnh của mọi tool call, dù tool nằm ở Anthropic, trong Claude Code, trên MCP server hay trong backend của bạn.</p>
  </header>`;
}

function DocumentView() {
  const blocks = DOC.blocks;
  const start = blocks.findIndex(b => b.type === "heading" && b.level === 2);
  let out = Hero(blocks.slice(0, start));
  let sectionOpen = false, cardOpen = false, skipping = false;
  let lastId = "", level = "", nextList = "";
  const used = new Set();
  const closeCard = () => { if (cardOpen) { out += "</article>"; cardOpen = false; } };
  const closeSection = () => { closeCard(); if (sectionOpen) { out += "</section>"; sectionOpen = false; } };

  for (const b of blocks.slice(start)) {
    if (b.type === "heading") {
      if (b.level === 2) {
        closeSection();
        skipping = b.id === VIEW.skipSection;
        if (skipping) continue;
        out += `<section id="${b.id}"><h2 class="sec">${inline(b.text)}</h2>`; sectionOpen = true;
      } else if (skipping) { continue; }
      else if (b.level === 3) {
        closeCard();
        const lv = b.text.match(/^(L\d)\./);
        if (lv) { level = lv[1]; out += `<h3 class="level-h lv-${level}" id="${b.id}">${inline(b.text)}</h3>`; }
        else out += `<h3 class="h3" id="${b.id}">${inline(b.text)}</h3>`;
      } else if (b.level === 4 && /^E\d+\./.test(b.text)) {
        closeCard();
        out += `<article class="example lv-${level}" id="${b.id}"><h4><span class="badge">${level}</span>${inline(b.text)}</h4>`; cardOpen = true;
      } else {
        out += `<h${b.level} id="${b.id}">${inline(b.text)}</h${b.level}>`;
      }
      lastId = b.id;
      if (VIEW.inject[b.id]) out += Visuals[VIEW.inject[b.id]]();
      continue;
    }
    if (skipping || b.type === "hr") continue;

    const rep = VIEW.replace[lastId];
    if (rep && rep.type === b.type && !used.has(lastId)) {
      used.add(lastId);
      out += Visuals[rep.visual]() + (b.type === "code" ? AsciiToggle(b.text) : "");
      continue;
    }
    if (b.type === "p") {
      if (b.text === "**Nên:**") { out += `<p class="lbl do">Nên</p>`; nextList = "do"; continue; }
      if (b.text === "**Tránh:**") { out += `<p class="lbl dont">Tránh</p>`; nextList = "dont"; continue; }
      out += P(b.text);
    } else if (b.type === "ul") { out += List("ul", b.items, nextList); nextList = ""; }
    else if (b.type === "ol") out += List("ol", b.items);
    else if (b.type === "tasks") out += Tasks(b);
    else if (b.type === "table") out += Table(b);
    else if (b.type === "code") out += Code(b);
    else if (b.type === "quote") out += Quote(b);
  }
  closeSection();
  return out;
}

/* ============================== 6. WORKFLOWS + EVENTS ============================== */
const $ = s => document.querySelector(s);
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
    ta.remove(); return ok;
  }
}
const actions = {
  setTab(tab) { state.tab.set(tab); window.scrollTo({ top: 0 }); },
  toggleNav() { state.navOpen.set(v => !v); },
  closeNav() { state.navOpen.set(false); },
  goto(id) {
    if (!id) return;
    if (state.tab.get() !== "doc") state.tab.set("doc");
    const el = document.getElementById(id);
    if (!el) return;
    if (!isWide()) state.navOpen.set(false);
    el.scrollIntoView({ block: "start" });
    history.replaceState(null, "", "#" + encodeURIComponent(id));
    state.active.set(id);
  },
  toggleCheck(i, on) { state.checks.set(list => on ? [...new Set([...list, i])] : list.filter(x => x !== i)); },
  async copyMarkdown() { actions.notify(await copyText(SOURCE) ? "Đã sao chép Markdown" : "Không sao chép được. Hãy chọn toàn bộ và sao chép thủ công."); },
  async copyCode(i) { actions.notify(await copyText(CODE_STORE[i]) ? "Đã sao chép đoạn code" : "Không sao chép được"); },
  downloadMarkdown() {
    try {
      const blob = new Blob([SOURCE], { type: "text/markdown;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = META.file;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      actions.notify("Đã tải file .md");
    } catch (e) { actions.notify("Không tải được file. Hãy dùng nút Sao chép Markdown."); }
  },
  notify(msg) { state.toast.set(msg); clearTimeout(actions._t); actions._t = setTimeout(() => state.toast.set(""), 2200); }
};

function bindEvents() {
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-action]");
    if (!t) return;
    const a = t.dataset.action;
    if (a === "check") return;
    if (a === "goto") { e.preventDefault(); actions.goto(t.dataset.target); }
    else if (a === "tab") actions.setTab(t.dataset.tab);
    else if (a === "toggle-nav") actions.toggleNav();
    else if (a === "close-nav") actions.closeNav();
    else if (a === "copy-md") actions.copyMarkdown();
    else if (a === "copy-code") actions.copyCode(Number(t.dataset.index));
    else if (a === "download-md") actions.downloadMarkdown();
  });
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset && t.dataset.action === "check") actions.toggleCheck(Number(t.dataset.index), t.checked);
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !isWide() && state.navOpen.get()) actions.closeNav();
    if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && e.target.getAttribute("role") === "tab") {
      const next = state.tab.get() === "doc" ? "md" : "doc";
      actions.setTab(next); document.getElementById("tab-" + next).focus();
    }
  });
  window.matchMedia("(min-width: 960px)").addEventListener("change", ev => state.navOpen.set(ev.matches));
  const navIds = new Set([...document.querySelectorAll(".nav a")].map(a => a.dataset.nav));
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting && navIds.has(en.target.id)) state.active.set(en.target.id); });
  }, { rootMargin: "-15% 0px -75% 0px" });
  document.querySelectorAll("#doc [id]").forEach(el => { if (navIds.has(el.id)) io.observe(el); });
}

function bindState() {
  state.tab.sub(tab => {
    ["doc", "md"].forEach(k => {
      const on = k === tab;
      $("#panel-" + k).hidden = !on;
      const b = $("#tab-" + k); b.setAttribute("aria-selected", String(on)); b.tabIndex = on ? 0 : -1;
    });
  });
  state.navOpen.sub(open => {
    document.body.classList.toggle("nav-open", open && !isWide());
    document.body.classList.toggle("nav-collapsed", !open && isWide());
    document.querySelector('[data-action="toggle-nav"]').setAttribute("aria-expanded", String(open));
  });
  state.active.sub(id => {
    document.querySelectorAll(".nav a").forEach(a => {
      const on = a.dataset.nav === id;
      a.classList.toggle("is-active", on);
      if (on) { a.setAttribute("aria-current", "location"); if (a.scrollIntoView && isWide()) a.scrollIntoView({ block: "nearest" }); }
      else a.removeAttribute("aria-current");
    });
  });
  state.checks.sub(list => {
    const total = TASK_COUNT || 1;
    const c = $("#ck-count"), bar = $("#ck-bar");
    if (c) c.textContent = `${list.length}/${TASK_COUNT} mục`;
    if (bar) bar.style.width = (list.length / total * 100) + "%";
    document.querySelectorAll(".checks li").forEach(li => li.classList.toggle("done", list.includes(Number(li.dataset.ck))));
  });
  state.toast.sub(msg => { const t = $("#toast"); t.textContent = msg; t.classList.toggle("show", !!msg); });
}

/* ============================== 7. BOOT ============================== */
(function boot() {
  $("#brand").textContent = META.brand;
  $("#nav").innerHTML = Nav();
  $("#doc").innerHTML = DocumentView();
  $("#md-out").value = SOURCE;
  $("#md-stats").textContent = `${SOURCE.split("\n").length} dòng, ${SOURCE.length.toLocaleString("vi-VN")} ký tự. Bản HTML được dựng từ chính nội dung Markdown này.`;
  bindState();
  bindEvents();
  const hash = decodeURIComponent(location.hash.slice(1));
  if (hash && document.getElementById(hash)) setTimeout(() => actions.goto(hash), 0);
})();
</script>
