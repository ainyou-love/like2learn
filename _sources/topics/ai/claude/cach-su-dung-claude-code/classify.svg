  <text class="t t-b" x="320" y="55" text-anchor="middle">Skill đó CÒN NGHĨA không?</text>
  <path class="w" d="M320 70 L320 98 M320 98 L165 98 L165 126 M320 98 L475 98 L475 126"/>
  <text class="t-s" x="240" y="92" text-anchor="middle">CÒN</text>
  <text class="t-s" x="404" y="92" text-anchor="middle">KHÔNG CÒN</text>
  <polygon points="165,134 160,124 170,124" fill="var(--ink-3)"/>
  <polygon points="475,134 470,124 480,124" fill="var(--ink-3)"/>
