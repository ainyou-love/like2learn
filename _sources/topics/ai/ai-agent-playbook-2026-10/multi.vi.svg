<svg viewBox="0 0 680 360" role="img" aria-labelledby="pb-multi-t"><title id="pb-multi-t">Read-parallel và write-parallel</title><desc>Trái: các lượt tìm chỉ đọc gộp lại không xung đột. Phải: các bên ghi song song tự đưa ra lựa chọn phong cách ngầm, và chúng va nhau khi merge.</desc><defs><marker id="pb-multi-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9z" fill="var(--ink-3)"/></marker></defs><rect class="band" x="30" y="10" width="300" height="330" rx="12"/><text class="t-s" x="180" y="34" text-anchor="middle">Read-parallel: chạy tốt</text><rect class="band" x="350" y="10" width="300" height="330" rx="12"/><text class="t-s" x="500" y="34" text-anchor="middle">Write-parallel: hỏng</text><rect class="n-new" x="100" y="52" width="160" height="44" rx="8"/><text class="t t-b" x="180" y="74" text-anchor="middle" dominant-baseline="central">Agent chính</text><rect class="n-new" x="45" y="140" width="80" height="44" rx="8"/><text class="t t-b" x="85" y="162" text-anchor="middle" dominant-baseline="central">Tìm A</text><rect class="n-new" x="140" y="140" width="80" height="44" rx="8"/><text class="t t-b" x="180" y="162" text-anchor="middle" dominant-baseline="central">Tìm B</text><rect class="n-new" x="235" y="140" width="80" height="44" rx="8"/><text class="t t-b" x="275" y="162" text-anchor="middle" dominant-baseline="central">Tìm C</text><line class="w" x1="160" y1="96" x2="95" y2="138" marker-end="url(#pb-multi-ah)"/><line class="w" x1="180" y1="96" x2="180" y2="138" marker-end="url(#pb-multi-ah)"/><line class="w" x1="200" y1="96" x2="265" y2="138" marker-end="url(#pb-multi-ah)"/><line class="w" x1="95" y1="184" x2="140" y2="242" marker-end="url(#pb-multi-ah)"/><line class="w" x1="180" y1="184" x2="180" y2="242" marker-end="url(#pb-multi-ah)"/><line class="w" x1="265" y1="184" x2="220" y2="242" marker-end="url(#pb-multi-ah)"/><rect class="n-ok" x="75" y="244" width="210" height="56" rx="8"/><text class="t t-b" x="180" y="263" text-anchor="middle" dominant-baseline="central">Tổng hợp</text><text class="t-s" x="180" y="282" text-anchor="middle" dominant-baseline="central">Bản tóm tắt, không xung đột</text><rect class="n-new" x="420" y="52" width="160" height="44" rx="8"/><text class="t t-b" x="500" y="74" text-anchor="middle" dominant-baseline="central">Agent chính</text><rect class="n-new" x="370" y="140" width="120" height="44" rx="8"/><text class="t t-b" x="430" y="162" text-anchor="middle" dominant-baseline="central">Hình nền</text><rect class="n-new" x="510" y="140" width="120" height="44" rx="8"/><text class="t t-b" x="570" y="162" text-anchor="middle" dominant-baseline="central">Sprite chim</text><line class="w" x1="480" y1="96" x2="435" y2="138" marker-end="url(#pb-multi-ah)"/><line class="w" x1="520" y1="96" x2="565" y2="138" marker-end="url(#pb-multi-ah)"/><line class="w" x1="435" y1="184" x2="470" y2="242" marker-end="url(#pb-multi-ah)"/><line class="w" x1="565" y1="184" x2="530" y2="242" marker-end="url(#pb-multi-ah)"/><rect class="n-bad" x="395" y="244" width="210" height="56" rx="8"/><text class="t t-b" x="500" y="263" text-anchor="middle" dominant-baseline="central">Merge thất bại</text><text class="t-s" x="500" y="282" text-anchor="middle" dominant-baseline="central">Lựa chọn ngầm lệch nhau</text></svg>
