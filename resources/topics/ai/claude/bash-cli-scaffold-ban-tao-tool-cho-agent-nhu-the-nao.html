<style>/* Palette. Two families with clearly different jobs: a serif carries the
   argument, a monospace carries anything the machine would print --
   filenames, flags, JSON. On a page about shell tools that pairing is the
   subject, not decoration.

   Three role colours, and they mean exactly one thing each:
     --front  paid for on every turn / runs directly
     --ref    read only on demand / only ever sourced
     --tpl    material you copy and commit
   Anything absent by design or generated per machine is drawn faint and
   dashed instead of coloured, so nothing depends on colour alone. */
:root{
  --ground:#F2F3F1; --surface:#FFFFFF; --panel:#E8EAE6; --line:#D1D6CE; --line-soft:#E1E4DE;
  --ink:#15181A; --muted:#565B58; --faint:#848A86;
  --trace:#1F5E4E; --trace-soft:#DEEAE5;
  --front:#96560F; --ref:#2A5C79; --tpl:#1F5E4E;
  --est:#1F5E4E;  --hyp:#96560F;  --unv:#565B58;  --asm:#6B4A83;
  --alarm:#8E3024; --alarm-soft:#F6E4E1;
  --serif:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#101311; --surface:#181C19; --panel:#1F2420; --line:#2E3430; --line-soft:#242A26;
  --ink:#E6E9E4; --muted:#9BA29C; --faint:#7B827C;
  --trace:#6FBFA2; --trace-soft:#142622;
  --front:#DFA45E; --ref:#79B4D4; --tpl:#6FBFA2;
  --est:#6FBFA2;  --hyp:#DFA45E;  --unv:#9BA29C;  --asm:#BC9AD4;
  --alarm:#E28C80; --alarm-soft:#2A1A17;
}}
:root[data-theme="dark"]{
  --ground:#101311; --surface:#181C19; --panel:#1F2420; --line:#2E3430; --line-soft:#242A26;
  --ink:#E6E9E4; --muted:#9BA29C; --faint:#7B827C;
  --trace:#6FBFA2; --trace-soft:#142622;
  --front:#DFA45E; --ref:#79B4D4; --tpl:#6FBFA2;
  --est:#6FBFA2;  --hyp:#DFA45E;  --unv:#9BA29C;  --asm:#BC9AD4;
  --alarm:#E28C80; --alarm-soft:#2A1A17;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--serif);
  font-size:17.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--trace);outline-offset:3px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;scroll-behavior:auto}}

/* ── top bar ─────────────────────────────────────────────── */
.bar{position:sticky;top:0;z-index:40;background:var(--ground);
  border-bottom:1px solid var(--line);
  padding:9px 18px;padding-top:calc(9px + env(safe-area-inset-top,0px));
  display:flex;gap:10px;align-items:center}
.bar .sp{flex:1}
button{font-family:var(--mono);font-size:12px;letter-spacing:.03em;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:3px;padding:7px 12px;transition:color .12s,border-color .12s}
button:hover{color:var(--ink);border-color:var(--trace)}
button[aria-pressed="true"]{color:var(--ground);background:var(--trace);border-color:var(--trace)}
#navbtn{display:inline-flex}
@media (min-width:1180px){#navbtn{display:none}}

/* ── drawer ──────────────────────────────────────────────── */
#nav{position:fixed;z-index:50;top:0;left:0;width:290px;height:100dvh;overflow-y:auto;
  background:var(--surface);border-right:1px solid var(--line);
  padding:22px 16px calc(22px + env(safe-area-inset-bottom,0px));
  transform:translateX(-100%);transition:transform .2s}
#nav.open{transform:none}
#scrim{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.42)}
@media (min-width:1180px){
  #nav{transform:none;border-right:1px solid var(--line-soft);background:transparent}
  #scrim{display:none}
  body{padding-left:290px}
  .bar{padding-left:26px}
}
#nav .navhead{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);margin:0 0 12px;padding-left:11px}
#toc a{display:block;text-decoration:none;color:var(--muted);font-size:13.5px;line-height:1.42;
  padding:6px 0 6px 11px;border-left:2px solid var(--line-soft)}
#toc a:hover{color:var(--ink);border-left-color:var(--trace)}
#toc a.lv3{padding-left:22px;font-size:12.5px;color:var(--faint)}
#toc a.on{color:var(--ink);border-left-color:var(--trace);font-weight:600}
#toc a.part{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink);margin-top:16px;border-left-color:var(--trace)}
#toc a.part:first-child{margin-top:0}

/* ── page ────────────────────────────────────────────────── */
.wrap{max-width:820px;margin:0 auto;padding:0 20px 90px}
.hero{padding:52px 0 26px;border-bottom:1px solid var(--line)}
.kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;
  color:var(--trace);margin:0 0 16px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(30px,6vw,46px);line-height:1.1;
  letter-spacing:-.015em;margin:0 0 20px;text-wrap:balance}
.lede p{font-size:clamp(17px,2.2vw,19.5px);color:var(--muted);margin:0 0 13px;max-width:64ch}
h2,h3,h4{scroll-margin-top:78px}
h2{font-family:var(--serif);font-weight:600;font-size:clamp(23px,4vw,31px);line-height:1.2;
  letter-spacing:-.012em;margin:54px 0 18px;text-wrap:balance}
h2 .eyebrow{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--trace);font-weight:400;margin-bottom:11px;letter-spacing:.16em}
h3{font-family:var(--serif);font-weight:600;font-size:20.5px;margin:38px 0 12px}
h4{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);margin:28px 0 10px}
p{margin:0 0 17px;max-width:66ch}
ul,ol{margin:0 0 18px;padding-left:22px;max-width:66ch}
li{margin-bottom:8px}
li::marker{color:var(--trace)}
strong{font-weight:600}
blockquote{margin:0 0 20px;padding:2px 0 2px 18px;border-left:2px solid var(--trace);
  color:var(--muted);max-width:64ch}
blockquote p:last-child{margin-bottom:0}
hr{border:0;border-top:1px solid var(--line);margin:46px 0}
code{font-family:var(--mono);font-size:.845em;background:var(--panel);
  border-radius:2px;padding:1.5px 5px;color:var(--ink);overflow-wrap:break-word}
.pre{overflow-x:auto;margin:0 0 22px;background:var(--panel);border-radius:3px;
  border-left:2px solid var(--line)}
.pre pre{margin:0;padding:15px 17px;font-family:var(--mono);font-size:12.5px;line-height:1.55}
.pre code{background:none;padding:0;border-radius:0;font-size:inherit}
.tw{overflow-x:auto;margin:0 0 24px;border:1px solid var(--line);border-radius:3px;
  background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:400px}
th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);text-align:left;font-weight:500;padding:10px 13px;
  border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
td{padding:10px 13px;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.55}
tr:last-child td{border-bottom:0}

/* ── figures ─────────────────────────────────────────────── */
figure{margin:0 0 28px}
.fig{border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:20px 18px}
figcaption{font-size:13.5px;color:var(--muted);margin-top:11px;max-width:64ch;line-height:1.6}
.fmono{font-family:var(--mono)}


/* Colour carries one distinction and only one: WHEN a thing is read, or
   WHO may run it. Amber = paid for on every turn / runs directly.
   Slate = read on demand / only ever sourced. Pine = material, committed.
   Dashed + faint = absent on purpose, or generated per machine. */

/* trees */
.trees{display:grid;gap:18px}
.tr-box{border:1px solid var(--line);border-radius:3px;overflow:hidden}
.tr-head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;
  padding:10px 13px;background:var(--panel);border-bottom:1px solid var(--line)}
.tr-head b{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--ink)}
.tr-head span{font-size:12px;color:var(--faint)}
.tr-rows{display:grid}
.tr-row{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:6px 14px;
  align-items:baseline;padding:7px 13px 7px 11px;border-bottom:1px solid var(--line-soft);
  border-left:2px solid transparent}
.tr-row:last-child{border-bottom:0}
.tr-row code{background:none;padding:0;font-size:12.5px;color:var(--ink);white-space:nowrap}
.tr-row span{font-size:13px;color:var(--muted);line-height:1.5}
.tr-row.d1 code{padding-left:16px;color:var(--muted)}
.tr-row.k-front,.tr-row.k-run{border-left-color:var(--front)}
.tr-row.k-front code,.tr-row.k-run code{color:var(--front)}
.tr-row.k-ref,.tr-row.k-lib{border-left-color:var(--ref)}
.tr-row.k-ref.d0 code,.tr-row.k-lib.d0 code{color:var(--ref)}
.tr-row.k-tpl,.tr-row.k-keep{border-left-color:var(--tpl)}
.tr-row.k-tpl.d0 code,.tr-row.k-keep.d0 code{color:var(--tpl)}
.tr-row.k-gone,.tr-row.k-gen{border-left:2px dashed var(--line);background:var(--panel)}
.tr-row.k-gone code,.tr-row.k-gen code{color:var(--faint)}
.tr-row.k-gone span,.tr-row.k-gen span{color:var(--faint)}
@media (max-width:560px){
  .tr-row{grid-template-columns:1fr}
  .tr-row code{white-space:normal;overflow-wrap:break-word}
}

/* flow */
.flow{display:grid;gap:2px}
.fl-step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;
  padding:11px 0;border-bottom:1px solid var(--line-soft)}
.fl-step:last-child{border-bottom:0}
.fl-step>b{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ground);
  background:var(--trace);width:22px;height:22px;border-radius:3px;
  display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.fl-body{display:grid;gap:3px}
.fl-body strong{font-size:14.5px;font-weight:600}
.fl-body span{font-size:13.5px;color:var(--muted);line-height:1.55}
.fl-note{margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft);
  font-size:12.5px;color:var(--muted)}

/* swap */
.sw-head{display:none}
@media (min-width:640px){
  .sw-head{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;
    font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--faint);padding:0 0 8px;border-bottom:1px solid var(--line-soft);margin-bottom:4px}
  .sw-head span:last-child{grid-column:3}
}
.swap{display:grid;gap:2px}
.sw-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;
  align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.sw-row:last-child{border-bottom:0}
.sw-row code{background:none;padding:0;font-size:12.5px;overflow-wrap:break-word}
.sw-row .sw-a{color:var(--muted)}
.sw-row .sw-b{color:var(--tpl);font-weight:500}
.sw-row i{font-style:normal;color:var(--faint);font-size:14px}
.sw-row span{grid-column:1/-1;font-size:12.5px;color:var(--faint);line-height:1.5}
@media (max-width:639px){
  .sw-row{grid-template-columns:auto minmax(0,1fr)}
  .sw-row .sw-a{grid-column:1/-1}
}

/* levels */
.lvl{margin-bottom:17px}
.lvl:last-child{margin-bottom:0}
.lvl-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;

.lvl:first-child .lvl-h{color:var(--front)}

.tool{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:12px;
  padding:9px 0;border-top:1px solid var(--line-soft);font-size:13.5px}

.tool b{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink)}
.tool span{color:var(--muted)}

/* routes */
.routes{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:620px){.routes{grid-template-columns:1fr 1fr}}
.rt{padding:12px 13px;border-radius:3px;border:1px solid var(--line);background:var(--panel)}
.rt b{display:block;font-family:var(--mono);font-size:12px;margin-bottom:5px;color:var(--trace)}
.rt span{font-size:13.5px;color:var(--muted)}
.routes-top,.routes-bot{font-family:var(--mono);font-size:11.5px;text-align:center;
  padding:9px 12px;border-radius:3px;line-height:1.5}
.routes-top{background:var(--trace-soft);color:var(--trace);margin-bottom:12px}
.routes-bot{background:var(--alarm-soft);color:var(--alarm);margin-top:12px}

/* gates */
.gates{display:grid;gap:7px}
.gt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;align-items:baseline;
  padding:10px 12px;border-radius:3px;background:var(--panel);font-size:14px}
.gt b{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--tpl)}
.gt span{color:var(--muted);font-size:13px}
.gt b code{background:none;padding:0;color:inherit;font-size:1em}
@media (max-width:560px){.gt{grid-template-columns:1fr;gap:5px}}


/* ── markdown view ───────────────────────────────────────── */
#md{padding-top:26px}
.md-note{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px;
  padding:13px 15px;border:1px solid var(--line);border-radius:3px;background:var(--surface)}
.md-note p{margin:0;font-size:13.5px;color:var(--muted);flex:1 1 220px;max-width:none}
#mdbox{overflow-x:auto;border:1px solid var(--line);border-radius:3px;background:var(--panel)}
#mdbox pre{margin:0;padding:16px 18px;font-family:var(--mono);font-size:12.5px;line-height:1.6;
  white-space:pre}
#mdbox code{background:none;padding:0;border-radius:0;font-size:inherit;color:inherit}
footer{margin-top:58px;padding-top:22px;border-top:1px solid var(--line)}
footer p{font-size:13.5px;color:var(--faint);max-width:64ch;margin:0 0 9px}

<script type="text/plain" id="src"># Bạn tạo tool cho agent như thế nào — đọc một cặp skill bash CLI

> Phần 1 — Viết một tool shell nhiều file thì đau ở đâu, và cặp skill này trả lại cho bạn cái gì.
> Phần 2 — Bên trong một skill có gì: thư mục, luồng chạy, dữ liệu. Đây là phần để bạn vẽ lại được từ trí nhớ.
> Phần 3 — Một lần chạy đi hết từ câu hỏi đầu tiên tới file trên đĩa, cộng với những cái chặn bạn làm sai.
> Phần 4 — Những quyết định thiết kế đáng lấy, và công thức để bạn tự dựng skill đầu tiên.

---

# PHẦN 1 — Vấn đề và thành phẩm

## 1. Mục đích

Bạn viết một script shell để tự động hoá một việc nhỏ. Nó chạy được, bạn giữ lại. Tháng sau nó cần thêm một lệnh nữa, bạn thêm vào. Tháng sau nữa nó cần một đoạn tiện ích mà script khác cũng cần, bạn copy sang. Đến lúc này nó không còn là một script, nó là một **dự án** — và không ai từng ngồi xuống quyết định dự án đó nên có hình dạng gì.

Hậu quả thì luôn giống nhau, và luôn đến muộn:

- Tool chạy ngon trên máy bạn, hỏng trên máy đồng nghiệp — vì lệnh `date` trên macOS không nhận cờ mà bản GNU nhận.
- Ai đó cho tool chạy tự động lúc 3 giờ sáng. Hệ thống chọn một phiên bản shell cũ hơn phiên bản bạn test, và một cú pháp bạn dùng hàng ngày báo lỗi cú pháp.
- Dòng "kiểm tra xem công cụ X đã cài chưa" nằm rải rác ở đầu năm file khác nhau, mỗi chỗ một kiểu, và không chỗ nào nói cho người dùng biết phải làm gì tiếp.
- Bạn thêm một lệnh con mới nhưng quên cập nhật màn hình trợ giúp. Sáu tháng sau chính bạn đọc `--help` và tưởng tool không làm được việc đó.
- Một file cấu hình bị ghi dở giữa chừng vì máy tắt đúng lúc đó. Lần chạy sau tool đọc phải file hỏng.

Không cái nào trong số đó là bài toán khó. Chúng chỉ là **những quyết định nhỏ bị quyết lại từ đầu mỗi lần** — và mỗi lần lại ra một đáp án hơi khác.

Người đau nhất không phải người viết tool đầu tiên. Là người **sửa** nó: đồng nghiệp tiếp quản, hoặc chính bạn sáu tháng sau, hoặc — và đây là chỗ câu chuyện đổi màu — một **AI agent** được giao việc "thêm lệnh con vào tool này". Agent không nhớ gì về những lựa chọn cũ. Nó đọc file, đoán ra một kiểu, rồi viết theo kiểu đó. Lần sau nó đoán ra kiểu khác. Sau năm lần sửa, dự án có năm phong cách.

Cặp skill trong tài liệu này là câu trả lời viết-ra-giấy cho đúng một câu hỏi: **một tool shell nhiều file thì nên có hình dạng nào?** Quyết một lần, ghi lại, rồi thôi không quyết nữa. Từ đó mọi tool trong bộ sưu tập của bạn trông giống nhau, nên đọc hiểu một cái là hiểu tất cả — và agent sửa cái nào cũng ra cùng một phong cách.

Một trong hai skill nói thẳng ra ý định đó: nếu người dùng đang bắt đầu bất kỳ dự án shell nhiều file nào — kể cả khi họ không hề dùng chữ "khuôn mẫu" — thì cứ áp dụng, **để họ khỏi phải phát minh lại bố cục**.

## 2. Tình huống dùng và thành phẩm

Đây là **hai** skill chứ không phải một, và chúng chia nhau theo vòng đời của dự án:

| Skill | Dùng khi | Điểm xuất phát |
|---|---|---|
| `bash-cli-scaffold` | **Tạo mới** một tool shell từ con số không | Thư mục rỗng |
| `bash-cli-pattern` | **Nuôi lớn** tool đã có: thêm lệnh con, thêm module, sửa trợ giúp | Dự án đang chạy |

Hai skill trỏ sang nhau: mô tả của mỗi cái đều có một dòng "đừng dùng cái này cho việc kia — hãy dùng skill còn lại". Đó là ranh giới duy nhất bạn cần nhớ.

### Nửa thứ nhất — tạo mới

Bạn nói với agent: *"tạo cho tôi một bash CLI tên `pg-migrate` để chạy migration Postgres"*.

Skill `bash-cli-scaffold` kích hoạt và hỏi bạn bảy thứ **trong một lượt** — không hỏi nhỏ giọt từng câu: tên dự án, tiền tố hàm, tiền tố biến môi trường, danh sách lệnh con, nơi đặt thư mục, công cụ ngoài mà tool sẽ cần, và kiểu changelog.

Xong, bạn cầm trong tay **một thư mục hoàn chỉnh**, và ngay lập tức chạy được ba lệnh:

    pg-migrate.sh --help      # màn hình trợ giúp hiện ra đầy đủ
    pg-migrate.sh init        # quét máy bạn, ghi ra settings.json
    pg-migrate.sh doctor      # so settings.json đã lưu với môi trường hiện tại

Lệnh `apply` mà bạn đặt hàng thì **cố tình chưa làm gì**: nó thoát ra với thông báo "chưa cài đặt". Đó không phải thiếu sót — bộ khung dựng sẵn khung xương, phần thịt là việc của bạn.

### Nửa thứ hai — nuôi lớn

Hai tuần sau bạn nói: *"thêm lệnh con `rollback`"*. Lần này `bash-cli-pattern` kích hoạt, và nó không tạo file nào. Nó **đọc** dự án đang có: tìm bộ điều phối, đọc một hàm lệnh con anh em, rồi viết hàm mới **khớp với hàm cũ** — cùng kiểu đọc cờ, cùng kiểu báo lỗi, cùng thứ tự. Sau đó nó nối dây ở ba chỗ: nhánh trong bộ điều phối, nhánh trong trợ giúp con, và danh sách lệnh trong trợ giúp tổng.

Thành phẩm ở đây không phải file mới mà là **một bản sửa không lệch phong cách**, cộng thêm một bước kiểm tra: chạy lại `--help` để xác nhận màn hình trợ giúp vẫn đúng.

# PHẦN 2 — Bên trong hai skill

## 3. Cấu trúc thư mục

Ở mục này có **hai cây thư mục khác nhau**, và lẫn lộn chúng là cách nhanh nhất để hiểu sai:

- **Cây A** — thư mục của bản thân skill. Đây là thứ agent đọc.
- **Cây B** — thư mục mà skill *sinh ra*. Đây là thứ bạn nhận được.

### Cây A — bản thân hai skill

@fig:skillTree
    bash-cli-scaffold/
    ├── SKILL.md                     frontmatter + thuật toán sinh file
    ├── references/
    │   ├── output-tree.md           danh sách file sẽ sinh, mỗi file một dòng nhiệm vụ
    │   └── placeholders.md          bảng marker và luật thay thế
    └── templates/                   bash chạy được, chưa điền tên
        ├── __NAME__.sh              điểm vào
        ├── VERSION  CHANGELOG.md  .gitignore
        ├── .shellcheckrc  .editorconfig
        ├── lib/                     _bootstrap.sh  common.sh
        │                            settings.sh   tools.sh
        ├── config/                  tools.json.example  bootstrap.json
        └── tests/                   helpers/load.bash  unit/common.bats

    bash-cli-pattern/
    ├── SKILL.md                     frontmatter + 10 bất biến + bảng định tuyến
    └── references/
        ├── entry-point.md           khuôn 6 phần của file điểm vào
        ├── lib-module.md            luật cho file thư viện được nạp
        ├── helpers.md               log, báo lỗi, ghi nguyên tử, nhận diện HĐH
        ├── help-system.md           trợ giúp là một hệ thống con, không phải một cờ
        ├── init-doctor.md           bộ ba init / doctor / assert
        └── tooling.md               shellcheck, editorconfig, VERSION, test
@endfig

Nhiệm vụ từng chỗ, mỗi chỗ một câu:

| Thành phần | Nhiệm vụ |
|---|---|
| **frontmatter** (`name`, `description`) | Khối dữ liệu ở ngay đầu `SKILL.md`; là phần duy nhất nằm trong đầu óc agent **mọi lúc**, nên nó quyết định skill có được chọn hay không. |
| **thân `SKILL.md`** | Được đọc **mỗi lần skill kích hoạt**: quy trình và phán đoán, không chứa chi tiết. |
| `references/` | Chỉ đọc khi quy trình bảo đọc — nơi chứa chiều sâu. |
| `templates/` | Vật liệu để **chép**, không phải để mô tả: bash thật, chỉ còn thiếu tên. |

### Ba tầng bóc dần

Sự phân chia trên không tuỳ hứng. Nó theo một nguyên tắc có tên — **progressive disclosure**, tạm gọi là **bóc dần**: cái gì càng hay phải trả giá thì càng phải ngắn.

@fig:levels
    LUÔN NẰM TRONG CONTEXT
      frontmatter        quyết định skill có được chọn hay không

    ĐỌC KHI SKILL KÍCH HOẠT
      SKILL.md (thân)    quy trình, bảng định tuyến, luật cấm — không chứa chi tiết

    ĐỌC KHI QUY TRÌNH BẢO ĐỌC
      references/*.md    chiều sâu, không bao giờ đọc hết cùng một lúc
      templates/*        vật liệu chép ra, hầu như không cần đọc hiểu
@endfig

Đọc cây A theo lăng kính đó thì hai skill lộ ra hai tính cách khác nhau:

- `bash-cli-scaffold` **có `templates/`** vì đầu ra của nó là *vật liệu*. Mô tả một file bash bằng văn xuôi rồi bắt agent viết lại là vừa tốn vừa dễ sai; đưa thẳng file bash chạy được thì không sai được.
- `bash-cli-pattern` **không có `templates/`** vì đầu ra của nó là *phán đoán*. Không có file nào để chép — chỉ có "khi bạn đang sửa X thì mở file Y ra đọc".
- **Cả hai đều không có `scripts/`.** Đây là một quyết định, không phải một thiếu sót: công việc nặng nhất của bộ khung là thay chuỗi ký tự trong từng file mẫu, mà đó không phải thuật toán. Một skill có `scripts/` là skill giao việc cho code vì code rẻ hơn và chắc tay hơn lời dặn; ở đây chẳng có gì để giao.
- Cả hai đều **không có test**. Cái chặn sai duy nhất là một bước kiểm tra chạy tay ở cuối, sẽ nói ở mục 8.

### Cây B — dự án mà bộ khung sinh ra

@fig:projectTree
    pg-migrate/
    ├── pg-migrate.sh          ĐIỂM VÀO — chạy trực tiếp, có strict mode
    ├── VERSION                một dòng: 0.1.0
    ├── CHANGELOG.md           định dạng Keep a Changelog
    ├── .gitignore             bỏ qua settings.json, *.bak, tmp/
    ├── .shellcheckrc          tắt đúng một cảnh báo, có ghi lý do
    ├── .editorconfig          .sh và .bats thụt 4, còn lại thụt 2, xuống dòng LF
    ├── lib/                   CHỈ ĐƯỢC NẠP — không chạy trực tiếp
    │   ├── _bootstrap.sh      chọn đúng trình thông dịch, rồi chạy lại chính mình
    │   ├── common.sh          log / die / ghi nguyên tử / nhận diện HĐH
    │   ├── settings.sh        quét môi trường, so lệch, sửa lệch
    │   └── tools.sh           tìm đường dẫn, phiên bản, biến thể của công cụ ngoài
    ├── config/
    │   ├── tools.json.example danh sách công cụ cần — CÓ commit
    │   └── bootstrap.json     cấu hình tĩnh, không phụ thuộc máy
    ├── tests/
    │   ├── helpers/load.bash  nạp một thư viện vào phiên test
    │   ├── unit/common.bats   7 test khói cho common.sh
    │   └── fixtures/          để trống
    └── docs/                  để trống

    settings.json  ← KHÔNG có sẵn. Do lệnh `init` sinh ra. KHÔNG commit.
@endfig

Ranh giới quan trọng nhất trong cây B là **`bin/` và `lib/`**, hay ở đây là "file chạy được" đối lập với "file chỉ được nạp". Phụ thuộc chỉ đi một chiều: file chạy được nạp thư viện, thư viện không bao giờ gọi ngược lên. Nhờ vậy một thư viện dùng lại được cho nhiều điểm vào mà không kéo theo thứ gì.

Bộ khung mặc định **không tạo `bin/`** — chỉ tạo một file điểm vào duy nhất ở gốc. Thư mục `bin/` chứa các CLI nhỏ tách riêng là tuỳ chọn, chỉ dựng khi bạn hỏi.

## 4. Luồng chạy

### Bộ khung: một đường thẳng, chạy đúng một lần

@fig:scaffoldFlow
    1  Nhận diện       người dùng muốn dựng một dự án bash nhiều file
    2  Hỏi gộp         7 câu hỏi trong MỘT lượt, không hỏi nhỏ giọt
    3  Đọc danh sách   references/output-tree.md — file nào phải có
    4  Với từng file   đọc template → thay marker → ghi ra đích
    5  Cấp quyền chạy  chmod +x cho file .sh ở gốc và mọi thứ trong bin/
    6  Kiểm tra        chạy --help; nếu không hiện ra thì DỪNG, đừng báo xong
    7  Bàn giao        đường dẫn + 3 lệnh chạy đầu tiên + chỗ viết lệnh con thật
@endfig

Bước 6 là bước duy nhất có quyền phủ quyết. Skill nói thẳng: nếu `--help` không hiện ra thì bộ khung hỏng — dừng lại và sửa, không được tuyên bố đã xong.

### Khuôn mẫu: không có luồng, chỉ có bảng định tuyến

`bash-cli-pattern` không chạy theo một đường. Nó tự kích hoạt khi **nhận ra hình dạng dự án** — thư mục nào vừa có `bin/` vừa có `lib/*.sh`, file nào tự xác định vị trí của mình rồi nạp thư viện từ đó — kể cả khi bạn không hề nhắc tới nó. Sau đó nó đọc **đúng một** file tham chiếu, chọn theo thứ bạn đang chạm vào:

@fig:routes
    BẠN ĐANG SỬA MỘT BASH CLI NHIỀU FILE
                     │
        ┌────────────┼────────────┬───────────┬──────────┬──────────┐
        ▼            ▼            ▼           ▼          ▼          ▼
    thêm lệnh    thêm module   sửa log     sửa màn     sửa init   sửa file
      con         thư viện     báo lỗi    trợ giúp    / doctor   cấu hình
        │            │            │           │          │          │
    entry-point  lib-module   helpers   help-system  init-doctor  tooling
        .md          .md         .md        .md          .md        .md

    TỪ CHỐI: dự án hoàn toàn mới → dùng bash-cli-scaffold, không phải skill này
@endfig

Mỗi ngả đường ứng với một quy trình được viết sẵn. Ví dụ ngả "thêm lệnh con" có sáu bước, và hai bước cuối được đánh dấu **đừng bỏ qua**: thêm nhánh trợ giúp con, và cập nhật danh sách lệnh trong trợ giúp tổng. Lý do được nói rõ luôn — màn hình trợ giúp là một hệ thống con thật sự, thiếu một dòng trong đó là **lỗi**, không phải sơ suất nhỏ.

Cuối mỗi lần sửa, bước kiểm tra giống nhau: chạy `--help`, chạy `doctor` nếu cấu hình có thể đã đổi, chạy công cụ soi lỗi tĩnh nếu máy có, chạy test nếu vùng vừa sửa có test.

## 5. Dữ liệu và trạng thái

**Bản thân hai skill không nhớ gì cả.** Không thư mục tạm, không bộ nhớ đệm, không file trạng thái, không gì sống sót giữa hai lần chạy. Chúng đọc file tham chiếu của chính mình, đọc file dự án của bạn, rồi ghi file dự án của bạn. Hết.

Phần trạng thái đáng học nằm ở **dự án được sinh ra**, và đó mới là thứ hai skill thật sự bàn giao. Nó dựa trên một ranh giới duy nhất:

| | Khai báo — **có** commit | Phân giải — **không** commit |
|---|---|---|
| File | `config/tools.json.example` | `settings.json` |
| Nội dung | "tool này cần `jq` và `psql`" | "`jq` nằm ở `/opt/homebrew/bin/jq`, bản 1.7.1, biến thể apple" |
| Ai tạo | bộ khung, lúc dựng dự án | lệnh `init`, trên từng máy |

Đây là lý do **bộ khung từ chối tạo `settings.json`**. Nếu nó tạo, thư mục vừa sinh ra đã dính đường dẫn của một máy cụ thể, và dự án hết tái lập được. Việc quét máy là một hành động có chủ ý của người dùng, không phải tác dụng phụ.

Ba lệnh xoay quanh ranh giới đó — bộ ba chẩn đoán:

- **`init`** — chạy một lần. Quét môi trường sống, ghi ra `settings.json`. Từ chối ghi đè trừ khi có `--force`.
- **`doctor`** — chạy khi cần. So `settings.json` đã lưu với môi trường hiện tại, in ra từng mục. Chỉ sửa khi bạn thêm `--fix`, và khi sửa thì chép bản cũ ra `.bak` trước.
- **`assert`** — chốt chặn lúc chạy. Lệnh nào làm việc thật thì gọi nó trước; nếu có lệch thì thoát ngay với thông báo đã cài sẵn câu *"chạy `doctor --fix`"*.

Bộ ba này thay thế cho thứ mà mọi script shell đều có: những dòng `command -v jq || exit 1` rải rác khắp nơi, mỗi dòng một kiểu, không dòng nào chỉ cho người dùng lối ra.

Ngoài file, dự án sinh ra còn đọc vài **biến môi trường**, tất cả mang tiền tố bạn đã chọn:

| Biến | Dùng để |
|---|---|
| `<PKG>_PKG_DIR` | gốc dự án, file điểm vào tự tính ra rồi export |
| `<PKG>_LOG_LEVEL` | lọc mức log: `error` / `warn` / `info` / `debug`, mặc định `info` |
| `<PKG>_COMPONENT` | tên ngắn hiện trong dòng log để biết log từ đâu ra |
| `<PKG>_OS_OVERRIDE` | **móc dành cho test** — ép nhận diện HĐH mà không cần máy khác |
| `<PKG>_BASH_BOOTSTRAPPED` | chặn vòng lặp khi file khởi động chạy lại chính mình |
| `NO_COLOR` | quy ước chung: đặt bất cứ giá trị nào thì log hết màu |

### Giao diện bên ngoài

Cả hai skill đều có chạm tới vài công cụ ngoài. Ở đây chỉ cần biết **đưa gì vào, nhận gì ra**:

| Công cụ | Skill đưa | Nhận lại |
|---|---|---|
| `jq` | một tài liệu JSON và một biểu thức truy vấn | JSON hoặc chuỗi đã lọc; bộ ba chẩn đoán dựng mọi file JSON qua đây thay vì nối chuỗi |
| `shellcheck` | đường dẫn các file `.sh` vừa viết | danh sách cảnh báo tĩnh; bước kiểm tra tuỳ chọn, thiếu thì bỏ qua |
| `bats` | thư mục `tests/` | kết quả pass/fail; bộ khung chỉ sinh test khói, test thật là việc của bạn |
| `git` | không đưa gì | không nhận gì; skill không chạy git, chỉ sinh `.gitignore` để bạn tự commit |
| `date`, `uname` | không đưa gì | dấu thời gian và tên HĐH ghi vào `settings.json` lúc quét |

Nội tạng của mấy công cụ đó không phải chuyện của trang này.

# PHẦN 3 — Một lần chạy đầy đủ

## 6. Đầu tới cuối

### Đầu vào

Bạn muốn một tool chạy migration Postgres. Bảy câu trả lời:

| Câu hỏi | Bạn trả lời |
|---|---|
| Tên dự án | `pg-migrate` |
| Tiền tố hàm | `pgm` |
| Tiền tố biến môi trường | `PGM` |
| Lệnh con | `init`, `doctor`, `apply`, `rollback` |
| Nơi đặt | `scripts/bash/pg-migrate/` |
| Công cụ ngoài cần | `psql`, `jq` |
| Kiểu changelog | Keep a Changelog |

### Giữa chừng: marker biến thành tên

Đây là chỗ dễ hiểu sai nhất, nên đáng nhìn kỹ. File mẫu chứa những chuỗi đánh dấu; thay chuỗi là xong file.

@fig:swap
    TRONG TEMPLATE                            SAU KHI THAY
    __NAME__                          →       pg-migrate
    __PKG___PKG_DIR                   →       PGM_PKG_DIR
    ___ns___log                       →       _pgm_log
    ___PKG___COMMON_SOURCED           →       _PGM_COMMON_SOURCED
@endfig

Hai dòng dưới trông rối vì chúng **lồng nhau**. Marker chỉ là `__ns__` và `__PKG__`; những gạch dưới thừa hai bên là quy ước bash cho "hàm riêng tư, đừng gọi từ ngoài". `___ns___log` chính là `_` + `__ns__` + `_log`, nên sau khi thay ra `_pgm_log`. Bạn không cần nhớ chuyện này — chỉ cần biết rằng skill có hẳn một file tham chiếu dành riêng cho nó, vì nó đã từng làm người ta nhầm.

Dòng đầu tiên của file điểm vào, trước và sau, cho thấy toàn bộ trò chơi:

    # template
    __PKG___PKG_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

    # kết quả
    PGM_PKG_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

Phần `${BASH_SOURCE[0]}` **không bị thay** — đó là cú pháp bash lúc chạy, không phải marker. Luật này được ghi riêng: đừng thay biến bash, đừng thay ruột của khối văn bản trích dẫn cứng, đừng thay hai lần.

### Đầu ra

Cả cây thư mục nằm trên đĩa. Chạy được ngay:

    $ scripts/bash/pg-migrate/pg-migrate.sh --help
    pg-migrate — apply postgres migrations idempotently

    USAGE
      pg-migrate.sh <subcommand> [options]
      pg-migrate.sh help [<subcommand>]

    SUBCOMMANDS
      init      scan env and write settings.json (one-time)
      doctor    compare settings.json vs live env; --fix to repair
      apply     ← lệnh con của bạn; thân hàm còn rỗng
      rollback  ← lệnh con của bạn; thân hàm còn rỗng
      version   print tool version
      help      show this help

Chạy `init` một lần, `settings.json` xuất hiện — và đây là toàn bộ hình dạng của nó:

    {
      "version": 1,
      "scanned-at": "2026-09-18T11:04:22Z",
      "scanned-on": { "os": "darwin", "arch": "arm64" },
      "tools": {
        "psql": {
          "name": "psql", "found": true,
          "path": "/opt/homebrew/bin/psql",
          "version": "17.2", "variant": "unknown"
        },
        "jq": {
          "name": "jq", "found": true,
          "path": "/usr/bin/jq",
          "version": "1.7.1", "variant": "apple"
        }
      }
    }

Trường `variant` là thứ đáng chú ý: nó ghi lại **biến thể** của công cụ — `gnu`, `bsd`, `apple`, hay `unknown` — được đoán từ dòng đầu của `--version`. Đó chính là câu trả lời cho nỗi đau "chạy ngon trên máy tôi, hỏng trên máy anh" ở mục 1: sự khác biệt được **ghi lại thành dữ liệu** thay vì được phát hiện lúc lỗi.

### Hai tuần sau: viết `rollback` cho thật

Giờ sang skill còn lại. Sáu bước, theo đúng thứ tự:

1. Đọc bộ điều phối ở cuối file điểm vào, tìm khối phân nhánh theo đối số đầu tiên.
2. Đọc một hoặc hai hàm lệnh con anh em — để bắt chước, không để sáng tạo.
3. Viết `cmd_rollback` **phía trên** bộ điều phối, với vòng đọc cờ riêng của nó.
4. Thêm một nhánh vào bộ điều phối.
5. Thêm một nhánh vào trợ giúp con.
6. Cập nhật danh sách lệnh trong trợ giúp tổng.

Bước 3 có một luật nhỏ mà hai skill đều nhắc: mỗi cờ phải nhận **cả hai cách gõ**, `--settings đường/dẫn` và `--settings=đường/dẫn`. Người dùng có hai thói quen; tool không nên bắt họ đổi.

Và mỗi lệnh con **tự đọc cờ của riêng mình**, dù trông như lặp lại. Đó là cố ý: gom hết vào một chỗ xử lý chung là cách để cờ của lệnh này rò rỉ sang lệnh khác — một lỗi cực kỳ khó thấy.

## 7. Hook

Không có. Hai skill này không gắn vào hook nào, không có mục nào trong file cấu hình, không có lệnh gạch chéo nào gọi chúng.

Điều đó đáng nói ra chứ không phải đáng giấu: với phần lớn skill, **`description` chính là toàn bộ dây nối**. Agent đọc mô tả, thấy tình huống khớp, rồi tự chọn. Không có gì khác bật nó lên.

## 8. Cái gì chặn bạn làm sai

Có hai lớp chặn, và chúng ở hai nơi khác nhau.

# PHẦN 4 — Học lại thiết kế

## 9. Những quyết định đáng lấy

### Chia theo vòng đời, không chia theo chủ đề

Hai skill, một để tạo, một để bảo trì — thay vì một skill to nói cả hai. Đánh đổi: cùng một quy ước bị mô tả ở hai nơi (khuôn file điểm vào vừa nằm trong file mẫu vừa nằm trong file tham chiếu), và đó đúng là chỗ hai bản sẽ lệch nhau theo thời gian.

### Template là file thật, không phải lời mô tả

Bộ khung **chép** bash chạy được thay vì mô tả bash nên trông thế nào. Đánh đổi: file mẫu không tự chạy và không tự test được, vì chúng còn đầy marker. Không có gì canh chúng ngoài lần chạy `--help` sau khi đã thay xong.

### Bảng định tuyến thay cho quy trình

Thân `bash-cli-pattern` gần như chỉ gồm "nếu bạn đang làm X thì mở Y". Đánh đổi: không có đường thẳng để đi theo, nên skill vô dụng nếu agent chọn sai file để mở.

### Bất biến đánh số, mỗi dòng kèm một cột "vì sao"

Mười điều, mỗi điều có hậu quả đi kèm. Một luật kèm lý do thì nhớ được; một luật trần trụi thì bị bỏ qua ngay lần đầu thấy bất tiện.

### Cho phép lệch, và nói rõ lệch bao nhiêu thì hỏng

Câu đáng lấy nguyên văn: *lệch một điều thì chấp nhận được; lệch nhiều điều nghĩa là file này không còn thuộc khuôn mẫu nữa*. Rất hiếm tài liệu quy ước nào dám ghi ngưỡng. Đánh đổi: ngưỡng mờ, nên vẫn cần người đọc có phán đoán.

### Mô tả được viết như danh sách tình huống

Cả hai `description` đều dài, nhồi những câu người dùng sẽ gõ thật — "thêm lệnh con", "dựng khung CLI", "sửa lệnh doctor" — chứ không tóm tắt skill làm gì. `bash-cli-pattern` còn đi xa hơn: nó nhận diện **hình dạng thư mục** để tự kích hoạt mà không cần được gọi tên. Đánh đổi: mô tả là phần duy nhất luôn nằm trong context, nên nó là đoạn văn đắt nhất trong cả skill — trả tiền ở mọi lượt của mọi cuộc hội thoại, kể cả những lượt chẳng liên quan gì tới bash.

### Phần ruột thật ra chỉ là một ý

Bỏ hết bố cục thư mục sang một bên, thứ hai skill thật sự bán là bộ ba `init` / `doctor` / `assert`: **chụp lại môi trường một lần, rồi so lệch cho rẻ**, thay vì kiểm tra vặt rải rác khắp mã nguồn. Bố cục thư mục chỉ là cái nhà cho ý đó ở.

## 10. Tự dựng skill của bạn

Bạn vừa xem một skill được thiết kế. Giờ là những quyết định đến lượt bạn phải quyết.

### 1 · Lĩnh vực của bạn có hai nửa vòng đời không?

Nếu có một việc "làm một lần lúc đầu" và một việc "đụng vào mãi mãi", hãy tách hai skill. Nếu không, đừng tách cho giống người ta. Khi tách thì **nối chúng lại bằng một dòng trong mỗi mô tả**: *đừng dùng cái này cho việc kia — dùng skill kia*. Thiếu dòng đó, hai skill sẽ tranh nhau và cái sai thắng một nửa số lần.

### 2 · Cái gì ở lại `SKILL.md`, cái gì xuống `references/`

Luật mà cặp skill này minh hoạ: **`SKILL.md` giữ quyết định đọc gì tiếp theo; `references/` giữ thứ chỉ cần khi bạn đã ở đó.** Thân `bash-cli-pattern` gần như chỉ là bảng định tuyến, còn chiều sâu nằm trong các file tham chiếu — mỗi lần chỉ mở một.

Phép thử: câu này có cần đọc ở **mọi** lần chạy không? Không thì nó thuộc `references/`.

### 3 · Vật liệu hay phán đoán?

Nếu đầu ra là một file mà agent sẽ chép — hãy đưa hẳn file đó vào `templates/`. Nếu đầu ra là một lựa chọn phải cân nhắc — hãy viết văn xuôi. Đừng mô tả một file bằng lời khi bạn có thể đưa luôn file.

Và chỉ thêm `scripts/` khi công việc **thật sự là thuật toán**. Một loạt phép thay chuỗi thì không phải.

### 4 · Viết `description` như một danh sách tình huống

Không phải "skill này giúp bạn dựng CLI". Mà là những câu người dùng sẽ gõ thật, càng cụ thể càng tốt, cộng thêm dòng ranh giới, cộng thêm — nếu bạn muốn nó tự bật — một dấu hiệu **nhận diện được bằng mắt**: một tên file, một cặp thư mục, một đuôi mở rộng.

Nhớ rằng đây là đoạn đắt nhất bạn viết. Dài thì bắt trúng nhiều tình huống hơn, nhưng bạn trả tiền cho nó ở mọi lượt.

### 5 · Mỗi luật phải mang theo lý do

"Đừng quên thêm nhánh trợ giúp" thì quên ngay. "Thiếu nhánh trợ giúp thì người dùng nhìn thấy, và đó là **lỗi** chứ không phải sơ suất" thì không quên được. Khi viết một luật, hãy tìm lại chuyện đã hỏng khiến luật đó ra đời — nếu không tìm ra, có lẽ luật đó không cần tồn tại.

### 6 · Đặt một cái chặn rẻ ở cuối

Chọn thứ rẻ nhất mà **quan sát được** để chứng minh việc đã thành: ở đây là màn hình trợ giúp. Rồi biến nó thành điều kiện dừng, viết bằng câu mệnh lệnh: *nếu nó không hiện ra thì dừng, đừng báo xong*.

### 7 · Nói rõ đâu là chịu lực, đâu là gợi ý

Không phải luật nào cũng ngang nhau. Nếu bạn không phân hạng, người đọc sẽ tự phân — và họ phân sai.

### Bước đầu tiên, làm ngay bây giờ

Tạo `~/.claude/skills/<tên-của-bạn>/SKILL.md`. Trong đó đúng ba thứ:

- frontmatter: `name`, và một `description` liệt kê tình huống;
- một đoạn tiêu đề **"Vì sao skill này tồn tại"** — kể lại việc thủ công mà nó xoá bỏ;
- một bảng định tuyến, kể cả khi bảng mới có một dòng.

Chưa tạo `references/` vội. Chỉ tạo nó khi một mục phình ra tới mức bạn không muốn đọc lại ở mọi lần chạy. Thư mục rỗng là tiếng ồn.

## 11. Bảng thuật ngữ

**assert (chốt chặn lúc chạy)** — hàm được gọi trước khi làm việc thật, thoát ngay nếu cấu hình đã lưu lệch với môi trường hiện tại.

**bats** — bộ chạy test dành cho bash; mỗi test là một khối `@test`.

**bin/ và lib/** — quy ước tách file: `bin/` chứa file chạy trực tiếp, `lib/` chứa file chỉ được nạp vào file khác.

**bóc dần (progressive disclosure)** — cách sắp xếp sao cho phần luôn phải đọc thì ngắn, phần dài thì chỉ đọc khi cần.

**bộ điều phối (dispatcher)** — khối phân nhánh ở cuối file điểm vào, nhìn đối số đầu tiên rồi gọi hàm lệnh con tương ứng.

**chốt chống nạp trùng (source guard)** — hai dòng đầu file thư viện, thoát ngay nếu file đã được nạp trước đó.

**description** — dòng mô tả trong frontmatter; là bề mặt kích hoạt, quyết định skill có được chọn hay không.

**doctor** — lệnh con so sánh cấu hình đã lưu với môi trường hiện tại và in ra khác biệt.

**điểm vào (entry point)** — file được chạy trực tiếp, là nơi duy nhất bật chế độ nghiêm ngặt và nạp thư viện.

**frontmatter** — khối dữ liệu ở đầu `SKILL.md`, chứa `name` và `description`.

**ghi nguyên tử (atomic write)** — ghi ra file tạm rồi đổi tên đè lên đích, để người đọc không bao giờ thấy file viết dở.

**hook** — cơ chế cho phép chạy một lệnh tự động khi có sự kiện xảy ra; cặp skill này không dùng.

**init** — lệnh con chạy một lần, quét môi trường và ghi ra file cấu hình cho máy hiện tại.

**jq** — công cụ dòng lệnh để đọc và dựng JSON.

**lệch (drift)** — trạng thái cấu hình đã lưu không còn khớp với môi trường thật.

**marker (placeholder)** — chuỗi đánh dấu trong file mẫu, sẽ được thay bằng tên thật lúc sinh file.

**namespace (tiền tố)** — vài ký tự đứng đầu mọi tên hàm trong dự án, để hàm không đụng tên với thứ khác trong shell.

**settings.json** — ảnh chụp môi trường của một máy cụ thể; sinh bởi `init`, không commit.

**shebang** — dòng đầu file script, nói cho hệ điều hành biết chạy file bằng chương trình nào.

**shellcheck** — công cụ soi lỗi tĩnh cho script shell.

**chế độ nghiêm ngặt (strict mode)** — `set -euo pipefail`: dừng khi lỗi, dừng khi dùng biến chưa đặt, dừng khi một khâu trong đường ống hỏng.

**stdout và stderr** — hai luồng ra: dữ liệu có cấu trúc đi ra stdout để nối ống, log và lỗi đi ra stderr.

**lệnh con (subcommand)** — từ đầu tiên sau tên tool, ví dụ `init` trong `pg-migrate.sh init`.

**nạp (source)** — đọc một file bash vào **chính** shell đang chạy, khác với chạy file đó ra một tiến trình riêng.

**chạy lại chính mình (re-exec)** — thay thế tiến trình đang chạy bằng cùng script đó dưới một trình thông dịch khác.

**biến thể (variant)** — nhãn `gnu` / `bsd` / `apple` / `unknown` ghi lại phiên bản nào của một công cụ đang được dùng.

---
Trang này mô tả hai skill như chúng đang là: một cặp quy ước viết tay cho công cụ shell, không phải một framework. Chúng không chạy gì thay bạn — chúng chỉ nói cho agent biết phải viết cái gì.

Tên `pg-migrate`, `pgm`, `PGM` và danh sách công cụ trong ví dụ là bịa ra để đi hết một vòng cho dễ theo dõi. Bảy câu hỏi đầu vào, hai cây thư mục, luật thay marker và bộ ba `init` / `doctor` / `assert` thì thuộc về hai skill.

/* ===================================================================
   LAYER 2 . COMPONENTS
   Pure: data in, DOM out. Must not read STATE.
   =================================================================== */

function esc(s){ return String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function el(tag, attrs, kids){
  var n = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k === 'html') n.innerHTML = attrs[k];
    else if(k === 'text') n.textContent = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function(c){ if(c) n.appendChild(c); });
  return n;
}

/* Code spans are pulled out before escaping and put back after, so that
   markup inside them is never interpreted. The sentinel is ordinary text,
   not a control character, so the source stays copy-paste safe. */
function inline(s){
  var keep = [];
  s = String(s).replace(/`([^`]+)`/g, function(_, c){
    keep.push(c); return 'K0DE' + (keep.length - 1) + 'K0DE';
  });
  s = esc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*]+)\*(?![*\w])/g, '$1<em>$2</em>');
  return s.replace(/K0DE(\d+)K0DE/g, function(_, i){
    return '<code>' + esc(keep[+i]) + '</code>';
  });
}

var BLOCK = {
  h: function(b){
    var tag = b.level === 1 ? 'h2' : b.level === 2 ? 'h3' : 'h4';
    var m = /^(PHAN|PHẦN|PART)\s+(\d+)\s*—\s*(.*)$/.exec(b.text);
    if(tag === 'h2' && m){
      return el('h2', null, [
        el('span', { class: 'eyebrow', text: m[1] + ' ' + m[2] }),
        el('span', { html: inline(m[3]) })
      ]);
    }
    return el(tag, { html: inline(b.text) });
  },
  p:  function(b){ return el('p', { html: inline(b.text) }); },
  ul: function(b){ return el('ul', null, b.items.map(function(t){
        return el('li', { html: inline(t) }); })); },
  ol: function(b){ return el('ol', null, b.items.map(function(t){
        return el('li', { html: inline(t) }); })); },
  quote: function(b){ return el('blockquote', null, b.items.map(function(t){
        return el('p', { html: inline(t) }); })); },
  code: function(b){
    return el('div', { class: 'pre' }, [ el('pre', { text: b.text }) ]);
  },
  hr: function(){ return el('hr'); },
  table: function(b){
    var head = el('tr', null, b.head.map(function(c){
      return el('th', { html: inline(c) }); }));
    var body = b.rows.map(function(r){
      return el('tr', null, r.map(function(c){ return el('td', { html: inline(c) }); }));
    });
    return el('div', { class: 'tw' }, [
      el('table', null, [ el('thead', null, [head]), el('tbody', null, body) ])
    ]);
  },
  fig: function(b){
    var f = FIG[b.id];
    if(!f) return el('p', { text: '[missing figure: ' + b.id + ']' });
    var render = FIGURE[f.type];
    if(!render) return el('p', { text: '[no renderer: ' + f.type + ']' });
    return el('figure', null, [
      el('div', { class: 'fig' }, [ render(f) ]),
      f.cap ? el('figcaption', { html: inline(f.cap) }) : null
    ]);
  }
};

/* -- markdown ------------------------------------------------------- */

var MD = {
  parse: function(src){
    var lines = src.split('\n'), out = [], i = 0;
    function blank(s){ return !s.trim(); }
    function cells(s){
      return s.trim().replace(/^\|/, '').replace(/\|$/, '')
              .split('|').map(function(c){ return c.trim(); });
    }

    while(i < lines.length){
      var ln = lines[i];
      if(blank(ln)){ i++; continue; }

      /* figure directive: keep the id, skip the ASCII fallback body */
      var fm = /^@fig:(\S+)\s*$/.exec(ln);
      if(fm){
        var id = fm[1]; i++;
        while(i < lines.length && !/^@endfig\s*$/.test(lines[i])) i++;
        i++;
        out.push({ t: 'fig', id: id });
        continue;
      }

      var hm = /^(#{1,4})\s+(.*)$/.exec(ln);
      if(hm){ out.push({ t: 'h', level: hm[1].length, text: hm[2].trim() }); i++; continue; }

      if(/^---\s*$/.test(ln)){ out.push({ t: 'hr' }); i++; continue; }

      if(/^\|/.test(ln) && i + 1 < lines.length && /^\|[\s:|-]+\|?\s*$/.test(lines[i + 1])){
        var head = cells(ln); i += 2;
        var rows = [];
        while(i < lines.length && /^\|/.test(lines[i])){ rows.push(cells(lines[i])); i++; }
        out.push({ t: 'table', head: head, rows: rows });
        continue;
      }

      if(/^>\s?/.test(ln)){
        var q = [];
        while(i < lines.length && /^>\s?/.test(lines[i])){
          q.push(lines[i].replace(/^>\s?/, '')); i++;
        }
        out.push({ t: 'quote', items: q });
        continue;
      }

      var lm = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(ln);
      if(lm){
        var ordered = /\d/.test(lm[2]), items = [];
        while(i < lines.length){
          var m2 = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(lines[i]);
          if(m2){ items.push(m2[3]); i++; }
          else if(/^\s{2,}\S/.test(lines[i]) && items.length){
            items[items.length - 1] += ' ' + lines[i].trim(); i++;
          } else break;
        }
        out.push({ t: ordered ? 'ol' : 'ul', items: items });
        continue;
      }

      /* Four-space indented code. Blank lines inside one block are kept,
         then trimmed off the end, so a diagram split by blank lines stays
         a single block instead of becoming several. */
      if(/^ {4}\S/.test(ln)){
        var buf = [];
        while(i < lines.length){
          if(/^ {4}/.test(lines[i])){ buf.push(lines[i].slice(4)); i++; }
          else if(blank(lines[i]) && /^ {4}/.test(lines[i + 1] || '')){ buf.push(''); i++; }
          else break;
        }
        while(buf.length && !buf[buf.length - 1].trim()) buf.pop();
        out.push({ t: 'code', text: buf.join('\n') });
        continue;
      }

      var para = [ln.trim()]; i++;
      while(i < lines.length && !blank(lines[i]) &&
            !/^(#{1,4}\s|@fig:|@endfig|---\s*$|\||>\s?|\s*([-*]|\d+\.)\s|\s{4}\S)/.test(lines[i])){
        para.push(lines[i].trim()); i++;
      }
      out.push({ t: 'p', text: para.join(' ') });
    }
    return out;
  },

  render: function(blocks){
    var frag = document.createDocumentFragment();
    blocks.forEach(function(b){
      var fn = BLOCK[b.t];
      if(fn) frag.appendChild(fn(b));
    });
    return frag;
  }
};


/* -- figure renderers ----------------------------------------------
   Pure: data in, DOM out. Never reads STATE, so each one can be tested
   by calling it with a literal object. Three of the six are new here --
   `tree`, `flow` and `swap` -- because a folder listing, an ordered
   procedure and a before/after pair have no honest shape in the catalog.
   ------------------------------------------------------------------ */

var FIGURE = {

  /* A folder listing. One or more roots; each row is
     [indentDepth, name, kind, note]. `kind` colours the rail, so the
     reader sees the division of labour before reading a single word. */
  tree: function(f){
    return el('div', { class: 'trees' }, f.trees.map(function(T){
      return el('div', { class: 'tr-box' }, [
        el('div', { class: 'tr-head' }, [
          el('b', { text: T.root }),
          T.sub ? el('span', { text: T.sub }) : null
        ]),
        el('div', { class: 'tr-rows' }, T.rows.map(function(r){
          return el('div', { class: 'tr-row d' + r[0] + ' k-' + r[2] }, [
            el('code', { text: r[1] }),
            el('span', { html: inline(r[3]) })
          ]);
        }))
      ]);
    }));
  },

  /* An ordered procedure. Numbered because the content really is a
     sequence -- the numbers are the information, not decoration. */
  flow: function(f){
    var kids = f.steps.map(function(s, i){
      return el('div', { class: 'fl-step' }, [
        el('b', { text: String(i + 1) }),
        el('div', { class: 'fl-body' }, [
          el('strong', { html: inline(s[0]) }),
          el('span', { html: inline(s[1]) })
        ])
      ]);
    });
    return el('div', null, [
      el('div', { class: 'flow' }, kids),
      f.note ? el('div', { class: 'fl-note', html: inline(f.note) }) : null
    ]);
  },

  /* Before and after, with the reason on the right. Two monospace
     columns because the whole point is comparing two literal strings. */
  swap: function(f){
    var kids = f.rows.map(function(r){
      return el('div', { class: 'sw-row' }, [
        el('code', { class: 'sw-a', text: r[0] }),
        el('i', { text: '→' }),
        el('code', { class: 'sw-b', text: r[1] }),
        el('span', { html: inline(r[2]) })
      ]);
    });
    return el('div', null, [
      el('div', { class: 'sw-head' }, [
        el('span', { text: 'trong template' }),
        el('span', { text: 'sau khi thay' })
      ]),
      el('div', { class: 'swap' }, kids),
      f.note ? el('div', { class: 'fl-note', html: inline(f.note) }) : null
    ]);
  },

  levels: function(f){
    return el('div', null, f.levels.map(function(L){
      return el('div', { class: 'lvl' }, [
        el('div', { class: 'lvl-h' }, [
          el('span', { text: L.name + '  ' }),
          el('span', { text: L.note })
        ])
      ].concat(L.tools.map(function(t){
        return el('div', { class: 'tool' }, [
          el('b', { text: t[0] }), el('span', { html: inline(t[1]) })
        ]);
      })));
    }));
  },

  routes: function(f){
    return el('div', null, [
      el('div', { class: 'routes-top', text: f.top }),
      el('div', { class: 'routes' }, f.routes.map(function(r){
        return el('div', { class: 'rt' }, [
          el('b', { text: r[0] }), el('span', { html: inline(r[1]) })
        ]);
      })),
      el('div', { class: 'routes-bot', text: f.bottom })
    ]);
  },

  gates: function(f){
    return el('div', { class: 'gates' }, f.rows.map(function(r){
      return el('div', { class: 'gt' }, [
        el('b', { html: inline(r[0]) }), el('span', { html: inline(r[1]) })
      ]);
    }));
  }
};


/* ===================================================================
   LAYER 3 . LOGIC
   Binds DATA to COMPONENTS. The only layer that touches STATE.
   Pipeline:  SRC -> sections(front | body | footer) -> MD.parse
                  -> MD.render -> DOM -> table of contents
   Both views read the SAME text, so they cannot drift apart.
   =================================================================== */

/* front matter (title + lede) | body | footer, split on the outer rules */
function sections(){
  var t = SRC.replace(/^﻿/, '');
  var first = t.indexOf('\n---\n');
  var last = t.lastIndexOf('\n---\n');
  var head = t.slice(0, first).split('\n');
  return {
    title: (head.filter(function(l){ return l.indexOf('# ') === 0; })[0] || '# ').slice(2),
    lede: head
           .filter(function(l){ return l.indexOf('> ') === 0; })
           .map(function(l){ return l.slice(2); }),
    body: t.slice(first + 5, last),
    footer: t.slice(last + 5).split('\n\n')
             .map(function(p){ return p.trim(); })
             .filter(Boolean)
  };
}

/* the copy-out markdown drops layout directives; prose and ASCII stay */
function forCopy(){
  return SRC.split('\n')
    .filter(function(l){ return !/^@(fig:|endfig|box:|endbox)/.test(l); })
    .join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}

function slug(s, i){
  var base = String(s).toLowerCase()
    .replace(/[^a-z0-9À-ỹ]+/g, '-')
    .replace(/^-+|-+$/g, '').slice(0, 44);
  return (base || 'muc') + '-' + i;
}

/* ---- rendering -------------------------------------------------- */

function buildToc(root){
  var toc = document.getElementById('toc');
  toc.textContent = '';
  var heads = root.querySelectorAll('h2, h3');
  var n = 0;
  Array.prototype.forEach.call(heads, function(h){
    n++;
    if(!h.id) h.id = slug(h.textContent, n);
    var isPart = h.tagName === 'H2';
    var label = h.textContent;
    if(isPart){
      var eb = h.querySelector('.eyebrow');
      if(eb) label = eb.textContent + ' — ' + label.slice(eb.textContent.length);
    }
    var a = el('a', {
      href: '#' + h.id,
      class: isPart ? 'part' : 'lv3',
      text: label
    });
    a.addEventListener('click', function(){ if(!wide()) setNav(false); });
    toc.appendChild(a);
  });
}

function render(){
  var s = sections();

  var h1 = document.getElementById('title');
  h1.textContent = s.title;
  document.title = s.title;

  var lede = document.getElementById('lede');
  lede.textContent = '';
  s.lede.forEach(function(p){ lede.appendChild(el('p', { html: inline(p) })); });

  var doc = document.getElementById('doc');
  doc.textContent = '';
  doc.appendChild(MD.render(MD.parse(s.body)));

  var foot = document.getElementById('foot');
  foot.textContent = '';
  s.footer.forEach(function(p){ foot.appendChild(el('p', { html: inline(p) })); });

  document.getElementById('mdtext').textContent = forCopy();

  buildToc(doc);

  var isDoc = STATE.view === 'doc';
  document.getElementById('docview').hidden = !isDoc;
  document.getElementById('md').hidden = isDoc;
  var vb = document.getElementById('viewbtn');
  vb.textContent = isDoc ? I18N.md : I18N.doc;
  vb.setAttribute('aria-pressed', isDoc ? 'false' : 'true');

  /* no anchors to jump to in the markdown view */
  var nb = document.getElementById('navbtn');
  nb.hidden = !isDoc;
  if(!isDoc && STATE.nav) setNav(false);

  spy();
}

/* ---- controls ---------------------------------------------------- */

function wide(){ return (window.innerWidth || 1280) >= 1180; }

function setView(v){ STATE.view = v; render(); }

function setNav(open){
  STATE.nav = open;
  document.getElementById('nav').classList.toggle('open', open);
  document.getElementById('scrim').hidden = !open || wide();
  document.getElementById('navbtn').setAttribute('aria-expanded', open ? 'true' : 'false');
}

function copyMd(){
  var btn = document.getElementById('copybtn');
  var text = document.getElementById('mdtext').textContent;
  function flash(msg){
    var old = btn.textContent; btn.textContent = msg;
    setTimeout(function(){ btn.textContent = old; }, 1600);
  }
  function fallback(){
    try{
      var r = document.createRange();
      r.selectNodeContents(document.getElementById('mdtext'));
      var sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(r);
      var ok = false;
      try{ ok = document.execCommand('copy'); }catch(e){}
      flash(ok ? I18N.done : 'Đã bôi đen — Cmd/Ctrl+C');
    }catch(e){ flash('Bôi đen thủ công'); }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ flash(I18N.done); }, fallback);
  } else fallback();
}

/* ---- scrollspy ---------------------------------------------------- */

var spyTimer = null;
function spy(){
  if(spyTimer) return;
  spyTimer = setTimeout(function(){
    spyTimer = null;
    var links = document.querySelectorAll('#toc a');
    var best = null, bestTop = -1e9;
    Array.prototype.forEach.call(links, function(a){
      var t = document.getElementById(a.getAttribute('href').slice(1));
      if(!t) return;
      var top = t.getBoundingClientRect().top - 90;
      if(top <= 0 && top > bestTop){ bestTop = top; best = a; }
    });
    Array.prototype.forEach.call(links, function(a){
      a.classList.toggle('on', a === best);
    });
  }, 90);
}

/* ---- wiring ------------------------------------------------------- */

function boot(){
  document.getElementById('kick').textContent = I18N.kick;
  document.getElementById('navhead').textContent = I18N.navHead;
  document.getElementById('copybtn').textContent = I18N.copy;
  document.getElementById('mdnote').textContent = I18N.mdNote;
  document.getElementById('navbtn').textContent = I18N.contents;

  document.getElementById('viewbtn').addEventListener('click', function(){
    setView(STATE.view === 'doc' ? 'md' : 'doc');
  });
  document.getElementById('navbtn').addEventListener('click', function(){
    setNav(!STATE.nav);
  });
  document.getElementById('scrim').addEventListener('click', function(){ setNav(false); });
  document.getElementById('copybtn').addEventListener('click', copyMd);

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && STATE.nav) setNav(false);
  });
  window.addEventListener('scroll', spy, { passive: true });
  window.addEventListener('resize', function(){
    setNav(wide() ? false : STATE.nav);
  });

  render();
  setNav(false);
}

boot();
</script>
