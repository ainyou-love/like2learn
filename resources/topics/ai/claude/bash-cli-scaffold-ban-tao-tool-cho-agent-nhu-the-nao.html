<script type="text/plain" id="src"># bash-cli-scaffold: bạn tạo tool cho agent như thế nào

> Phần 1 — Một skill không nghĩ ra bộ khung CLI. Nó chưng cất bộ khung đó từ hai công cụ đã chạy thật, và có thể đo được mức độ trung thành.
> Phần 2 — Bảy câu hỏi đầu vào, mười bốn file đầu ra, ba lệnh chạy được ngay khi vừa sinh xong.
> Phần 3 — Bên trong: bộ giải interpreter tự re-exec, cỗ máy `settings.json`, và những thứ bị cắt có chủ đích.

---

# PHẦN 1 — Bằng chứng: 13 dòng, không một dòng logic

## Vấn đề mà skill này giải

Viết một công cụ bash nhiều file luôn bắt đầu bằng cùng một buổi chiều lãng phí. Bạn quyết định lại chỗ đặt `bin/` và `lib/`, viết lại `die`, viết lại `log_info`, viết lại cái hàm ghi file nguyên tử mà lần trước bạn đã viết đúng rồi. Rồi hai tháng sau, dự án thứ ba của bạn có một `atomic_write` khác với dự án thứ hai, và bạn không nhớ bản nào đúng.

`bash-cli-scaffold` là một Claude Code skill dựng sẵn toàn bộ bộ khung đó. Nhưng điều đáng học không phải là "nó tạo file cho bạn" — bất kỳ template nào cũng làm được. Điều đáng học là **bộ khung ấy đến từ đâu**.

## Nó không được tưởng tượng ra. Nó được đo.

Skill này tự mô tả là dựng theo "v2 conventions" của hai dự án có thật trong cùng repo:

- `scripts/bash/capture-cmd/` — bản lặp thứ nhất (v1), 21 file, 2.012 dòng shell và bats.
- `claude-customization/claude-global-rules-bootstrap/` — bản lặp thứ hai (v2), 8 lib module, 17 file bats, 3.344 dòng.

Cách thường thấy để kiểm chứng một câu như vậy là đọc lướt rồi gật đầu. Cách tốt hơn là đem template ra thay tên biến ngược lại rồi `diff` với file gốc. Kết quả:

@fig:proof
    lib/_bootstrap.sh   45/45   logic trùng khít với capture-cmd
    lib/common.sh       13      dòng khác biệt — cả 13 đều là comment
    lib/tools.sh        4/4     ánh xạ 1:1 từ capture-cmd/lib/_probe.sh
    lib/settings.sh     5/6     giữ 5 hàm, bỏ cc_settings_get
@endfig

Đây là con số đáng nhớ nhất của cả trang này. Đem `templates/lib/common.sh` thay `__ns__` → `scp`, `__PKG__` → `SCP`, rồi `diff` với `lib/common.sh` thật trong `claude-global-rules-bootstrap`: **13 dòng lệch, và không một dòng nào trong đó là code.** Tám dòng là khối comment liệt kê hàm mà template thêm vào; năm dòng còn lại là comment được viết lại hoặc thêm bớt. Toàn bộ `require_bash_4`, bốn hàm log, `die`, `atomic_write`, `absolute_path`, `detect_os` — giống nhau từng ký tự.

`lib/_bootstrap.sh` còn sạch hơn: 45 dòng, khác bản `capture-cmd` đúng ở chỗ biến cục bộ mang hai dấu gạch dưới thay vì một (`__cc_settings` so với `_cc_settings`) — hệ quả của quy ước đặt marker, không phải khác biệt hành vi.

## Vì sao điều đó quan trọng hơn vẻ ngoài

Một template được viết ra bằng trí nhớ sẽ chứa những đoạn code chưa bao giờ chạy. Một template được trích ra từ mã đang chạy thì mang theo cả những quyết định mà tác giả đã trả giá để học được: vì sao `_bootstrap.sh` phải an toàn với bash 3.2, vì sao `atomic_write` đọc stdin thay vì nhận chuỗi, vì sao `detect_os` có cửa hậu cho test.

@fig:bars
    claude-global-rules-bootstrap   3.344 dòng
    capture-cmd                     2.012 dòng
    bộ khung sinh ra                  567 dòng
@endfig

5.356 dòng shell đã chạy thật được nén xuống còn 567 dòng bộ khung. Phần bị bỏ lại chính là phần thuộc về từng bài toán riêng: `installer.sh`, `manifest.sh`, `state.sh`, `settings-merge.sh` của bootstrap; `_hooks.sh`, `_render.sh`, `_capture.sh` của capture-cmd. Phần giữ lại là bốn module mà **cả hai dự án đều có**.

## Quyết định thiết kế đáng biết nhất: tách làm hai skill

`bash-cli-scaffold` cố tình không biết cách sửa code. Nó có một skill anh em, `bash-cli-pattern` (7 file, 856 dòng), và phần mô tả của cả hai chỉ thẳng sang nhau:

> Use this ONLY for new projects starting from an empty directory; for adding subcommands, lib modules, or other edits to existing projects, use `bash-cli-pattern` instead.

Đây không phải sự phân chia tuỳ tiện. Hai việc có hình dạng khác nhau:

- **Sinh mới** là một hàm: đầu vào là bảy câu trả lời, đầu ra là mười bốn file, không cần đọc gì trong thư mục đích vì thư mục đích đang rỗng.
- **Sửa đổi** thì ngược lại: phải đọc code đang có trước, rồi bắt chước nó. `bash-cli-pattern` viết rõ điều này — thêm một subcommand thì "đọc 1-2 hàm `cmd_*` anh em trong cùng file, khớp cấu trúc của chúng".

Gộp hai việc vào một skill sẽ tạo ra một skill lúc nào cũng phải hỏi "đây là dự án mới hay cũ?" trước khi làm bất cứ điều gì. Tách ra thì câu hỏi ấy biến mất — nó đã được trả lời ở bước chọn skill.

# PHẦN 2 — Bề mặt bạn thật sự chạm vào

## Bảy câu hỏi, hỏi một lần

`SKILL.md` yêu cầu hỏi trọn bộ đầu vào trong **một** lượt — nguyên văn: "single AskUserQuestion batch — don't drip them out". Đây là chi tiết nhỏ nhưng nói nhiều về cách viết skill: nhỏ giọt câu hỏi biến một tác vụ ba mươi giây thành bảy lượt hội thoại.

| Đầu vào | Ví dụ | Dùng để làm gì |
|---|---|---|
| Tên dự án (kebab-case) | `pg-migrate` | tên thư mục, tên file `<name>.sh`, tiêu đề help |
| Namespace hàm (2-3 ký tự) | `pgm` | tiền tố hàm: `pgm_settings_scan` |
| Tiền tố biến môi trường | `PGM` | `PGM_PKG_DIR`, `PGM_LOG_LEVEL` |
| Danh sách subcommand ban đầu | `apply`, `rollback` | nhánh dispatcher + hàm `cmd_*` rỗng |
| Thư mục đích | `scripts/bash/pg-migrate/` | nơi ghi cây thư mục |
| Tool ngoài cần dùng | `psql`, `jq` | mục khởi tạo trong `tools.json.example` |
| Kiểu changelog | keep-a-changelog | định dạng `CHANGELOG.md` |

Bốn thứ skill tự quyết, không hỏi: luôn dùng `#!/usr/bin/env bash`; luôn kèm `_bootstrap.sh`; **luôn có `init` và `doctor` kể cả khi bạn không liệt kê**; luôn có `.shellcheckrc`, `.editorconfig`, `VERSION` bắt đầu ở `0.1.0`.

## Mười bốn file đi ra

@fig:tree
    entry     __NAME__.sh 168 dòng — 6 khối, dispatcher ở cuối
    lib       _bootstrap.sh 45 · common.sh 152 · settings.sh 116 · tools.sh 86
    config    tools.json.example · bootstrap.json
    tests     helpers/load.bash 17 · unit/common.bats 46 — 7 @test
    meta      VERSION · CHANGELOG.md · .gitignore · .shellcheckrc · .editorconfig
@endfig

Cộng lại: 14 file, 567 dòng shell ở phần entry + lib, 63 dòng test. Thêm hai thư mục rỗng (`tests/fixtures/`, `docs/`) được tạo sẵn để có chỗ đặt.

Ngay sau khi sinh xong, ba lệnh này chạy được mà không cần viết thêm dòng nào:

    <name>.sh --help          # màn hình help dựng đầy đủ
    <name>.sh init            # quét môi trường, ghi settings.json
    <name>.sh doctor          # đối chiếu settings.json với môi trường sống

Các `cmd_*` do bạn đặt tên thì chỉ là chỗ trống: mỗi hàm gọi `die 1 "subcommand <name> not implemented yet"`. Bộ khung không đoán bạn muốn gì.

## Vòng đời `settings.json`

Đây là phần mà cả hai dự án gốc đều có và là lý do bộ khung đáng dùng. Ý tưởng: **môi trường máy là một thứ cần được chụp lại và kiểm tra trôi dạt**, không phải thứ dò lại mỗi lần chạy.

@fig:cycle
    1  init đọc config/tools.json.example để biết cần tool nào
    2  tool_probe từng tool: resolve đường dẫn, đọc version, đoán variant
    3  jq -n dựng JSON, atomic_write xuống settings.json
    4  doctor quét lại môi trường sống rồi diff với bản đã lưu
    5  doctor --fix sao lưu .bak rồi ghi đè bằng bản quét mới
    → quay lại bước 2
@endfig

Năm hàm trong `lib/settings.sh` chia nhau vòng lặp này: `scan` (chỉ in ra stdout, không ghi đĩa), `init` (từ chối ghi đè nếu file đã tồn tại, trừ khi có `--force`), `diff` (in bảng so sánh từng tool), `repair` (sao lưu rồi ghi lại), và `assert` — hàm im lặng, chỉ trả mã thoát khác 0 khi phát hiện trôi dạt, dành cho việc chặn trong script khác.

`settings.json` **không** được sinh lúc scaffold. `SKILL.md` nêu lý do rõ ràng: giữ cho bộ khung tái lập được, không nhét đường dẫn riêng của một máy vào file khởi tạo. Nó nằm trong `.gitignore` ngay từ đầu; thứ được commit là `tools.json.example`.

## Ba hàm resolve tool

`lib/tools.sh` ánh xạ 1:1 từ `capture-cmd/lib/_probe.sh`, chỉ đổi tên:

| Bộ khung | Bản gốc trong capture-cmd | Làm gì |
|---|---|---|
| `tool_resolve` | `cc_resolve` | `settings.json` trước, `command -v` sau |
| `tool_version` | `cc_version` | thử `--version`, rồi `-V`, rồi `-v` |
| `tool_variant` | `cc_variant` | đoán `gnu` / `apple` / `bsd` / `unknown` |
| `tool_probe` | `cc_probe_tool` | gộp cả ba, trả về JSON |

`tool_variant` là hàm dễ bị xem nhẹ nhất nhưng lại là lý do bộ khung tồn tại trên macOS: `date`, `sed`, `grep` bản BSD và bản GNU nhận cờ khác nhau, và một script chạy đúng trên CI Linux có thể hỏng âm thầm trên máy lập trình viên. Ghi lại `variant` lúc `init` biến sự khác biệt đó thành dữ liệu thay vì thành một bug lúc 11 giờ đêm.

# PHẦN 3 — Bên trong bộ khung

## Bộ giải interpreter: file chạy trước mọi thứ khác

`lib/_bootstrap.sh` là thứ đầu tiên entry point `source`, trước cả `common.sh`. Bài toán nó giải: trên macOS, `/bin/bash` là bản 3.2 từ năm 2007, và khi script được gọi từ `cron` hay `launchd` với `PATH` bị rút gọn, đó chính là interpreter mà kernel chọn — dù bạn đã cài bash 5 bằng Homebrew.

@fig:resolver
    kernel đã chọn một bản bash nào đó
    có settings.json + có jq  →  đọc .tools.bash.path, exec lại chính mình bằng bash đó
    thiếu settings.json hoặc thiếu jq  →  đi tiếp, không lỗi
    bash < 4 sau khi đã qua hai nhánh trên  →  in cách khắc phục rồi exit 1
@endfig

Ba chi tiết trong 45 dòng đó đáng học riêng:

**File tự cấm mình dùng bash 4.** Comment đầu file viết rõ: không mảng kết hợp, không `${var,,}`, không `[[ =~ ]]`. Nó phải chạy được dưới chính cái interpreter mà nó sắp thay thế — nếu nó dùng cú pháp bash 4, nó sẽ chết trước khi kịp sửa vấn đề.

**Một biến cờ chặn vòng lặp re-exec.** `__PKG___BASH_BOOTSTRAPPED` được `export` trước khi `exec`. Thiếu nó, nếu `.tools.bash.path` trỏ tới một bản bash mà `$BASH` báo cáo dưới tên khác, script sẽ tự gọi lại chính nó vô hạn.

**Thông báo lỗi kèm cách sửa, không chỉ kèm lời than.** Khi rơi xuống cổng bash-4, nó in hai dòng: `brew install bash` và `<name>.sh doctor --fix`. Người dùng không phải đi tra.

## Hai lớp chặn bash cũ, nhưng chỉ một lớp thật sự canh cửa

@fig:gate
    _bootstrap.sh   chạy khi được source — đây là lớp thật sự chặn
    require_bash_4  được định nghĩa trong common.sh, entry point không gọi
@endfig

`lib/common.sh` định nghĩa `require_bash_4()` và comment của nó ghi "call from entry point". Nhưng entry point mà bộ khung sinh ra không gọi hàm đó ở đâu cả — lớp chặn thực sự là khối `BASH_VERSINFO[0] -lt 4` nằm cuối `_bootstrap.sh`, và nó chạy tự động vì `_bootstrap.sh` được `source` ngay dòng đầu.

Điều này đáng biết khi bạn đọc code: `require_bash_4` là một hàm công khai để bạn gọi trong `bin/` wrapper của riêng mình — những script đó không nhất thiết đi qua `_bootstrap.sh`. Dự án `claude-global-rules-bootstrap` thật thì có gọi nó, ở dòng 34 của `bin/sync-custom-instruction`.

## Cỗ máy placeholder

Template không dùng công cụ template nào cả. Chúng là file shell hợp lệ với marker nhúng thẳng vào, và bước sinh chỉ là thay chuỗi theo nghĩa đen. Tám marker khác nhau, 113 lần xuất hiện trong 14 file:

@fig:markers
    __NAME__ (21)                    → pg-migrate
    __ns__ (47)                      → pgm
    __PKG__ (38)                     → PGM
    __DESC__ (2)                     → dòng mô tả một câu
    __NS__ (2)                       → tên component mặc định khi log
    __SUBCOMMANDS_HELP_LINES__ (1)   → các dòng trong màn hình help
    __STUB_CMD_FUNCTIONS__ (1)       → khối hàm cmd_* rỗng
    __DISPATCH_STUB_ARMS__ (1)       → các nhánh case trong dispatcher
@endfig

Điểm tinh tế nhất nằm ở số dấu gạch dưới. Bash có quy ước đặt tiền tố `_` cho hàm nội bộ, nên một hàm riêng tư trong namespace `pgm` phải tên là `_pgm_log`. Trong template, thứ đó được viết là `___ns___` — ba gạch dưới, `ns`, ba gạch dưới. Sau khi thay `__ns__` → `pgm`, chuỗi tự trở thành `_pgm_`. Tương tự `___PKG___` → `_PGM_` cho các source guard như `_PGM_COMMON_SOURCED`.

Cách này gọn nhưng đòi hỏi thay theo đúng nghĩa đen và phân biệt hoa thường. `references/placeholders.md` nhấn mạnh chính điểm đó: "`sed s/__ns__/pgm/` sẽ không khớp `__NS__`" — và trong `common.sh` thì cả hai dạng cùng tồn tại, phục vụ hai mục đích khác nhau.

Ba marker cuối bảng không phải thay-một-từ mà là thay-một-khối: chúng là chỗ mà danh sách subcommand bạn khai báo được dệt vào ba nơi cùng lúc — màn hình help, các hàm rỗng, và dispatcher. Ba nơi này phải khớp nhau, và `bash-cli-pattern` liệt kê việc quên cập nhật help là lỗi chứ không phải thiếu sót nhỏ: "help renderer là một hệ thống con thật sự; thiếu mục trong đó là bug".

## Bộ khung đạt bao nhiêu trên mười quy ước

`bash-cli-pattern` định nghĩa 10 bất biến cho pattern này. Đối chiếu với thứ mà scaffold thật sự sinh ra:

@fig:invariants
    1  Entry point 6 khối theo thứ tự cố định
    2  #!/usr/bin/env bash + _bootstrap.sh
    3  bin/ để chạy, lib/ chỉ để source
    4  Hàm trong lib đều có namespace
    5  Nhận cả --flag value lẫn --flag=value
    6  Bề mặt chẩn đoán init + doctor + assert
    7  Help tập trung + help từng lệnh + help lib
    8  Log ra stderr, dữ liệu ra stdout
    9  JSON dựng bằng jq -n --arg + atomic_write
    10 .shellcheckrc + .editorconfig + VERSION + CHANGELOG.md
@endfig

Tám bất biến được thoả trọn vẹn ngay lúc sinh. Hai cái còn lại là phần bộ khung cố tình để ngỏ:

**Bất biến 3 — `bin/`.** Cây thư mục mặc định không có `bin/`. `references/output-tree.md` xếp nó vào mục "không được sinh ra", với lý do: wrapper `bin/` chỉ có ý nghĩa khi bạn đã biết mình muốn tách lệnh nào ra thành binary riêng. `capture-cmd` có 6 file trong `bin/`; `claude-global-rules-bootstrap` có 1. Không có con số mặc định nào đúng.

**Bất biến 7 — `help lib`.** Bộ khung sinh ra `show_top_help` và `show_sub_help` với ba nhánh `init` / `doctor` / `version`. `help lib` — lệnh in ra danh sách module trong `lib/` — chỉ tồn tại trong `capture-cmd` (`lib/_help.sh`, dòng 101). Nó cần biết dự án của bạn có những lib nào, mà lúc scaffold thì mới có đúng bốn lib mặc định.

## Bốn thứ skill từ chối làm

`SKILL.md` dành hẳn một mục cho việc này, và mục đó đáng đọc hơn mục liệt kê tính năng:

- **Không chạy `init` hộ bạn.** Sinh `settings.json` là một hành động có chủ ý của người dùng, vì nó ghi đường dẫn tuyệt đối của máy đó vào đĩa.
- **Không viết thân hàm subcommand.** Mọi `cmd_*` do bạn đặt tên đều là `die 1 "not implemented"`.
- **Không đăng ký vào `PATH`, alias hay registry nào.** Bạn tự nối nó vào shell của mình.
- **Không sinh test ngoài một bộ smoke test.** `tests/unit/common.bats` có 7 `@test` kiểm tra rằng `common.sh` source sạch và các helper tồn tại — trong đó có một test bật cửa hậu `__PKG___OS_OVERRIDE` để ép `detect_os` trả về `linux` mà không cần đổi máy.

Và một quy tắc về thứ tự: nếu bạn yêu cầu cả bốn thứ trên trong cùng một lượt, skill làm scaffold trước, rồi mới xử lý phần còn lại — và chuyển sang `bash-cli-pattern` nếu phần còn lại là sửa file vừa sinh.

## Bước kiểm tra cuối

Sau khi ghi xong toàn bộ file, skill chạy ba lệnh chỉ-đọc: `chmod +x` cho entry point, gọi `--help`, và chạy `shellcheck` nếu máy có cài. Câu kết của mục đó dứt khoát: nếu `--help` không hiện ra, bộ khung hỏng — dừng lại và sửa trước khi báo xong.

Đó là kiểu điều kiện nghiệm thu đáng học khi bạn tự viết skill: một lệnh chạy được, rẻ, và thất bại một cách ồn ào. Không phải "đọc lại file xem có đúng không".

/* ===================================================================
   LAYER 2 . COMPONENTS
   Pure: data in, DOM out. Must not read STATE.
   =================================================================== */

function esc(s){ return String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function el(tag, attrs, kids){
  var n = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k === 'html') n.innerHTML = attrs[k];
    else if(k === 'text') n.textContent = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function(c){ if(c) n.appendChild(c); });
  return n;
}

/* Code spans are pulled out before escaping and put back after, so that
   markup inside them is never interpreted. The sentinel is ordinary text,
   not a control character, so the source stays copy-paste safe. */
function inline(s){
  var keep = [];
  s = String(s).replace(/`([^`]+)`/g, function(_, c){
    keep.push(c); return 'K0DE' + (keep.length - 1) + 'K0DE';
  });
  s = esc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*]+)\*(?![*\w])/g, '$1<em>$2</em>');
  return s.replace(/K0DE(\d+)K0DE/g, function(_, i){
    return '<code>' + esc(keep[+i]) + '</code>';
  });
}

var BLOCK = {
  h: function(b){
    var tag = b.level === 1 ? 'h2' : b.level === 2 ? 'h3' : 'h4';
    var m = /^(PHAN|PHẦN|PART)\s+(\d+)\s*—\s*(.*)$/.exec(b.text);
    if(tag === 'h2' && m){
      return el('h2', null, [
        el('span', { class: 'eyebrow', text: m[1] + ' ' + m[2] }),
        el('span', { html: inline(m[3]) })
      ]);
    }
    return el(tag, { html: inline(b.text) });
  },
  p:  function(b){ return el('p', { html: inline(b.text) }); },
  ul: function(b){ return el('ul', null, b.items.map(function(t){
        return el('li', { html: inline(t) }); })); },
  ol: function(b){ return el('ol', null, b.items.map(function(t){
        return el('li', { html: inline(t) }); })); },
  quote: function(b){ return el('blockquote', null, b.items.map(function(t){
        return el('p', { html: inline(t) }); })); },
  code: function(b){
    return el('div', { class: 'pre' }, [ el('pre', { text: b.text }) ]);
  },
  hr: function(){ return el('hr'); },
  table: function(b){
    var head = el('tr', null, b.head.map(function(c){
      return el('th', { html: inline(c) }); }));
    var body = b.rows.map(function(r){
      return el('tr', null, r.map(function(c){ return el('td', { html: inline(c) }); }));
    });
    return el('div', { class: 'tw' }, [
      el('table', null, [ el('thead', null, [head]), el('tbody', null, body) ])
    ]);
  },
  fig: function(b){
    var f = FIG[b.id];
    if(!f) return el('p', { text: '[missing figure: ' + b.id + ']' });
    var render = FIGURE[f.type];
    if(!render) return el('p', { text: '[no renderer: ' + f.type + ']' });
    return el('figure', null, [
      el('div', { class: 'fig' }, [ render(f) ]),
      f.cap ? el('figcaption', { html: inline(f.cap) }) : null
    ]);
  }
};

/* -- markdown ------------------------------------------------------- */

var MD = {
  parse: function(src){
    var lines = src.split('\n'), out = [], i = 0;
    function blank(s){ return !s.trim(); }
    function cells(s){
      return s.trim().replace(/^\|/, '').replace(/\|$/, '')
              .split('|').map(function(c){ return c.trim(); });
    }

    while(i < lines.length){
      var ln = lines[i];
      if(blank(ln)){ i++; continue; }

      /* figure directive: keep the id, skip the ASCII fallback body */
      var fm = /^@fig:(\S+)\s*$/.exec(ln);
      if(fm){
        var id = fm[1]; i++;
        while(i < lines.length && !/^@endfig\s*$/.test(lines[i])) i++;
        i++;
        out.push({ t: 'fig', id: id });
        continue;
      }

      var hm = /^(#{1,4})\s+(.*)$/.exec(ln);
      if(hm){ out.push({ t: 'h', level: hm[1].length, text: hm[2].trim() }); i++; continue; }

      if(/^---\s*$/.test(ln)){ out.push({ t: 'hr' }); i++; continue; }

      if(/^\|/.test(ln) && i + 1 < lines.length && /^\|[\s:|-]+\|?\s*$/.test(lines[i + 1])){
        var head = cells(ln); i += 2;
        var rows = [];
        while(i < lines.length && /^\|/.test(lines[i])){ rows.push(cells(lines[i])); i++; }
        out.push({ t: 'table', head: head, rows: rows });
        continue;
      }

      if(/^>\s?/.test(ln)){
        var q = [];
        while(i < lines.length && /^>\s?/.test(lines[i])){
          q.push(lines[i].replace(/^>\s?/, '')); i++;
        }
        out.push({ t: 'quote', items: q });
        continue;
      }

      var lm = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(ln);
      if(lm){
        var ordered = /\d/.test(lm[2]), items = [];
        while(i < lines.length){
          var m2 = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(lines[i]);
          if(m2){ items.push(m2[3]); i++; }
          else if(/^\s{2,}\S/.test(lines[i]) && items.length){
            items[items.length - 1] += ' ' + lines[i].trim(); i++;
          } else break;
        }
        out.push({ t: ordered ? 'ol' : 'ul', items: items });
        continue;
      }

      /* Four-space indented code. Blank lines inside one block are kept,
         then trimmed off the end, so a diagram split by blank lines stays
         a single block instead of becoming several. */
      if(/^ {4}\S/.test(ln)){
        var buf = [];
        while(i < lines.length){
          if(/^ {4}/.test(lines[i])){ buf.push(lines[i].slice(4)); i++; }
          else if(blank(lines[i]) && /^ {4}/.test(lines[i + 1] || '')){ buf.push(''); i++; }
          else break;
        }
        while(buf.length && !buf[buf.length - 1].trim()) buf.pop();
        out.push({ t: 'code', text: buf.join('\n') });
        continue;
      }

      var para = [ln.trim()]; i++;
      while(i < lines.length && !blank(lines[i]) &&
            !/^(#{1,4}\s|@fig:|@endfig|---\s*$|\||>\s?|\s*([-*]|\d+\.)\s|\s{4}\S)/.test(lines[i])){
        para.push(lines[i].trim()); i++;
      }
      out.push({ t: 'p', text: para.join(' ') });
    }
    return out;
  },

  render: function(blocks){
    var frag = document.createDocumentFragment();
    blocks.forEach(function(b){
      var fn = BLOCK[b.t];
      if(fn) frag.appendChild(fn(b));
    });
    return frag;
  }
};

/* ===================================================================
   LAYER 3 . LOGIC
   Binds DATA to COMPONENTS. The only layer that touches STATE.
   Pipeline:  SRC -> sections(front | body | footer) -> MD.parse
                  -> MD.render -> DOM -> table of contents
   Both views read the SAME text, so they cannot drift apart.
   =================================================================== */

/* front matter (title + lede) | body | footer, split on the outer rules */
function sections(){
  var t = SRC.replace(/^﻿/, '');
  var first = t.indexOf('\n---\n');
  var last = t.lastIndexOf('\n---\n');
  var head = t.slice(0, first).split('\n');
  return {
    title: (head.filter(function(l){ return l.indexOf('# ') === 0; })[0] || '# ').slice(2),
    lede: head
           .filter(function(l){ return l.indexOf('> ') === 0; })
           .map(function(l){ return l.slice(2); }),
    body: t.slice(first + 5, last),
    footer: t.slice(last + 5).split('\n\n')
             .map(function(p){ return p.trim(); })
             .filter(Boolean)
  };
}

/* the copy-out markdown drops layout directives; prose and ASCII stay */
function forCopy(){
  return SRC.split('\n')
    .filter(function(l){ return !/^@(fig:|endfig|box:|endbox)/.test(l); })
    .join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}

function slug(s, i){
  var base = String(s).toLowerCase()
    .replace(/[^a-z0-9À-ỹ]+/g, '-')
    .replace(/^-+|-+$/g, '').slice(0, 44);
  return (base || 'muc') + '-' + i;
}

/* ---- rendering -------------------------------------------------- */

function buildToc(root){
  var toc = document.getElementById('toc');
  toc.textContent = '';
  var heads = root.querySelectorAll('h2, h3');
  var n = 0;
  Array.prototype.forEach.call(heads, function(h){
    n++;
    if(!h.id) h.id = slug(h.textContent, n);
    var isPart = h.tagName === 'H2';
    var label = h.textContent;
    if(isPart){
      var eb = h.querySelector('.eyebrow');
      if(eb) label = eb.textContent + ' — ' + label.slice(eb.textContent.length);
    }
    var a = el('a', {
      href: '#' + h.id,
      class: isPart ? 'part' : 'lv3',
      text: label
    });
    a.addEventListener('click', function(){ if(!wide()) setNav(false); });
    toc.appendChild(a);
  });
}

function render(){
  var s = sections();

  var h1 = document.getElementById('title');
  h1.textContent = s.title;
  document.title = s.title;

  var lede = document.getElementById('lede');
  lede.textContent = '';
  s.lede.forEach(function(p){ lede.appendChild(el('p', { html: inline(p) })); });

  var doc = document.getElementById('doc');
  doc.textContent = '';
  doc.appendChild(MD.render(MD.parse(s.body)));

  var foot = document.getElementById('foot');
  foot.textContent = '';
  s.footer.forEach(function(p){ foot.appendChild(el('p', { html: inline(p) })); });

  document.getElementById('mdtext').textContent = forCopy();

  buildToc(doc);

  var isDoc = STATE.view === 'doc';
  document.getElementById('docview').hidden = !isDoc;
  document.getElementById('md').hidden = isDoc;
  var vb = document.getElementById('viewbtn');
  vb.textContent = isDoc ? I18N.md : I18N.doc;
  vb.setAttribute('aria-pressed', isDoc ? 'false' : 'true');

  /* no anchors to jump to in the markdown view */
  var nb = document.getElementById('navbtn');
  nb.hidden = !isDoc;
  if(!isDoc && STATE.nav) setNav(false);

  spy();
}

/* ---- controls ---------------------------------------------------- */

function wide(){ return (window.innerWidth || 1280) >= 1180; }

function setView(v){ STATE.view = v; render(); }

function setNav(open){
  STATE.nav = open;
  document.getElementById('nav').classList.toggle('open', open);
  document.getElementById('scrim').hidden = !open || wide();
  document.getElementById('navbtn').setAttribute('aria-expanded', open ? 'true' : 'false');
}

function copyMd(){
  var btn = document.getElementById('copybtn');
  var text = document.getElementById('mdtext').textContent;
  function flash(msg){
    var old = btn.textContent; btn.textContent = msg;
    setTimeout(function(){ btn.textContent = old; }, 1600);
  }
  function fallback(){
    try{
      var r = document.createRange();
      r.selectNodeContents(document.getElementById('mdtext'));
      var sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(r);
      var ok = false;
      try{ ok = document.execCommand('copy'); }catch(e){}
      flash(ok ? I18N.done : 'Đã bôi đen — Cmd/Ctrl+C');
    }catch(e){ flash('Bôi đen thủ công'); }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ flash(I18N.done); }, fallback);
  } else fallback();
}

/* ---- scrollspy ---------------------------------------------------- */

var spyTimer = null;
function spy(){
  if(spyTimer) return;
  spyTimer = setTimeout(function(){
    spyTimer = null;
    var links = document.querySelectorAll('#toc a');
    var best = null, bestTop = -1e9;
    Array.prototype.forEach.call(links, function(a){
      var t = document.getElementById(a.getAttribute('href').slice(1));
      if(!t) return;
      var top = t.getBoundingClientRect().top - 90;
      if(top <= 0 && top > bestTop){ bestTop = top; best = a; }
    });
    Array.prototype.forEach.call(links, function(a){
      a.classList.toggle('on', a === best);
    });
  }, 90);
}

/* ---- wiring ------------------------------------------------------- */

function boot(){
  document.getElementById('kick').textContent = I18N.kick;
  document.getElementById('navhead').textContent = I18N.navHead;
  document.getElementById('copybtn').textContent = I18N.copy;
  document.getElementById('mdnote').textContent = I18N.mdNote;
  document.getElementById('navbtn').textContent = I18N.contents;

  document.getElementById('viewbtn').addEventListener('click', function(){
    setView(STATE.view === 'doc' ? 'md' : 'doc');
  });
  document.getElementById('navbtn').addEventListener('click', function(){
    setNav(!STATE.nav);
  });
  document.getElementById('scrim').addEventListener('click', function(){ setNav(false); });
  document.getElementById('copybtn').addEventListener('click', copyMd);

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && STATE.nav) setNav(false);
  });
  window.addEventListener('scroll', spy, { passive: true });
  window.addEventListener('resize', function(){
    setNav(wide() ? false : STATE.nav);
  });

  render();
  setNav(false);
}

boot();
</script>
