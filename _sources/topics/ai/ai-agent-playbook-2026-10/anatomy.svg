<svg viewBox="0 0 680 470" role="img" aria-labelledby="pb-anatomy-t"><title id="pb-anatomy-t">Micro-agent inside deterministic code</title><desc>Fetch, policy check, and execute are code; one LLM step proposes; a human gate applies only outside policy.</desc><defs><marker id="pb-anatomy-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9z" fill="var(--ink-3)"/></marker></defs><rect class="n-box" x="200" y="20" width="280" height="56" rx="8"/><text class="t t-b" x="340" y="39" text-anchor="middle" dominant-baseline="central">Fetch ticket and order</text><text class="t-s" x="340" y="58" text-anchor="middle" dominant-baseline="central">Deterministic code</text><line class="w" x1="340" y1="76" x2="340" y2="104" marker-end="url(#pb-anatomy-ah)"/><rect class="n-new" x="200" y="106" width="280" height="56" rx="8"/><text class="t t-b" x="340" y="125" text-anchor="middle" dominant-baseline="central">Propose refund plan</text><text class="t-s" x="340" y="144" text-anchor="middle" dominant-baseline="central">LLM loop, max 10 steps</text><line class="w" x1="340" y1="162" x2="340" y2="190" marker-end="url(#pb-anatomy-ah)"/><rect class="n-box" x="200" y="192" width="280" height="56" rx="8"/><text class="t t-b" x="340" y="211" text-anchor="middle" dominant-baseline="central">Policy check</text><text class="t-s" x="340" y="230" text-anchor="middle" dominant-baseline="central">Over $200 or 30 days?</text><line class="w" x1="340" y1="248" x2="340" y2="276" marker-end="url(#pb-anatomy-ah)"/><rect class="n-warn" x="200" y="278" width="280" height="56" rx="8"/><text class="t t-b" x="340" y="297" text-anchor="middle" dominant-baseline="central">Human approval</text><text class="t-s" x="340" y="316" text-anchor="middle" dominant-baseline="central">Loop pauses, resumes later</text><line class="w" x1="340" y1="334" x2="340" y2="362" marker-end="url(#pb-anatomy-ah)"/><rect class="n-box" x="200" y="364" width="280" height="56" rx="8"/><text class="t t-b" x="340" y="383" text-anchor="middle" dominant-baseline="central">Execute refund and email</text><text class="t-s" x="340" y="402" text-anchor="middle" dominant-baseline="central">Deterministic code</text><path class="w" d="M480 220 L560 220 L560 392 L484 392" marker-end="url(#pb-anatomy-ah)"/><text class="t-s" x="570" y="310" text-anchor="start">Within policy</text></svg>
