The architecture note's central claim, applied to `A-104`:

| A JSON schema proves | A JSON schema does not prove |
|---|---|
| `amount` is a number | `amount <= refundable_amount` |
| `currency` is a string | `currency` matches the original payment |
| `payment_id` is present | that payment has been captured |
| `reason` is in the enum | this refund has not already run |
| — | the caller is allowed to refund |

## 3.0 The question actually being asked

Jev is being treated as a **validation function**: feed in state, receive a typed
value, no schema error possible. Haskell is being proposed for **that same position** —
parse, validate, enforce invariants. Both sides use the same vocabulary: *type-safe*,
*total function*, *type errors are impossible*.

So the fair question is whether this is a **conflict of responsibility** — two things
competing for one slot — or an **opportunity to compose**.

> **The answer first, the proof after:** the overlap is in the *words*, not in the
> responsibility. The same phrase "type-safe" refers to two different things here.

|  | Jev | Haskell |
|---|---|---|
| "type-safe" means | the output matches the answer space you declared | relationships between values are checked at compile time |
| Guaranteed when | at runtime, on every call | at compile time, once for every run |
| Input | unstructured and untrusted | values that have already been parsed |
| Output | a `Distribution` — data | a `Value` — evidence |
| Says nothing about | whether the answer is correct | what the prose outside the system means |

In the `A-104` scenario: Jev can report that this agent means a refund rather than a
cancellation, at 0.93 — something no type system can do. But it does not know whether
`pay_8fd2` was captured, and it must not guess. Haskell knows for certain that a refund
can only come out of a `CapturedPayment`, but it cannot read the sentence the support
agent typed.

[ASSUMPTION/HIGH] The real risk is not picking the wrong side. It is using one while
believing you have the other — reading "Jev cannot hallucinate" and concluding the tool
call is now safe. The rest of Part 3 pulls those two apart.

## 3.1 What "functional" actually means for Jev

    ✓ TOTAL          no throws, no parse errors, no type errors
                     the codomain is closed and declared in advance

    ✓ PURE-ish       no state between calls, questions are independent
                     one question never becomes hidden context for another

    ✗ REFERENTIALLY TRANSPARENT
                     the output is a probability distribution, not a value
                     self-consistency is not determinism

[CONCERN] That third line decides everything else. A total function returning
`Distribution a` is **not a proof** — it is data. Let a Jev answer flow straight into
the domain as a decision and you have introduced a probability where an invariant
belongs.

    jev :: State -> Questions -> IO (Distribution Answer)
    --     ^^^^^ untrusted input          ^^^^^^^^^^^^ still untrusted output

## 3.2 Where it fits — answered in §1.4.B

The detail lives in **Part 1, section 1.4.B** (§ "B · Inside a development workflow"): the pipeline diagram marked ✓ / ~ / ✗
step by step, the table of the five positions where Jev genuinely helps, and the rule
for deciding which predicates belong to code.

The one line needed to read on: **Jev may stand before the boundary and after it,
never inside.** Before it means routing, argument extraction, and injection screening.
After it means audit triage. In between — Command, State machine, Effect — its output
is a probability, and a probability must never become an invariant.

## 3.3 Where Jev and Haskell actually meet

They do not compete on the critical path — they sit at opposite ends of it. But there
is exactly one overlap, and it is the dangerous one: **predicates currently handled as
fuzzy judgements that should have been deterministic rules.**

[JEV'S OPPORTUNITY COST] It never shows up on the invoice:

    $0.042 per million tokens makes
        "just ask the model"
    cheaper, in the short run, than
        "model the domain properly"

    → the team takes the cheap option
    → six months later there is no domain model,
      only a pile of questions and thresholds nobody dares touch

A dividing rule you can apply today:

    Can this predicate be decided from data you already hold?
        YES  → write code. Never ask the model. No exceptions.
        NO   → it needs unstructured input interpreted → model
               → the output is a Distribution
               → it passes through a threshold policy
               → only then does it become a Command

## 3.4 Who supplies which kind of correctness

| Layer | Kind of correctness | JSON schema | Jev | Typed domain |
|---|---|---|---|---|
| Structural | fields have the right types | ✓ | ✓✓ cannot fail | ✓ |
| Semantic | the values mean something | ✗ | ~ only over unstructured input | ✓✓ |
| Transition | the state moves legally | ✗ | ✗ | ✓✓ |
| Operational | the effect is controlled | ✗ | ✗ | ✓ |
| Post-condition | it reconciles | ✗ | ~ triage | ✓ |

[ASSUMPTION/HIGH] Anyone who reads the launch post and concludes their tool calls are
now safe has misread it. Jev raises structural correctness to an absolute and adds a
little semantic correctness. The three middle rows are as empty as they were.

## 3.5 Formalisation should track how dangerous the effect is

@fig:ladder
    READ       filesystem.search · git.diff · database.query
               getting it wrong costs one more read
    WRITE      update_ticket · generate_report
               getting it wrong is fixable by hand
    BUSINESS   create_order · refund · recharge_wallet
               getting it wrong costs money and trust
    CRITICAL   transfer_money · production_deploy · delete_customer
               getting it wrong cannot be undone

    Bash       ████────────────────
    Python     ██████████──────────
    Typed core ████████████████████
@endfig

## 3.6 What Haskell buys, and what it does not

What it buys — four things, and only four:

1. **Illegal states become unrepresentable.**
   `refund :: CapturedPayment -> RefundedPayment` means refunding an uncaptured
   payment will not compile.
2. **Exhaustiveness fails the build.** Add a state and every missing branch turns red.
   Python's `match` with `Literal` only turns red if strict checking is on and
   somebody runs it.
3. **Parse, don't validate, at the edge.** A `newtype Money` with a smart constructor
   removes the "has this been validated yet?" question four layers down.
4. **Commands as data with a pure interpreter.** Dry runs, replays, and audits share
   one code path.

What it does not buy:

| Claim in the note | Reality |
|---|---|
| `amount <= refundable_amount` | A runtime value from the database. No type system proves it. An `if` in every language |
| `refund not duplicated` | A unique constraint in the database. Not a typing problem |
| `caller has permission` | Runtime data. Types can force you to *remember* the check, not perform it |
| Concurrency correctness | Software transactional memory is good, but so is `SERIALIZABLE` in Postgres, already in the stack |
| `payment already captured` | **This one is a real win for the type system** |

[FACT] Of the five example lines in the note, one is a type-system advantage. The
other four are runtime checks in any language.

### The hidden cost: the foreign-function boundary

@fig:ffi
    Python orchestration
        ↓  serialise to JSON            ← types lost here
    Haskell core — parse again, smart constructors
        ↓                               ← the guarantee lives only here
    typed state transition
        ↓  serialise back to JSON       ← types lost again
    Python
@endfig

[RISK/SCALING] If Python calls in the wrong order, skips a step, or retries after a
timeout, Haskell never knows. Idempotency still has to be solved outside. A Haskell
core protects **transitions**, not **orchestration** — and most agent incidents live
in orchestration.

### Haskell is only the stand-in — the benefit holds, the cost does not

None of those four things is peculiar to Haskell. They belong to **algebraic data
types + exhaustiveness + parse-don't-validate**, and a fair number of languages carry
the full set. What genuinely differs is the **boundary cost**: if the language shares a
runtime with your orchestration layer, most of the foreign-function cost above
disappears.

| Language | How much of the four | Boundary cost |
|---|---|---|
| Haskell | all four | High — separate process, small ecosystem, hard to hire for |
| OCaml | all four, very fast compiles | Similarly high, but a much simpler build |
| F# / Scala 3 | all four | **Low if you are already on .NET or the JVM** — same runtime, no serialisation boundary |
| Rust | ADTs, exhaustiveness, strong newtypes; effect control comes through ownership rather than types | Medium — embeds through PyO3, no separate process needed |
| Kotlin / Swift | sealed classes or enums with exhaustive matching; weaker at parse-don't-validate | Low if already in the stack |
| TypeScript | discriminated unions with exhaustiveness checks; types erased at runtime | **Near zero** if the MCP server is already TypeScript |
| Python with ADTs | tagged unions plus strict type checking — roughly 80% | Zero, in exchange for a guarantee that only exists if somebody runs the checker |

[ASSUMPTION/HIGH] This is why "should we adopt Haskell" is usually the wrong question.
The better one: **which language in this family has the lowest boundary cost against
the stack you already run?** A JVM team gets nearly all the benefit from Scala 3 at
almost no foreign-function cost; if the MCP server is already TypeScript, in-place
discriminated unions beat a Haskell core sitting behind a serialisation boundary.

## 3.7 One engineering budget, three places to spend it

The right question is not whether to adopt Haskell. It is **what kind of incidents you
have had over the past six months.**

| Kind of incident | Cheapest fix | Does Haskell help? |
|---|---|---|
| The model picked the wrong tool or a semantically wrong argument | Better tool descriptions, a judgement layer, a confidence gate | No |
| The code permitted an illegal transition | Algebraic data types and an explicit state machine | **Yes, strongly** |
| Retries, partial writes, duplicated effects | Idempotency keys, database constraints, an outbox | No |
| Nobody can reconstruct what happened | An explicit audit log and commands as data | Partly |
| Validation duplicated across many tools | Consolidate into one domain module | Yes, but Python can too |

[ASSUMPTION/MEDIUM] Across agent tooling generally, the first and third dominate. The
second dominates only when the domain really is payments, ledgers, or wallets —
exactly what the note lists. The note is not wrong, but it draws its examples from the
*exceptional* case and presents them as the general rule.

### A workable decision threshold

    Fewer than 6 states, simple guards
        → Python with an enum, match, and property tests. Enough. Stop.

    6 to 10 states, guards that depend on history
        → Python with tagged unions, strict type checking, property tests
          (80% of the guarantee for 15% of the cost)

    More than 10 states, complex transition guards,
    one mistake costs real money, replay and dry runs needed
        → a Haskell core is worth considering

## 3.8 Where Jev and Haskell join

The joint is the **threshold policy** — and the threshold policy, not the tool, is the
strongest Haskell candidate in the whole architecture. It is where the fuzzy meets the
discrete, and mistakes there are silent.

    -- the model's output is DATA, not a decision
    newtype Conf = Conf Double          -- smart constructor: [0,1]
    data Dist a  = Dist { best :: a, conf :: Conf }

    data Verdict a
      = Auto     a          -- confident enough, proceed
      | NeedsAck a          -- a person must confirm
      | Escalate            -- do not proceed

    -- the policy binds to the RISK OF THE ACTION, not to the model
    decide :: RiskClass -> Dist a -> Verdict a

    -- a command can only be built from Auto plus a checked permission
    data Authorized c = Authorized c AuditRef

    authorize :: Verdict Intent -> Permission -> Maybe (Authorized RefundCmd)

    execute :: Authorized RefundCmd -> CapturedPayment -> IO RefundedPayment
    --         ^^^^^^^^^^                ^^^^^^^^^^^^^^^^
    --         no evidence, no call        wrong state, no compile

Three illegal states disappear at compile time: calling `execute` with a raw model
output that never passed `decide`; calling it when `decide` returned `Escalate`;
refunding a payment that was never captured. All three are real bugs, and all three are
currently policed by an `if` in Python.

    "There is currently no engineering justification for introducing Haskell."

    That is a valid and preferred conclusion over forcing Haskell into the architecture.

</details>

[RISK] But one gap skews the result: the rubric compares **Haskell against the Python
that exists**, not Haskell against **Python that has been modelled properly**. Every
candidate will score artificially well, because the baseline is code that never tried.

Three additions worth making:

    [1] Before scoring any candidate, write out what the Python version
        with algebraic types and strict checking would look like.
        Score Haskell against THAT.
        If the delta is small → keep Python, whatever the total says.

    [2] Add a mandatory question per candidate:
        "Has this tool broken in the last six months? How?"
        No incident history ⇒ cap the score at 2.

    [3] Add the missing cost axis:
        "Foreign-function boundary cost" — the guarantee is lost at
        serialisation, and orchestration stays outside the core.

[NEXT STEP] One more output section is worth adding: **which candidates are really
database or idempotency bugs wearing a type-system costume?** In practice that section
swallows one or two of the top three.

## 3.10 Conclusions

| Question | Answer |
|---|---|
| Does Jev belong in MCP servers, skills, and tool calls? | Yes — *before* the boundary for routing, argument extraction, and injection screening, and *after* it for audit triage. Never inside |
| Does Jev being "functional" replace domain modelling? | No. A total function returning a distribution, not a proof. Its output is the domain's input |
| Jev against Haskell? | A category error. Opposite ends of the same pipeline. The one overlap is the threshold policy — also the best Haskell candidate here |
| Jev's largest opportunity cost | Cheapness makes "ask the model" beat "model the domain" in the short run. Architectural debt that never appears on the invoice |
| Haskell's largest opportunity cost | The foreign-function boundary. You add a parsing layer rather than removing one, and orchestration stays outside the protected region |

actually is (payments and ledgers, or internal developer tooling), and how many states
the largest existing state machine has. Any further discussion without them drifts
towards abstraction.

  const n = document.createElement(tag);
  if(attrs) for(const k in attrs){ if(attrs[k] != null) n.setAttribute(k, attrs[k]); }

  return n;
}

function inline(src){
  const spans = [];
  let s = String(src).replace(/`([^`]+)`/g, (_, c) => {
    spans.push('<code>' + esc(c) + '</code>');
    return '\u0000' + (spans.length - 1) + '\u0000';
  });
  s = esc(s)
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => spans[+i]);
}

/* a leading [TAG] becomes a chip, the rest of the paragraph stays prose */
function withTag(text){
  const m = text.match(/^\[([^\]\n]{2,40})\]\s+([\s\S]*)$/);
  if(!m || m[1] !== m[1].toUpperCase()) return inline(text);
  return '<span class="t t-' + TAG_CLASS(m[1]) + '">' + esc(m[1]) + '</span> ' + inline(m[2]);
}

const BLOCK = {
  h(b){
    if(b.level === 1){
      const m = b.text.match(/^((?:PHẦN|PART) \d+)\s+—\s+([\s\S]+)$/);
      return m ? el('h2', null, '<span class="num">' + esc(m[1]) + '</span>' + inline(m[2]))
               : el('h2', null, inline(b.text));
    }
    return el(b.level === 2 ? 'h3' : 'h4', null, inline(b.text));
  },
  p:   b => el('p', null, withTag(b.text)),
  ul:  b => el('ul', null, b.items.map(i => '<li>' + inline(i) + '</li>').join('')),
  ol:  b => el('ol', null, b.items.map(i => '<li>' + inline(i) + '</li>').join('')),
  hr:  () => el('hr', { class: 'part-rule' }),
  code: b => el('pre', null, esc(b.text)),
  quote(b){
    const d = el('div', { class: 'call' });
    b.lines.forEach(l => d.appendChild(el('p', null, withTag(l))));
    return d;
  },
  table(b){
    const rows = r => '<tr>' + r.map(c => '<' + (r === b.head ? 'th' : 'td') + '>' + inline(c) +
                      '</' + (r === b.head ? 'th' : 'td') + '>').join('') + '</tr>';
    const w = el('div', { class: 'tw' });
    w.appendChild(el('table', { class: 'wrapcell' }, rows(b.head) + b.rows.map(rows).join('')));
    return w;
  },
  details(b){
    const d = el('details', { class: 'src' });
    d.appendChild(el('summary', null, esc(b.summary)));
    d.appendChild(el('pre', null, esc(b.body)));
    return d;
  }
};

/* ── figure components ─────────────────────────────────────────────── */
const wrapFig = (inner, cap) => {
  const f = el('figure');
  const b = el('div', { class: 'fig-body' });
  b.appendChild(inner);
  f.appendChild(b);
  if(cap) f.appendChild(el('figcaption', null, cap));
  return f;
};

const FIGURE = {
  demo(d){
    const r = el('div', { class: 'demo' });
    const top = el('div');
    top.appendChild(el('span', { class: 'dl' }, esc(d.stateLabel)));
    top.appendChild(el('p', { class: 'quote' }, esc(d.state)));
    top.appendChild(el('span', { class: 'dl' }, esc(d.qLabel)));
    top.appendChild(el('ul', { class: 'qs' }, d.qs.map(q =>
      '<li><b>' + esc(q[0]) + '</b><span class="ty">' + esc(q[1]) + '</span><span>' + esc(q[2]) + '</span></li>').join('')));
    r.appendChild(top);
    const ans = el('div', { class: 'ans' });
    d.ans.forEach(a => {
      const blk = el('div', { class: 'ans-blk' });
      blk.appendChild(el('div', { class: 'ans-hd' },
        '<code>' + esc(a.key) + '</code> → <b>' + esc(a.win) + '</b>' +
        (a.note ? '<span class="ty">' + esc(a.note) + '</span>' : '') +
        '<span class="conf' + (a.low ? ' low' : '') + '">' + esc(a.conf) + '</span>'));
      a.bars.forEach(([k, w, v, dim]) => blk.appendChild(el('div', { class: 'resp' },
        '<div class="resp-row"><span class="resp-k">' + esc(k) + '</span>' +
        '<span class="track"><span class="fill' + (dim ? ' u' : '') + '" style="width:' + w + '%"></span></span>' +
        '<span class="resp-v">' + v.toFixed(3) + '</span></div>')));
      ans.appendChild(blk);
    });
    r.appendChild(ans);
    return r;
  },

  samp(d){
    const r = el('div', { class: 'samp' });
    d.rows.forEach(row => {
      const x = el('div', { class: 'samp-row' });
      x.appendChild(el('div', { class: 'lab' }, esc(row.lab)));
      x.appendChild(el('div', { class: 'toks' },
        Array(row.n).fill('<span class="tok ' + row.cls + '"></span>').join('')));
      x.appendChild(el('div', { class: 'note' }, esc(row.note)));
      r.appendChild(x);
    });
    return r;
  },

  flow(d){
    const r = el('div', { class: 'flow' });
    d.steps.forEach(([owner, cls, title, body], i) => {
      if(i) r.appendChild(el('div', { class: 'arr' }, '↓'));
      r.appendChild(el('div', { class: 'step' },
        '<span class="owner o-' + cls + '">' + esc(owner) + '</span>' +
        '<p>' + (title ? '<b>' + esc(title) + '</b>' + (body ? '<br>' : '') : '') +
        (body ? '<span class="g">' + body + '</span>' : '') + '</p>'));
    });
    return r;
  },

  bands(d){
    const r = el('div', { class: 'bands' });
    r.appendChild(el('div', { class: 'band-bar' },
      d.bands.map((b, i) => '<div class="b' + (i + 1) + '">' + esc(b) + '</div>').join('')));
    r.appendChild(el('div', { class: 'scale' }, d.scale.map(s => '<span>' + esc(s) + '</span>').join('')));
    r.appendChild(el('div', { class: 'band-legend' }, d.legend.map(l => '<div>' + l + '</div>').join('')));
    return r;
  },

  stack(d){
    return el('div', { class: 'stack' }, d.layers.map(([name, who, gap]) =>
      '<div class="layer' + (gap ? ' gap' : '') + '"><span>' + esc(name) +
      '</span><span class="who">' + esc(who) + '</span></div>').join(''));
  },

  mtx(d){
    const cell = ([t, s, hot]) => '<div class="cell' + (hot ? ' hot' : '') + '"><b>' + esc(t) +
                                  '</b><span>' + esc(s) + '</span></div>';
    return el('div', { class: 'mtx' },
      '<div class="yl">' + esc(d.y) + '</div>' +
      d.cols.map(c => '<div class="hdr">' + esc(c) + '</div>').join('') +
      d.cells.map(cell).join('') +
      '<div class="xl">' + esc(d.x) + '</div>');
  },

  paths(d){
    return el('div', { class: 'paths' }, d.paths.map(p =>
      '<div class="path"><div class="ph"><span>' + esc(p.head) + '</span><em>' + esc(p.sub) + '</em></div><ol>' +
      p.items.map(([t, gate]) => '<li' + (gate ? ' class="gate"' : '') + '>' + t + '</li>').join('') +
      '</ol></div>').join(''));
  },

  ladder(d, shared){
    const r = el('div');
    r.appendChild(el('div', { class: 'ladder' }, d.rungs.map(([t, s], i) =>
      '<div class="rung r' + (i + 1) + '"><b>' + esc(t) + '</b><span>' + esc(s) + '</span></div>').join('')));
    r.appendChild(el('div', { class: 'reach' }, shared.reach.map(([n, w, c]) =>
      '<div><span>' + esc(n) + '</span><i style="background:' + c + ';width:' + w + '%"></i></div>').join('')));
    return r;
  },

  ffi(d){
    return el('div', { class: 'ffi' }, d.rows.map(([t, note, inCore], i) =>
      (i ? '<div class="sep">↓</div>' : '') +
      '<div class="fl' + (inCore ? ' in' : '') + '"><span>' + esc(t) + '</span><em>' + esc(note) + '</em></div>'
    ).join(''));
  }
};

/* build one figure (or a stack of them) from FIG data for a language */
function buildFigure(id, lang){
  const spec = FIG[id];
  if(!spec) return el('p', null, '<code>@fig:' + esc(id) + '</code>');
  const one = sp => wrapFig(FIGURE[sp.type](sp[lang], sp), sp.cap ? sp.cap[lang] : null);
  if(spec.type === 'multi'){
    const frag = document.createDocumentFragment();
    spec.items.forEach(sp => frag.appendChild(one(sp)));
    return frag;
  }
  return one(spec);
}

/* ── markdown subset parser ────────────────────────────────────────── */
const MD = {
  parse(src){
    const L = src.split('\n'), out = [];
    let i = 0;
    const isCode = s => s.startsWith('    ');
    while(i < L.length){
      const ln = L[i];

      if(!ln.trim()){ i++; continue; }

      if(ln.startsWith('@fig:')){                       // figure region
        const id = ln.slice(5).trim();
        while(i < L.length && L[i] !== '@endfig') i++;
        i++;
        out.push({ t: 'fig', id });
        continue;
      }
      if(ln.startsWith('@box:')){                       // styled region
        const cls = ln.slice(5).trim();
        const inner = [];
        i++;
        while(i < L.length && L[i] !== '@endbox') inner.push(L[i++]);
        i++;
        out.push({ t: 'box', cls, blocks: MD.parse(inner.join('\n')) });
        continue;
      }
      if(ln.startsWith('<details>')){                   // raw collapsible
        i++;
        const sm = (L[i] || '').replace(/<\/?summary>/g, '');
        i++;
        const body = [];
        while(i < L.length && !L[i].startsWith('</details>')){
          if(isCode(L[i])) body.push(L[i].slice(4)); else if(L[i].trim() === '') body.push('');
          i++;
        }
        i++;
        out.push({ t: 'details', summary: sm, body: body.join('\n').replace(/^\n+|\n+$/g, '') });
        continue;
      }
      if(/^#{1,4} /.test(ln)){
        const lv = ln.match(/^#+/)[0].length;
        out.push({ t: 'h', level: lv, text: ln.slice(lv + 1).trim() });
        i++; continue;
      }
      if(ln.startsWith('---')){ out.push({ t: 'hr' }); i++; continue; }

      if(isCode(ln)){                                   // indented code, blanks allowed inside
        const buf = [];
        let last = i;
        while(i < L.length && (isCode(L[i]) || !L[i].trim())){
          if(isCode(L[i])) last = i;
          buf.push(L[i]); i++;
        }
        buf.length = last - (i - buf.length) + 1;
        out.push({ t: 'code', text: buf.map(x => x.slice(4)).join('\n') });
        i = last + 1; continue;
      }
      if(ln.startsWith('|')){                           // table
        const rows = [];
        while(i < L.length && L[i].startsWith('|')){
          rows.push(L[i].replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
          i++;
        }
        const head = rows.shift();
        if(rows.length && rows[0].every(c => /^-{2,}$/.test(c))) rows.shift();
        out.push({ t: 'table', head, rows });
        continue;
      }
      if(ln.startsWith('> ')){                          // blockquote → callout
        const para = [];
        let cur = [];
        while(i < L.length && L[i].startsWith('>')){
          const txt = L[i].replace(/^>\s?/, '');
          if(!txt.trim()){ if(cur.length){ para.push(cur.join(' ')); cur = []; } }
          else cur.push(txt);
          i++;
        }
        if(cur.length) para.push(cur.join(' '));
        out.push({ t: 'quote', lines: para });
        continue;
      }
      if(/^[-*] /.test(ln) || /^\d+\. /.test(ln)){      // list, 2-space continuations
        const ordered = /^\d+\. /.test(ln);
        const items = [];
        while(i < L.length && (/^[-*] |^\d+\. /.test(L[i]) || /^ {2,}\S/.test(L[i]))){
          if(/^ {2,}\S/.test(L[i])) items[items.length - 1] += ' ' + L[i].trim();
          else items.push(L[i].replace(/^[-*] |^\d+\. /, ''));
          i++;
        }
        out.push({ t: ordered ? 'ol' : 'ul', items });
        continue;
      }
      const para = [];                                  // paragraph
      while(i < L.length && L[i].trim() && !/^[#>|@]|^---|^    |^[-*] |^\d+\. |^</.test(L[i])){
        para.push(L[i].trim()); i++;
      }
      if(para.length) out.push({ t: 'p', text: para.join(' ') });
      else i++;
    }
    return out;
  },

  render(blocks, lang){
    const frag = document.createDocumentFragment();
    blocks.forEach(b => {
      if(b.t === 'fig'){ frag.appendChild(buildFigure(b.id, lang)); return; }
      if(b.t === 'box'){
        const d = el('div', { class: b.cls });
        d.appendChild(MD.render(b.blocks, lang));
        frag.appendChild(d); return;
      }
      const fn = BLOCK[b.t];
      if(fn) frag.appendChild(fn(b));
    });
    return frag;
  }
};

/* ═══════════════════════════════════════════════════════════════════
   LAYER 3 · LOGIC
   Binds DATA to COMPONENTS. The only layer that touches STATE.
   Pipeline:  SRC → slice(depth) → split(front | body | footer)
                  → MD.parse → MD.render → DOM
   Both the document view and the markdown view read the SAME sliced
   text, so they cannot drift apart.
   ═══════════════════════════════════════════════════════════════════ */

/* remove the region between the rule before `head` and the rule before `stop` */
function dropPart(t, head, stop){
  let a = t.indexOf(head);
  if(a < 0) return t;
  a = t.lastIndexOf('\n---\n', a);
  let b = t.indexOf(stop, a);
  if(b < 0) return t;
  b = t.lastIndexOf('\n---\n', b);
  return (a > -1 && b > a) ? t.slice(0, a) + t.slice(b) : t;
}

/* remove one footer-note paragraph */
function dropNote(t, note){
  const i = t.indexOf(note);
  if(i < 0) return t;
  let e = t.indexOf('\n\n', i + note.length);
  if(e < 0) e = t.length;
  return t.slice(0, i) + t.slice(e);
}

/* one source of truth, sliced to the requested depth */
const _cache = {};
function sliced(lang, depth){
  const key = lang + depth;
  if(_cache[key]) return _cache[key];
  let t = SRC[lang];
  const m = CUT[lang];
  if(depth < 3){ t = dropPart(t, m.p3, m.foot); t = t.replace(m.l3, ''); t = dropNote(t, m.n3); }
  if(depth < 2){ t = dropPart(t, m.p2, m.foot); t = t.replace(m.l2, ''); t = dropNote(t, m.n2); }
  return (_cache[key] = t.replace(/\n{3,}$/, '\n'));
}

/* front matter (title + lede) | body | footer, split on the outer rules */
function sections(lang, depth){
  const t = sliced(lang, depth);
  const first = t.indexOf('\n---\n');
  const lastRule = t.lastIndexOf('\n---\n');
  return {
    lede: t.slice(0, first).split('\n').filter(l => l.startsWith('> ')).map(l => l.slice(2)),
    body: t.slice(first + 5, lastRule),
    footer: t.slice(lastRule + 5).split('\n\n').map(p => p.trim()).filter(Boolean)
  };
}

/* the copy-out markdown drops the layout directives; prose and ASCII stay */
function forCopy(lang, depth){
  return sliced(lang, depth)
    .split('\n').filter(l => !/^@(fig:|endfig|box:|endbox)/.test(l)).join('\n')
    .replace(/\n{3,}/g, '\n\n');
}

/* ── rendering ─────────────────────────────────────────────────────── */
let heads = [];

function renderDoc(){
  const { lang, depth } = STATE;
  const s = sections(lang, depth);
  const t = I18N[lang];

  document.documentElement.lang = lang;
  document.getElementById('headline').textContent = t.headline;
  document.getElementById('lede').innerHTML = s.lede.map(inline).join(' ');
  document.getElementById('meta').innerHTML =
    t.meta.map(([k, v]) => '<span><b>' + esc(k) + '</b> ' + esc(v) + '</span>').join('');

  const doc = document.getElementById('doc');
  doc.textContent = '';
  doc.appendChild(MD.render(MD.parse(s.body), lang));

  const foot = document.getElementById('foot');
  foot.textContent = '';
  s.footer.forEach(p => foot.appendChild(el('p', null, inline(p.replace(/\n/g, ' ')))));

  document.getElementById('mdout').textContent = forCopy(lang, depth);
  document.getElementById('mdnote').textContent = t.mdNote;
}

function buildToc(){
  const toc = document.getElementById('toc');
  toc.textContent = '';
  heads = [...document.getElementById('doc').querySelectorAll('h2,h3')];
  heads.forEach((hd, i) => {
    hd.id = 'h' + i;
    const a = el('a', { href: '#h' + i, class: hd.tagName === 'H2' ? 'toc2' : 'toc3' });
    const num = hd.querySelector('.num');
    a.textContent = num ? hd.textContent.replace(num.textContent, '').trim() : hd.textContent;
    a.addEventListener('click', () => { if(!wide()) setNav(false); });
    toc.appendChild(a);
  });
  spy();
}

function paint(){
  const t = I18N[STATE.lang];
  document.getElementById('view-doc').hidden = STATE.view !== 'html';
  document.getElementById('view-md').hidden  = STATE.view !== 'md';

  document.getElementById('b-vi').setAttribute('aria-pressed', STATE.lang === 'vi');
  document.getElementById('b-en').setAttribute('aria-pressed', STATE.lang === 'en');
  const bh = document.getElementById('b-html'), bm = document.getElementById('b-md');
  bh.textContent = t.doc; bm.textContent = t.md;
  bh.setAttribute('aria-pressed', STATE.view === 'html');
  bm.setAttribute('aria-pressed', STATE.view === 'md');

  const sel = document.getElementById('depth');
  [...sel.options].forEach((o, i) => o.textContent = t.depth[i]);
  sel.value = String(STATE.depth);
  sel.setAttribute('aria-label', t.depthLabel);

  const btn = document.getElementById('navbtn');
  btn.textContent = t.contents;
  document.querySelectorAll('.copy').forEach(b => {
    b.dataset.label = t.copy; b.dataset.doneLabel = t.done;
    if(b.dataset.done !== '1') b.textContent = t.copy;
  });

  if(STATE.view === 'html'){ btn.hidden = false; buildToc(); if(wide()) setNav(true); }
  else { btn.hidden = true; setNav(false); }
}

function render(){ renderDoc(); paint(); }

/* ── controls ──────────────────────────────────────────────────────── */
const wide = () => (window.innerWidth || 1280) >= 1180;   // no matchMedia dependency

function setLang(v){ STATE.lang = v; render(); }
function setView(v){ STATE.view = v; paint(); }
function setDepth(v){ STATE.depth = Math.min(3, Math.max(1, +v || 1)); render(); }

function setNav(force){
  STATE.nav = (force === undefined) ? !STATE.nav : force;
  document.body.classList.toggle('nav-open', STATE.nav);
  document.getElementById('navbtn').setAttribute('aria-expanded', STATE.nav);
}

function copyMd(btn){
  const text = document.getElementById('mdout').textContent;
  const ok = () => {
    btn.dataset.done = '1';
    btn.textContent = btn.dataset.doneLabel;
    setTimeout(() => { btn.dataset.done = '0'; btn.textContent = btn.dataset.label; }, 1800);
  };
  const fallback = () => {
    const ta = el('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); ok(); } catch(e) {}
    document.body.removeChild(ta);
  };
  if(navigator.clipboard && window.isSecureContext)
    navigator.clipboard.writeText(text).then(ok).catch(fallback);
  else fallback();
}

/* ── scrollspy ─────────────────────────────────────────────────────── */
let tick = false;
function spy(){
  const links = document.getElementById('toc').children;
  if(!heads.length || links.length !== heads.length) return;
  let active = 0;
  for(let i = 0; i < heads.length; i++){
    if(heads[i].getBoundingClientRect().top <= 90) active = i; else break;
  }
  for(let i = 0; i < links.length; i++) links[i].classList.toggle('on', i === active);
}
addEventListener('scroll', () => {
  if(tick) return;
  tick = true;
  requestAnimationFrame(() => { if(STATE.view === 'html') spy(); tick = false; });
}, { passive: true });

addEventListener('keydown', e => { if(e.key === 'Escape' && STATE.nav && !wide()) setNav(false); });
addEventListener('resize', () => { if(STATE.view === 'html' && wide() && !STATE.nav) setNav(true); });

render();

</script>
