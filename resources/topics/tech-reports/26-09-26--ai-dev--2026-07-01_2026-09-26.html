<style>/* @@BEGIN:CSS:TOKENS */
/* Declared three times on purpose: the light default, the dark default that

:root{

  --line:#e2e2de; --line-2:#cdcdc7;

    --bg:#131519; --panel:#1a1d23; --sunk:#20242b;

    --watch:#e0b95a; --watch-soft:#2e2718;

  }
}

  --fg:#16181d; --fg-2:#4a4f5a; --fg-3:#767c88;

  --accent:#2f5bd0; --accent-soft:#e8eefc;
  --now:#b23b2e;   --now-soft:#fbeae7;

/* @@BEGIN:CSS:BASE */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:400 16px/1.62 var(--sans);
  font-feature-settings:"kern","liga";
  overflow-wrap:break-word;
}
/* [hidden] must win over any display we set on the same element, or a hidden
   panel keeps rendering and the acceptance suite is the only thing that notices. */
[hidden]{display:none !important}
h1,h2,h3,h4{line-height:1.25;font-weight:650;margin:0 0 .4em}
h1{font-size:1.75rem;letter-spacing:-.015em}
h2{font-size:1.3rem;letter-spacing:-.01em}
h3{font-size:1.05rem}
p{margin:0 0 .85em}
a{color:var(--accent)}
a:hover{text-decoration-thickness:2px}
code,kbd,pre{font-family:var(--mono);font-size:.875em}
ul,ol{margin:0 0 .85em;padding-left:1.35em}
li{margin:.2em 0}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:0;z-index:60;background:var(--panel);
  padding:.5rem .8rem;border:1px solid var(--line)}
.skip:focus{left:.5rem;top:.5rem}
.mark{background:var(--watch-soft);color:var(--fg);border-radius:2px;padding:0 1px}
[id]{scroll-margin-top:calc(var(--bar) + 44px)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
/* @@END:CSS:BASE */

/* @@BEGIN:CSS:ATOM:Text */
.lt{}
.lt-miss{border-bottom:1px dotted var(--watch)}
.lt-miss::after{content:attr(data-fallback);font-size:.7em;vertical-align:super;
  color:var(--watch);margin-left:.15em;font-weight:600}
/* @@END:CSS:ATOM:Text */

/* @@BEGIN:CSS:ATOM:Badge */
/* Colour never carries meaning alone -- every badge prints its label, and the
   tint only speeds up scanning for a reader who can see it. */
.badge{display:inline-flex;align-items:center;gap:.3em;
  font:600 11px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;
  padding:.35em .55em;border-radius:5px;border:1px solid var(--line-2);
  background:var(--mute-soft);color:var(--fg-2);white-space:nowrap}
.badge[data-v="patch_now"]{background:var(--now-soft);color:var(--now);border-color:currentColor}
.badge[data-v="try_now"]{background:var(--try-soft);color:var(--try);border-color:currentColor}
.badge[data-v="watch"]{background:var(--watch-soft);color:var(--watch);border-color:currentColor}
.badge[data-v="ignore"]{background:var(--mute-soft);color:var(--mute)}
.badge[data-v="FACT"]{background:var(--try-soft);color:var(--try)}
.badge[data-v="ASSUMPTION"]{background:var(--watch-soft);color:var(--watch)}
.badge[data-v="UNVERIFIED"],.badge[data-v="VENDOR_CLAIM"]{
  background:transparent;color:var(--fg-2);border-style:dashed;border-color:var(--line-2)}
.badge[data-v^="RISK"]{background:var(--now-soft);color:var(--now)}
.badge[data-v="high"]{background:var(--try-soft);color:var(--try)}
.badge[data-v="low"]{background:var(--now-soft);color:var(--now)}
.badge--kind{text-transform:none;letter-spacing:0;font-weight:500;
  background:transparent;color:var(--fg-3)}
/* @@END:CSS:ATOM:Badge */

/* @@BEGIN:CSS:ATOM:DateLabel */
.date{font:500 12px/1 var(--mono);color:var(--fg-3);white-space:nowrap}
.date[data-p="tbd"]{font-style:italic}
/* @@END:CSS:ATOM:DateLabel */

/* @@BEGIN:CSS:ATOM:CiteChip */
.cite{display:inline-block;position:relative;font:600 11px/1 var(--mono);
  color:var(--accent);background:var(--accent-soft);border:0;
  padding:.25em .4em;border-radius:4px;vertical-align:baseline;margin:0 .1em;
  white-space:nowrap}
.cite[data-unknown="1"]{background:var(--now-soft);color:var(--now)}
.cite-pop{position:absolute;left:0;top:calc(100% + 6px);z-index:40;width:min(19rem,72vw);
  text-align:left;text-transform:none;letter-spacing:0;
  font:400 12px/1.45 var(--sans);color:var(--fg);
  background:var(--panel);border:1px solid var(--line-2);border-radius:var(--rad);
  box-shadow:0 8px 24px rgba(0,0,0,.14);padding:.55rem .65rem;white-space:normal}
.cite-pop b{display:block;font-weight:600;margin-bottom:.15em}
.cite-pop span{color:var(--fg-3)}
.cite:not(:hover):not(:focus-visible) .cite-pop{display:none}
/* @@END:CSS:ATOM:CiteChip */

/* @@BEGIN:CSS:ATOM:ExtLink */
.xl{display:inline-flex;align-items:baseline;gap:.3em;text-decoration-thickness:1px}
.xl .dom{font:400 11px/1 var(--mono);color:var(--fg-3)}
.xl svg{width:.75em;height:.75em;flex:none;align-self:center}
/* @@END:CSS:ATOM:ExtLink */

/* @@BEGIN:CSS:ATOM:CodeBlock */
.code{position:relative;background:var(--sunk);border:1px solid var(--line);
  border-radius:var(--rad);margin:.6rem 0}
.code pre{margin:0;padding:.6rem 2.6rem .6rem .7rem;overflow-x:auto;
  font:400 13px/1.55 var(--mono)}
.code .copy{position:absolute;top:.3rem;right:.3rem}
/* @@END:CSS:ATOM:CodeBlock */

/* @@BEGIN:CSS:ATOM:CopyButton */
.copy{background:var(--panel);border:1px solid var(--line-2);border-radius:5px;
  padding:.25em .5em;font:500 11px/1.3 var(--sans);color:var(--fg-2)}
.copy:hover{border-color:var(--accent);color:var(--accent)}
.copy[data-done="1"]{color:var(--try);border-color:var(--try)}
/* @@END:CSS:ATOM:CopyButton */

/* @@BEGIN:CSS:ATOM:Metric */
.metric{display:flex;flex-direction:column;gap:.1rem;padding:.5rem .65rem;
  background:var(--sunk);border:1px solid var(--line);border-radius:var(--rad);min-width:0}
.metric .v{font:650 1.05rem/1.2 var(--sans);font-variant-numeric:tabular-nums}
.metric .v .u{font-size:.7em;font-weight:500;color:var(--fg-3);margin-left:.15em}
.metric .l{font-size:12px;color:var(--fg-2)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.5rem;margin:.6rem 0}
/* @@END:CSS:ATOM:Metric */

/* @@BEGIN:CSS:ATOM:Card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);margin:.6rem 0}
.card>.hd{display:flex;gap:.5rem;align-items:flex-start;width:100%;text-align:left;
  background:none;border:0;padding:.7rem .8rem;border-radius:var(--rad)}
.card>.bd{padding:0 .8rem .8rem;border-top:1px solid var(--line);margin-top:-1px;padding-top:.7rem}
/* @@END:CSS:ATOM:Card */

/* @@BEGIN:CSS:ATOM:Table */
/* Mobile first, and for a table that means not being a table. Each row becomes
   a small block with the column name printed beside its value, so nothing
   important hides behind a horizontal scroll on a phone. The real grid comes
   back once there is width for four columns to be read at a glance. */
.tw{border:1px solid var(--line);border-radius:var(--rad);margin:.8rem 0;background:var(--panel)}
.tw table{border-collapse:collapse;width:100%;font-size:14.5px}
.tw thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tw tbody,.tw tr,.tw td{display:block}
.tw tr{border-bottom:1px solid var(--line);padding:.6rem .7rem}
.tw tr:last-child{border-bottom:0}
.tw td{border:0;padding:.18rem 0;display:flex;gap:.6rem;align-items:baseline}
.tw td:empty{display:none}
.tw td::before{content:attr(data-l);flex:0 0 5.5rem;
  font:600 10.5px/1.7 var(--sans);text-transform:uppercase;letter-spacing:.04em;
  color:var(--fg-3)}

@media (min-width:700px){
  .tw{overflow-x:auto}
  .tw table{min-width:32rem}
  .tw thead{position:static;width:auto;height:auto;overflow:visible;clip:auto;display:table-header-group}
  .tw tbody{display:table-row-group}
  .tw tr{display:table-row;padding:0}
  .tw td{display:table-cell}
  .tw td::before{content:none}
  .tw th,.tw td{text-align:left;padding:.55rem .7rem;border-bottom:1px solid var(--line);
    vertical-align:top}
  .tw th{font:600 12px/1.3 var(--sans);text-transform:uppercase;letter-spacing:.04em;
    color:var(--fg-3);background:var(--sunk);position:sticky;top:0}
  .tw tr:last-child td{border-bottom:0}
}
/* @@END:CSS:ATOM:Table */

/* @@BEGIN:CSS:ATOM:Tabs */
#tabs{display:flex;gap:.25rem;padding:0 .7rem;border-bottom:1px solid var(--line);
  position:sticky;top:var(--bar);background:var(--bg);z-index:20;
  overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs [role=tab]{background:none;border:0;border-bottom:2px solid transparent;
  padding:.7rem .6rem;min-height:44px;white-space:nowrap;flex:none;
  font:500 14.5px/1.3 var(--sans);color:var(--fg-2)}
@media (min-width:900px){
  #tabs{padding:.4rem .9rem 0}
  #tabs [role=tab]{padding:.5rem .6rem;min-height:0;font-size:14px}
}
#tabs [role=tab][aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent);font-weight:650}
#tabs .n{font:500 11px/1 var(--mono);color:var(--fg-3);margin-left:.3em}
/* @@END:CSS:ATOM:Tabs */

/* @@BEGIN:CSS:ATOM:FilterChip */
.chip{display:flex;align-items:center;gap:.45rem;width:100%;text-align:left;
  background:none;border:1px solid transparent;border-radius:5px;
  padding:.28rem .4rem;font:400 13px/1.3 var(--sans);color:var(--fg-2)}
.chip:hover{background:var(--sunk)}
.chip[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip .box{width:13px;height:13px;flex:none;border:1.5px solid var(--line-2);border-radius:3px}
.chip[aria-pressed=true] .box{background:var(--accent);border-color:var(--accent)}
.chip .n{margin-left:auto;font:500 11px/1 var(--mono);color:var(--fg-3)}
.chip[data-n="0"]{opacity:.45}
/* @@END:CSS:ATOM:FilterChip */

/* @@BEGIN:CSS:ATOM:Callout */
.callout{border:1px solid var(--line-2);border-left-width:3px;border-radius:var(--rad);
  padding:.65rem .8rem;margin:.8rem 0;background:var(--panel);font-size:14.5px}
.callout>b{display:block;font:600 11px/1 var(--sans);text-transform:uppercase;
  letter-spacing:.05em;margin-bottom:.35em;color:var(--fg-3)}
.callout p:last-child{margin-bottom:0}
.callout[data-v=info]{border-left-color:var(--accent);background:var(--accent-soft)}
.callout[data-v=risk]{border-left-color:var(--now);background:var(--now-soft)}
.callout[data-v=conflict]{border-left-color:var(--watch);background:var(--watch-soft)}
/* @@END:CSS:ATOM:Callout */

/* @@BEGIN:CSS:ATOM:EmptyState */
.empty{border:1px dashed var(--line-2);border-radius:var(--rad);padding:1.2rem .9rem;
  text-align:center;color:var(--fg-3);font-size:14.5px;background:var(--panel)}
/* @@END:CSS:ATOM:EmptyState */

/* @@BEGIN:CSS:ATOM:Icon */
.ic{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.12em;
  fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* @@END:CSS:ATOM:Icon */

/* @@BEGIN:CSS:ATOM:YouTube */
/* A click-to-load facade, not a live iframe: the page makes zero external
   requests until the reader actually asks for the video, and a report with
   twelve talks in it still opens instantly. */
.yt{position:relative;margin:.7rem 0;border:1px solid var(--line);border-radius:var(--rad);
  overflow:hidden;background:#000;aspect-ratio:16/9;width:100%;max-width:44rem}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt .play{position:absolute;inset:0;width:100%;height:100%;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:.6rem;
  background:linear-gradient(160deg,#20242b,#0c0e11);border:0;color:#e8eaee}
.yt .play .btn{width:58px;height:40px;border-radius:10px;background:#c4302b;
  display:flex;align-items:center;justify-content:center}
.yt .play .btn::after{content:"";width:0;height:0;margin-left:3px;
  border-left:15px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}
.yt .play span{font:500 12.5px/1.3 var(--sans);opacity:.85;max-width:80%;text-align:center}
.yt .play:hover .btn{background:#e2453f}
/* @@END:CSS:ATOM:YouTube */

/* @@SLOT:CSS_ATOMS */

/* @@BEGIN:CSS:BIZ:TopBar */
/* Phone shape: one row of controls, then the search on a full-width row of its
   own. Cramming a text field between four buttons at 360px produces a box too
   narrow to read what you typed, so it gets its own line instead. The
   arithmetic below has to add up to --bar, or the sticky tab strip parks over
   the bar or floats below it: 4 + 40 + 6 + 40 + 4 = 94. */
#topbar{position:sticky;top:0;z-index:30;height:var(--bar);
  display:flex;flex-wrap:wrap;align-items:center;align-content:center;
  gap:6px .5rem;padding:4px max(10px,env(safe-area-inset-left)) 4px max(10px,env(safe-area-inset-right));
  background:var(--panel);border-bottom:1px solid var(--line)}
#topbar .brand{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;line-height:1.2}
#topbar .brand b{font:650 14px/1.25 var(--sans);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
#topbar .brand small{font:400 11px/1.25 var(--mono);color:var(--fg-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .grow{display:none}
#topbar .ctl{flex:none;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;
  padding:0 .55rem;display:inline-flex;align-items:center;
  justify-content:center;gap:.3rem;font:600 12.5px/1 var(--sans);color:var(--fg-2)}
#topbar .ctl:hover{border-color:var(--accent);color:var(--accent)}
#topbar .ctl[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);
  border-color:var(--accent)}
#topbar [data-act=print]{display:none}
#topbar .search{order:10;flex:1 1 100%;display:flex;align-items:center;gap:.4rem;height:40px;
  border:1px solid var(--line-2);border-radius:8px;padding:0 .6rem;background:var(--bg)}
#topbar .search input{border:0;background:none;outline:0;color:var(--fg);width:100%;
  /* 16px exactly: anything smaller makes iOS Safari zoom the page on focus. */
  font:400 16px/1 var(--sans);padding:.5rem 0;min-width:0}
#topbar .search svg{color:var(--fg-3);flex:none}

@media (min-width:900px){
  #topbar{flex-wrap:nowrap;gap:.5rem;height:var(--bar);padding:0 .7rem}
  #topbar .brand{flex:0 1 auto}
  #topbar .grow{display:block;flex:1 1 auto;min-width:.5rem}
  #topbar [data-act=print]{display:inline-flex}
  #topbar .search{order:0;flex:0 1 auto;width:min(22rem,30vw);height:32px}
  #topbar .search input{font-size:13.5px;padding:.4rem 0}
}
/* @@END:CSS:BIZ:TopBar */

/* @@BEGIN:CSS:BIZ:Sidebar */
/* Skin only -- where the sidebar sits, and whether it is a drawer or a column,
   is a layout question and lives in CSS:LAYOUT. */
#sidebar{overflow-y:auto;padding:.8rem .7rem 3rem;background:var(--panel);
  overscroll-behavior:contain}
#sidebar h4{font:600 11px/1 var(--sans);text-transform:uppercase;letter-spacing:.06em;
  color:var(--fg-3);margin:1.1rem .4rem .4rem}
#sidebar h4:first-child{margin-top:0}
#sidebar a{display:flex;gap:.45rem;align-items:baseline;padding:.3rem .4rem;
  border-radius:5px;text-decoration:none;color:var(--fg-2);font-size:13.5px}
#sidebar a:hover{background:var(--sunk);color:var(--fg)}
#sidebar a[aria-current=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
#sidebar a .k{font:500 11px/1.5 var(--mono);color:var(--fg-3);flex:none;width:1.1em}
#sidebar a .n{margin-left:auto;font:500 11px/1.5 var(--mono);color:var(--fg-3)}
#sidebar a[data-n="0"]{opacity:.5}
#reset{width:100%;margin-top:.6rem;background:var(--sunk);border:1px solid var(--line-2);
  border-radius:6px;padding:.4rem;font:500 12.5px/1 var(--sans);color:var(--fg-2)}
/* @@END:CSS:BIZ:Sidebar */

/* @@BEGIN:CSS:LAYOUT */
/* Mobile first. The base rules below are the phone layout -- one column, the
   nav behind a drawer, the search on its own row where it can be typed in with
   a thumb. Everything under a min-width query is an enhancement for a screen
   that happens to be bigger, never a rescue for a broken small one.
   Reports get read on a phone between other things, and the first thing a
   reader wants there is "what do I have to act on", not a sidebar. */

:root{ --bar:94px; }            /* two rows on a phone: controls, then search */
#main{margin-left:0;min-height:calc(100vh - var(--bar))}
#view{
  padding:1rem .85rem 4.5rem;
  padding-left:max(.85rem,env(safe-area-inset-left));
  padding-right:max(.85rem,env(safe-area-inset-right));
  padding-bottom:max(4.5rem,env(safe-area-inset-bottom));
  max-width:100%;
}
#view>*{max-width:100%}
.blk{margin:0 0 1.8rem}
.blk>h2{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.blk>h2 .n{font:500 12px/1.6 var(--mono);color:var(--fg-3)}

/* Touch first: 44px is the smallest target that a thumb hits reliably, and a
   report is mostly a page of things to tap open. */
#topbar .ctl{height:40px;min-width:40px}
.item>.hd{padding:.75rem .7rem;min-height:44px}
.chip{padding:.5rem .45rem;min-height:40px}
#sidebar a{padding:.55rem .45rem;min-height:40px;align-items:center}
.copy{padding:.45em .7em;min-height:34px}
.grpbar button{min-height:38px}
button{-webkit-tap-highlight-color:rgba(47,91,208,.15)}

/* No sideways scrolling of the page itself -- only of the things that opted in. */
body{overflow-x:hidden}
.tw,.code pre,#jsonview{-webkit-overflow-scrolling:touch}
.metrics{grid-template-columns:repeat(auto-fit,minmax(min(100%,8.5rem),1fr))}
.gl{grid-template-columns:1fr;gap:.1rem .9rem}
.gl dd{margin:0 0 .5rem}
.cf dl{grid-template-columns:1fr}

/* The drawer. Off-canvas by default, which is the state a phone opens in. */
#sidebar{
  position:fixed;top:0;left:0;bottom:0;z-index:45;
  width:min(19.5rem,88vw);
  padding-top:calc(.8rem + env(safe-area-inset-top));
  padding-bottom:calc(3rem + env(safe-area-inset-bottom));
  transform:translateX(-100%);transition:transform .18s ease;
  box-shadow:0 0 40px rgba(0,0,0,.28);
}
#sidebar.open{transform:none}
#scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45)}

@media (min-width:600px){
  #view{padding:1.2rem 1.1rem 5rem}
  .gl{grid-template-columns:minmax(7rem,auto) 1fr;gap:.35rem .9rem}
  .gl dd{margin:0}
  .cf dl{grid-template-columns:auto 1fr}
}

/* Only here does the sidebar earn permanent space: below this the content
   column would drop under ~40 characters, which is unreadable. */
@media (min-width:900px){
  :root{--bar:52px}
  #navbtn{display:none}
  #main{margin-left:17rem}
  #view{padding:1.4rem 1.2rem 5rem;max-width:calc(var(--measure) + 11rem)}
  #view>*{max-width:var(--measure)}
  #view>.tw,#view>.metrics,#view>.yt{max-width:none}
  #sidebar{top:var(--bar);width:17rem;transform:none;box-shadow:none;transition:none;
    border-right:1px solid var(--line)}
  #scrim{display:none}
  #topbar .ctl{height:32px;min-width:32px}
  .item>.hd{padding:.65rem .75rem;min-height:0}
  .chip{padding:.28rem .4rem;min-height:0}
  #sidebar a{padding:.3rem .4rem;min-height:0;align-items:baseline}
  .copy{min-height:0;padding:.25em .5em}
}
@media (min-width:1280px){
  #view{padding-left:2rem}
}
/* @@END:CSS:LAYOUT */

/* @@BEGIN:CSS:PRINT */
@media print{
  #topbar,#sidebar,#tabs,#scrim,.skip,.copy,.grpbar,.jsonbar,.caret,.yt{display:none !important}
  #main{margin:0}
  #view{max-width:none;padding:0}
  #view>*{max-width:none}
  body{background:#fff;color:#000;font-size:11pt}
  .item>.bd{display:block !important}
  .item,.card,.src,.callout{break-inside:avoid;border-color:#bbb}
  .item>.hd:hover{background:none}
  /* A printed page loses every href, so print the destination after the text. */
  .xl::after,.src .ttl a::after{content:" (" attr(href) ")";font:400 9pt var(--mono);
    color:#444;word-break:break-all}
  #jsonview{display:none}
  a{text-decoration:none;color:#000}
}
/* @@END:CSS:PRINT */

  if (typeof lt === 'string') return {text: lt, miss: ''};
  const v = lt[lang];

/* @@BEGIN:JS:ATOM:CiteChip */

/* @@BEGIN:JS:ATOM:Table */

/* @@BEGIN:JS:BIZ:FilterPanel */
/* AND across groups, OR inside one: picking patch_now + try_now widens the
   result, adding a stack filter narrows it. That is the combination people
   actually reach for -- "anything urgent that touches Postgres". */
Biz.FilterPanel = (D, ctx) => {
  const groups = [
    ['action', ctx.t('col.action'), FILTER_VALUES.action, v => ctx.t('action.' + v)],
    ['truth', ctx.t('ui.data_quality'), FILTER_VALUES.truth, v => ctx.t('truth.' + v)],
    ['tag', 'Tags', FILTER_VALUES.tag, v => ctx.t('tag.' + v)],
    ['stack', 'Stack', D.meta.stack || [], v => v]
  ];
  let h = '<h4>' + esc(ctx.t('nav.filters')) + '</h4>';
  groups.forEach(g => {
    const vals = g[2].filter(v => (ctx.counts.facet[g[0]][v] || 0) > 0 || ctx.state.filters[g[0]].has(v));
    if (!vals.length) return;
    h += '<div class="fgroup"><div class="lbl">' + esc(g[1]) + '</div>' +
      vals.map(v => Atoms.FilterChip(g[0], v, g[3](v), ctx.counts.facet[g[0]][v] || 0,
        ctx.state.filters[g[0]].has(v))).join('') + '</div>';
  });
  h += '<button type="button" id="reset" data-act="reset">' + esc(ctx.t('ui.reset')) + '</button>';
  return h;
};

Biz.HeroHighlights = (D, ctx) => {

/* @@BEGIN:JS:BIZ:DeadlineTimeline */
Biz.DeadlineTimeline = (D, ctx) => {
  /* Undated entries sort last: a deadline with no date is still a deadline, but
     it cannot be planned around, so it must not sit between two that can. */
  const ds = (D.deadlines || []).slice().sort((a, b) => {
    if (!a.date && !b.date) return 0;
    if (!a.date) return 1;
    if (!b.date) return -1;
    return a.date < b.date ? -1 : 1;
  });
  return '<section class="blk" id="b-deadlines"><h2>' + esc(ctx.t('nav.deadlines')) +
    '<span class="n">' + ds.length + '</span></h2>' +
    (ds.length ? '<ul class="tl">' + ds.map(d =>
      '<li data-s="' + esc(d.status) + '"><div class="when">' +
      Atoms.DateLabel(d.date, d.date_precision, ctx) +
      '<span class="badge" data-v="' + esc(d.status) + '">' + esc(ctx.t('st.' + d.status)) + '</span>' +
      '</div><div>' + Atoms.Text(d.event, ctx, ctx.state.query) + ' ' +
      Atoms.Cites(d.source_ids, ctx) + '</div></li>').join('') + '</ul>'
      : Atoms.EmptyState(ctx.t('ui.no_results'))) + '</section>';
};

/* @@BEGIN:JS:BIZ:ItemCard */
Biz.ItemCard = (item, ctx) => {
  const open = ctx.state.expanded.has(item.id);
  const soft = (item.truth === 'UNVERIFIED' || item.truth === 'VENDOR_CLAIM') ? '1' : '0';
  const q = ctx.state.query;
  let hd = '<button type="button" class="hd" data-act="item" data-id="' + esc(item.id) +
    '" aria-expanded="' + (open ? 'true' : 'false') + '" aria-controls="bd-' + esc(item.id) + '">' +
    Atoms.Badge('kind', item.kind, ctx) +
    '<span class="nm">' + hi(esc(item.name), q) + '</span>' +
    (item.version ? '<span class="ver">' + esc(item.version) + '</span>' : '') +
    Atoms.DateLabel(item.date, item.date_precision, ctx) +
    (item.action ? Atoms.Badge('action', item.action, ctx) : '') +
    Atoms.Badge('truth', item.truth, ctx) +
    (item.truth === 'ASSUMPTION' && item.confidence
      ? '<span class="badge" data-v="' + esc(item.confidence) + '">' +
        esc(ctx.t('conf.' + item.confidence)) + '</span>' : '') +
    (item.tags || []).map(tg => Atoms.Badge('tag', tg, ctx)).join('') +
    (item.older_context ? '<span class="badge">' + esc(ctx.t('ui.older_context')) + '</span>' : '') +
    '<span class="caret">' + Atoms.Icon('caret') + '</span>' +
    '<p class="hl-txt">' + Atoms.Text(item.headline, ctx, q) + '</p></button>';

  /* The body is always in the DOM, only hidden. That is what lets the print
     stylesheet expand everything and the browser's own find-in-page reach a
     collapsed item. */
  let bd = '<p>' + Atoms.Text(item.body, ctx, q) + '</p>' + Atoms.Metrics(item.metrics, ctx);
  if ((item.commands || []).length) {
    bd += '<div class="grp"><b>' + esc(ctx.t('ui.commands')) + '</b>' +
      Atoms.CodeBlock(item.commands, ctx) + '</div>';
  }
  const links = (item.links || []).filter(l => safeUrl(l.url));
  if (links.length) {
    bd += '<div class="grp"><b>' + esc(ctx.t('ui.links')) + '</b><ul class="lnks">' +
      links.map(l => '<li>' + Atoms.ExtLink(l.url, L(l.label, ctx.lang).text || domainOf(l.url), ctx) +
        '</li>').join('') + '</ul></div>';
  }
  /* A talk is not a link to click later -- it is the evidence. Put the player
     under the claim it supports. */
  const vids = links.filter(l => isYouTube(l.url))
    .concat((item.source_ids || []).map(id => ctx.state.idx.sourcesById[id])
      .filter(s => s && isYouTube(s.url)).map(s => ({url: s.url, label: s.title})));
  const seen = {};
  vids.forEach(v => {
    const y = ytParse(v.url);
    if (!y || seen[y.id]) return;
    seen[y.id] = 1;
    bd += Atoms.YouTube(v.url, ctx, typeof v.label === 'string' ? v.label : L(v.label, ctx.lang).text);
  });
  if ((item.source_ids || []).length) {
    bd += '<div class="grp"><b>' + esc(ctx.t('ui.sources')) + '</b> ' +
      Atoms.Cites(item.source_ids, ctx) + '</div>';
  }
  return '<article class="item" id="' + esc(item.id) + '" data-soft="' + soft +
    '" data-open="' + (open ? '1' : '0') + '">' + hd +
    '<div class="bd" id="bd-' + esc(item.id) + '"' + (open ? '' : ' hidden') + '>' + bd +
    '</div></article>';
};
/* @@END:JS:BIZ:ItemCard */

/* @@BEGIN:JS:BIZ:SectionBlock */
Biz.SectionBlock = (s, ctx) => {
  const items = (s.items || []).filter(ctx.pass);
  let inner;
  if (s.status === 'empty' && !(s.items || []).length) inner = Atoms.EmptyState(ctx.t('ui.empty_section'));
  else if (!items.length) inner = Atoms.EmptyState(ctx.t('ui.no_results'));

/* LAYER 4a -- the dataset, the indexes built from it, and the render context.
   Split out of one oversized JS:APP region so that changing how items are
   filtered never means reading the router and the event table too. */

/* @@BEGIN:JS:APP:DATA */
/* The DATA block deliberately sits at the very end of the file, so that an
   agent editing the components never has to load the dataset into context.
   The cost of that choice is exactly this: at the moment this script runs,

   therefore assigned in start(), which waits for the parser to reach it. */
let RAW, DATA, LANGS, KEY, idx, state;

function readData() {

     research step wrote, which is what the JSON tab hands you. */

  if (!el) throw new Error('report-data block is missing from the page');
  RAW = el.textContent.replace(/<\\\//g, '</').trim();

    idx.itemsById[it.id] = it; idx.sectionOfItem[it.id] = s.id; idx.all.push(it);
  }));
  (DATA.sources || []).forEach((s, i) => { idx.sourcesById[s.id] = s; idx.citeNumber[s.id] = i + 1; });
  idx.all.forEach(it => (it.source_ids || []).forEach(sid => {
    (idx.citedBy[sid] = idx.citedBy[sid] || []).push(it.id);
  }));

    lang: LANGS.indexOf(DATA.meta.default_language) >= 0 ? DATA.meta.default_language : LANGS[0],
    theme: store.get(KEY + ':theme', ''),
    tab: 'report',
    query: '',

function makeCtx() {

/* LAYER 4b -- filtering, search, the hash router, and render(). */

/* @@BEGIN:JS:APP:FILTER */
/* ---- filtering and search ---- */

    (it.commands || []).join(' ')];

    const s = idx.sourcesById[sid];
    if (s) parts.push(s.title, s.publisher);

}
function itemPasses(it) {

  if (f.truth.size && !f.truth.has(it.truth)) return false;
  if (f.tag.size && !(it.tags || []).some(x => f.tag.has(x))) return false;
  if (f.stack.size && !(it.stack_relevance || []).some(x => f.stack.has(x))) return false;

/* Facet counts ignore their own group, so a chip never reads 0 for something

function counts() {

  (DATA.sections || []).forEach(s => {
    out.section[s.id] = (s.items || []).filter(itemPasses).length;
    out.total += out.section[s.id];

  const saved = state.filters;
  Object.keys(out.facet).forEach(g => {
    state.filters = Object.assign({}, saved, {[g]: new Set()});
    const pool = idx.all.filter(itemPasses);
    state.filters = saved;
    const vals = g === 'stack' ? (DATA.meta.stack || []) : FILTER_VALUES[g];
    vals.forEach(v => {
      out.facet[g][v] = pool.filter(it =>
        g === 'action' ? it.action === v :
        g === 'truth' ? it.truth === v :

/* @@BEGIN:JS:APP:ROUTER */

  if (p.length && TABS.indexOf(p[0]) >= 0) { out.tab = p[0]; p.shift(); }
  if (p.length) out.id = p.join('/');

/* @@BEGIN:JS:APP:SPY */

          "body": {
            "vi": "Bốn advisory cùng ngày. Ở next-auth v5, khi config sinh lỗi server-side thì object auth chứa lỗi thay vì null, nên kiểu kiểm tra !!auth trong middleware (đúng pattern của guide chính thức) cho mọi request đi qua. Email/magic-link normalizer kiểm tra trước khi Unicode-normalize, nên ký tự giống @ có thể chuyển link đăng nhập tới người khác (v4 và v5); thêm lỗi cookie OAuth state/PKCE không gắn với provider và getToken() crash với Bearer header sai định dạng. Vá ở 4.24.15, 5.0.0-beta.32 và @auth/core 0.41.3.",
            "en": "Four advisories landed the same day. In next-auth v5 a server-side configuration error fills the auth object with an error instead of null, so an !!auth check in middleware (the pattern the official guide shows) admits every request. The email/magic-link normalizer validates before Unicode normalization, so an @ look-alike can route a sign-in link to someone else (v4 and v5); there are also OAuth state/PKCE cookies not bound to their provider and a getToken() crash on malformed Bearer headers. Fixed in 4.24.15, 5.0.0-beta.32 and @auth/core 0.41.3."

            "en": "Since npm 12, dependency preinstall/install/postinstall scripts no longer run until approved through the root package's allowScripts policy, and git/remote dependencies default to none. Packages that build natively or download binaries (sharp, better-sqlite3, bcrypt, Playwright, Puppeteer, Electron) will not fail at install but at runtime if left unapproved. npm 12 also requires Node ^22.22.2, ^24.15.0 or >=26 and removes npm shrinkwrap and npm adduser."

            "vi": "Harness chỉ đọc stdout của pytest và bỏ qua exit code, nên một patch thêm conftest.py in ra dòng PASSED giả được chấm RESOLVED_FULL mà không sửa gì. PR #620 ghi lại exit code và từ chối chấm khi exit code khác 0 nhưng stdout báo toàn pass. Bài học chung cho mọi eval tự làm: đừng chấm agent chỉ dựa trên text output mà agent có thể ghi. Harness 5.0 (17/8) cũng đổi định dạng task repo và đường dẫn log, là breaking change cho pipeline hiện có.",

  "glossary": [
    {
      "term": "preinstall hook",
      "definition": {
        "vi": "Script tự chạy trước khi package được cài, với quyền của người cài.",
        "en": "A script that runs automatically before a package installs, with the installer's privileges."
      }
    },
    {
      "term": "upper bound",
      "definition": {
        "vi": "Giới hạn version trên khi khai báo dependency (ví dụ <2), để bản major mới không tự được cài.",
        "en": "A maximum version in a dependency spec (e.g. <2) so a new major is not installed automatically."
      }
    },
    {
      "term": "DNS rebinding",
      "definition": {
        "vi": "Kỹ thuật cho trang web gửi request tới server chạy trên localhost của bạn như thể cùng nguồn.",
        "en": "A technique that lets a web page send requests to a server on your localhost as if it were same-origin."
      }
    },
    {
      "term": "harness",
      "definition": {
        "vi": "Lớp phần mềm quanh model: vòng lặp agent, tool, context, quyền. Cùng model, harness khác cho kết quả khác.",
        "en": "The software around a model: agent loop, tools, context, permissions. The same model gives different results in different harnesses."
      }
    },
    {
      "term": "AGENTS.md",
      "definition": {
        "vi": "File hướng dẫn cho coding agent đặt ở gốc repo, được nhiều agent cùng đọc.",
        "en": "An instructions file for coding agents at the repo root, read by several agents."
      }
    },
    {
      "term": "skill",
      "definition": {
        "vi": "Gói hướng dẫn và script cho agent, chỉ nạp vào context khi tác vụ cần.",
        "en": "A bundle of instructions and scripts for an agent, loaded into context only when a task needs it."
      }
    },
    {
      "term": "MCP",
      "definition": {
        "vi": "Model Context Protocol: giao thức chuẩn để agent gọi tool và đọc dữ liệu từ server bên ngoài.",
        "en": "Model Context Protocol: a standard protocol for agents to call tools and read data from external servers."
      }
    },
    {
      "term": "cooldown",
      "definition": {
        "vi": "Khoảng chờ trước khi nhận version mới phát hành, để bản độc kịp bị phát hiện.",
        "en": "A wait before adopting a newly published version, so a malicious one can be caught first."
      }
    },
    {
      "term": "core.fsmonitor",
      "definition": {
        "vi": "Cấu hình git chỉ định một lệnh chạy khi git kiểm tra thay đổi file; repo độc có thể dùng nó để chạy code.",
        "en": "A git setting naming a command run when git checks for file changes; a hostile repo can use it to run code."
      }
    },
    {
      "term": "RCE",
      "definition": {
        "vi": "Remote code execution: kẻ tấn công chạy được code tùy ý từ xa.",
        "en": "Remote code execution: an attacker can run arbitrary code remotely."
      }
    }
  ],
