<svg viewBox="0 0 680 250" role="img" aria-labelledby="pb-protocol-t"><title id="pb-protocol-t">Quy trình thiết kế</title><desc>Chín giai đoạn từ Cần agent đến Lặp lại, trong đó Lặp lại quay về Kiểm chứng.</desc><defs><marker id="pb-protocol-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9z" fill="var(--ink-3)"/></marker></defs><rect class="n-box" x="22" y="30" width="112" height="56" rx="8"/><text class="t t-b" x="78" y="58" text-anchor="middle" dominant-baseline="central">0 Cần agent?</text><line class="w" x1="134" y1="58" x2="148" y2="58" marker-end="url(#pb-protocol-ah)"/><rect class="n-ok" x="150" y="30" width="112" height="56" rx="8"/><text class="t t-b" x="206" y="58" text-anchor="middle" dominant-baseline="central">1 Kiểm chứng</text><line class="w" x1="262" y1="58" x2="276" y2="58" marker-end="url(#pb-protocol-ah)"/><rect class="n-box" x="278" y="30" width="112" height="56" rx="8"/><text class="t t-b" x="334" y="58" text-anchor="middle" dominant-baseline="central">2 Định hình</text><line class="w" x1="390" y1="58" x2="404" y2="58" marker-end="url(#pb-protocol-ah)"/><rect class="n-box" x="406" y="30" width="112" height="56" rx="8"/><text class="t t-b" x="462" y="58" text-anchor="middle" dominant-baseline="central">3 Tool</text><line class="w" x1="518" y1="58" x2="532" y2="58" marker-end="url(#pb-protocol-ah)"/><rect class="n-box" x="534" y="30" width="112" height="56" rx="8"/><text class="t t-b" x="590" y="58" text-anchor="middle" dominant-baseline="central">4 Context</text><rect class="n-warn" x="86" y="130" width="112" height="56" rx="8"/><text class="t t-b" x="142" y="158" text-anchor="middle" dominant-baseline="central">5 Kiểm soát</text><line class="w" x1="198" y1="158" x2="212" y2="158" marker-end="url(#pb-protocol-ah)"/><rect class="n-box" x="214" y="130" width="112" height="56" rx="8"/><text class="t t-b" x="270" y="158" text-anchor="middle" dominant-baseline="central">6 Chạy dài</text><line class="w" x1="326" y1="158" x2="340" y2="158" marker-end="url(#pb-protocol-ah)"/><rect class="n-bad" x="342" y="130" width="112" height="56" rx="8"/><text class="t t-b" x="398" y="158" text-anchor="middle" dominant-baseline="central">7 Bảo mật</text><line class="w" x1="454" y1="158" x2="468" y2="158" marker-end="url(#pb-protocol-ah)"/><rect class="n-ok" x="470" y="130" width="112" height="56" rx="8"/><text class="t t-b" x="526" y="158" text-anchor="middle" dominant-baseline="central">8 Lặp lại</text><path class="w" d="M590 86 L590 108 L142 108 L142 128" marker-end="url(#pb-protocol-ah)"/><path class="w-dash" d="M598 158 L640 158 L640 14 L206 14 L206 28" marker-end="url(#pb-protocol-ah)"/><text class="t-s" x="360" y="230" text-anchor="middle">Lặp lại quay về Kiểm chứng: chạy lại eval sau mỗi thay đổi</text></svg>
