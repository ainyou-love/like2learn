<svg viewBox="0 0 680 360" role="img" aria-labelledby="pb-trifecta-t"><title id="pb-trifecta-t">Lethal trifecta</title><desc>Private data and untrusted content meet in the agent context; an exfiltration channel makes it exploitable; an allowlist removes that leg.</desc><defs><marker id="pb-trifecta-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9z" fill="var(--ink-3)"/></marker></defs><rect class="n-box" x="60" y="30" width="220" height="56" rx="8"/><text class="t t-b" x="170" y="49" text-anchor="middle" dominant-baseline="central">Private data</text><text class="t-s" x="170" y="68" text-anchor="middle" dominant-baseline="central">Internal records</text><rect class="n-box" x="400" y="30" width="220" height="56" rx="8"/><text class="t t-b" x="510" y="49" text-anchor="middle" dominant-baseline="central">Untrusted content</text><text class="t-s" x="510" y="68" text-anchor="middle" dominant-baseline="central">Emails, tickets, web</text><rect class="n-new" x="230" y="150" width="220" height="56" rx="8"/><text class="t t-b" x="340" y="169" text-anchor="middle" dominant-baseline="central">Agent context</text><text class="t-s" x="340" y="188" text-anchor="middle" dominant-baseline="central">All legs meet here</text><line class="w" x1="190" y1="86" x2="290" y2="148" marker-end="url(#pb-trifecta-ah)"/><line class="w" x1="490" y1="86" x2="390" y2="148" marker-end="url(#pb-trifecta-ah)"/><line class="w-bad" x1="290" y1="206" x2="190" y2="268" marker-end="url(#pb-trifecta-ah)"/><rect class="n-bad" x="60" y="270" width="220" height="56" rx="8"/><text class="t t-b" x="170" y="289" text-anchor="middle" dominant-baseline="central">Exfiltration channel</text><text class="t-s" x="170" y="308" text-anchor="middle" dominant-baseline="central">Send to any address</text><rect class="n-ok" x="400" y="270" width="220" height="56" rx="8"/><text class="t t-b" x="510" y="289" text-anchor="middle" dominant-baseline="central">Cut the leg</text><text class="t-s" x="510" y="308" text-anchor="middle" dominant-baseline="central">Recipient fixed by code</text><line class="w-ok" x1="398" y1="298" x2="284" y2="298" marker-end="url(#pb-trifecta-ah)"/></svg>
