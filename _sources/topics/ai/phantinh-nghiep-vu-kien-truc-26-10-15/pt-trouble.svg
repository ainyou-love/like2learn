<svg viewBox="0 0 900 516" role="img" aria-labelledby="pt-trouble-t"><title id="pt-trouble-t">From a symptom to the admin page that explains it, and the fix</title><desc>Seven common symptoms; each row reads left to right: where to look, what you see, what fixes it.</desc><defs><marker id="pt-trouble-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9z" fill="var(--ink-3)"/></marker></defs><text class="t-h" x="24" y="40" text-anchor="start" dominant-baseline="central">SYMPTOM</text><text class="t-h" x="236" y="40" text-anchor="start" dominant-baseline="central">WHERE IN ADMIN</text><text class="t-h" x="432" y="40" text-anchor="start" dominant-baseline="central">WHAT YOU SEE</text><text class="t-h" x="668" y="40" text-anchor="start" dominant-baseline="central">FIX</text><rect class="n-warn" x="24" y="56" width="196" height="52" rx="8"/><text class="t t-b" x="122.0" y="82.0" text-anchor="middle" dominant-baseline="central">Chat won't start</text><rect class="n-box" x="236" y="56" width="180" height="52" rx="8"/><text class="t t-b" x="326.0" y="73.0" text-anchor="middle" dominant-baseline="central">Bridge tab</text><text class="t-s" x="326.0" y="92.0" text-anchor="middle" dominant-baseline="central">doctor: ok or degraded</text><rect class="n-info" x="432" y="56" width="220" height="52" rx="8"/><text class="t t-b" x="542.0" y="73.0" text-anchor="middle" dominant-baseline="central">SHIM_UNREACHABLE</text><text class="t-s" x="542.0" y="92.0" text-anchor="middle" dominant-baseline="central">or SHIM_REFUSED in the error</text><rect class="n-ok" x="668" y="56" width="208" height="52" rx="8"/><text class="t t-b" x="772.0" y="73.0" text-anchor="middle" dominant-baseline="central">Start the host-shim</text><text class="t-s" x="772.0" y="92.0" text-anchor="middle" dominant-baseline="central">make dev; tokens must match</text><line class="w" x1="220" y1="82" x2="234" y2="82" marker-end="url(#pt-trouble-ah)"/><line class="w" x1="416" y1="82" x2="430" y2="82" marker-end="url(#pt-trouble-ah)"/><line class="w" x1="652" y1="82" x2="666" y2="82" marker-end="url(#pt-trouble-ah)"/><rect class="n-warn" x="24" y="120" width="196" height="52" rx="8"/><text class="t t-b" x="122.0" y="146.0" text-anchor="middle" dominant-baseline="central">Spawn blocked by login</text><rect class="n-box" x="236" y="120" width="180" height="52" rx="8"/><text class="t t-b" x="326.0" y="137.0" text-anchor="middle" dominant-baseline="central">Credentials tab</text><text class="t-s" x="326.0" y="156.0" text-anchor="middle" dominant-baseline="central">a status dot per account</text><rect class="n-info" x="432" y="120" width="220" height="52" rx="8"/><text class="t t-b" x="542.0" y="137.0" text-anchor="middle" dominant-baseline="central">CLAUDE_LOGIN_EXPIRED</text><text class="t-s" x="542.0" y="156.0" text-anchor="middle" dominant-baseline="central">expired or not logged in</text><rect class="n-ok" x="668" y="120" width="208" height="52" rx="8"/><text class="t t-b" x="772.0" y="137.0" text-anchor="middle" dominant-baseline="central">Sync the grant or log in</text><text class="t-s" x="772.0" y="156.0" text-anchor="middle" dominant-baseline="central">from the same tab, on the web</text><line class="w" x1="220" y1="146" x2="234" y2="146" marker-end="url(#pt-trouble-ah)"/><line class="w" x1="416" y1="146" x2="430" y2="146" marker-end="url(#pt-trouble-ah)"/><line class="w" x1="652" y1="146" x2="666" y2="146" marker-end="url(#pt-trouble-ah)"/><rect class="n-warn" x="24" y="184" width="196" height="52" rx="8"/><text class="t t-b" x="122.0" y="210.0" text-anchor="middle" dominant-baseline="central">Sent, but no reply</text><rect class="n-box" x="236" y="184" width="180" height="52" rx="8"/><text class="t t-b" x="326.0" y="201.0" text-anchor="middle" dominant-baseline="central">Sessions · quality</text><text class="t-s" x="326.0" y="220.0" text-anchor="middle" dominant-baseline="central">score green / amber / red</text><rect class="n-info" x="432" y="184" width="220" height="52" rx="8"/><text class="t t-b" x="542.0" y="201.0" text-anchor="middle" dominant-baseline="central">stuck mid-stream, sync drift</text><text class="t-s" x="542.0" y="220.0" text-anchor="middle" dominant-baseline="central">JSONL has more turns than the DB</text><rect class="n-ok" x="668" y="184" width="208" height="52" rx="8"/><text class="t t-b" x="772.0" y="201.0" text-anchor="middle" dominant-baseline="central">reingest_session &lt;sid&gt;</text><text class="t-s" x="772.0" y="220.0" text-anchor="middle" dominant-baseline="central">CLI, outside admin; idempotent</text><line class="w" x1="220" y1="210" x2="234" y2="210" marker-end="url(#pt-trouble-ah)"/><line class="w" x1="416" y1="210" x2="430" y2="210" marker-end="url(#pt-trouble-ah)"/><line class="w" x1="652" y1="210" x2="666" y2="210" marker-end="url(#pt-trouble-ah)"/><rect class="n-warn" x="24" y="248" width="196" height="52" rx="8"/><text class="t t-b" x="122.0" y="274.0" text-anchor="middle" dominant-baseline="central">List and tmux disagree</text><rect class="n-box" x="236" y="248" width="180" height="52" rx="8"/><text class="t t-b" x="326.0" y="265.0" text-anchor="middle" dominant-baseline="central">Sessions · Reconcile</text><text class="t-s" x="326.0" y="284.0" text-anchor="middle" dominant-baseline="central">preview the diff first</text><rect class="n-info" x="432" y="248" width="220" height="52" rx="8"/><text class="t t-b" x="542.0" y="265.0" text-anchor="middle" dominant-baseline="central">DB orphans · tmux orphans</text><text class="t-s" x="542.0" y="284.0" text-anchor="middle" dominant-baseline="central">a row without tmux, or the reverse</text><rect class="n-ok" x="668" y="248" width="208" height="52" rx="8"/><text class="t t-b" x="772.0" y="265.0" text-anchor="middle" dominant-baseline="central">Apply fix</text><text class="t-s" x="772.0" y="284.0" text-anchor="middle" dominant-baseline="central">row → LOST, orphan tmux killed</text><line class="w" x1="220" y1="274" x2="234" y2="274" marker-end="url(#pt-trouble-ah)"/><line class="w" x1="416" y1="274" x2="430" y2="274" marker-end="url(#pt-trouble-ah)"/><line class="w" x1="652" y1="274" x2="666" y2="274" marker-end="url(#pt-trouble-ah)"/><rect class="n-warn" x="24" y="312" width="196" height="52" rx="8"/><text class="t t-b" x="122.0" y="338.0" text-anchor="middle" dominant-baseline="central">One-shot never ends</text><rect class="n-box" x="236" y="312" width="180" height="52" rx="8"/><text class="t t-b" x="326.0" y="329.0" text-anchor="middle" dominant-baseline="central">Sessions · Running</text><text class="t-s" x="326.0" y="348.0" text-anchor="middle" dominant-baseline="central">the PROVISIONING filter</text><rect class="n-info" x="432" y="312" width="220" height="52" rx="8"/><text class="t t-b" x="542.0" y="329.0" text-anchor="middle" dominant-baseline="central">running &gt; 5 min, no lease</text><text class="t-s" x="542.0" y="348.0" text-anchor="middle" dominant-baseline="central">or TIMEOUT after 600 s</text><rect class="n-ok" x="668" y="312" width="208" height="52" rx="8"/><text class="t t-b" x="772.0" y="329.0" text-anchor="middle" dominant-baseline="central">The reaper closes it</text><text class="t-s" x="772.0" y="348.0" text-anchor="middle" dominant-baseline="central">provisioning_timeout; run again</text><line class="w" x1="220" y1="338" x2="234" y2="338" marker-end="url(#pt-trouble-ah)"/><line class="w" x1="416" y1="338" x2="430" y2="338" marker-end="url(#pt-trouble-ah)"/><line class="w" x1="652" y1="338" x2="666" y2="338" marker-end="url(#pt-trouble-ah)"/><rect class="n-warn" x="24" y="376" width="196" height="52" rx="8"/><text class="t t-b" x="122.0" y="402.0" text-anchor="middle" dominant-baseline="central">Answers are slow</text><rect class="n-box" x="236" y="376" width="180" height="52" rx="8"/><text class="t t-b" x="326.0" y="393.0" text-anchor="middle" dominant-baseline="central">Performance</text><text class="t-s" x="326.0" y="412.0" text-anchor="middle" dominant-baseline="central">latency per turn, by stage</text><rect class="n-info" x="432" y="376" width="220" height="52" rx="8"/><text class="t t-b" x="542.0" y="393.0" text-anchor="middle" dominant-baseline="central">model / proxy / ingest / tool</text><text class="t-s" x="542.0" y="412.0" text-anchor="middle" dominant-baseline="central">TTFT &gt; 30 s turns a session amber</text><rect class="n-ok" x="668" y="376" width="208" height="52" rx="8"/><text class="t t-b" x="772.0" y="393.0" text-anchor="middle" dominant-baseline="central">Fix the slow stage</text><text class="t-s" x="772.0" y="412.0" text-anchor="middle" dominant-baseline="central">proxy, tool use or the model</text><line class="w" x1="220" y1="402" x2="234" y2="402" marker-end="url(#pt-trouble-ah)"/><line class="w" x1="416" y1="402" x2="430" y2="402" marker-end="url(#pt-trouble-ah)"/><line class="w" x1="652" y1="402" x2="666" y2="402" marker-end="url(#pt-trouble-ah)"/><rect class="n-warn" x="24" y="440" width="196" height="52" rx="8"/><text class="t t-b" x="122.0" y="466.0" text-anchor="middle" dominant-baseline="central">Report missing/invalid</text><rect class="n-box" x="236" y="440" width="180" height="52" rx="8"/><text class="t t-b" x="326.0" y="457.0" text-anchor="middle" dominant-baseline="central">Sessions · Modules</text><text class="t-s" x="326.0" y="476.0" text-anchor="middle" dominant-baseline="central">quality issues; ModuleEditor</text><rect class="n-info" x="432" y="440" width="220" height="52" rx="8"/><text class="t t-b" x="542.0" y="457.0" text-anchor="middle" dominant-baseline="central">closed with no report</text><text class="t-s" x="542.0" y="476.0" text-anchor="middle" dominant-baseline="central">or schema validation errors</text><rect class="n-ok" x="668" y="440" width="208" height="52" rx="8"/><text class="t t-b" x="772.0" y="457.0" text-anchor="middle" dominant-baseline="central">Fix the schema or template</text><text class="t-s" x="772.0" y="476.0" text-anchor="middle" dominant-baseline="central">preview it in ModuleEditor</text><line class="w" x1="220" y1="466" x2="234" y2="466" marker-end="url(#pt-trouble-ah)"/><line class="w" x1="416" y1="466" x2="430" y2="466" marker-end="url(#pt-trouble-ah)"/><line class="w" x1="652" y1="466" x2="666" y2="466" marker-end="url(#pt-trouble-ah)"/></svg>
