<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ ghi chép · No.{{NO}} — {{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5EE; --paper-deep:#EAEEE3; --ink:#1C2B22; --ink-soft:#44544A;
  --green:#2F5D4A; --green-line:#C3D0C0; --brass:#9C7A2E; --seal:#B0492F;
  --card:#FBFCF8; --radius:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; color:var(--ink); font-size:16px; line-height:1.75;
  font-family:"Be Vietnam Pro",system-ui,sans-serif;
  background-color:var(--paper);
  background-image:repeating-linear-gradient(transparent 0 31px, rgba(47,93,74,.045) 31px 32px);
}
a{color:inherit;text-decoration:none}
strong{color:var(--green);font-weight:600}
em{font-style:italic}

/* ---------- LAYOUT ---------- */
.wrap{
  max-width:1240px; margin:0 auto; padding:0 24px;
  display:grid; grid-template-columns:288px 1fr; gap:48px; align-items:start;
}

/* ---------- SIDEBAR ---------- */
.sidebar{position:sticky; top:0; height:100vh; overflow-y:auto; padding:24px 0;}
.cover{
  background:var(--card); border:2px solid var(--green); border-radius:var(--radius);
  padding:18px; position:relative;
}
.cover::after{
  content:""; position:absolute; inset:5px; border:1px dashed var(--green-line);
  border-radius:6px; pointer-events:none;
}
.cover .label{
  font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--seal); font-weight:500;
}
.cover .title{
  font-family:"Bricolage Grotesque",sans-serif; font-weight:700; color:var(--green);
  font-size:23px; line-height:1.2; margin-top:8px;
}
nav.toc-nav{margin-top:20px}
ol.toc{list-style:none; margin:0; padding:0; counter-reset:none}
ol.toc li{margin:2px 0}
ol.toc a{
  display:flex; align-items:baseline; gap:10px; padding:8px 12px;
  border-left:3px solid transparent; border-radius:6px; transition:background .15s,color .15s;
}
ol.toc a .t{flex:1; font-size:14px; color:var(--ink-soft)}
ol.toc a .num{
  font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--brass);
  font-weight:500; min-width:22px; text-align:right; order:2;
}
ol.toc a:hover{background:var(--paper-deep)}
ol.toc a.active{background:var(--card); border-left-color:var(--seal);}
ol.toc a.active .t{color:var(--green); font-weight:600}
ol.toc a:focus-visible{outline:2px solid var(--green); outline-offset:2px}

/* ---------- MAIN ---------- */
.main{padding:40px 0 24px; min-width:0}

/* HERO */
.hero{position:relative; margin-bottom:40px}
.kicker{
  font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--seal); font-weight:500; margin:0 0 10px;
}
.hero h1{
  font-family:"Bricolage Grotesque",sans-serif; font-weight:700; color:var(--green);
  font-size:clamp(34px,5vw,56px); line-height:1.05; margin:0 0 14px; max-width:16ch;
}
.subtitle{font-size:16px; color:var(--ink-soft); max-width:52ch; margin:0 0 18px}
.meta{display:flex; flex-wrap:wrap; gap:10px}
.pill{
  font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--green);
  border:1px solid var(--green-line); background:var(--card);
  padding:5px 12px; border-radius:999px;
}
.stamp{
  position:absolute; top:-6px; right:0; width:118px; height:118px;
  transform:rotate(7deg); opacity:.92;
}
.stamp text{fill:var(--seal); font-family:"IBM Plex Mono",monospace; font-weight:500;
  letter-spacing:.08em; text-transform:uppercase;}

/* ENTRY CARD */
section.entry{
  background:var(--card); border:1px solid var(--green-line); border-radius:var(--radius);
  padding:26px 28px; margin-bottom:26px; scroll-margin-top:24px;
}
.entry-head{
  display:grid; grid-template-columns:1fr 168px; gap:22px; align-items:start;
  padding-bottom:18px; border-bottom:1px dashed var(--green-line); margin-bottom:18px;
}
.eyebrow{
  font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--brass); font-weight:500;
}
.entry-head h2{
  font-family:"Bricolage Grotesque",sans-serif; font-weight:700; color:var(--green);
  font-size:26px; line-height:1.15; margin:6px 0 6px;
}
.summary-line{font-style:italic; color:var(--ink-soft); font-size:15px; margin:0}
.frame{
  width:168px; height:138px; border:2px solid var(--green); background:var(--paper);
  border-radius:4px; position:relative; transform:rotate(-1.4deg);
  display:flex; align-items:center; justify-content:center; padding:12px;
}
.frame::after{content:""; position:absolute; inset:4px; border:1px dashed var(--green-line); pointer-events:none}
.frame svg{width:100%; height:100%}

/* line-art illustration defaults */
.ill{fill:none; stroke:var(--green); stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
.ill .b{stroke:var(--brass)}
.ill .s{stroke:var(--seal)}
.ill .thin{stroke-width:2}

/* BODY BULLETS */
ul.points{list-style:none; margin:0 0 18px; padding:0}
ul.points li{position:relative; padding-left:24px; margin:9px 0}
ul.points li::before{
  content:"—"; position:absolute; left:0; top:0; color:var(--brass); font-weight:600;
}

/* CALLOUT */
.callout{
  border-left:3px solid var(--seal); background:var(--paper);
  padding:14px 18px; border-radius:0 6px 6px 0;
}
.callout .clabel{
  font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--seal); font-weight:500; display:block; margin-bottom:5px;
}
.callout p{margin:0; font-size:15px}

/* FOOTER */
footer{
  border-top:1px dashed var(--green-line); margin-top:14px; padding:20px 0 60px;
  font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-soft);
}

/* menu button + backdrop (mobile only) */
.menu-btn{display:none}
.backdrop{display:none}

/* ---------- MOBILE ---------- */
@media (max-width:900px){
  .wrap{grid-template-columns:1fr; gap:0; padding:0 18px}
  .sidebar{
    position:fixed; top:0; left:0; z-index:40;
    width:min(82vw,320px); height:100vh; height:100dvh;
    background:var(--paper); border-right:1px solid var(--green-line);
    padding:20px 16px; overflow-y:auto;
    transform:translateX(-100%); transition:transform .28s ease;
  }
  .sidebar.open{transform:translateX(0)}
  .main{padding:28px 0 24px}
  .stamp{display:none}
  .entry-head{grid-template-columns:1fr}
  .frame{width:100%; max-width:220px; height:150px; margin-top:4px}
  .menu-btn{
    display:inline-flex; align-items:center; gap:8px;
    position:fixed; left:16px; bottom:16px; z-index:50;
    background:var(--green); color:var(--paper); border:none;
    font-family:"IBM Plex Mono",monospace; font-size:13px; letter-spacing:.1em;
    padding:12px 18px; border-radius:999px; cursor:pointer;
    box-shadow:0 4px 14px rgba(28,43,34,.25);
  }
  .backdrop{
    display:block; position:fixed; inset:0; z-index:39;
    background:rgba(28,43,34,.42); opacity:0; visibility:hidden; transition:opacity .28s;
  }
  .backdrop.show{opacity:1; visibility:visible}
}

/* ---------- REDUCED MOTION ---------- */
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none !important; animation:none !important}
}
</style>
</head>
<body>

<div class="wrap">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="cover">
      <span class="label">Sổ ghi chép · No.{{NO}}</span>
      <div class="title">{{TITLE}}</div>
    </div>
    <nav class="toc-nav" aria-label="Mục lục ghi chú">
      <ol class="toc">
{{TOC_ITEMS}}
      </ol>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- HERO -->
    <header class="hero">
      <svg class="stamp" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="54" fill="none" stroke="var(--seal)" stroke-width="3"/>
        <circle cx="60" cy="60" r="44" fill="none" stroke="var(--seal)" stroke-width="1.5" stroke-dasharray="4 4"/>
        <text x="60" y="50" text-anchor="middle" font-size="12">ĐÃ GHI</text>
        <line x1="38" y1="60" x2="82" y2="60" stroke="var(--seal)" stroke-width="1.5"/>
        <text x="60" y="78" text-anchor="middle" font-size="11">Sổ · {{YEAR}}</text>
      </svg>
      <p class="kicker">{{KICKER}}</p>
      <h1>{{TITLE}}</h1>
      <p class="subtitle">{{SUBTITLE}}</p>
      <div class="meta">
{{META_PILLS}}
      </div>
    </header>

{{SECTIONS}}

    <footer>
      {{SOURCE_LINE}}
    </footer>

  </main>
</div>

<!-- MOBILE DRAWER CONTROLS -->
<button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="sidebar">☰ Mục lục</button>
<div class="backdrop" id="backdrop"></div>

<script>
(function(){
  var sidebar = document.getElementById('sidebar');
  var backdrop = document.getElementById('backdrop');
  var menuBtn = document.getElementById('menuBtn');

  function setDrawer(open){
    sidebar.classList.toggle('open', open);
    backdrop.classList.toggle('show', open);
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  menuBtn.addEventListener('click', function(){
    setDrawer(!sidebar.classList.contains('open'));
  });
  backdrop.addEventListener('click', function(){ setDrawer(false); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ setDrawer(false); }
  });
  Array.prototype.forEach.call(document.querySelectorAll('.toc a'), function(a){
    a.addEventListener('click', function(){ setDrawer(false); });
  });

  // Scrollspy
  var desktop = window.matchMedia('(min-width:901px)');
  var links = {};
  Array.prototype.forEach.call(document.querySelectorAll('.toc a'), function(a){
    links[a.getAttribute('href').slice(1)] = a;
  });
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){
        Array.prototype.forEach.call(document.querySelectorAll('.toc a'), function(l){
          l.classList.remove('active');
        });
        var link = links[en.target.id];
        if(link){
          link.classList.add('active');
          if(desktop.matches){ link.scrollIntoView({block:'nearest'}); }
        }
      }
    });
  }, {rootMargin:'-20% 0px -70% 0px'});
  Array.prototype.forEach.call(document.querySelectorAll('section.entry'), function(s){
    io.observe(s);
  });
})();
</script>
</body>
</html>
