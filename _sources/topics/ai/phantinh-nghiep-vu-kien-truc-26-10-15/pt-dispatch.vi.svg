<svg viewBox="0 0 680 360" role="img" aria-labelledby="pt-dispatch-vi-t"><title id="pt-dispatch-vi-t">Module là dữ liệu; kind chọn code chạy nó</title><desc>YAML seed dòng Module một lần; kind của dòng chọn workflow ở web và engine ở backend.</desc><defs><marker id="pt-dispatch-vi-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9z" fill="var(--ink-3)"/></marker></defs><rect class="n-box" x="20" y="20" width="150" height="56" rx="8"/><text class="t t-b" x="95.0" y="39.0" text-anchor="middle" dominant-baseline="central">modules/*.yaml</text><text class="t-s" x="95.0" y="58.0" text-anchor="middle" dominant-baseline="central">seed, chỉ insert</text><rect class="n-new" x="260" y="20" width="160" height="56" rx="8"/><text class="t t-b" x="340.0" y="39.0" text-anchor="middle" dominant-baseline="central">Module row</text><text class="t-s" x="340.0" y="58.0" text-anchor="middle" dominant-baseline="central">nguồn sự thật</text><rect class="n-box" x="510" y="20" width="150" height="56" rx="8"/><text class="t t-b" x="585.0" y="39.0" text-anchor="middle" dominant-baseline="central">/admin/settings</text><text class="t-s" x="585.0" y="58.0" text-anchor="middle" dominant-baseline="central">sửa dòng</text><line class="w" x1="170" y1="48" x2="258" y2="48" marker-end="url(#pt-dispatch-vi-ah)"/><text class="t-m" x="214" y="36" text-anchor="middle" dominant-baseline="central">seed_modules</text><line class="w" x1="510" y1="48" x2="422" y2="48" marker-end="url(#pt-dispatch-vi-ah)"/><rect class="n-box" x="260" y="112" width="160" height="50" rx="8"/><text class="t t-b" x="340.0" y="128.0" text-anchor="middle" dominant-baseline="central">kinds.py</text><text class="t-s" x="340.0" y="147.0" text-anchor="middle" dominant-baseline="central">kiểm key + liên kết</text><line class="w" x1="340" y1="76" x2="340" y2="110" marker-end="url(#pt-dispatch-vi-ah)"/><rect class="band" x="10" y="184" width="320" height="166" rx="12"/><text class="t-h" x="22" y="202">WEB · /m/[module]</text><rect class="n-box" x="26" y="212" width="288" height="40" rx="8"/><text class="t" x="170.0" y="232.0" text-anchor="middle" dominant-baseline="central">WORKFLOW_BY_KIND[kind]</text><rect class="n-box" x="26" y="262" width="138" height="72" rx="8"/><text class="t t-b" x="95.0" y="289.0" text-anchor="middle" dominant-baseline="central">workflow</text><text class="t-s" x="95.0" y="308.0" text-anchor="middle" dominant-baseline="central">state + GraphQL</text><rect class="n-box" x="176" y="262" width="138" height="72" rx="8"/><text class="t t-b" x="245.0" y="289.0" text-anchor="middle" dominant-baseline="central">atoms</text><text class="t-s" x="245.0" y="308.0" text-anchor="middle" dominant-baseline="central">thuần, chỉ props</text><line class="w" x1="164" y1="298" x2="174" y2="298" marker-end="url(#pt-dispatch-vi-ah)"/><rect class="band" x="350" y="184" width="320" height="166" rx="12"/><text class="t-h" x="362" y="202">API · engine theo kind</text><rect class="n-box" x="366" y="212" width="140" height="58" rx="8"/><text class="t t-b" x="436.0" y="232.0" text-anchor="middle" dominant-baseline="central">tui_chat · 20</text><text class="t-s" x="436.0" y="251.0" text-anchor="middle" dominant-baseline="central">tmux + claude TUI</text><rect class="n-box" x="516" y="212" width="140" height="58" rx="8"/><text class="t t-b" x="586.0" y="232.0" text-anchor="middle" dominant-baseline="central">oneshot · 19</text><text class="t-s" x="586.0" y="251.0" text-anchor="middle" dominant-baseline="central">claude -p / codex</text><rect class="n-box" x="366" y="280" width="290" height="54" rx="8"/><text class="t t-b" x="511.0" y="298.0" text-anchor="middle" dominant-baseline="central">13 kind riêng · mỗi kind 1 module</text><text class="t-s" x="511.0" y="317.0" text-anchor="middle" dominant-baseline="central">bảng, học tập, suy luận, quyết định …</text><path class="w" d="M300 162 L170 182 L170 210" marker-end="url(#pt-dispatch-v