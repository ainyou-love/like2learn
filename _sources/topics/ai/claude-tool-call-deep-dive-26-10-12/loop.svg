<svg viewBox="0 0 640 320" role="img" aria-labelledby="tc-lp-t"><title id="tc-lp-t">Vòng lặp agent: harness gửi request, Claude trả response, đọc stop_reason, thực thi tool hoặc trả kết quả</title>
  <defs><marker id="tc-lp-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker></defs>
  <rect class="n-box" x="20" y="120" width="170" height="62" rx="10"/>
  <text class="t t-b" x="105" y="146" text-anchor="middle">Harness gửi request</text>
  <text class="t-s" x="105" y="166" text-anchor="middle">messages + tools</text>
  <rect class="n-box" x="240" y="20" width="160" height="62" rx="10"/>
  <text class="t t-b" x="320" y="46" text-anchor="middle">Claude</text>
  <text class="t-s" x="320" y="66" text-anchor="middle">trả response</text>
  <rect class="n-box" x="460" y="120" width="160" height="62" rx="10"/>
  <text class="t t-b" x="540" y="146" text-anchor="middle">Đọc stop_reason</text>
  <text class="t-s" x="540" y="166" text-anchor="middle">mỗi lượt</text>
  <rect class="n-new" x="230" y="220" width="180" height="62" rx="10"/>
  <text class="t t-b" x="320" y="246" text-anchor="middle">Kiểm tra quyền, thực thi</text>
  <text class="t-s" x="320" y="266" text-anchor="middle">gửi tool_result</text>
  <rect class="n-warn" x="470" y="248" width="150" height="50" rx="10"/>
  <text class="t t-b" x="545" y="278" text-anchor="middle">Trả kết quả</text>
  <path class="w" d="M150 120 C 170 70, 200 55, 236 52" marker-end="url(#tc-lp-ah)"/>
  <path class="w" d="M404 52 C 450 55, 500 75, 530 116" marker-end="url(#tc-lp-ah)"/>
  <path class="w-acc" d="M480 182 C 460 215, 440 238, 414 246" marker-end="url(#tc-lp-ah)"/>
  <text class="t t-b t-acc" x="470" y="222">tool_use</text>
  <path class="w-acc" d="M230 252 C 180 250, 140 225, 110 186" marker-end="url(#tc-lp-ah)"/>
  <path class="w-warn" d="M560 182 L 560 244" marker-end="url(#tc-lp-ah)"/>
  <text class="t t-b t-warn" x="568" y="220">end_turn</text>
</svg>
