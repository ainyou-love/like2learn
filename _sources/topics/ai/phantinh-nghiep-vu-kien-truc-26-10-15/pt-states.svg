<svg viewBox="0 0 680 300" role="img" aria-labelledby="pt-states-t"><title id="pt-states-t">Session states and who moves them</title><desc>Spawn moves provisioning to active; close, the reaper or a dead tmux end it; an idle close can revive.</desc><defs><marker id="pt-states-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9z" fill="var(--ink-3)"/></marker></defs><rect class="n-box" x="20" y="110" width="130" height="56" rx="8"/><text class="t t-b" x="85.0" y="129.0" text-anchor="middle" dominant-baseline="central">provisioning</text><text class="t-s" x="85.0" y="148.0" text-anchor="middle" dominant-baseline="central">row created</text><rect class="n-new" x="270" y="110" width="130" height="56" rx="8"/><text class="t t-b" x="335.0" y="129.0" text-anchor="middle" dominant-baseline="central">active</text><text class="t-s" x="335.0" y="148.0" text-anchor="middle" dominant-baseline="central">tailer running</text><rect class="n-ok" x="520" y="110" width="140" height="56" rx="8"/><text class="t t-b" x="590.0" y="129.0" text-anchor="middle" dominant-baseline="central">closed</text><text class="t-s" x="590.0" y="148.0" text-anchor="middle" dominant-baseline="central">close_reason</text><rect class="n-bad" x="20" y="222" width="130" height="50" rx="8"/><text class="t t-b" x="85.0" y="238.0" text-anchor="middle" dominant-baseline="central">error</text><text class="t-s" x="85.0" y="257.0" text-anchor="middle" dominant-baseline="central">spawn / run failed</text><rect class="n-warn" x="270" y="222" width="130" height="50" rx="8"/><text class="t t-b" x="335.0" y="238.0" text-anchor="middle" dominant-baseline="central">lost</text><text class="t-s" x="335.0" y="257.0" text-anchor="middle" dominant-baseline="central">DB row, no tmux</text><line class="w" x1="150" y1="138" x2="268" y2="138" marker-end="url(#pt-states-ah)"/><text class="t-m" x="209" y="126" text-anchor="middle" dominant-baseline="central">spawn ok</text><line class="w" x1="400" y1="130" x2="518" y2="130" marker-end="url(#pt-states-ah)"/><text class="t-m" x="459" y="100" text-anchor="middle" dominant-baseline="central">close · tmux_gone</text><text class="t-m" x="459" y="116" text-anchor="middle" dominant-baseline="central">idle_ttl</text><path class="w" d="M520 156 C470 190 430 190 400 160" marker-end="url(#pt-states-ah)"/><text class="t-m" x="412" y="200" text-anchor="start" dominant-baseline="central">revive: idle_ttl + tmux alive</text><line class="w" x1="85" y1="166" x2="85" y2="220" marker-end="url(#pt-states-ah)"/><text class="t-m" x="92" y="194" text-anchor="start" dominant-baseline="central">bridge error</text><line class="w" x1="335" y1="166" x2="335" y2="220" marker-end="url(#pt-states-ah)"/><text class="t-m" x="328" y="194" text-anchor="end" dominant-baseline="central">reconcileSessions</text><path class="w" d="M85 110 C85 40 590 40 590 108" marker-end="url(#pt-states-ah)"/><text class="t-m" x="337" y="50" text-anchor="middle" dominant-baseline="central">oneshot done · or reaper: provisioning_timeout (no lease)</text></svg>
