<svg viewBox="0 0 680 470" role="img" aria-labelledby="pt-layers-t"><title id="pt-layers-t">Five layers from the person to the AI agent</title><desc>Surfaces, web edge, core API with stores, host bridge, AI agents.</desc><defs><marker id="pt-layers-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9z" fill="var(--ink-3)"/></marker></defs><rect class="band" x="10" y="14" width="660" height="78" rx="12"/><text class="t-h" x="22" y="32">1 · SURFACES</text><rect class="n-box" x="178.0" y="27" width="151.33333333333334" height="52" rx="8"/><text class="t t-b" x="253.66666666666669" y="44.0" text-anchor="middle" dominant-baseline="central">PWA</text><text class="t-s" x="253.66666666666669" y="63.0" text-anchor="middle" dominant-baseline="central">browser, phone</text><rect class="n-box" x="343.33333333333337" y="27" width="151.33333333333334" height="52" rx="8"/><text class="t t-b" x="419.00000000000006" y="44.0" text-anchor="middle" dominant-baseline="central">Raycast</text><text class="t-s" x="419.00000000000006" y="63.0" text-anchor="middle" dominant-baseline="central">hotkey actions</text><rect class="n-box" x="508.6666666666667" y="27" width="151.33333333333334" height="52" rx="8"/><text class="t t-b" x="584.3333333333334" y="44.0" text-anchor="middle" dominant-baseline="central">Terminal</text><text class="t-s" x="584.3333333333334" y="63.0" text-anchor="middle" dominant-baseline="central">tmux attach -r</text><rect class="band" x="10" y="106" width="660" height="78" rx="12"/><text class="t-h" x="22" y="124">2 · WEB EDGE</text><rect class="n-box" x="178.0" y="119" width="482.0" height="52" rx="8"/><text class="t t-b" x="419.0" y="136.0" text-anchor="middle" dominant-baseline="central">Next.js 16 :7777</text><text class="t-s" x="419.0" y="155.0" text-anchor="middle" dominant-baseline="central">routes, /api/gql proxy, /raycast/*</text><rect class="band" x="10" y="198" width="660" height="78" rx="12"/><text class="t-h" x="22" y="216">3 · CORE API</text><rect class="n-new" x="178.0" y="211" width="151.33333333333334" height="52" rx="8"/><text class="t t-b" x="253.66666666666669" y="228.0" text-anchor="middle" dominant-baseline="central">Django GraphQL :8888</text><text class="t-s" x="253.66666666666669" y="247.0" text-anchor="middle" dominant-baseline="central">Module catalog, engines</text><rect class="n-box" x="343.33333333333337" y="211" width="151.33333333333334" height="52" rx="8"/><text class="t t-b" x="419.00000000000006" y="228.0" text-anchor="middle" dominant-baseline="central">Postgres</text><text class="t-s" x="419.00000000000006" y="247.0" text-anchor="middle" dominant-baseline="central">durable</text><rect class="n-box" x="508.6666666666667" y="211" width="151.33333333333334" height="52" rx="8"/><text class="t t-b" x="584.3333333333334" y="228.0" text-anchor="middle" dominant-baseline="central">Redis</text><text class="t-s" x="584.3333333333334" y="247.0" text-anchor="middle" dominant-baseline="central">live: pub/sub, lease</text><rect class="band" x="10" y="290" width="660" height="78" rx="12"/><text class="t-h" x="22" y="308">4 · HOST BRIDGE</text><rect class="n-box" x="178.0" y="303" width="234.0" height="52" rx="8"/><text class="t t-b" x="295.0" y="320.0" text-anchor="middle" dominant-baseline="central">host-shim :9876</text><text class="t-s" x="295.0" y="339.0" text-anchor="middle" dominant-baseline="central">HTTP → CLI</text><rect class="n-box" x="426.0" y="303" width="234.0" height="52" rx="8"/><text class="t t-b" x="543.0" y="320.0" text-anchor="middle" dominant-baseline="central">phantinh-bridge</text><text class="t-s" x="543.0" y="339.0" text-anchor="middle" dominant-baseline="central">bash CLI, one JSON line</text><rect class="band" x="10" y="382" width="660" height="78" rx="12"/><text class="t-h" x="22" y="400">5 · AI AGENTS</text><rect class="n-box" x="178.0" y="395" width="234.0" height="52" rx="8"/><text class="t t-b" x="295.0" y="